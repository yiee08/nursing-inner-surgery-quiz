xt":"加自來水"},{"letter":"D","text":"重教深咳並重新採集"}],"answer":"D","rationale":"唾液污染會影響檢體品質，應重新收集下呼吸道痰液。"},{"stem":"發燒、膿痰及喘加劇，優先追蹤何者？","options":[{"letter":"A","text":"口渴"},{"letter":"B","text":"指甲長度"},{"letter":"C","text":"排便"},{"letter":"D","text":"感染、血氧、呼吸作功與意識"}],"answer":"D","rationale":"感染可引發惡化及呼吸衰竭，需監測呼吸與意識。"},{"stem":"給氧後嗜睡加重，應如何處理？","options":[{"letter":"A","text":"完全停氧不評估"},{"letter":"B","text":"增加鎮靜藥"},{"letter":"C","text":"任其睡眠"},{"letter":"D","text":"重評呼吸、氧合及血氣並通知團隊"}],"answer":"D","rationale":"嗜睡可能代表通氣惡化，需緊急評估；氧療不能未評估驟停。"},{"stem":"PaCO2升高且pH下降，最符合何者？","options":[{"letter":"A","text":"呼吸性鹼中毒"},{"letter":"B","text":"代謝性鹼中毒"},{"letter":"C","text":"代謝性酸中毒"},{"letter":"D","text":"呼吸性酸中毒"}],"answer":"D","rationale":"二氧化碳上升使酸性增加，造成呼吸性酸中毒。"},{"stem":"慢性高碳酸血症且HCO3−升高、pH近正常，較可能表示何者？","options":[{"letter":"A","text":"腎臟部分代償慢性呼吸性酸中毒"},{"letter":"B","text":"檢體必錯"},{"letter":"C","text":"無CO2滯留"},{"letter":"D","text":"急性代謝酸中毒"}],"answer":"A","rationale":"慢性CO2滯留可由腎臟保留碳酸氫根部分代償。"},{"stem":"非侵襲性通氣治療前需確認何者？","options":[{"letter":"A","text":"漏氣越多越好"},{"letter":"B","text":"昏迷不能保護氣道仍直接用"},{"letter":"C","text":"開始後不必評估"},{"letter":"D","text":"患者可保護氣道、面罩合適且可監測"}],"answer":"D","rationale":"NIV需適當患者選擇、面罩密合及密切監測。"},{"stem":"NIV患者嘔吐且意識下降，應如何處理？","options":[{"letter":"A","text":"繼續面罩不處理"},{"letter":"B","text":"關警報離開"},{"letter":"C","text":"餵水"},{"letter":"D","text":"立即求援並評估氣道保護與替代通氣"}],"answer":"D","rationale":"嘔吐、意識下降增加吸入風險且可能無法保護氣道。"},{"stem":"NIV治療有效的表現為何？","options":[{"letter":"A","text":"血氧降且心跳快"},{"letter":"B","text":"呼吸作功下降且意識、血氣改善"},{"letter":"C","text":"嗜睡加深"},{"letter":"D","text":"無法耐受面罩"}],"answer":"B","rationale":"呼吸窘迫、氧合及酸鹼趨勢改善可提示療效。"},{"stem":"鼻導管造成耳後發紅，應如何處理？","options":[{"letter":"A","text":"忽略"},{"letter":"B","text":"檢查皮膚、調整固定並適當減壓"},{"letter":"C","text":"停止必要氧療"},{"letter":"D","text":"綁更緊"}],"answer":"B","rationale":"長期鼻導管可能造成壓傷，應減壓並維持必要氧療。"},{"stem":"鼻導管使用者應避免哪項鼻腔照護？","options":[{"letter":"A","text":"口腔照護"},{"letter":"B","text":"塗石油類油膏"},{"letter":"C","text":"評估加濕"},{"letter":"D","text":"檢查黏膜"}],"answer":"B","rationale":"油性產品與氧氣環境有燃燒風險。"},{"stem":"咳嗽造成漏尿，適當護理為何？","options":[{"letter":"A","text":"禁止咳嗽"},{"letter":"B","text":"評估並提供骨盆底訓練或轉介"},{"letter":"C","text":"限制所有液體"},{"letter":"D","text":"告知必然不可處理"}],"answer":"B","rationale":"咳嗽相關尿失禁可評估並採取骨盆底訓練等介入。"},{"stem":"平躺喘加劇應評估何者？","options":[{"letter":"A","text":"體位性呼吸困難及心衰竭等共病"},{"letter":"B","text":"視為正常COPD"},{"letter":"C","text":"停所有藥"},{"letter":"D","text":"只測白天活動"}],"answer":"A","rationale":"端坐呼吸可能提示心衰竭等共病，不能單歸因COPD。"},{"stem":"喘促合併胸痛放射至手臂，應優先考慮何者？","options":[{"letter":"A","text":"急性冠心症等非肺部原因"},{"letter":"B","text":"只加吸入藥"},{"letter":"C","text":"必然是咳嗽"},{"letter":"D","text":"下次回診再說"}],"answer":"A","rationale":"胸痛放射須緊急排除急性冠心症等危急病因。"},{"stem":"一位COPD患者活動量下降，護理目標較適當為何？","options":[{"letter":"A","text":"永久臥床"},{"letter":"B","text":"避免所有活動"},{"letter":"C","text":"安全監測下逐步增加日常活動"},{"letter":"D","text":"不問患者偏好"}],"answer":"C","rationale":"適度活動與復健可維持功能，需量力及監測。"},{"stem":"一位COPD患者計畫搭機，護理師應建議何者？","options":[{"letter":"A","text":"停用吸入藥"},{"letter":"B","text":"行前評估病況、氧氣需求及設備安排"},{"letter":"C","text":"氧瓶上機不需確認"},{"letter":"D","text":"所有患者禁飛"}],"answer":"B","rationale":"飛行可能加重低氧，需事先評估並確認航空及設備規定。"},{"stem":"氧氣設備附近有室內吸菸，正確衛教為何？","options":[{"letter":"A","text":"包布就能防火"},{"letter":"B","text":"關氧即可旁吸"},{"letter":"C","text":"開窗即安全"},{"letter":"D","text":"氧氣環境與設備周遭嚴禁吸菸及明火"}],"answer":"D","rationale":"氧氣助燃，患者及家人都須遠離設備吸菸或用火。"},{"stem":"氧氣管線跨越走道，應如何處理？","options":[{"letter":"A","text":"繞樓梯扶手"},{"letter":"B","text":"埋在地毯下"},{"letter":"C","text":"赤腳跨越"},{"letter":"D","text":"整理固定管線並保持通道暢通"}],"answer":"D","rationale":"管線可能造成跌倒，需整理動線並妥善固定。"},{"stem":"何種狀況需立即求助？","options":[{"letter":"A","text":"短暫打噴嚏"},{"letter":"B","text":"休息即緩解的輕喘"},{"letter":"C","text":"嚴重喘、發紺、意識改變或救援藥無效"},{"letter":"D","text":"痰量如常"}],"answer":"C","rationale":"嚴重喘、發紺、意識變化及救援藥無效是急症警訊。"},{"stem":"書面自我管理計畫的主要目的為何？","options":[{"letter":"A","text":"自行診斷所有疾病"},{"letter":"B","text":"取代回診"},{"letter":"C","text":"辨識症狀變化並依指示分級行動"},{"letter":"D","text":"可自行停藥"}],"answer":"C","rationale":"行動計畫協助辨識穩定、惡化與急症，並依預定指示求助。"},{"stem":"因害怕喘而不敢外出，護理師宜如何協助？","options":[{"letter":"A","text":"停止社交"},{"letter":"B","text":"評估焦慮與活動限制，支持並轉介復健資源"},{"letter":"C","text":"只給鎮靜藥"},{"letter":"D","text":"不處理焦慮"}],"answer":"B","rationale":"焦慮可能與喘互相加重，需支持、呼吸技巧及復健等整合照護。"},{"stem":"喘時平穩引導呼吸的目的為何？","options":[{"letter":"A","text":"取代評估"},{"letter":"B","text":"減少恐慌並協助控制呼吸節奏"},{"letter":"C","text":"取代氧療"},{"letter":"D","text":"強迫快速呼吸"}],"answer":"B","rationale":"平穩陪伴可降低恐慌，但不能替代必要治療。"},{"stem":"患者未規律使用維持吸入劑，護理師先了解何者？","options":[{"letter":"A","text":"先責備"},{"letter":"B","text":"藥物理解、技巧、可近性及副作用疑慮"},{"letter":"C","text":"取消處方"},{"letter":"D","text":"共用藥物"}],"answer":"B","rationale":"找出未使用原因才能提供對應教育或資源。"},{"stem":"患者認為維持藥不用每天用，應如何衛教？","options":[{"letter":"A","text":"停救援藥"},{"letter":"B","text":"維持藥依處方規律使用，與救援藥用途不同"},{"letter":"C","text":"所有藥只在最喘時用"},{"letter":"D","text":"每月用一次"}],"answer":"B","rationale":"維持藥和救援藥用途不同，依處方規律使用。"},{"stem":"吸入器存放於高溫車內，應提醒何者？","options":[{"letter":"A","text":"依產品說明保存並避免不適當高溫"},{"letter":"B","text":"高溫增效"},{"letter":"C","text":"溫度無影響"},{"letter":"D","text":"全部冷凍"}],"answer":"A","rationale":"保存條件因產品而異，應依仿單避免高溫等不當環境。"},{"stem":"疲倦但血氧接近平日，仍喘促，應如何處理？","options":[{"letter":"A","text":"任意加氧"},{"letter":"B","text":"不問症狀"},{"letter":"C","text":"判定無事"},{"letter":"D","text":"評估呼吸作功、症狀與其他原因"}],"answer":"D","rationale":"血氧不能完整代表通氣與呼吸作功，需整合評估。"},{"stem":"痰量、顏色及黏稠度評估的意義為何？","options":[{"letter":"A","text":"看髮型"},{"letter":"B","text":"比較基線變化以判斷感染或分泌物負荷"},{"letter":"C","text":"無臨床用途"},{"letter":"D","text":"看鞋碼"}],"answer":"B","rationale":"痰液特性及改變有助評估感染與急性惡化。"},{"stem":"冷空氣使喘加劇，可建議何者？","options":[{"letter":"A","text":"用明火加熱氧氣"},{"letter":"B","text":"寒風快走"},{"letter":"C","text":"以圍巾遮護口鼻並避免直接吸冷空氣"},{"letter":"D","text":"永久不外出"}],"answer":"C","rationale":"遮護口鼻及減少冷空氣刺激可降低症狀誘發。"},{"stem":"清潔劑氣味引發喘促，衛教何者適當？","options":[{"letter":"A","text":"減少揮發物暴露並保持適當通風"},{"letter":"B","text":"密閉漂白水"},{"letter":"C","text":"停維持藥"},{"letter":"D","text":"加香氛掩蓋"}],"answer":"A","rationale":"刺激性氣味可能加重氣道症狀，應減少暴露及通風。"}]},{"title":"Asthma（氣喘）","questions":[{"answer":"A","options":[{"letter":"A","text":"慢性氣道發炎伴可變性氣流受限"},{"letter":"B","text":"肺血管阻塞造成固定氧合障礙"},{"letter":"C","text":"肺泡不可逆塌陷造成固定呼吸困難"},{"letter":"D","text":"胸膜積液造成肺擴張受限"}],"rationale":"氣喘的核心為慢性氣道發炎及可變性氣流受限；不是固定肺泡或胸膜病變。","stem":"患者反覆喘鳴、咳嗽且症狀時有時無，最符合何種病理特徵？"},{"answer":"A","options":[{"letter":"A","text":"症狀會隨時間與誘因而變動"},{"letter":"B","text":"呼吸道症狀只會在夜間出現"},{"letter":"C","text":"每次發作都會持續惡化不緩解"},{"letter":"D","text":"症狀必然由細菌感染造成"}],"rationale":"氣喘症狀可受冷空氣等誘因影響而起伏；單一誘發因素不代表必有感染。","stem":"患者每逢冷空氣暴露後短暫咳喘，最能說明氣喘何種特性？"},{"answer":"C","options":[{"letter":"A","text":"肺泡破裂使呼氣氣流變急"},{"letter":"B","text":"膈肌痙攣造成呼氣音調升高"},{"letter":"C","text":"狹窄氣道在呼氣時更易受壓"},{"letter":"D","text":"胸水使肺底部氣流加速通過"}],"rationale":"呼氣時胸腔內壓上升，狹窄氣道更易受壓，氣流受限與喘鳴因而明顯。","stem":"氣喘患者呼氣時喘鳴較明顯，最可能的生理原因為何？"},{"answer":"C","options":[{"letter":"A","text":"肺泡通氣量增加且呼吸功下降"},{"letter":"B","text":"肺血流量上升且血氧必然改善"},{"letter":"C","text":"氣道管徑縮小且氣流阻力增加"},{"letter":"D","text":"胸膜腔壓力下降且肺順應性增加"}],"rationale":"支氣管平滑肌收縮使氣道變窄、阻力增加；不會直接改善氧合。","stem":"患者接觸誘因後支氣管平滑肌收縮，預期最直接的變化為何？"},{"answer":"C","options":[{"letter":"A","text":"肺順應性增加且殘氣量下降"},{"letter":"B","text":"呼吸功降低且肺泡通氣改善"},{"letter":"C","text":"氣道阻塞加重且呼氣更困難"},{"letter":"D","text":"肺血流增加而心輸出量上升"}],"rationale":"黏膜水腫與黏液增加會縮小氣道通道，與支氣管收縮共同加重阻塞。","stem":"發作時可見氣道黏膜水腫、分泌物增加，最可能造成何種結果？"},{"answer":"D","options":[{"letter":"A","text":"氣道已形成完全固定的不可逆阻塞"},{"letter":"B","text":"肺泡已失去所有氣體交換能力"},{"letter":"C","text":"氣道只會對細菌感染產生反應"},{"letter":"D","text":"氣道對刺激可能出現過度收縮反應"}],"rationale":"氣道高反應性是對刺激產生過強的支氣管反應；不等同固定阻塞或肺泡失能。","stem":"護理師向患者解釋氣道高反應性，何者最適當？"},{"answer":"A","options":[{"letter":"A","text":"無症狀期間發炎仍可能存在"},{"letter":"B","text":"無症狀代表發炎必然已完全消失"},{"letter":"C","text":"症狀停止表示已轉成細菌感染"},{"letter":"D","text":"無症狀時通常代表肺泡已塌陷"}],"rationale":"症狀間歇不代表慢性氣道發炎完全消失；控制藥仍應依處方使用。","stem":"患者兩週未喘，詢問氣道發炎是否已完全消失，護理師宜如何說明？"},{"answer":"A","options":[{"letter":"A","text":"空氣滯留並可能形成過度充氣"},{"letter":"B","text":"通氣量持續增加且呼吸功下降"},{"letter":"C","text":"胸膜腔出現液體蓄積"},{"letter":"D","text":"肺內殘氣減少且呼吸變淺"}],"rationale":"氣流受限使呼氣不完全，空氣可能滯留並造成過度充氣。","stem":"急性發作時患者呼氣不完全，護理師最應預期何種變化？"},{"answer":"C","options":[{"letter":"A","text":"正常胸片可排除氣喘診斷"},{"letter":"B","text":"正常胸片表示肺功能必定正常"},{"letter":"C","text":"氣喘胸片可能無特異異常"},{"letter":"D","text":"胸片正常表示確診肺部腫瘤"}],"rationale":"胸片通常沒有氣喘特異表現，主要用於評估鑑別診斷或併發症，不能排除氣喘。","stem":"氣喘患者胸部X光未見明顯異常，護理師應如何解讀？"},{"answer":"A","options":[{"letter":"A","text":"誘因暴露與氣道發炎程度改變"},{"letter":"B","text":"胸廓形狀每日產生明顯變化"},{"letter":"C","text":"心瓣膜狹窄程度短期反覆變化"},{"letter":"D","text":"紅血球壽命隨季節固定改變"}],"rationale":"誘因暴露及發炎程度改變可造成氣喘症狀與氣流受限起伏。","stem":"患者症狀在不同季節及環境中起伏，最可能的原因為何？"},{"answer":"B","options":[{"letter":"A","text":"夜間症狀視為正常且不必追蹤"},{"letter":"B","text":"夜間覺醒頻率作為控制狀況指標"},{"letter":"C","text":"建議先停用所有控制藥物"},{"letter":"D","text":"只詢問白天運動耐受情形"}],"rationale":"夜間覺醒可能提示控制不佳，應與日間症狀、活動受限及用藥情形一併評估。","stem":"患者近一週因夜間咳喘醒來數次，門診評估時最應納入何者？"},{"answer":"D","options":[{"letter":"A","text":"平日使用的家具顏色與品牌"},{"letter":"B","text":"最近是否更換飲水的包裝品牌"},{"letter":"C","text":"是否曾經接受近視度數檢查"},{"letter":"D","text":"近期活動耐受變化及症狀對功能的影響"}],"rationale":"活動耐受度下降可反映症狀控制及功能受損，應進一步釐清變化。","stem":"患者表示爬樓梯較平日容易喘，護理師優先追問何者？"},{"answer":"B","options":[{"letter":"A","text":"依單次聽診判定氣喘已排除"},{"letter":"B","text":"確認近期症狀、用藥與呼吸狀態"},{"letter":"C","text":"直接判定目前控制良好而停止追蹤"},{"letter":"D","text":"認為喘鳴消失即可安排立即出院"}],"rationale":"氣喘症狀具變異性，單次聽診正常不能取代近期病史、呼吸狀態及治療反應評估。","stem":"患者昨夜嚴重喘醒，今日聽診未聞喘鳴，護理師下一步應如何處理？"},{"answer":"A","options":[{"letter":"A","text":"可能有嚴重呼吸窘迫，須立即評估"},{"letter":"B","text":"通常代表吸入藥已充分發揮作用"},{"letter":"C","text":"代表支氣管已擴張，症狀正在緩解"},{"letter":"D","text":"表示病情穩定，可自行返家觀察"}],"rationale":"說話受限是嚴重呼吸困難警訊，須立即評估並處置，而非視為改善。","stem":"急性喘患者只能以單字回答問題，護理師應如何判斷？"},{"answer":"B","options":[{"letter":"A","text":"一般疲倦而無須再評估"},{"letter":"B","text":"通氣不足並有呼吸衰竭風險"},{"letter":"C","text":"鼻塞造成短暫呼吸音改變"},{"letter":"D","text":"藥物已起效且病況改善"}],"rationale":"意識改變與呼吸音變弱可能表示氣流極少及通氣衰竭，是緊急警訊。","stem":"急性發作患者逐漸嗜睡且呼吸音變弱，最需警覺何種狀況？"},{"answer":"C","options":[{"letter":"A","text":"通常只是輕微上呼吸道感染"},{"letter":"B","text":"較可能是緊張而非呼吸問題"},{"letter":"C","text":"寂靜胸可能代表氣流極少"},{"letter":"D","text":"表示氣道已恢復正常通暢"}],"rationale":"嚴重阻塞時氣流不足以產生喘鳴，寂靜胸是危急徵象而非改善。","stem":"重度氣喘發作時幾乎聽不到呼吸音，護理師最適當的判讀為何？"},{"answer":"C","options":[{"letter":"A","text":"僅量體溫並等待下一次巡房"},{"letter":"B","text":"先安排常規衛教再觀察變化"},{"letter":"C","text":"先處理氧合並同步依計畫改善氣道阻塞"},{"letter":"D","text":"只補充飲水並記錄咳嗽情形"}],"rationale":"低氧需及時處理氧合並同步治療氣道阻塞；衛教不能取代急症處置。","stem":"急性喘患者血氧下降，護理師的優先處置為何？"},{"answer":"D","options":[{"letter":"A","text":"呼吸肌正在休息且氣道已恢復"},{"letter":"B","text":"感染已排除且呼吸狀況穩定"},{"letter":"C","text":"胸廓活動減少但無呼吸窘迫"},{"letter":"D","text":"輔助呼吸肌使用增加，呼吸作功上升"}],"rationale":"使用輔助呼吸肌表示呼吸作功增加，應評估窘迫程度及治療需求。","stem":"氣喘患者呼吸時明顯使用胸鎖乳突肌，代表何種狀況？"},{"answer":"A","options":[{"letter":"A","text":"呼氣氣流受限及其可變性"},{"letter":"B","text":"肺部感染的細菌種類與藥物敏感性"},{"letter":"C","text":"心臟每分鐘輸出的血液量"},{"letter":"D","text":"患者接觸的特定過敏原種類"}],"rationale":"肺量計評估呼氣氣流受限及支氣管擴張後變化，不用來測心輸出量或辨認過敏原。","stem":"臨床懷疑氣喘時，肺量計主要用來客觀評估何者？"},{"answer":"A","options":[{"letter":"A","text":"用力呼氣第一秒所呼出的氣體容積"},{"letter":"B","text":"最大吸氣後胸廓擴張的周徑"},{"letter":"C","text":"呼氣末二氧化碳的平均濃度"},{"letter":"D","text":"心臟每分鐘輸送至肺部的血量"}],"rationale":"FEV1是用力呼氣第一秒呼出的容積；應與其他肺量計指標共同判讀。","stem":"護理師向患者說明肺功能報告中的FEV1，何者正確？"},{"answer":"C","options":[{"letter":"A","text":"心律不整造成的心輸出量下降"},{"letter":"B","text":"肺功能完全正常且無氣流受限"},{"letter":"C","text":"阻塞性通氣障礙及呼氣氣流受限"},{"letter":"D","text":"肺血管阻塞造成的灌流異常"}],"rationale":"FEV1/FVC降低常見於阻塞性通氣障礙，反映呼氣氣流受限。","stem":"肺量計顯示FEV1/FVC降低，最可能提示何種通氣型態？"},{"answer":"D","options":[{"letter":"A","text":"細菌感染是症狀變化的主要原因"},{"letter":"B","text":"肺部腫瘤造成固定氣道狹窄"},{"letter":"C","text":"支氣管擴張劑反應可排除氣喘"},{"letter":"D","text":"可變性氣流受限，符合氣喘特徵"}],"rationale":"支氣管擴張劑後改善支持可變性氣流受限，但仍須結合臨床表現判斷。","stem":"患者支氣管擴張劑使用後FEV1明顯改善，最支持何種特徵？"},{"answer":"A","options":[{"letter":"A","text":"依臨床情況重測或安排進一步客觀檢查"},{"letter":"B","text":"直接開始抗生素治療以確認診斷"},{"letter":"C","text":"因檢查正常而停止所有追蹤"},{"letter":"D","text":"將氣喘永久排除並結束後續評估"}],"rationale":"氣喘具變異性，無症狀時肺量計可能正常；必要時依情況重測或進一步檢查。","stem":"患者無症狀時肺量計正常，但病史仍疑似氣喘，應採取何種作法？"},{"answer":"D","options":[{"letter":"A","text":"測量每次發作時的血氧變化"},{"letter":"B","text":"判斷患者是否有心律不整"},{"letter":"C","text":"取代所有肺功能與臨床評估"},{"letter":"D","text":"追蹤個人呼氣氣流的變化趨勢"}],"rationale":"PEF可追蹤個人呼氣氣流趨勢並配合行動計畫；不能取代所有檢查。","stem":"護理師教導患者使用尖峰呼氣流速計，主要用途為何？"},{"answer":"D","options":[{"letter":"A","text":"緩慢吐氣數分鐘後記錄最低讀值"},{"letter":"B","text":"測量前先咳嗽並記錄第一次數值"},{"letter":"C","text":"平躺休息後以鼻子緩慢呼氣"},{"letter":"D","text":"先深吸氣，再快速用力吹氣並依指示重測"}],"rationale":"PEF需先最大吸氣，再快速有力呼氣，依指示重複測量並記錄最佳值。","stem":"患者準備測量尖峰呼氣流速，哪一個操作步驟正確？"},{"answer":"A","options":[{"letter":"A","text":"可反映部分嗜酸性氣道發炎訊號"},{"letter":"B","text":"可測得胸膜腔內壓力變化"},{"letter":"C","text":"可直接測出血紅素攜氧能力"},{"letter":"D","text":"可單獨確診所有類型氣喘"}],"rationale":"FeNO可輔助評估部分氣道發炎，不能單獨確診氣喘或取代臨床判斷。","stem":"患者詢問FeNO檢查能提供何種資訊，護理師如何說明？"},{"answer":"B","options":[{"letter":"A","text":"陽性結果可完全取代肺功能檢查"},{"letter":"B","text":"顯示有致敏證據，仍須比對暴露與症狀"},{"letter":"C","text":"陽性即證明所有喘症都由該過敏原造成"},{"letter":"D","text":"陽性表示氣喘已經治癒"}],"rationale":"陽性表示致敏證據，需與實際暴露及症狀關聯判讀，不能直接認定因果。","stem":"患者皮膚過敏測試呈陽性，如何解讀才恰當？"},{"answer":"A","options":[{"letter":"A","text":"呼吸肌疲乏或通氣不足正在加重"},{"letter":"B","text":"單純鼻塞導致二氧化碳下降"},{"letter":"C","text":"血液氣體變化與呼吸狀況無關"},{"letter":"D","text":"患者過度換氣且病情必然改善"}],"rationale":"嚴重發作時二氧化碳上升可能提示通氣不足或呼吸肌疲乏，需警覺呼吸衰竭。","stem":"重度發作患者的二氧化碳逐漸上升，護理師最需懷疑何者？"},{"answer":"A","options":[{"letter":"A","text":"評估氧合情形及治療反應"},{"letter":"B","text":"直接測量氣道發炎程度"},{"letter":"C","text":"用來辨認引起症狀的過敏原"},{"letter":"D","text":"取代呼吸作功與意識評估"}],"rationale":"血氧可協助評估氧合及治療反應，但仍須同時觀察呼吸作功、說話能力與意識。","stem":"急性氣喘照護中監測血氧的主要目的為何？"},{"answer":"B","options":[{"letter":"A","text":"以胸片直接測量支氣管反應性"},{"letter":"B","text":"疑有併發症或其他診斷時協助鑑別"},{"letter":"C","text":"每次例行回診都以胸片確診氣喘"},{"letter":"D","text":"以胸片取代肺量計測試氣流受限"}],"rationale":"胸片不是氣喘常規確診工具，適用於懷疑併發症或其他診斷的情境。","stem":"氣喘患者出現不典型胸痛且臨床懷疑其他胸肺問題，何時較適合安排胸部X光？"},{"answer":"D","options":[{"letter":"A","text":"殺死造成氣喘症狀的細菌"},{"letter":"B","text":"永久抑制氣道黏液分泌"},{"letter":"C","text":"直接清除所有氣道慢性發炎"},{"letter":"D","text":"迅速放鬆支氣管平滑肌以改善氣流"}],"rationale":"短效β2促效劑可快速支氣管擴張以緩解症狀，但不取代控制發炎的治療。","stem":"患者依處方使用短效β2促效劑，該藥主要作用為何？"},{"answer":"C","options":[{"letter":"A","text":"飲用糖水以降低口腔刺激"},{"letter":"B","text":"立即加倍下一次吸入藥量"},{"letter":"C","text":"漱口後將水吐掉以減少局部副作用"},{"letter":"D","text":"使用後立刻平躺並避免飲水"}],"rationale":"吸入型類固醇後漱口並吐掉，可降低口腔念珠菌及聲音沙啞風險。","stem":"患者使用吸入型類固醇後，護理師應提醒哪項照護？"},{"answer":"C","options":[{"letter":"A","text":"改用家人吸入藥以避免藥物浪費"},{"letter":"B","text":"目前間歇使用方式已足以控制發炎"},{"letter":"C","text":"依處方規律使用以控制氣道發炎"},{"letter":"D","text":"症狀消失就可自行永久停用控制藥"}],"rationale":"吸入型類固醇是控制發炎的藥物，通常須依處方規律使用，不是只在喘時使用。","stem":"患者只在喘時才使用吸入型類固醇，護理師最適當的衛教為何？"},{"answer":"C","options":[{"letter":"A","text":"按壓後立即快速吐氣"},{"letter":"B","text":"快速連按數次後再開始吸氣"},{"letter":"C","text":"緩慢深吸時同步按壓並持續吸入"},{"letter":"D","text":"噴向舌面以確認藥物已釋出"}],"rationale":"定量噴霧器需協調按壓與緩慢深吸，以利藥物進入下呼吸道。","stem":"患者使用定量噴霧器時常將藥噴入口腔，護理師應教導何種協調技巧？"},{"answer":"D","options":[{"letter":"A","text":"含住吸嘴並持續數分鐘不動"},{"letter":"B","text":"立即快速吐氣以排出殘藥"},{"letter":"C","text":"立即咳嗽以確認藥物進入氣道"},{"letter":"D","text":"短暫閉氣後再緩慢呼氣"}],"rationale":"吸藥後短暫閉氣有助藥物沉積，之後再緩慢呼氣。","stem":"患者吸入藥物後若能耐受，接續應如何呼吸？"},{"answer":"D","options":[{"letter":"A","text":"不連接吸入器的單獨面罩"},{"letter":"B","text":"鼻胃管以協助藥物送入肺部"},{"letter":"C","text":"血壓計以確認吸入藥物劑量"},{"letter":"D","text":"儲霧罐以減少按壓吸氣協調困難"}],"rationale":"儲霧罐可減少定量噴霧器的協調需求，並降低口咽部藥物沉積。","stem":"患者難以協調定量噴霧器按壓與吸氣，護理師可建議何種輔具？"},{"answer":"D","options":[{"letter":"A","text":"對著裝置吹氣後再緩慢吸入"},{"letter":"B","text":"使用前以水沖洗裝置內部"},{"letter":"C","text":"將儲霧罐接在乾粉裝置前端"},{"letter":"D","text":"依裝置要求快速而深地吸氣"}],"rationale":"乾粉吸入器通常需足夠快速而深的吸氣，並避免對裝置吹氣以免受潮。","stem":"患者使用乾粉吸入器，護理師應提醒哪項操作重點？"},{"answer":"D","options":[{"letter":"A","text":"裝置尚未乾燥時即可吸入藥粉"},{"letter":"B","text":"以酒精浸泡裝置後立即使用"},{"letter":"C","text":"每次使用後以水沖洗內部再收起"},{"letter":"D","text":"依產品說明清潔並避免裝置內部受潮"}],"rationale":"乾粉受潮可能影響藥物輸送，應依產品說明清潔並妥善保存。","stem":"患者詢問乾粉吸入器平日如何清潔與保存，護理師應如何回答？"},{"answer":"B","options":[{"letter":"A","text":
