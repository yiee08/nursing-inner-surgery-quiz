<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123a4a"><title>護理科內外科｜隨身刷題</title>
<style>
:root{--ink:#183b48;--muted:#60747c;--teal:#167c76;--bg:#f2f6f5;--card:#fff;--line:#dce7e4;--ok:#16744c;--bad:#b8403b;--gold:#efb84f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;line-height:1.55}.app{max-width:760px;margin:auto;min-height:100vh;padding:0 16px 34px}.top{margin:0 -16px 16px;padding:18px 18px 16px;background:linear-gradient(135deg,#123a4a,#167c76);color:white;position:sticky;top:0;z-index:3;box-shadow:0 4px 14px #15394422}.top h1{font-size:20px;margin:0 0 3px}.top p{margin:0;font-size:12px;opacity:.85}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.controls label{font-size:12px;color:var(--muted);font-weight:700}.controls select,.controls input{width:100%;margin-top:4px;padding:11px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-size:15px}.switchrow{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:4px 0 12px}.stats{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin:10px 1px}.bar{height:7px;background:#dce7e4;border-radius:9px;overflow:hidden;margin:0 0 14px}.bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .2s}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 6px 22px #193f4a0b}.qmeta{color:var(--teal);font-size:12px;font-weight:800;margin-bottom:8px}.stem{font-size:18px;font-weight:750;line-height:1.55;margin:0 0 16px}.opt{width:100%;display:flex;align-items:flex-start;text-align:left;gap:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:12px;border-radius:13px;margin:9px 0;font-size:15px;line-height:1.45;cursor:pointer}.opt:active{transform:scale(.99)}.letter{flex:none;width:26px;height:26px;border-radius:50%;background:#eaf2f0;color:#315c60;display:grid;place-items:center;font-weight:800;font-size:13px}.opt.selected{border-color:var(--teal);background:#edf7f5}.opt.correct{border-color:#65ad84;background:#eff9f2}.opt.wrong{border-color:#d9827b;background:#fff2f0}.opt:disabled{cursor:default}.feedback{display:none;margin-top:12px;padding:13px;border-radius:12px;font-size:14px}.feedback.show{display:block}.feedback.ok{background:#eef8f1;border:1px solid #d2ead8}.feedback.no{background:#fff4f2;border:1px solid #f0d4cf}.feedback b{display:block;margin-bottom:5px}.actions{display:flex;gap:9px;margin-top:14px}.btn{border:0;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:750;cursor:pointer}.primary{background:var(--teal);color:#fff;flex:1}.secondary{background:#e8efed;color:var(--ink)}.small{font-size:12px;color:var(--muted);text-align:center;margin:12px 0}.empty{text-align:center;padding:32px 16px;color:var(--muted)}.complete{display:none;text-align:center;padding:26px 16px}.complete h2{margin:0 0 8px}.complete .score{font-size:36px;font-weight:850;color:var(--teal)}.hide{display:none!important}@media(min-width:620px){.app{padding-top:10px}.top{border-radius:0 0 18px 18px}.stem{font-size:20px}}
</style></head><body><main class="app"><header class="top"><h1>護理科內外科｜隨身刷題</h1><p>10 個主題・1,000 題・附答案與解析｜可離線使用</p></header>
<div class="controls"><label>選擇主題<select id="topic"></select></label><label>練習模式<select id="mode"><option value="practice">逐題練習（答後看解析）</option><option value="exam">測驗模式（最後看成績）</option></select></label></div>
<div class="controls"><label>題目範圍<select id="range"><option value="all">全部題目</option><option value="wrong">錯題重練</option><option value="marked">我的收藏</option></select></label><label>快速跳題<input id="jump" type="number" min="1" max="100" placeholder="輸入題號 1–100"></label></div>
<div class="switchrow"><input type="checkbox" id="shuffle"> <label for="shuffle">隨機出題（每次開始重新抽序）</label></div>
<div class="stats"><span id="counter">準備開始</span><span id="score">答對 0 / 已答 0</span></div><div class="bar"><i id="progress"></i></div>
<section class="card" id="quiz"><div class="qmeta" id="qmeta"></div><p class="stem" id="stem"></p><div id="options"></div><div class="feedback" id="feedback"></div><div class="actions"><button class="btn secondary" id="prev">上一題</button><button class="btn secondary" id="mark">☆ 收藏</button><button class="btn primary" id="next">下一題</button></div></section>
<section class="card complete" id="complete"><h2>本回合完成</h2><div class="score" id="finalscore"></div><p id="summary"></p><button class="btn primary" id="retryWrong">重練本回合錯題</button><div style="height:8px"></div><button class="btn secondary" id="restart">重新開始</button></section>
<p class="small">題目為學習練習用途，非官方考題；臨床照護請遵循最新指引與機構規範。</p></main>
<script>
const BANK=[{"title":"呼吸系統處置","questions":[{"stem":"一位肺炎病人呼吸急促、發紺且血氧飽和度下降，護理師應優先採取何項措施？","options":[{"letter":"A","text":"協助採高坐臥並立即評估呼吸與氧合"},{"letter":"B","text":"先安排沐浴以降低體溫"},{"letter":"C","text":"先完成飲食紀錄"},{"letter":"D","text":"鼓勵病人平躺休息"}],"answer":"A","rationale":"高坐臥可改善胸廓擴張；先處理氣道與氧合並迅速評估，符合急症優先原則。"},{"stem":"護理師觀察到病人呼吸時胸骨上凹陷並使用輔助呼吸肌，最適當的判斷為何？","options":[{"letter":"A","text":"單純表示病人疼痛已緩解"},{"letter":"B","text":"呼吸作功增加，可能有呼吸窘迫"},{"letter":"C","text":"代表肺部換氣已恢復正常"},{"letter":"D","text":"正常的睡眠呼吸型態"}],"answer":"B","rationale":"凹陷與輔助肌使用是呼吸作功增加的警訊，須立即評估呼吸道、氧合及病情變化。"},{"stem":"慢性阻塞性肺病病人採縮唇呼吸時，護理師應如何指導？","options":[{"letter":"A","text":"用力快速吐氣至頭暈"},{"letter":"B","text":"鼻吸氣，噘嘴緩慢吐氣且吐氣時間較長"},{"letter":"C","text":"快速用嘴吸氣並閉氣"},{"letter":"D","text":"吸氣與吐氣都屏住氣"}],"answer":"B","rationale":"縮唇呼吸延長呼氣、降低小氣道塌陷，有助減少呼吸困難。"},{"stem":"護理師教導慢性阻塞性肺病病人腹式呼吸，何者正確？","options":[{"letter":"A","text":"吸氣時腹部內縮，吐氣時鼓起"},{"letter":"B","text":"全程憋氣以增加肺活量"},{"letter":"C","text":"吸氣時腹部鼓起，吐氣時腹部內縮"},{"letter":"D","text":"肩膀快速抬起完成吸氣"}],"answer":"C","rationale":"腹式呼吸以橫膈活動為主，吸氣腹部上升、吐氣腹部下降，有助提升呼吸效率。"},{"stem":"病人使用鼻導管氧氣，護理師發現鼻黏膜乾燥，最適切的處置為何？","options":[{"letter":"A","text":"自行塗抹石油性軟膏於鼻孔"},{"letter":"B","text":"將氧流量任意調至最大"},{"letter":"C","text":"停用氧氣直到乾燥消失"},{"letter":"D","text":"依醫囑及設備需要使用適當加濕並評估黏膜"}],"answer":"D","rationale":"適當加濕可減輕乾燥；油性產品遇氧有燃燒風險，氧流量不可自行變更。"},{"stem":"使用氧氣治療時，下列何項安全措施最重要？","options":[{"letter":"A","text":"將氧氣鋼瓶平放於走道"},{"letter":"B","text":"用棉被覆蓋氧氣流量計"},{"letter":"C","text":"遠離火源並禁止吸菸"},{"letter":"D","text":"以油性潤滑劑保護氧氣接頭"}],"answer":"C","rationale":"氧氣助燃，須嚴禁火源與吸菸；鋼瓶應固定，設備保持通暢且不可被遮蓋。"},{"stem":"給予氧氣後，護理師評估病人最能直接反映氧合改善的資料為何？","options":[{"letter":"A","text":"腸蠕動音"},{"letter":"B","text":"脈搏血氧飽和度趨勢與臨床呼吸狀態"},{"letter":"C","text":"尿液顏色"},{"letter":"D","text":"每日身高"}],"answer":"B","rationale":"血氧飽和度配合意識、呼吸型態與膚色可評估氧合；單一數值仍須結合臨床判斷。"},{"stem":"指尖脈搏血氧機讀值與病人臨床狀況不符且手指冰冷，護理師宜先做何事？","options":[{"letter":"A","text":"立即依該讀值增加氧氣至最高"},{"letter":"B","text":"以血壓計袖帶壓住探頭"},{"letter":"C","text":"忽略病人主訴並記錄正常"},{"letter":"D","text":"溫暖末梢、確認探頭位置與訊號後重新測量"}],"answer":"D","rationale":"末梢灌流不佳及探頭位置可能造成誤讀，應先改善測量條件並以臨床狀況交叉確認。"},{"stem":"抽取動脈血液氣體分析後，穿刺處最適當的護理為何？","options":[{"letter":"A","text":"不需加壓，讓血液自然凝固"},{"letter":"B","text":"立即按摩穿刺處"},{"letter":"C","text":"持續直接加壓至止血，並留意血腫與灌流"},{"letter":"D","text":"在穿刺處熱敷後離開"}],"answer":"C","rationale":"動脈穿刺出血風險較高，應直接加壓止血並觀察局部及遠端循環。"},{"stem":"病人的動脈血液氣體顯示 pH 下降、二氧化碳分壓上升，最符合何種狀況？","options":[{"letter":"A","text":"單純代謝性酸中毒"},{"letter":"B","text":"代謝性鹼中毒"},{"letter":"C","text":"呼吸性鹼中毒"},{"letter":"D","text":"呼吸性酸中毒"}],"answer":"D","rationale":"二氧化碳滯留形成碳酸，常使 pH 下降，呈呼吸性酸中毒；仍須結合碳酸氫根判讀代償。"},{"stem":"肺功能檢查前，病人詢問是否可以抽菸，護理師如何回答最適當？","options":[{"letter":"A","text":"依檢查單位指示避免抽菸，因抽菸會影響氣道與測量"},{"letter":"B","text":"可以抽菸，結果不會受影響"},{"letter":"C","text":"只要檢查前喝咖啡即可"},{"letter":"D","text":"抽菸可使肺功能測值更準確"}],"answer":"A","rationale":"抽菸會影響氣道與肺功能測量；應依檢查機構指示準備，並告知用藥是否需暫停。"},{"stem":"病人接受支氣管鏡檢查後，何項照護最優先？","options":[{"letter":"A","text":"安排平躺並不再觀察"},{"letter":"B","text":"待咽喉反射恢復後再給予飲食"},{"letter":"C","text":"鼓勵立刻進食固體食物"},{"letter":"D","text":"立即提供大量飲水"}],"answer":"B","rationale":"局部麻醉可能抑制咽喉反射，未恢復前進食飲水有吸入風險，需監測呼吸與出血。"},{"stem":"胸腔穿刺後病人突然呼吸困難且患側呼吸音減弱，護理師應優先懷疑何種併發症？","options":[{"letter":"A","text":"低血糖"},{"letter":"B","text":"氣胸"},{"letter":"C","text":"便祕"},{"letter":"D","text":"尿滯留"}],"answer":"B","rationale":"胸腔穿刺後突發呼吸困難與呼吸音減弱須警覺氣胸，立即評估並通報處理。"},{"stem":"胸部 X 光檢查前，護理師對育齡病人最適當的評估為何？","options":[{"letter":"A","text":"確認是否排便"},{"letter":"B","text":"常規停用所有藥物一週"},{"letter":"C","text":"要求先大量飲水"},{"letter":"D","text":"詢問是否可能懷孕並依流程採取防護"}],"answer":"D","rationale":"需確認妊娠可能並依放射檢查規範評估防護；不可無指示任意停藥。"},{"stem":"肺炎病人咳出痰液，何種檢體採集方式最適當？","options":[{"letter":"A","text":"清晨漱口後深咳，將下呼吸道痰液吐入無菌容器"},{"letter":"B","text":"先將唾液吐入容器即可"},{"letter":"C","text":"先在容器內加入自來水"},{"letter":"D","text":"從床單刮取乾痰送驗"}],"answer":"A","rationale":"深咳取得的下呼吸道痰液較具代表性，避免唾液污染並依規範迅速送驗。"},{"stem":"醫師開立痰液培養，且病人狀況允許，護理師應如何安排採檢？","options":[{"letter":"A","text":"抗生素使用數日後才採集"},{"letter":"B","text":"只採集口水即可"},{"letter":"C","text":"等病人完全康復後採集"},{"letter":"D","text":"儘可能於抗生素開始前採集，但不得延誤急救治療"}],"answer":"D","rationale":"抗生素前採檢有助培養判讀，但不能為採檢延誤必要的急性治療。"},{"stem":"肺炎病人使用抗生素後，護理師最應追蹤何項反應？","options":[{"letter":"A","text":"體溫、呼吸狀況、痰液及藥物不良反應"},{"letter":"B","text":"每日鞋碼"},{"letter":"C","text":"頭髮生長速度"},{"letter":"D","text":"視力顏色辨識"}],"answer":"A","rationale":"需評估感染改善及抗生素安全性，例如過敏、腹瀉或其他不良反應。"},{"stem":"病人服用抗生素後出現全身蕁麻疹、喘鳴及嘴唇腫脹，護理師應如何處理？","options":[{"letter":"A","text":"僅記錄於交班，不需處理"},{"letter":"B","text":"視為嚴重過敏反應，立即啟動緊急處置並通知醫療團隊"},{"letter":"C","text":"告知屬常見現象，下一劑照常服用"},{"letter":"D","text":"先讓病人自行步行觀察"}],"answer":"B","rationale":"蕁麻疹合併喘鳴、血管性水腫可能是過敏性反應，須立即處理氣道與循環並停下後續給藥待評估。"},{"stem":"流感病人咳嗽時，護理師衛教何者最適當？","options":[{"letter":"A","text":"將用過衛生紙留在床邊"},{"letter":"B","text":"以衛生紙或手肘遮掩咳嗽並執行手部衛生"},{"letter":"C","text":"咳嗽時面向他人以便聽診"},{"letter":"D","text":"與他人共用口罩"}],"answer":"B","rationale":"咳嗽禮節及手部衛生可降低飛沫與接觸傳播。"},{"stem":"照護疑似肺結核病人時，護理師應優先採取何種感染管制措施？","options":[{"letter":"A","text":"僅使用接觸隔離手套即可"},{"letter":"B","text":"讓病人與其他病人共用病室且不戴口罩"},{"letter":"C","text":"安排空氣隔離並由工作人員佩戴適當呼吸防護具"},{"letter":"D","text":"只在清潔時戴一般手套"}],"answer":"C","rationale":"肺結核經空氣傳播，應採空氣隔離、適當呼吸防護及病人外出時口罩等措施。"},{"stem":"護理師為肺結核病人採集痰液時，最適當的地點為何？","options":[{"letter":"A","text":"通風良好且依院內感染管制規範指定的採檢處"},{"letter":"B","text":"護理站內"},{"letter":"C","text":"多人共用的餐廳"},{"letter":"D","text":"電梯中"}],"answer":"A","rationale":"痰液採集可能產生感染性飛沫核，應在指定、通風適當的區域進行。"},{"stem":"肺結核病人開始多重藥物治療後，護理師最重要的衛教為何？","options":[{"letter":"A","text":"依療程規律服藥，不可因症狀改善自行停藥"},{"letter":"B","text":"只需服用其中一種藥"},{"letter":"C","text":"與家人共用藥物以免浪費"},{"letter":"D","text":"退燒後即可停藥"}],"answer":"A","rationale":"不完整治療會造成復發及抗藥性；應完成療程並依安排追蹤。"},{"stem":"服用抗結核藥物的病人發現皮膚或眼白變黃，護理師應建議何者？","options":[{"letter":"A","text":"只要多吃油脂即可"},{"letter":"B","text":"儘速聯絡醫療團隊評估肝毒性，不自行忽略"},{"letter":"C","text":"自行加倍服藥"},{"letter":"D","text":"這是療效良好，不需告知"}],"answer":"B","rationale":"黃疸可能提示肝損傷，需立即評估藥物相關肝毒性並依醫囑處理。"},{"stem":"使用異菸肼治療的病人，護理師應提醒留意何種症狀並回報？","options":[{"letter":"A","text":"偶爾打噴嚏"},{"letter":"B","text":"指甲短暫變長"},{"letter":"C","text":"食慾正常"},{"letter":"D","text":"手腳麻木或刺痛"}],"answer":"D","rationale":"異菸肼可能造成周邊神經病變；麻木刺痛應回報，並依醫囑評估維生素 B6 補充。"},{"stem":"使用利福平的病人詢問尿液呈橘紅色是否代表出血，護理師最適當回應為何？","options":[{"letter":"A","text":"只需少喝水即可改善"},{"letter":"B","text":"此藥可使尿液、淚液等呈橘紅色，仍應依指示服藥並留意其他異常"},{"letter":"C","text":"代表腎臟已衰竭，立即停藥"},{"letter":"D","text":"將藥物與他人交換"}],"answer":"B","rationale":"利福平常使體液呈橘紅色，須事先衛教；若有其他症狀仍應回報。"},{"stem":"氣喘病人突然喘鳴、說話需中斷換氣，護理師應優先做何事？","options":[{"letter":"A","text":"先給予鎮靜藥使其安靜"},{"letter":"B","text":"先安排長時間衛教"},{"letter":"C","text":"評估呼吸嚴重度並依處方立即給予急救型支氣管擴張劑"},{"letter":"D","text":"讓病人平躺並離開病室"}],"answer":"C","rationale":"急性氣喘發作需先處理氣道阻塞與氧合，按處方使用急救型吸入藥並密切再評估。"},{"stem":"氣喘病人使用短效乙二型交感神經作用劑後出現輕微手抖，護理師如何回應較適當？","options":[{"letter":"A","text":"不需評估呼吸狀態"},{"letter":"B","text":"可能是常見副作用，仍須評估嚴重度與心悸等症狀"},{"letter":"C","text":"要求自行加量直到手抖消失"},{"letter":"D","text":"表示發生肺塌陷，立即停用所有藥物"}],"answer":"B","rationale":"短效乙二型作用劑可造成手抖或心悸，應評估並依處方使用，不可自行增減劑量。"},{"stem":"病人使用吸入型類固醇後，最重要的口腔照護為何？","options":[{"letter":"A","text":"立即吞下漱口水"},{"letter":"B","text":"漱口並吐掉漱口水"},{"letter":"C","text":"不必清潔口腔"},{"letter":"D","text":"使用後立刻吃糖"}],"answer":"B","rationale":"使用後漱口可降低口腔念珠菌感染及聲音沙啞風險。"},{"stem":"病人同時使用支氣管擴張劑與吸入型類固醇，若均依處方使用，通常應先吸哪一種？","options":[{"letter":"A","text":"先使用支氣管擴張劑，再使用吸入型類固醇"},{"letter":"B","text":"自行選擇且不必間隔"},{"letter":"C","text":"先吸類固醇並立即漱口，再吸擴張劑"},{"letter":"D","text":"兩種藥混在同一裝置"}],"answer":"A","rationale":"先擴張氣道有助後續類固醇吸入進入氣道；各藥應依裝置及處方使用。"},{"stem":"使用定量噴霧吸入器時，病人最適當的操作為何？","options":[{"letter":"A","text":"藥罐置於口外數公尺處"},{"letter":"B","text":"按壓後立刻吐氣，不需吸入"},{"letter":"C","text":"緩慢深吸氣時同步按壓藥罐，之後短暫閉氣"},{"letter":"D","text":"快速連續按壓並只用鼻子吸氣"}],"answer":"C","rationale":"按壓與緩慢深吸氣需協調，吸入後短暫閉氣可增加藥物沉積；可依需要使用輔助艙。"},{"stem":"病人使用乾粉吸入器時，吸氣技巧何者正確？","options":[{"letter":"A","text":"快速且深地經口吸入，並避免對裝置吐氣"},{"letter":"B","text":"緩慢用鼻吸入"},{"letter":"C","text":"吸氣時遮住裝置氣孔"},{"letter":"D","text":"對著裝置用力吐氣後再吸"}],"answer":"A","rationale":"乾粉裝置需有足夠快速深吸氣帶動藥粉，並保持裝置乾燥、避免向內吐氣。"},{"stem":"氣喘病人夜間症狀增加，且急救吸入器使用頻率上升，護理師最適當的建議為何？","options":[{"letter":"A","text":"避免記錄症狀"},{"letter":"B","text":"自行停用控制型藥物"},{"letter":"C","text":"僅在夜間加倍使用所有吸入藥"},{"letter":"D","text":"儘速回診評估控制狀況與治療計畫"}],"answer":"D","rationale":"夜間症狀與急救藥使用增加表示控制可能不佳，需評估病情與處方，而非自行調藥。"},{"stem":"氣喘病人使用峰流速計，何項操作有助於取得可信測值？","options":[{"letter":"A","text":"站立或坐直、深吸氣後快速用力吹氣，重複測量並記錄最佳值"},{"letter":"B","text":"含住吹嘴慢慢吐氣一次"},{"letter":"C","text":"測量後只記最小值"},{"letter":"D","text":"先咳嗽再將儀器置於鼻孔"}],"answer":"A","rationale":"峰流速需最大吸氣後迅速用力呼氣，依裝置及照護計畫重複測量並記錄最佳值。"},{"stem":"氣喘病人使用峰流速監測時，若測值落入其個人化行動計畫的危險區，應如何處理？","options":[{"letter":"A","text":"自行停掉控制型藥物"},{"letter":"B","text":"先做劇烈運動測試耐受度"},{"letter":"C","text":"依書面行動計畫立即使用急救處置並尋求醫療協助"},{"letter":"D","text":"忽略測值，等下次門診"}],"answer":"C","rationale":"危險區代表氣流受限可能嚴重，應依個人計畫處理並及時求助，不可延誤。"},{"stem":"慢性阻塞性肺病急性惡化病人氧療中，護理師應如何調整氧氣？","options":[{"letter":"A","text":"依醫囑或治療目標滴定並密切監測臨床狀態與血氧"},{"letter":"B","text":"任意調至最高流量且不再評估"},{"letter":"C","text":"只有病人睡著才給氧"},{"letter":"D","text":"因可能二氧化碳滯留而完全禁止氧氣"}],"answer":"A","rationale":"缺氧須治療，但需依處方設定目標並監測；不能因 COPD 而拒絕必要氧療，也不可任意調整。"},{"stem":"慢性阻塞性肺病病人活動時容易喘，護理師的節能指導何者適當？","options":[{"letter":"A","text":"將活動分段、安排休息並在費力時配合吐氣"},{"letter":"B","text":"完全停止所有日常活動"},{"letter":"C","text":"費力時憋氣用力"},{"letter":"D","text":"一次完成所有活動且避免休息"}],"answer":"A","rationale":"分段活動與配合呼氣可降低呼吸負荷，維持功能並減少疲憊。"},{"stem":"慢性阻塞性肺病病人痰液黏稠且無限水醫囑，護理師可建議何者？","options":[{"letter":"A","text":"以油性物質塗抹氣道"},{"letter":"B","text":"刻意限制所有液體"},{"letter":"C","text":"抑制咳嗽且不清除分泌物"},{"letter":"D","text":"適當補充水分並配合有效咳嗽，促進痰液排出"}],"answer":"D","rationale":"適當水分可使分泌物較易排出；仍須考慮心腎功能及個別限水指示。"},{"stem":"慢性阻塞性肺病病人接受肺復健的主要目的為何？","options":[{"letter":"A","text":"改善運動耐受、症狀管理及日常功能"},{"letter":"B","text":"立即逆轉既有肺氣腫"},{"letter":"C","text":"使病人不再需要評估"},{"letter":"D","text":"取代所有藥物治療"}],"answer":"A","rationale":"肺復健可改善活動能力與生活品質，通常結合運動、教育及自我管理，非取代其他治療。"},{"stem":"護理師向慢性阻塞性肺病病人說明戒菸，何種說法最適當？","options":[{"letter":"A","text":"只需改抽低焦油香菸"},{"letter":"B","text":"戒菸可減緩肺功能惡化，並可討論行為支持與藥物協助"},{"letter":"C","text":"戒菸會使肺部立即恢復正常"},{"letter":"D","text":"病程已慢性，戒菸完全沒有益處"}],"answer":"B","rationale":"戒菸是減緩疾病進展的重要措施；應提供可行支持，避免誇大為完全逆轉病變。"},{"stem":"肺氣腫病人胸廓呈桶狀，主要與何種病理生理改變有關？","options":[{"letter":"A","text":"氣管軟骨增生"},{"letter":"B","text":"肺泡破壞及肺部過度充氣"},{"letter":"C","text":"胸膜腔大量液體必然存在"},{"letter":"D","text":"肺泡塌陷使胸腔縮小"}],"answer":"B","rationale":"肺泡彈性回縮減弱與氣體滯留造成過度充氣，可形成桶狀胸。"},{"stem":"慢性支氣管炎病人長期咳嗽、咳痰，主要病理變化為何？","options":[{"letter":"A","text":"橫膈神經急性斷裂"},{"letter":"B","text":"支氣管黏液分泌增加及氣道慢性發炎"},{"letter":"C","text":"肺泡表面活性物質突然過量"},{"letter":"D","text":"胸膜纖維完全消失"}],"answer":"B","rationale":"慢性支氣管炎以氣道發炎及黏液分泌增加為特徵，造成咳嗽、咳痰與氣流受限。"},{"stem":"病人突發單側胸痛與呼吸困難，叩診呈鼓音且呼吸音減弱，護理師應優先懷疑何者？","options":[{"letter":"A","text":"肺水腫"},{"letter":"B","text":"氣胸"},{"letter":"C","text":"支氣管炎"},{"letter":"D","text":"鼻竇炎"}],"answer":"B","rationale":"單側呼吸音減弱、鼓音與急性胸痛呼吸困難符合氣胸表現，須迅速評估處置。"},{"stem":"疑似張力性氣胸病人出現低血壓、頸靜脈怒張與嚴重呼吸窘迫，最適當的處置原則為何？","options":[{"letter":"A","text":"讓病人步行至檢查室"},{"letter":"B","text":"立即啟動緊急處置並準備緊急減壓，不等待常規影像"},{"letter":"C","text":"僅觀察血氧一小時"},{"letter":"D","text":"先安排隔日門診胸部 X 光"}],"answer":"B","rationale":"張力性氣胸會造成阻塞性休克，屬立即危及生命急症，不能為常規影像延誤減壓。"},{"stem":"病人接受胸管引流，水封瓶內出現隨呼吸起伏的水柱變化，通常表示何者？","options":[{"letter":"A","text":"胸管必然阻塞"},{"letter":"B","text":"胸腔壓力變化仍傳至水封系統"},{"letter":"C","text":"引流系統必然破裂"},{"letter":"D","text":"應立即夾住胸管"}],"answer":"B","rationale":"水封液面隨呼吸波動通常反映胸腔壓力傳導；須結合病況及系統位置判斷。"},{"stem":"胸管引流系統持續冒泡，護理師應如何判斷與處理？","options":[{"letter":"A","text":"立即拔除胸管"},{"letter":"B","text":"評估是否有持續漏氣，依流程檢查連接處並通報"},{"letter":"C","text":"將水封瓶提高至病人胸部以上"},{"letter":"D","text":"把胸管長時間夾閉"}],"answer":"B","rationale":"持續冒泡可能代表漏氣，須評估病人並依規範檢查系統；任意夾閉可造成張力性氣胸風險。"},{"stem":"胸管意外脫出病人胸壁時，護理師第一步應如何處理？","options":[{"letter":"A","text":"以無菌敷料覆蓋胸壁開口並立即求援"},{"letter":"B","text":"讓傷口完全敞開並離開"},{"letter":"C","text":"將胸管自行插回胸腔"},{"letter":"D","text":"以膠帶封住所有敷料四邊且不評估"}],"answer":"A","rationale":"應立即覆蓋傷口、評估呼吸並通知醫療團隊；不可自行將胸管重新插入。"},{"stem":"胸管與引流瓶連接意外分離，護理師應採取何種措施？","options":[{"letter":"A","text":"依院內流程立即維持無菌水封或更換無菌系統並通報"},{"letter":"B","text":"把引流瓶倒置於床上"},{"letter":"C","text":"將胸管永久夾住"},{"letter":"D","text":"不處理直到交班"}],"answer":"A","rationale":"分離會破壞水封與無菌性，須立即依流程恢復安全引流，避免長時間夾管。"},{"stem":"胸管引流瓶應如何放置？","options":[{"letter":"A","text":"高於胸部並放在枕邊"},{"letter":"B","text":"平放於病人腹部"},{"letter":"C","text":"低於病人胸部且保持直立"},{"letter":"D","text":"懸掛在輸液架頂端"}],"answer":"C","rationale":"低於胸部可避免引流液逆流，並須保持瓶體直立及管路通暢。"},{"stem":"胸管病人翻身後引流管形成折曲，護理師最適當的處理為何？","options":[{"letter":"A","text":"解除折曲並確認引流通暢及病人呼吸狀況"},{"letter":"B","text":"立即拔除胸管"},{"letter":"C","text":"擠壓整段胸管直到疼痛"},{"letter":"D","text":"提高引流瓶至胸部上方"}],"answer":"A","rationale":"折曲會阻礙引流，應整理管路並重新評估；不宜常規強力擠壓胸管。"},{"stem":"肺栓塞病人最典型的急性主訴可能為何？","options":[{"letter":"A","text":"單純慢性耳鳴"},{"letter":"B","text":"餐後腹脹"},{"letter":"C","text":"突發呼吸困難與胸膜性胸痛"},{"letter":"D","text":"數月逐漸加重的鼻塞"}],"answer":"C","rationale":"肺栓塞常突發呼吸困難、胸痛、心搏過速或低血氧，需緊急評估。"},{"stem":"疑似肺栓塞病人突然呼吸困難、心搏過速且血氧下降，護理師應優先採取何者？","options":[{"letter":"A","text":"立即評估生命徵象、給予依指示的氧療並啟動緊急通報"},{"letter":"B","text":"先進食觀察症狀"},{"letter":"C","text":"鼓勵下床快走"},{"letter":"D","text":"按摩小腿以消散血栓"}],"answer":"A","rationale":"肺栓塞可能迅速危及生命，需先支持氧合及循環並緊急通報；疑似深層靜脈栓塞不可按摩患肢。"},{"stem":"病人接受抗凝血治療以處理肺栓塞，護理師應優先觀察何項安全問題？","options":[{"letter":"A","text":"指甲油顏色"},{"letter":"B","text":"每日嗅覺變化"},{"letter":"C","text":"出血徵象，如血尿、黑便或不明瘀青"},{"letter":"D","text":"頭髮是否捲曲"}],"answer":"C","rationale":"抗凝血藥增加出血風險，應觀察出血並依藥物種類監測相關檢驗。"},{"stem":"病人使用低分子量肝素皮下注射，何種衛教較適當？","options":[{"letter":"A","text":"注射後用力按摩數分鐘"},{"letter":"B","text":"依指導於腹部皮下注射並避免注射後揉搓"},{"letter":"C","text":"與家人共用針具"},{"letter":"D","text":"改為肌肉注射以吸收較快"}],"answer":"B","rationale":"腹部皮下注射常用且應輪替部位，注射後勿揉搓以減少瘀青；針具不得共用。"},{"stem":"肺水腫病人咳粉紅色泡沫痰且呼吸困難，護理師首要措施為何？","options":[{"letter":"A","text":"採高坐臥、評估氧合並立即通知醫療團隊"},{"letter":"B","text":"鼓勵大量飲水"},{"letter":"C","text":"安排無人陪同沐浴"},{"letter":"D","text":"採平躺並抬高雙腿"}],"answer":"A","rationale":"急性肺水腫造成嚴重氧合障礙，應採有利呼吸姿勢、支持氧合並迅速啟動處置。"},{"stem":"心因性肺水腫病人使用利尿劑後，護理師應重點監測何者？","options":[{"letter":"A","text":"僅測量身高"},{"letter":"B","text":"只詢問食慾，不觀察排尿"},{"letter":"C","text":"避免追蹤血壓"},{"letter":"D","text":"尿量、體重、血壓及電解質變化"}],"answer":"D","rationale":"利尿劑可造成容量下降、低血壓與電解質異常，需監測排尿及體液狀態。"},{"stem":"病人疑似睡眠呼吸中止症，最具提示性的病史為何？","options":[{"letter":"A","text":"僅在運動後口渴"},{"letter":"B","text":"清晨視力短暫模糊"},{"letter":"C","text":"偶爾打嗝"},{"letter":"D","text":"睡眠中大聲打鼾、目擊呼吸暫停且白天嗜睡"}],"answer":"D","rationale":"打鼾、目擊呼吸中止及白天嗜睡是阻塞型睡眠呼吸中止症常見線索，需進一步評估。"},{"stem":"使用持續性正壓呼吸器的睡眠呼吸中止症病人抱怨口鼻乾燥，護理師宜先建議何者？","options":[{"letter":"A","text":"檢查面罩密合與加濕設定，並與照護團隊討論調整"},{"letter":"B","text":"自行停用呼吸器"},{"letter":"C","text":"用膠帶完全封住鼻孔"},{"letter":"D","text":"把壓力任意調至最高"}],"answer":"A","rationale":"乾燥可能與漏氣或加濕不足有關，應檢查設備並依專業指示調整，不可自行停用或改壓力。"},{"stem":"接受全身麻醉後的病人仍嗜睡且呼吸淺慢，護理師首要關注何者？","options":[{"letter":"A","text":"先提供大量食物"},{"letter":"B","text":"讓病人無人看護睡眠"},{"letter":"C","text":"只評估手術傷口"},{"letter":"D","text":"維持呼吸道通暢並評估呼吸與氧合"}],"answer":"D","rationale":"麻醉後呼吸抑制及氣道阻塞可危及生命，須先確保氣道、呼吸與氧合。"},{"stem":"病人因痰多無力咳出，護理師使用抽吸前應先做何事？","options":[{"letter":"A","text":"常規每幾分鐘抽吸一次，不需評估"},{"letter":"B","text":"將導管置入後持續抽吸數分鐘"},{"letter":"C","text":"不準備氧氣或監測"},{"letter":"D","text":"評估呼吸音、氧合及抽吸必要性，並說明程序"}],"answer":"D","rationale":"抽吸應有臨床適應症，並先評估及準備以降低缺氧、創傷等風險。"},{"stem":"執行氣管內抽吸時，何種作法較安全？","options":[{"letter":"A","text":"導管置入時不施加抽吸，退出時間歇抽吸且限制單次時間"},{"letter":"B","text":"反覆抽吸至病人發紺"},{"letter":"C","text":"不需無菌技術"},{"letter":"D","text":"置入全程持續強力抽吸"}],"answer":"A","rationale":"退出時短暫抽吸可清除分泌物，應採無菌技術並限制時間、監測病人以防低氧與黏膜損傷。"},{"stem":"氣管造口病人突然呼吸困難，護理師發現管內有可見分泌物，優先措施為何？","options":[{"letter":"A","text":"評估氣道通暢並依需要抽吸，同時呼叫協助"},{"letter":"B","text":"先移除氧氣"},{"letter":"C","text":"將內管封住"},{"letter":"D","text":"立即餵水"}],"answer":"A","rationale":"分泌物阻塞可能迅速造成窒息，應立即維持氣道並依流程抽吸與求援。"},{"stem":"氣管造口病人日常照護中，何項措施有助預防分泌物乾燥與堵塞？","options":[{"letter":"A","text":"維持適當加濕並定期評估氣道分泌物"},{"letter":"B","text":"以棉花塞住造口"},{"letter":"C","text":"每天用力刮除氣管內壁"},{"letter":"D","text":"限制所有液體且取消加濕"}],"answer":"A","rationale":"氣管造口繞過上呼吸道加溫加濕功能，適當加濕有助避免分泌物乾燥栓塞。"},{"stem":"新置氣管造口管意外脫出時，護理師應如何處理？","options":[{"letter":"A","text":"讓病人平躺等待交班"},{"letter":"B","text":"盲目用力將原管插回"},{"letter":"C","text":"以膠帶封閉造口"},{"letter":"D","text":"立即呼叫支援、給予氧氣並依緊急氣道流程處置"}],"answer":"D","rationale":"新造口通道尚未成熟，盲目置管可能形成假道；應啟動緊急氣道流程並由受訓人員處置。"},{"stem":"病人拔管後聲音微弱且呼吸費力，護理師應優先做何事？","options":[{"letter":"A","text":"先提供固體食物"},{"letter":"B","text":"要求病人自行走動"},{"letter":"C","text":"只記錄聲音變化"},{"letter":"D","text":"立即評估氣道與呼吸、給予支持並通知醫療團隊"}],"answer":"D","rationale":"拔管後可能有上呼吸道阻塞或呼吸衰竭，須立即監測呼吸與氧合並準備救援。"},{"stem":"病人吞嚥時咳嗽、濕濁聲且血氧下降，護理師應如何處理？","options":[{"letter":"A","text":"繼續餵食以完成餐點"},{"letter":"B","text":"將病人平躺餵水"},{"letter":"C","text":"鼓勵快速吞嚥"},{"letter":"D","text":"停止口服進食並評估吞嚥與吸入風險"}],"answer":"D","rationale":"咳嗽、濕聲與血氧變化提示吞嚥困難及吸入風險，應停止餵食並進一步評估。"},{"stem":"病人需鼻胃管灌食且有吸入風險，灌食時應採何種姿勢？","options":[{"letter":"A","text":"抬高床頭並依機構流程維持灌食後適當時間"},{"letter":"B","text":"完全平躺"},{"letter":"C","text":"頭低腳高"},{"letter":"D","text":"俯臥且不監測"}],"answer":"A","rationale":"抬高床頭可降低胃內容物逆流與吸入風險，依院內流程維持灌食期間及之後姿勢。"},{"stem":"使用氧氣面罩的病人感到噁心欲吐，護理師應優先如何處理？","options":[{"letter":"A","text":"讓病人平躺且面罩緊扣"},{"letter":"B","text":"以膠帶封住面罩"},{"letter":"C","text":"忽略噁心直到嘔吐"},{"letter":"D","text":"協助側轉或坐起、移開面罩以維持嘔吐物排出並迅速恢復氧療"}],"answer":"D","rationale":"嘔吐時須防止吸入並保持氣道，短暫處理後應儘快恢復必要氧療及重新評估。"},{"stem":"呼吸急促病人出現意識混亂，最適當的臨床判斷為何？","options":[{"letter":"A","text":"代表呼吸狀況已穩定"},{"letter":"B","text":"只需安排心理諮商"},{"letter":"C","text":"可能是低氧或二氧化碳異常的警訊，應立即評估"},{"letter":"D","text":"通常是正常老化現象"}],"answer":"C","rationale":"急性意識改變可能反映腦部氧合不足或通氣異常，須立即評估生命徵象與呼吸。"},{"stem":"慢性呼吸疾病病人突然嗜睡、頭痛且呼吸變淺，護理師應警覺何者？","options":[{"letter":"A","text":"視力疲勞"},{"letter":"B","text":"二氧化碳滯留或通氣不足"},{"letter":"C","text":"正常的呼吸復原"},{"letter":"D","text":"單純缺水且無關呼吸"}],"answer":"B","rationale":"嗜睡、頭痛及淺呼吸可能提示高碳酸血症或呼吸衰竭，需迅速評估與通報。"},{"stem":"呼吸衰竭病人需監測呼吸狀態，除血氧外何種觀察也重要？","options":[{"letter":"A","text":"只觀察食量"},{"letter":"B","text":"只量體溫一次"},{"letter":"C","text":"僅記錄指甲長度"},{"letter":"D","text":"呼吸頻率、深度、意識及呼吸作功"}],"answer":"D","rationale":"血氧無法單獨反映通氣或病人疲憊程度，需整合呼吸型態、意識與臨床表現。"},{"stem":"脈搏血氧飽和度正常但病人疑似一氧化碳中毒，護理師應如何判斷？","options":[{"letter":"A","text":"只重測另一手指即可確診"},{"letter":"B","text":"正常讀值即可排除中毒"},{"letter":"C","text":"停止所有氧療"},{"letter":"D","text":"不能單靠一般脈搏血氧排除，需緊急評估並依指示檢測"}],"answer":"D","rationale":"一氧化碳可能使一般脈搏血氧讀值失真偏高，須依臨床情況進一步檢測並提供急救處置。"},{"stem":"病人吸入濃煙後聲音沙啞、口鼻有焦黑痕跡，護理師最優先關注何者？","options":[{"letter":"A","text":"讓病人單獨留在病室"},{"letter":"B","text":"先處理皮膚清潔再觀察數小時"},{"letter":"C","text":"鼓勵飲食測試吞嚥"},{"letter":"D","text":"可能有進展性上呼吸道水腫，立即啟動氣道評估"}],"answer":"D","rationale":"吸入性傷害可造成延遲氣道水腫，聲音沙啞與焦黑痕跡是危險徵象，須及早處理氣道。"},{"stem":"病人疑似異物哽塞，仍能有效咳嗽並發聲，護理師應如何處置？","options":[{"letter":"A","text":"立刻盲目手指挖取"},{"letter":"B","text":"鼓勵持續咳嗽並密切觀察"},{"letter":"C","text":"立即讓其喝水沖下"},{"letter":"D","text":"將其倒吊"}],"answer":"B","rationale":"仍能有效咳嗽表示部分氣道通暢，應鼓勵咳出並觀察；盲目挖取可能將異物推深。"},{"stem":"成人異物哽塞後無法說話、咳嗽或呼吸，護理師應採取何種行動？","options":[{"letter":"A","text":"給予口服水"},{"letter":"B","text":"等待自然排出"},{"letter":"C","text":"先安排胸部 X 光再處理"},{"letter":"D","text":"立即啟動急救並依成人異物哽塞流程施行適當解除措施"}],"answer":"D","rationale":"完全氣道阻塞是立即急症，應呼救並依現行急救訓練執行解除阻塞及必要的心肺復甦。"},{"stem":"無脈搏且無正常呼吸的成人病人，護理師應優先做何事？","options":[{"letter":"A","text":"啟動急救系統並立即開始高品質心肺復甦"},{"letter":"B","text":"等待醫師到場才開始"},{"letter":"C","text":"先測量體溫"},{"letter":"D","text":"先給予口服藥"}],"answer":"A","rationale":"無脈搏且無正常呼吸應立即啟動急救並開始心肺復甦，不可延誤。"},{"stem":"心肺復甦時自動體外心臟去顫器到達，護理師應如何配合？","options":[{"letter":"A","text":"電擊時讓氧氣面罩緊貼胸部電極"},{"letter":"B","text":"依語音指示貼妥電極，分析與電擊時確認所有人離開病人"},{"letter":"C","text":"分析時持續觸摸病人"},{"letter":"D","text":"不理會設備指示"}],"answer":"B","rationale":"需依 AED 指示操作，分析及電擊時不可接觸病人；注意氧氣設備與電極安全。"},{"stem":"病人胸痛且疑似急性冠心症，同時呼吸困難，護理師的初步處置應包含何者？","options":[{"letter":"A","text":"延後心電圖至隔日"},{"letter":"B","text":"迅速評估生命徵象與氧合，依適應症及醫囑給氧並啟動急性胸痛流程"},{"letter":"C","text":"鼓勵病人自行步行"},{"letter":"D","text":"所有胸痛者一律給最高流量氧氣而不評估"}],"answer":"B","rationale":"須快速評估與依流程處置；氧氣依低氧或臨床適應症使用，不應不加評估地一律高流量給氧。"},{"stem":"肺炎病人需要深呼吸及咳嗽訓練，為減輕傷口疼痛，護理師可建議何者？","options":[{"letter":"A","text":"完全避免咳嗽"},{"letter":"B","text":"咳嗽時以枕頭支托傷口並依醫囑適時止痛"},{"letter":"C","text":"以手大力壓迫胸部"},{"letter":"D","text":"每次咳嗽都憋氣"}],"answer":"B","rationale":"傷口支托及適當止痛可促進深呼吸與有效咳嗽，降低分泌物滯留風險。"},{"stem":"術後病人使用誘發性肺量計，護理師應如何指導？","options":[{"letter":"A","text":"快速吹氣進入裝置"},{"letter":"B","text":"坐直、緩慢深吸氣使指示器上升，短暫閉氣後放鬆呼氣"},{"letter":"C","text":"只在疼痛時偶爾使用"},{"letter":"D","text":"躺平並用力咳入裝置"}],"answer":"B","rationale":"誘發性肺量計訓練緩慢深吸氣，有助肺泡擴張；應依照護計畫規律使用並配合咳嗽。"},{"stem":"術後病人深呼吸時疼痛而不願活動，護理師優先處置為何？","options":[{"letter":"A","text":"只限制飲水"},{"letter":"B","text":"取消所有活動數日"},{"letter":"C","text":"評估疼痛並依醫囑提供止痛，鼓勵安全活動及呼吸訓練"},{"letter":"D","text":"要求忍耐且不提供止痛"}],"answer":"C","rationale":"適當止痛可促進深呼吸與早期活動，降低肺不張及分泌物滯留。"},{"stem":"長期臥床病人預防肺不張，何項護理措施最適當？","options":[{"letter":"A","text":"定期翻身、深呼吸咳嗽訓練及依狀況早期活動"},{"letter":"B","text":"僅提高床尾"},{"letter":"C","text":"持續淺呼吸"},{"letter":"D","text":"限制翻身以避免疲勞"}],"answer":"A","rationale":"翻身、肺擴張訓練及活動可促進通氣與分泌物清除，降低肺不張風險。"},{"stem":"病人出現單側小腿腫痛並伴突發呼吸困難，護理師應如何處理？","options":[{"letter":"A","text":"按摩患側小腿"},{"letter":"B","text":"鼓勵快走以促循環"},{"letter":"C","text":"懷疑靜脈血栓併肺栓塞，立即限制不必要活動並緊急通報評估"},{"letter":"D","text":"熱敷後返家觀察"}],"answer":"C","rationale":"小腿腫痛可能為深層靜脈栓塞，突發呼吸困難提示肺栓塞，需急診評估且不可按摩患肢。"},{"stem":"肺癌病人接受化學治療後發燒且呼吸道症狀加劇，護理師應優先考量何者？","options":[{"letter":"A","text":"感染及免疫抑制相關風險，立即評估並通報"},{"letter":"B","text":"自行停掉所有治療並返家"},{"letter":"C","text":"只增加室內香氛"},{"letter":"D","text":"視為必然正常反應而不評估"}],"answer":"A","rationale":"化療可能造成免疫抑制，發燒可能是嚴重感染徵象，需及時評估與依流程處置。"},{"stem":"肺癌病人咳出大量鮮紅色血液且呼吸急促，護理師首要處理為何？","options":[{"letter":"A","text":"讓病人平躺吞下血液"},{"letter":"B","text":"優先維持氣道與氧合、評估出血量並緊急求援"},{"letter":"C","text":"先收集痰液培養再處理"},{"letter":"D","text":"鼓勵用力咳嗽不停"}],"answer":"B","rationale":"大量咳血可造成氣道阻塞與失血，須先維持氣道及循環並立即啟動急救處置。"},{"stem":"大量咳血病人已知出血側肺，等待緊急處置時可採何種姿勢？","options":[{"letter":"A","text":"出血側朝下以保護未出血側肺"},{"letter":"B","text":"出血側朝上並平躺"},{"letter":"C","text":"頭低腳高"},{"letter":"D","text":"坐姿前傾並吞下血液"}],"answer":"A","rationale":"出血側朝下可減少血液流入健側肺；須同時維持氣道並依急救團隊指示處置。"},{"stem":"病人胸腔積液造成呼吸困難，護理師評估可能發現何者？","options":[{"letter":"A","text":"雙側肺音完全相同是必然表現"},{"letter":"B","text":"患側呼吸音減弱及叩診濁音"},{"letter":"C","text":"只會出現腸音減弱"},{"letter":"D","text":"患側呼吸音增強且鼓音"}],"answer":"B","rationale":"胸膜腔液體可使患側通氣下降，常見呼吸音減弱、叩診濁音及呼吸困難。"},{"stem":"胸腔積液病人接受胸腔穿刺放液時，護理師應如何協助？","options":[{"letter":"A","text":"請病人劇烈咳嗽以加速放液"},{"letter":"B","text":"要求病人平躺且不監測"},{"letter":"C","text":"協助採安全坐姿或側臥姿勢，並監測症狀及生命徵象"},{"letter":"D","text":"放液後立即大量飲水"}],"answer":"C","rationale":"適當姿勢利於操作，過程中須觀察呼吸困難、疼痛及生命徵象，放液後留意併發症。"},{"stem":"胸腔穿刺放液過程中病人出現胸痛、咳嗽及呼吸不適，護理師應如何處理？","options":[{"letter":"A","text":"立即告知操作者並依指示暫停或調整放液"},{"letter":"B","text":"讓病人離開檢查室"},{"letter":"C","text":"自行拔除所有器材"},{"letter":"D","text":"要求病人忍耐並加快放液"}],"answer":"A","rationale":"新發胸痛與呼吸不適可能提示併發症或放液不耐受，需立即回報並評估。"},{"stem":"護理師為呼吸困難病人進行肺部聽診時，何種方式較適當？","options":[{"letter":"A","text":"只聽前胸一點"},{"letter":"B","text":"只在吐氣時聽一側"},{"letter":"C","text":"隔著厚被聽診且不比較兩側"},{"letter":"D","text":"左右對稱部位由上而下比較，請病人張口深呼吸"}],"answer":"D","rationale":"對稱比較並由上而下聽診有助發現局部呼吸音差異；應觀察病人是否疲憊或頭暈。"},{"stem":"肺部聽診出現高音調、連續哨笛樣聲音，最可能代表何者？","options":[{"letter":"A","text":"氣道狹窄或阻塞所致喘鳴"},{"letter":"B","text":"心包摩擦音"},{"letter":"C","text":"正常腸音"},{"letter":"D","text":"胸膜摩擦音"}],"answer":"A","rationale":"喘鳴常由氣道狹窄造成，須依病人呼吸窘迫程度評估嚴重性。"},{"stem":"肺部聽診出現細小爆裂音，護理師應如何理解？","options":[{"letter":"A","text":"必然表示正常肺音"},{"letter":"B","text":"可直接確診肺癌"},{"letter":"C","text":"可能與肺泡或小氣道內液體、塌陷後再張開有關，需結合病況判讀"},{"letter":"D","text":"代表上呼吸道完全阻塞"}],"answer":"C","rationale":"爆裂音可見於肺水腫、肺炎或肺不張等，需搭配病史、影像及其他評估，不能單獨確診。"},{"stem":"病人呼吸音呈吸氣與吐氣皆有粗糙低音，咳嗽後有所改變，較可能為何種聲音？","options":[{"letter":"A","text":"胸膜摩擦音"},{"letter":"B","text":"心音"},{"letter":"C","text":"鼾音，常與較大氣道分泌物有關"},{"letter":"D","text":"肺泡呼吸音"}],"answer":"C","rationale":"鼾音多與大氣道分泌物或狹窄相關，咳嗽後可能改變，應評估排痰需求。"},{"stem":"聽診出現局部吸氣及吐氣皆可聽到的高音調哨笛聲，代表何種可能？","options":[{"letter":"A","text":"腹水"},{"letter":"B","text":"腎結石"},{"letter":"C","text":"必然為正常呼吸音"},{"letter":"D","text":"局部氣道阻塞或狹窄"}],"answer":"D","rationale":"局部持續喘鳴可能提示局部支氣管狹窄或阻塞，須進一步評估原因。"},{"stem":"呼吸窘迫病人逐漸安靜，原本明顯喘鳴突然消失但胸廓起伏更差，護理師應如何判斷？","options":[{"letter":"A","text":"可能因氣流極度減少形成寂靜胸，屬危險惡化"},{"letter":"B","text":"喘鳴消失即代表氣喘痊癒"},{"letter":"C","text":"立即停止所有急救藥物"},{"letter":"D","text":"不需再監測"}],"answer":"A","rationale":"嚴重氣流受限時可能聽不到喘鳴，寂靜胸是危及生命的警訊，需立即急救。"},{"stem":"病人咳嗽無力且痰液滯留，使用姿位引流前護理師應先確認何者？","options":[{"letter":"A","text":"是否先禁食一整天"},{"letter":"B","text":"病人是否穿著新鞋"},{"letter":"C","text":"病人耐受性、禁忌及適當引流姿勢"},{"letter":"D","text":"是否將氧氣完全移除"}],"answer":"C","rationale":"姿位引流須依受累肺段、耐受性及禁忌調整，並監測呼吸狀況，避免不安全姿勢。"},{"stem":"病人接受拍痰治療時，護理師應避免何種部位？","options":[{"letter":"A","text":"肺部適當區域"},{"letter":"B","text":"脊椎、胸骨、腎臟區及骨突處"},{"letter":"C","text":"分泌物滯留相關肺段"},{"letter":"D","text":"依評估選定的胸壁位置"}],"answer":"B","rationale":"叩擊應避開骨突、脊椎、胸骨及腎臟等區域，以免造成疼痛或組織損傷。"},{"stem":"病人胸部物理治療後應鼓勵何者？","options":[{"letter":"A","text":"吞下痰液"},{"letter":"B","text":"有效咳嗽排出鬆動的分泌物並觀察痰液"},{"letter":"C","text":"不需評估呼吸音"},{"letter":"D","text":"立即平躺且禁止咳嗽"}],"answer":"B","rationale":"物理治療可鬆動分泌物，之後咳出並評估痰量及呼吸狀態可確認效果。"},{"stem":"病人痰液由清稀轉為大量膿性且伴發燒，護理師應如何處理？","options":[{"letter":"A","text":"評估感染惡化並通知醫療團隊，依指示採檢"},{"letter":"B","text":"認定是正常清除而不記錄"},{"letter":"C","text":"自行停用抗生素"},{"letter":"D","text":"限制病人咳嗽"}],"answer":"A","rationale":"痰液性質改變合併發燒可能表示感染惡化，需評估並依指示採檢或調整治療。"},{"stem":"呼吸道分泌物檢體已採集，護理師應如何處理？","options":[{"letter":"A","text":"未標示放在床邊數小時"},{"letter":"B","text":"倒入一般垃圾桶"},{"letter":"C","text":"與另一病人檢體混合"},{"letter":"D","text":"標示正確資料並依規定迅速送至檢驗室"}],"answer":"D","rationale":"正確標示與及時送驗可維持檢體品質及病人辨識安全。"},{"stem":"病人接受胸部電腦斷層合併含碘顯影劑檢查，護理師應先評估何者？","options":[{"letter":"A","text":"只詢問最近一次洗澡時間"},{"letter":"B","text":"是否已剪指甲"},{"letter":"C","text":"是否有近視"},{"letter":"D","text":"顯影劑過敏史、腎功能及相關用藥風險"}],"answer":"D","rationale":"含碘顯影劑需評估過敏反應及腎功能，並依院內流程檢視相關藥物與檢查準備。"}]},{"title":"常見診斷檢查","questions":[{"stem":"病人即將接受含碘顯影劑電腦斷層，表示曾因顯影劑發生全身蕁麻疹與喘鳴。護理師最適當的處置為何？","options":[{"letter":"A","text":"告知放射科醫師並暫緩檢查，評估過敏反應史及替代方案"},{"letter":"B","text":"直接安排檢查，因過敏只會在第一次使用時發生"},{"letter":"C","text":"將過敏史記為海鮮過敏即可，不需通報"},{"letter":"D","text":"給予口服水分後照常檢查"}],"answer":"A","rationale":"曾有顯影劑即時型嚴重過敏反應者，需在檢查前通報醫療團隊，評估替代方式或適當預防措施；不可自行忽略或以海鮮過敏概括。"},{"stem":"病人接受含碘顯影劑檢查後返病房，護理師應優先確認哪項狀況？","options":[{"letter":"A","text":"是否出現輕微口中金屬味"},{"letter":"B","text":"有無呼吸困難、喉頭腫脹或全身性過敏徵象"},{"letter":"C","text":"是否立即排出大量尿液"},{"letter":"D","text":"是否有檢查前禁食造成的飢餓感"}],"answer":"B","rationale":"顯影劑後仍須留意嚴重過敏反應，呼吸道受威脅需立即處置。金屬味或短暫熱感可能短暫發生，但不能取代呼吸狀態評估。"},{"stem":"病人將接受腹部含碘顯影劑電腦斷層，近期腎功能不佳。護理師最適當的作法為何？","options":[{"letter":"A","text":"先限制所有液體以避免顯影劑稀釋"},{"letter":"B","text":"自行取消所有影像檢查"},{"letter":"C","text":"只要病人沒有水腫便可假定腎功能正常"},{"letter":"D","text":"確認近期腎功能與醫囑，向醫療團隊反映並評估顯影劑風險"}],"answer":"D","rationale":"腎功能不全可能增加顯影劑相關腎損傷風險，須核對腎功能、臨床狀況與醫囑，依個別情況調整檢查或補液；不能單憑外觀判斷。"},{"stem":"糖尿病病人服用metformin，今日安排含碘顯影劑檢查。護理師應如何處理其用藥？","options":[{"letter":"A","text":"檢查當下加倍服藥以控制血糖"},{"letter":"B","text":"一律永久停用metformin"},{"letter":"C","text":"依院內流程與醫囑評估腎功能，確認檢查前後是否需暫停及何時恢復"},{"letter":"D","text":"無須詢問用藥，因metformin與腎功能無關"}],"answer":"C","rationale":"含碘顯影劑與metformin的處理須依腎功能、臨床情況及現行院內規範和醫囑辦理，確認恢復用藥時機；不應自行永久停藥或加量。"},{"stem":"病人接受含碘顯影劑檢查後，無禁忌且醫療團隊未限制水分。適當衛教為何？","options":[{"letter":"A","text":"尿色變深就自行服用利尿劑"},{"letter":"B","text":"檢查後須完全禁水一天"},{"letter":"C","text":"大量飲用酒精飲料促進排出"},{"letter":"D","text":"依醫囑維持適當水分攝取，並通報尿量明顯減少或過敏症狀"}],"answer":"D","rationale":"適當水分有助於顯影劑排出，但須考量心腎狀態與液體限制；不可自行極端補水、禁水或使用利尿劑。"},{"stem":"病人因疑似中風安排腦部電腦斷層，最適當的護理作為為何？","options":[{"letter":"A","text":"快速核對病人身分、檢查需求及顯影劑相關安全資訊，不因非必要事項延誤急診影像"},{"letter":"B","text":"要求病人先完成整夜禁食"},{"letter":"C","text":"先等待家屬到場才開始任何準備"},{"letter":"D","text":"先給鎮靜藥讓病人睡著"}],"answer":"A","rationale":"疑似急性中風的影像評估具時效性，須迅速完成必要核對與安全評估並配合團隊流程，不宜以非必要禁食或鎮靜延誤。"},{"stem":"病人接受頭部電腦斷層後詢問輻射安全，護理師適當的回答為何？","options":[{"letter":"A","text":"一次電腦斷層必然造成癌症"},{"letter":"B","text":"檢查會使用游離輻射，醫療團隊會依臨床需要選擇影像及降低不必要曝露"},{"letter":"C","text":"檢查後病人會持續放射輻射，應隔離"},{"letter":"D","text":"電腦斷層完全沒有輻射"}],"answer":"B","rationale":"電腦斷層使用游離輻射，但檢查後病人不會因此具有放射性；醫療影像應依臨床適應症採合理降低曝露原則。"},{"stem":"接受腹部電腦斷層的病人可能懷孕，護理師應優先做何事？","options":[{"letter":"A","text":"不必詢問，因腹部影像不影響胎兒"},{"letter":"B","text":"不論病況一律永遠禁止任何影像檢查"},{"letter":"C","text":"確認懷孕可能並立即告知放射科及開單團隊，依臨床急迫性評估檢查方式"},{"letter":"D","text":"自行要求病人簽署放棄權利後照常檢查"}],"answer":"C","rationale":"可能懷孕時需通報並由團隊衡量檢查效益、風險與替代方案；不是完全不問，也不是不分情況一律禁止。"},{"stem":"病人接受電腦斷層時焦慮且擔心狹窄空間，護理師最適當的說明為何？","options":[{"letter":"A","text":"只要閉氣越久影像一定越清楚"},{"letter":"B","text":"檢查時需盡量保持不動，技術人員可透過對講系統與你聯繫"},{"letter":"C","text":"可自行在檢查中坐起來"},{"letter":"D","text":"檢查期間完全無法與外界聯繫"}],"answer":"B","rationale":"事前說明保持不動、設備溝通方式及檢查流程可減輕焦慮並改善影像品質；病人應依技術人員指示而非自行移動。"},{"stem":"病人安排磁振造影，曾接受心律調節器植入。檢查前護理師應如何處理？","options":[{"letter":"A","text":"只要取下外衣即可"},{"letter":"B","text":"確認植入裝置的型號及磁振安全條件，未確認前不可逕自進入磁場區"},{"letter":"C","text":"請病人將裝置關機後自行進入"},{"letter":"D","text":"直接帶入檢查室，所有新式裝置均可安全掃描"}],"answer":"B","rationale":"植入裝置可能受磁場影響，須確認裝置及條件是否符合磁振安全規範，並依專業團隊程序辦理。"},{"stem":"磁振造影前發現病人身上有可拆式金屬首飾，適當處置為何？","options":[{"letter":"A","text":"只取下會發出聲音的首飾"},{"letter":"B","text":"依磁振安全流程取下所有可移除金屬物品並再次檢查"},{"letter":"C","text":"將金屬物品放在檢查床旁"},{"letter":"D","text":"用衣物蓋住首飾即可"}],"answer":"B","rationale":"強磁場可能吸引金屬物品並造成傷害或影像干擾，需按流程清除可移除金屬物，且不得將其帶入磁場區。"},{"stem":"病人詢問磁振造影是否使用游離輻射，護理師正確回答為何？","options":[{"letter":"A","text":"磁振造影使用磁場與無線電波成像，與電腦斷層不同，不使用游離輻射"},{"letter":"B","text":"磁振造影的輻射量比一般X光高"},{"letter":"C","text":"所有影像檢查都使用相同輻射"},{"letter":"D","text":"磁振造影會使病人檢查後具有放射性"}],"answer":"A","rationale":"磁振造影以磁場和射頻脈衝成像，不使用游離輻射；仍須注意植入物、金屬物品及其他磁振安全事項。"},{"stem":"病人安排含釓顯影劑磁振造影且有嚴重腎功能不全，護理師應採取何行動？","options":[{"letter":"A","text":"認為釓劑不會經腎臟排除而直接施打"},{"letter":"B","text":"確認腎功能並立即通報醫療團隊，評估顯影劑適用性與替代方案"},{"letter":"C","text":"只詢問是否對碘過敏即可"},{"letter":"D","text":"自行增加顯影劑劑量以縮短檢查"}],"answer":"B","rationale":"釓顯影劑使用須考量腎功能與特定風險，應依醫囑和安全規範評估；碘顯影劑過敏史不能替代腎功能評估。"},{"stem":"病人接受磁振造影時因幽閉恐懼症極度焦慮，護理師最適當的措施為何？","options":[{"letter":"A","text":"要求病人自行忍耐，不需告知檢查人員"},{"letter":"B","text":"先解釋流程、提供溝通方式並通知團隊評估適當支持或替代安排"},{"letter":"C","text":"未經醫囑立即給予鎮靜藥"},{"letter":"D","text":"以束縛方式固定病人避免中斷"}],"answer":"B","rationale":"可藉由說明與溝通降低焦慮，必要時由團隊評估鎮靜或替代方式；不可擅自給藥或忽略病人安全。"},{"stem":"病人接受磁振造影後詢問是否需隔離家人，護理師應回答何者？","options":[{"letter":"A","text":"一般磁振造影不會使你帶有放射性，無須因此隔離家人"},{"letter":"B","text":"檢查後需隔離三天"},{"letter":"C","text":"需以鉛衣覆蓋身體"},{"letter":"D","text":"只有接觸兒童時才需防輻射"}],"answer":"A","rationale":"磁振造影不使用放射性同位素，檢查後病人不會帶有放射性，無需隔離。"},{"stem":"病人接受胸部X光檢查前，護理師應指導何者？","options":[{"letter":"A","text":"自行移動身體以便拍到更多角度"},{"letter":"B","text":"將氧氣設備全部拆除且不告知人員"},{"letter":"C","text":"拍攝時持續咳嗽以排除痰液"},{"letter":"D","text":"依技術人員指示保持姿勢並在拍攝時短暫屏住呼吸"}],"answer":"D","rationale":"短暫屏氣及保持不動有助影像清晰；氧氣或必要支持設備應由團隊依安全程序處理，不可擅自拆除。"},{"stem":"胸部X光檢查前發現病人可能懷孕，護理師應如何作為？","options":[{"letter":"A","text":"自行取消所有後續醫療"},{"letter":"B","text":"不告訴病人，直接完成檢查"},{"letter":"C","text":"依流程確認並告知檢查團隊，評估臨床必要性與防護"},{"letter":"D","text":"認為胸部X光不需任何評估"}],"answer":"C","rationale":"懷孕可能應納入影像安全評估並通報團隊，依必要性與防護措施決定；不能隱瞞或自行做絕對決定。"},{"stem":"接受胸部X光的病人詢問檢查後有無輻射殘留，正確說明為何？","options":[{"letter":"A","text":"一般X光拍攝不會使身體變成放射源"},{"letter":"B","text":"必須將衣物焚毀以免輻射"},{"letter":"C","text":"檢查後要避免接觸嬰兒一週"},{"letter":"D","text":"需大量喝水才能排除X光"}],"answer":"A","rationale":"一般X光是短暫外部曝露，拍攝後不會有放射性物質留在身體內。"},{"stem":"病人要接受上消化道鋇劑攝影，護理師通常應確認何事？","options":[{"letter":"A","text":"檢查中可任意飲水"},{"letter":"B","text":"檢查前大量進食以避免低血糖"},{"letter":"C","text":"檢查前自行服用瀉藥不必詢問"},{"letter":"D","text":"依檢查單位指示禁食並確認吞嚥與腸阻塞等相關病況"}],"answer":"D","rationale":"上消化道鋇劑檢查通常需依流程禁食，以減少胃內容物干擾；病況及準備方式應依檢查規範確認。"},{"stem":"病人完成鋇劑吞嚥檢查後，護理師應提醒何事？","options":[{"letter":"A","text":"若無液體限制，依指示補充水分並注意排便情形"},{"letter":"B","text":"完全禁水直到排出鋇劑"},{"letter":"C","text":"出現便祕時自行使用任何藥物"},{"letter":"D","text":"鋇劑一定會在數分鐘內排出"}],"answer":"A","rationale":"鋇劑可能使糞便呈白色並造成便祕，適當水分及依指示處理有助排出；液體限制者須個別評估。"},{"stem":"病人接受鋇劑攝影後兩天未排便且腹部逐漸脹痛，適當護理處置為何？","options":[{"letter":"A","text":"告知是正常現象，持續等待一週"},{"letter":"B","text":"要求病人自行大量服用瀉藥"},{"letter":"C","text":"評估腹部與排便狀況並儘速通知醫療團隊"},{"letter":"D","text":"限制活動並停止所有液體"}],"answer":"C","rationale":"鋇劑滯留伴腹脹疼痛可能需進一步評估處理，不宜只當作一般便祕或自行使用藥物。"},{"stem":"病人接受鋇劑灌腸前，護理師應確認哪項準備？","options":[{"letter":"A","text":"自行停用所有慢性病藥物數日"},{"letter":"B","text":"檢查前已食用高纖大餐"},{"letter":"C","text":"已依醫囑與檢查單位指示完成腸道準備"},{"letter":"D","text":"不需確認排便準備"}],"answer":"C","rationale":"鋇劑灌腸通常需清潔腸道以改善影像品質，具體準備依醫囑及檢查單位流程；不得自行停用藥物。"},{"stem":"接受鋇劑灌腸時病人突然出現劇烈腹痛及冒冷汗，護理師應優先做何事？","options":[{"letter":"A","text":"請病人自行下床排便"},{"letter":"B","text":"立即通知放射科醫師並評估生命徵象，不可要求病人忍耐"},{"letter":"C","text":"繼續注入鋇劑以完成檢查"},{"letter":"D","text":"先給口服瀉劑"}],"answer":"B","rationale":"劇烈腹痛可能代表嚴重併發症或穿孔等警訊，應立即停止相關操作並通報評估。"},{"stem":"病人接受胃鏡檢查並使用咽喉局部麻醉，檢查後最重要的進食安全措施為何？","options":[{"letter":"A","text":"先給固體食物確認反射"},{"letter":"B","text":"平躺餵食以避免疲累"},{"letter":"C","text":"待吞嚥及咽喉反射恢復後再依指示進食飲水"},{"letter":"D","text":"檢查一結束立刻喝水測試"}],"answer":"C","rationale":"咽喉局部麻醉會降低保護性反射，過早飲食有吸入風險，應確認反射恢復並依醫囑進食。"},{"stem":"病人接受胃鏡切片後返病房，出現持續劇烈腹痛、腹部僵硬及心跳加快，護理師應如何處理？","options":[{"letter":"A","text":"認為是正常脹氣，隔日再評估"},{"letter":"B","text":"立即給固體食物"},{"letter":"C","text":"鼓勵自行走動後不必再觀察"},{"letter":"D","text":"立即通知醫師並密切監測，警覺穿孔或出血"}],"answer":"D","rationale":"劇烈腹痛、腹膜刺激徵象和生命徵象變化可能是穿孔或出血，須立即評估及通報。"},{"stem":"病人接受胃鏡後少量咽喉不適，無其他異常，適當衛教為何？","options":[{"letter":"A","text":"任何咽喉不適都代表穿孔"},{"letter":"B","text":"輕微咽喉刺激可能短暫發生，但若吐血、呼吸困難或嚴重腹痛須立即就醫"},{"letter":"C","text":"出現黑便應自行服用止瀉藥"},{"letter":"D","text":"檢查後不可再進食任何食物"}],"answer":"B","rationale":"輕微咽喉不適常可短暫出現，但吐血、呼吸困難或嚴重腹痛是需立即評估的警訊。"},{"stem":"病人安排大腸鏡檢查，護理師最應確認的準備為何？","options":[{"letter":"A","text":"檢查前吃高纖食物增加糞便"},{"letter":"B","text":"腸道清潔劑使用方式、排便狀況及禁食指示均已理解"},{"letter":"C","text":"腸道準備可自行省略"},{"letter":"D","text":"只要無腹痛就不必清腸"}],"answer":"B","rationale":"腸道清潔有助觀察黏膜與病灶，須確認清腸劑、飲食及禁食準備；不足時應告知檢查團隊。"},{"stem":"病人使用抗凝血藥且預計接受大腸鏡息肉切除，護理師應如何處理？","options":[{"letter":"A","text":"檢查當天加倍服用"},{"letter":"B","text":"不需告知內視鏡團隊"},{"letter":"C","text":"確認藥物種類並依醫囑與團隊計畫調整，勿自行停藥"},{"letter":"D","text":"所有抗凝血藥均需永久停用"}],"answer":"C","rationale":"息肉切除有出血風險，抗凝血藥處理需個別規劃並權衡栓塞與出血風險；病人不可自行停藥或加量。"},{"stem":"病人大腸鏡檢查後接受鎮靜，返家前護理師應確認何項衛教？","options":[{"letter":"A","text":"當日可自行簽署所有重要法律文件"},{"letter":"B","text":"當日不可駕車或操作危險機械，並由適當陪同者協助返家"},{"letter":"C","text":"感覺清醒即可自行開車"},{"letter":"D","text":"檢查後立即飲酒助眠"}],"answer":"B","rationale":"鎮靜藥可能影響判斷力與反應時間，即使主觀感覺清醒仍應遵守出院安全指示並由陪同者協助。"},{"stem":"病人大腸鏡息肉切除後出現大量鮮血便及暈眩，護理師應如何指導？","options":[{"letter":"A","text":"立即回院或尋求緊急醫療評估"},{"letter":"B","text":"服用止瀉藥後繼續休息"},{"letter":"C","text":"多吃高纖食物即可"},{"letter":"D","text":"在家觀察一週"}],"answer":"A","rationale":"大量出血伴暈眩可能為延遲性出血或循環不穩，需緊急評估，不可延誤。"},{"stem":"糞便潛血檢查結果呈陽性，護理師最適當的說明為何？","options":[{"letter":"A","text":"結果陽性表示檢體被污染，直接丟棄"},{"letter":"B","text":"代表已確診大腸癌"},{"letter":"C","text":"代表一定有痔瘡，不必追蹤"},{"letter":"D","text":"表示需進一步評估出血來源，陽性本身不能確診癌症"}],"answer":"D","rationale":"糞便潛血陽性提示可能有消化道出血，需依醫療建議進一步檢查，不能據此直接診斷癌症或排除其他原因。"},{"stem":"病人接受糞便潛血篩檢前詢問是否需自行停藥，護理師最適當回答為何？","options":[{"letter":"A","text":"檢查與藥物無關，任何準備都不必詢問"},{"letter":"B","text":"所有人都須停用抗凝血藥一週"},{"letter":"C","text":"依所使用的檢測方式及醫療指示處理，勿自行停用處方藥"},{"letter":"D","text":"加倍服用鐵劑可提高準確度"}],"answer":"C","rationale":"不同糞便潛血方法的飲食及用藥限制可能不同，應依檢查說明辦理，避免未經醫囑停藥。"},{"stem":"病人接受腹部超音波評估膽囊，護理師應確認何種準備？","options":[{"letter":"A","text":"檢查前大量飲水且不排尿"},{"letter":"B","text":"服用瀉藥清腸"},{"letter":"C","text":"先吃油膩食物刺激膽囊收縮"},{"letter":"D","text":"依檢查單位指示禁食，以利膽囊與上腹部影像評估"}],"answer":"D","rationale":"膽囊超音波常需禁食，避免進食使膽囊收縮而影響觀察；仍應遵循檢查單位具體指示。"},{"stem":"病人接受骨盆腔超音波且醫囑要求膀胱充盈，護理師應如何指導？","options":[{"letter":"A","text":"依指示飲水並在檢查前避免排尿，若不適應告知人員"},{"letter":"B","text":"檢查前排空膀胱"},{"letter":"C","text":"自行使用利尿劑"},{"letter":"D","text":"完全禁水至檢查後"}],"answer":"A","rationale":"經腹部骨盆腔超音波常需適度充盈膀胱以改善聲窗，依單位指示準備；不可自行使用利尿劑。"},{"stem":"超音波檢查時病人詢問是否會有輻射，護理師正確回答為何？","options":[{"letter":"A","text":"診斷超音波使用聲波成像，不使用游離輻射"},{"letter":"B","text":"檢查後需隔離孕婦"},{"letter":"C","text":"超音波會累積與電腦斷層相同的輻射"},{"letter":"D","text":"超音波會使體內留下放射性物質"}],"answer":"A","rationale":"診斷超音波以聲波成像，不使用游離輻射；仍應由合格人員依醫療需要進行。"},{"stem":"肝臟超音波安排時，病人表示檢查前已進食。護理師應如何處理？","options":[{"letter":"A","text":"要求病人催吐後立刻檢查"},{"letter":"B","text":"告知檢查單位並確認是否需改期或調整，不隱瞞準備情況"},{"letter":"C","text":"自行加做電腦斷層"},{"letter":"D","text":"假裝病人已禁食"}],"answer":"B","rationale":"進食可能影響膽囊或上腹部超音波影像，應據實告知並由檢查團隊決定是否調整。"},{"stem":"病人將接受甲狀腺細針抽吸，護理師應特別詢問哪項資訊？","options":[{"letter":"A","text":"近期是否接觸噪音"},{"letter":"B","text":"是否曾做過腹部超音波"},{"letter":"C","text":"是否喜歡甜食"},{"letter":"D","text":"抗凝血藥或出血傾向，並依醫囑規劃檢查安全"}],"answer":"D","rationale":"穿刺檢查有出血風險，抗凝血藥與凝血狀況需事先評估並依醫囑處理。"},{"stem":"甲狀腺細針抽吸後，穿刺處有輕微瘀青但生命徵象穩定，適當照護為何？","options":[{"letter":"A","text":"依指示局部加壓並觀察腫脹、持續出血或呼吸吞嚥困難"},{"letter":"B","text":"完全不需觀察頸部"},{"letter":"C","text":"立即按摩穿刺處"},{"letter":"D","text":"用力咳嗽促進止血"}],"answer":"A","rationale":"局部加壓與觀察可辨識血腫；頸部腫脹若壓迫氣道或伴呼吸吞嚥困難需緊急處理。"},{"stem":"病人接受肝臟切片後返病房，最適當的護理措施為何？","options":[{"letter":"A","text":"熱敷穿刺處並按摩"},{"letter":"B","text":"依醫囑採指定姿勢與觀察生命徵象、穿刺處及腹痛"},{"letter":"C","text":"只記錄病人是否口渴"},{"letter":"D","text":"立即下床快走以預防血栓"}],"answer":"B","rationale":"肝臟切片後需依醫囑臥床或採適當姿勢，監測出血、疼痛及生命徵象；活動安排依臨床指示。"},{"stem":"肝臟切片後病人突然右上腹劇痛、肩部牽涉痛且血壓下降，護理師應優先處理何事？","options":[{"letter":"A","text":"立即通報並評估出血與循環狀況"},{"letter":"B","text":"安排病人自行走到廁所"},{"letter":"C","text":"告知肩痛是必然正常反應"},{"letter":"D","text":"給予食物後觀察"}],"answer":"A","rationale":"腹痛、牽涉痛合併低血壓可能提示內出血，須緊急通報和支持循環。"},{"stem":"病人安排乳房穿刺切片，術前發現其正在服用抗血小板藥，護理師應如何作為？","options":[{"letter":"A","text":"立即自行停藥且不告知醫師"},{"letter":"B","text":"忽略藥物，因穿刺完全沒有出血風險"},{"letter":"C","text":"核對藥物並聯繫醫療團隊確認出血風險及用藥計畫"},{"letter":"D","text":"要求加倍服藥以免血栓"}],"answer":"C","rationale":"穿刺有出血風險，抗血小板藥物須由醫療團隊依個別風險訂定處理方式，不應由護理師或病人自行停藥。"},{"stem":"乳房穿刺後病人詢問穿刺處照護，適當衛教為何？","options":[{"letter":"A","text":"出現快速擴大的腫脹也不需聯絡醫療人員"},{"letter":"B","text":"依指示保持敷料清潔乾燥並觀察持續出血、紅腫熱痛"},{"letter":"C","text":"持續揉搓穿刺處以散開血塊"},{"letter":"D","text":"自行拆除敷料並浸泡浴缸"}],"answer":"B","rationale":"保持穿刺處清潔並觀察感染、血腫或出血徵象；擴大腫脹或持續出血應及時回報。"},{"stem":"病人安排腰椎穿刺，護理師術前應確認哪項重要事項？","options":[{"letter":"A","text":"是否已將所有藥物永久停用"},{"letter":"B","text":"病人是否已吃高脂餐"},{"letter":"C","text":"凝血狀況、抗凝血用藥、神經學基準及檢查同意流程"},{"letter":"D","text":"只需測量身高"}],"answer":"C","rationale":"腰椎穿刺需評估出血風險、神經狀態與相關禁忌，並遵循同意和醫囑流程。"},{"stem":"腰椎穿刺後病人主訴坐起時頭痛加劇、平躺後改善，護理師應如何回應？","options":[{"letter":"A","text":"認定為腦出血並自行給抗凝血藥"},{"letter":"B","text":"要求病人持續坐立"},{"letter":"C","text":"告知與穿刺無關，不需記錄"},{"letter":"D","text":"評估症狀並告知醫療團隊，依醫囑採取處置與補液等支持"}],"answer":"D","rationale":"姿勢性頭痛可能與腦脊髓液漏相關，需評估並依醫囑處理；不宜未評估自行診斷或用藥。"},{"stem":"病人腰椎穿刺後詢問是否必須平躺固定時間，護理師應如何說明？","options":[{"letter":"A","text":"依醫囑與院內流程安排休息及活動，若有頭痛或神經症狀應回報"},{"letter":"B","text":"所有病人一律必須平躺數日"},{"letter":"C","text":"檢查後立刻劇烈運動"},{"letter":"D","text":"不論症狀均禁止喝水"}],"answer":"A","rationale":"穿刺後休息與活動建議依個別狀況和院內流程，若有頭痛、麻木或無力等應通報，不能給出無差別的固定規則。"},{"stem":"腰椎穿刺後穿刺處滲血且病人下肢出現新發無力，護理師應優先採取何行動？","options":[{"letter":"A","text":"立即通知醫師並進行神經學與穿刺處評估"},{"letter":"B","text":"按摩下肢促進循環"},{"letter":"C","text":"只需更換敷料，不必評估神經狀態"},{"letter":"D","text":"等待下一班再觀察"}],"answer":"A","rationale":"新發神經缺損及滲血可能代表嚴重併發症，須立即評估和通報。"},{"stem":"病人安排腦波檢查，護理師應如何說明檢查原理？","options":[{"letter":"A","text":"檢查結果可單獨確診所有精神疾病"},{"letter":"B","text":"檢查會使用游離輻射"},{"letter":"C","text":"以頭皮電極記錄腦部電活動，不會將電流注入腦內"},{"letter":"D","text":"須將電極插入腦組織"}],"answer":"C","rationale":"腦波以頭皮電極記錄電位變化，並非侵入性注入電流，也不使用游離輻射。"},{"stem":"病人接受腦波檢查，醫囑要求睡眠剝奪以誘發異常，護理師應如何衛教？","options":[{"letter":"A","text":"照常熬夜並駕車前往"},{"letter":"B","text":"檢查前大量飲用咖啡以保持清醒"},{"letter":"C","text":"依檢查單位提供的睡眠剝奪指示準備，避免自行加用鎮靜藥"},{"letter":"D","text":"檢查前自行服用安眠藥"}],"answer":"C","rationale":"睡眠剝奪需按檢查指示準備，鎮靜藥或咖啡因可能影響結果，並須注意疲倦後交通安全。"},{"stem":"病人接受腦波檢查後，頭皮有電極膏殘留，護理師應說明何者？","options":[{"letter":"A","text":"不可清洗頭髮一個月"},{"letter":"B","text":"電極膏具有放射性，須隔離"},{"letter":"C","text":"須立即使用強溶劑擦拭"},{"letter":"D","text":"電極膏可依指示清洗，通常不代表皮膚受傷"}],"answer":"D","rationale":"電極膏通常可用洗髮方式清除；避免刺激性溶劑，並觀察皮膚是否有不適。"},{"stem":"病人接受神經傳導檢查及肌電圖前，護理師應詢問何項資訊？","options":[{"letter":"A","text":"是否對聲音敏感"},{"letter":"B","text":"是否使用抗凝血藥、是否有出血傾向及相關神經肌肉症狀"},{"letter":"C","text":"最近一次排便顏色"},{"letter":"D","text":"是否曾做過眼底攝影"}],"answer":"B","rationale":"肌電圖可能以針電極進行肌肉檢查，應評估出血風險、用藥與症狀基準。"},{"stem":"病人接受肌電圖後，針刺部位輕微痠痛，適當衛教為何？","options":[{"letter":"A","text":"立即按摩所有穿刺點"},{"letter":"B","text":"自行服用抗凝血藥減輕疼痛"},{"letter":"C","text":"短暫局部不適可能發生；若疼痛加劇、明顯腫脹或持續出血應回報"},{"letter":"D","text":"任何痠痛都表示神經永久受損"}],"answer":"C","rationale":"肌電圖後可能有短暫痠痛，但加劇疼痛、腫脹或出血需進一步評估；不宜按摩或自行用藥。"},{"stem":"病人安排心電圖，護理師為取得較準確的靜息心電圖，應如何準備？","options":[{"letter":"A","text":"檢查中持續交談使病人放鬆"},{"letter":"B","text":"要求病人檢查前跑步"},{"letter":"C","text":"將胸前電極貼在衣物上"},{"letter":"D","text":"讓病人安靜休息並以正確位置放置電極"}],"answer":"D","rationale":"安靜休息及正確電極位置可減少動作干擾並提升判讀品質。"},{"stem":"護理師發現心電圖呈現明顯基線漂移且病人正在顫抖，適當處理為何？","options":[{"letter":"A","text":"剪除所有導線"},{"letter":"B","text":"不看病人狀況只重複列印"},{"letter":"C","text":"先評估病人並改善電極接觸與顫抖等干擾後重做"},{"letter":"D","text":"直接將異常心律記為確診"}],"answer":"C","rationale":"動作或接觸不良可造成偽差，須先評估臨床狀況並排除干擾；真正危急心律則不可因重做而延誤處理。"},{"stem":"病人胸痛且心電圖疑似急性缺血，護理師最優先的作為為何？","options":[{"letter":"A","text":"立即評估生命徵象並依急救流程通知醫療團隊，不延誤處置"},{"letter":"B","text":"先移除監測並讓病人步行"},{"letter":"C","text":"請病人自行回家休息"},{"letter":"D","text":"等候例行報告隔日再處理"}],"answer":"A","rationale":"胸痛與疑似急性缺血需即刻臨床評估與團隊處置，不能等待正式報告或讓病人活動。"},{"stem":"病人接受24小時心電圖監測，護理師適當的衛教為何？","options":[{"letter":"A","text":"症狀發生時自行拆除電極"},{"letter":"B","text":"檢查期間完全停止日常活動"},{"letter":"C","text":"記錄症狀及發生時間，並保持記錄器與電極依指示使用"},{"letter":"D","text":"洗澡時將記錄器浸入水中"}],"answer":"C","rationale":"症狀時間紀錄有助對照心律，設備須依指示避免弄濕或拆除；活動安排依檢查指示。"},{"stem":"接受運動心電圖的病人出現胸痛、喘及頭暈，護理師應如何處理？","options":[{"letter":"A","text":"鼓勵再多走幾分鐘完成測試"},{"letter":"B","text":"立即停止運動並通知醫療團隊，評估生命徵象"},{"letter":"C","text":"讓病人獨自走回病房"},{"letter":"D","text":"先給食物再繼續運動"}],"answer":"B","rationale":"運動中出現胸痛、呼吸困難或頭暈為停止測試及立即評估的警訊。"},{"stem":"病人接受心臟超音波，護理師對經胸超音波的說明何者正確？","options":[{"letter":"A","text":"通常由胸壁放置探頭觀察心臟結構與功能，並非侵入性檢查"},{"letter":"B","text":"檢查一定要全身麻醉"},{"letter":"C","text":"檢查使用放射性同位素"},{"letter":"D","text":"必須將探頭送入心室"}],"answer":"A","rationale":"經胸心臟超音波以胸壁探頭取得心臟影像，通常非侵入性且不使用游離輻射。"},{"stem":"病人即將接受經食道心臟超音波，檢查後何時可飲食？","options":[{"letter":"A","text":"待咽喉麻醉消退且吞嚥反射恢復後，依指示開始飲食"},{"letter":"B","text":"檢查一結束立即大量喝水"},{"letter":"C","text":"平躺時餵食以防跌倒"},{"letter":"D","text":"麻醉期間以吸管飲用"}],"answer":"A","rationale":"經食道檢查常使用咽喉麻醉及鎮靜，反射未恢復前飲食會有吸入風險。"},{"stem":"經食道心臟超音波後病人出現呼吸困難與頸部腫脹，護理師應優先做何事？","options":[{"letter":"A","text":"請病人自行步行至檢查室"},{"letter":"B","text":"立即啟動緊急評估並通知醫師，維持呼吸道安全"},{"letter":"C","text":"告知是正常咽喉麻醉反應"},{"letter":"D","text":"給予固體食物測試吞嚥"}],"answer":"B","rationale":"呼吸困難和頸部腫脹可能代表嚴重併發症或氣道威脅，應緊急處理。"},{"stem":"病人準備心導管檢查，護理師需確認的重要事項為何？","options":[{"letter":"A","text":"是否已停止所有慢性病藥物"},{"letter":"B","text":"是否能在檢查中自行進食"},{"letter":"C","text":"顯影劑反應史、腎功能、抗凝血用藥及檢查前禁食指示"},{"letter":"D","text":"有無近視"}],"answer":"C","rationale":"心導管可能使用顯影劑且涉及穿刺，需評估腎功能、過敏史、用藥及依醫囑準備。"},{"stem":"心導管檢查後股動脈穿刺處敷料迅速滲血，護理師應如何處置？","options":[{"letter":"A","text":"立即以適當方式加壓止血並通知醫療團隊，監測生命徵象"},{"letter":"B","text":"用熱敷促進循環"},{"letter":"C","text":"讓病人屈曲髖關節並下床"},{"letter":"D","text":"只更換敷料，不需加壓"}],"answer":"A","rationale":"股動脈穿刺後出血可迅速造成失血，應立即加壓止血並通報、監測循環。"},{"stem":"心導管由股動脈進入後，病人出現同側足部蒼白、冰冷且足背脈搏減弱，護理師應優先做何事？","options":[{"letter":"A","text":"將患肢抬高並按摩至溫暖即可"},{"letter":"B","text":"立即比較肢體循環並通報醫師，警覺動脈灌流受損"},{"letter":"C","text":"解除所有監測後觀察至隔日"},{"letter":"D","text":"告知病人是正常麻醉效果"}],"answer":"B","rationale":"穿刺側遠端脈搏減弱、蒼白冰冷可能代表動脈阻塞或灌流不足，需立即評估與通報。"},{"stem":"心導管穿刺處出現快速擴大的搏動性腫塊，護理師應如何處理？","options":[{"letter":"A","text":"讓病人起身排尿"},{"letter":"B","text":"以冰塊直接壓迫且不告知醫師"},{"letter":"C","text":"用力按摩腫塊使血液散開"},{"letter":"D","text":"持續評估並立即通知醫療團隊，考慮血腫或假性動脈瘤"}],"answer":"D","rationale":"快速擴大或搏動性腫塊可能提示血管併發症，需立即通報及適當處置。"},{"stem":"心導管使用橈動脈入路後，護理師應重點評估哪項？","options":[{"letter":"A","text":"手部灌流、感覺及穿刺處出血"},{"letter":"B","text":"雙下肢肌力即可"},{"letter":"C","text":"視力變化"},{"letter":"D","text":"耳道分泌物"}],"answer":"A","rationale":"橈動脈穿刺後須評估手部循環、感覺與穿刺止血裝置狀況。"},{"stem":"病人接受心導管後出現胸痛及心電圖變化，護理師應如何處置？","options":[{"letter":"A","text":"告知術後胸痛必然正常"},{"letter":"B","text":"鼓勵快走改善循環"},{"letter":"C","text":"立即評估並通報醫療團隊，警覺心肌缺血等併發症"},{"letter":"D","text":"先將病人送回家"}],"answer":"C","rationale":"術後新發胸痛合併心電圖變化可能為急性缺血，需立即處置而非觀察或活動。"},{"stem":"病人接受冠狀動脈攝影後詢問顯影劑排出方式，適當衛教為何？","options":[{"letter":"A","text":"停用所有藥物直到尿液透明"},{"letter":"B","text":"不需觀察穿刺處"},{"letter":"C","text":"若無液體限制，依醫囑維持適當水分，並觀察尿量及穿刺處"},{"letter":"D","text":"自行大量灌水不考慮心衰竭"}],"answer":"C","rationale":"補液需依心腎狀況和醫囑，並監測尿量及穿刺處；心衰竭者不可盲目大量飲水。"},{"stem":"病人接受肺功能檢查前，護理師應如何處理支氣管擴張劑？","options":[{"letter":"A","text":"檢查是否正常與用藥無關"},{"letter":"B","text":"依檢查目的及醫囑確認是否暫緩使用，不自行停藥"},{"letter":"C","text":"一律檢查前加倍使用"},{"letter":"D","text":"所有吸入藥永久停用"}],"answer":"B","rationale":"部分肺功能檢查需評估支氣管擴張劑前後差異，藥物是否暫緩依檢查指示，不可自行停藥或加量。"},{"stem":"病人進行肺量計測試時，為取得可靠結果應如何配合？","options":[{"letter":"A","text":"吐氣時中途停止數次"},{"letter":"B","text":"含住吹嘴但不需密封"},{"letter":"C","text":"只做淺呼吸即可"},{"letter":"D","text":"依指示深吸氣後用力、快速且持續吐氣"}],"answer":"D","rationale":"肺量計需良好密封並依指示用力呼氣，努力不足或漏氣會影響結果。"},{"stem":"肺量計測試中病人因用力呼氣而頭暈，護理師應如何處理？","options":[{"letter":"A","text":"停止測試、協助安全坐臥並評估症狀"},{"letter":"B","text":"給予鎮靜劑後繼續測試"},{"letter":"C","text":"要求立即連續重做"},{"letter":"D","text":"讓病人站立走動"}],"answer":"A","rationale":"用力呼氣可能造成短暫頭暈，應停止並防跌倒，症狀改善後是否續測由專業人員判斷。"},{"stem":"病人接受支氣管鏡檢查並使用鎮靜及咽喉麻醉，檢查後護理師應先確認何事？","options":[{"letter":"A","text":"只確認是否飢餓"},{"letter":"B","text":"立刻安排病人獨自離院"},{"letter":"C","text":"呼吸狀態、血氧及咽喉反射恢復情形"},{"letter":"D","text":"立即餵水測試"}],"answer":"C","rationale":"支氣管鏡後須監測呼吸、氧合及鎮靜恢復，咽喉反射未恢復前不可飲食。"},{"stem":"支氣管鏡肺組織切片後，病人突然呼吸急促且單側呼吸音減弱，護理師應優先考慮何者？","options":[{"letter":"A","text":"可能氣胸，立即評估並通知醫師"},{"letter":"B","text":"只是焦慮，請病人自行回家"},{"letter":"C","text":"正常咽喉刺激，不需處理"},{"letter":"D","text":"低血糖，先給糖水"}],"answer":"A","rationale":"肺切片後突發呼吸困難及單側呼吸音減弱需警覺氣胸，應緊急評估。"},{"stem":"支氣管鏡後病人咳出少量帶血痰，何種情況需立即通報？","options":[{"letter":"A","text":"短暫輕微喉嚨癢"},{"letter":"B","text":"聲音短暫沙啞"},{"letter":"C","text":"一兩次乾咳"},{"letter":"D","text":"出血量增加、呼吸困難或血氧下降"}],"answer":"D","rationale":"少量血絲痰可能短暫出現，但增加出血、呼吸困難或氧合變差可能是嚴重併發症。"},{"stem":"病人安排痰液培養，為降低口腔菌污染，護理師應如何指導採檢？","options":[{"letter":"A","text":"漱口後以深咳方式取得下呼吸道痰液，避免只收集唾液"},{"letter":"B","text":"先將漱口水吐入檢體瓶"},{"letter":"C","text":"只收集鼻涕即可"},{"letter":"D","text":"檢體瓶開蓋放置數小時再採"}],"answer":"A","rationale":"深部痰液較能代表下呼吸道，採檢前漱口並避免唾液污染；檢體應依流程迅速送驗。"},{"stem":"需採集結核菌痰液檢體的病人正在咳嗽，護理師採檢時應採取何種防護？","options":[{"letter":"A","text":"要求病人對著他人咳嗽以取得檢體"},{"letter":"B","text":"只戴一般手套即可"},{"letter":"C","text":"安排在多人候診區採集"},{"letter":"D","text":"依空氣傳染防護措施與適當隔離流程執行"}],"answer":"D","rationale":"疑似肺結核需採取空氣傳染防護及適當隔離，避免造成傳播。"},{"stem":"痰液檢體採集後，最適當的處理為何？","options":[{"letter":"A","text":"先放在病床旁直到下班"},{"letter":"B","text":"將檢體倒入排水孔後補採"},{"letter":"C","text":"不需核對病人身分"},{"letter":"D","text":"確認標示正確並儘速依規定送至檢驗室"}],"answer":"D","rationale":"正確病人、標示及及時送檢是檢體品質與安全的基本要求。"},{"stem":"病人安排動脈血液氣體分析，穿刺後護理師最重要的局部處置為何？","options":[{"letter":"A","text":"只貼上小敷料不加壓"},{"letter":"B","text":"立即熱敷並按摩"},{"letter":"C","text":"要求病人反覆屈伸手腕"},{"letter":"D","text":"持續直接加壓至止血，並評估遠端循環"}],"answer":"D","rationale":"動脈穿刺出血風險較高，需直接加壓至止血，尤其抗凝血或凝血異常者需留意較久。"},{"stem":"動脈血液氣體檢體採集後，護理師應如何維持檢體品質？","options":[{"letter":"A","text":"放置室溫數小時後送驗"},{"letter":"B","text":"依檢驗室規範妥善處理並儘速送驗"},{"letter":"C","text":"與尿液混合送檢"},{"letter":"D","text":"將檢體暴露空氣以便氧合"}],"answer":"B","rationale":"血氣結果可能受延遲及處理方式影響，須按檢驗室規範快速運送及處理。"},{"stem":"病人手腕動脈穿刺前，護理師進行Allen測試的目的為何？","options":[{"letter":"A","text":"評估手部側枝循環是否足以支持手部灌流"},{"letter":"B","text":"判斷腎臟濾過功能"},{"letter":"C","text":"測量肺活量"},{"letter":"D","text":"確認是否對局部麻醉過敏"}],"answer":"A","rationale":"Allen測試用於評估尺動脈等側枝循環，以降低橈動脈採血後手部灌流不足風險。"},{"stem":"病人尿液常規檢查需採中段尿，正確衛教為何？","options":[{"letter":"A","text":"容器內側可用手指接觸"},{"letter":"B","text":"把尿液倒入馬桶後再舀取"},{"letter":"C","text":"清潔會陰後先解少量尿，再於中段接取至無菌或指定容器"},{"letter":"D","text":"將第一滴尿直接滴在容器外側"}],"answer":"C","rationale":"清潔後採中段尿可減少尿道口及皮膚菌污染，避免碰觸容器內面。"},{"stem":"留置導尿病人需做尿液培養，護理師應如何採檢？","options":[{"letter":"A","text":"依流程消毒採樣口後以無菌方式抽取新鮮尿液"},{"letter":"B","text":"從尿袋中取已放置一整天的尿液"},{"letter":"C","text":"拆開導尿管與集尿袋接頭採集"},{"letter":"D","text":"從集尿袋底部直接倒取"}],"answer":"A","rationale":"培養檢體應從消毒後採樣口無菌取得新鮮尿液，尿袋內尿液容易受污染且不適用。"},{"stem":"病人正在使用抗生素，醫師開立尿液培養，護理師應優先安排何事？","options":[{"letter":"A","text":"先用大量消毒液沖洗尿道"},{"letter":"B","text":"若不延誤治療，盡可能在開始抗生素前採集檢體"},{"letter":"C","text":"等療程完成後才採集"},{"letter":"D","text":"自行停掉抗生素一週"}],"answer":"B","rationale":"抗生素可能降低培養陽性率，通常盡可能於給藥前採檢，但不得為採檢而延誤急需治療。"},{"stem":"尿液檢體採集後病人無法立即送檢，護理師應如何處理？","options":[{"letter":"A","text":"將檢體放在暖氣旁"},{"letter":"B","text":"依檢驗室規範適當保存並記錄採集時間"},{"letter":"C","text":"加入自來水增加體積"},{"letter":"D","text":"置於陽光下曝曬"}],"answer":"B","rationale":"延遲送檢可能改變檢體成分，應依檢驗室規範保存及標示時間，不可任意處理。"},{"stem":"病人進行24小時尿液收集，第一天早晨開始時應如何做？","options":[{"letter":"A","text":"每次只收集少量尿"},{"letter":"B","text":"保留第一泡尿並不記錄時間"},{"letter":"C","text":"先排空膀胱並丟棄該次尿液，記下開始時間，之後收集所有尿液"},{"letter":"D","text":"每天只需收集一次晨尿"}],"answer":"C","rationale":"24小時收集開始時排空並丟棄該次尿液，之後完整收集至結束時間的尿液，才能計算總量與成分。"},{"stem":"24小時尿液收集期間有一次尿液未收集到，護理師應如何處理？","options":[{"letter":"A","text":"只補收下一次尿液即可"},{"letter":"B","text":"告知檢查單位或醫療團隊，通常需重新開始完整收集"},{"letter":"C","text":"隱瞞漏收並送檢"},{"letter":"D","text":"用飲水量估算漏掉的尿量"}],"answer":"B","rationale":"漏收會使24小時總量和檢驗結果失準，應據實告知並依指示重新收集。"},{"stem":"尿液妊娠試驗結果陰性，但病人月經延遲且高度懷疑懷孕，適當回應為何？","options":[{"letter":"A","text":"說明早期可能尚未測得，依醫囑安排適當時機複驗或進一步檢查"},{"letter":"B","text":"要求病人自行服用荷爾蒙"},{"letter":"C","text":"不需記錄月經史"},{"letter":"D","text":"陰性即可完全排除任何懷孕"}],"answer":"A","rationale":"檢測時間與尿液濃度會影響結果，臨床懷疑持續時需依醫療指示追蹤，不能過度解讀單次陰性。"},{"stem":"病人進行糞便檢體採集，護理師應指導何者？","options":[{"letter":"A","text":"避免尿液或馬桶水污染，使用指定容器並依規定送驗"},{"letter":"B","text":"直接從馬桶水中取樣"},{"letter":"C","text":"將糞便混入清潔劑"},{"letter":"D","text":"採樣後不需標示"}],"answer":"A","rationale":"避免污染及正確標示、送驗可維持糞便檢體品質。"},{"stem":"病人接受糞便寄生蟲檢查，護理師應如何處理檢體？","options":[{"letter":"A","text":"先以酒精消毒糞便"},{"letter":"B","text":"依檢驗室指定容器、保存方式及採集時間送驗"},{"letter":"C","text":"加入尿液避免乾燥"},{"letter":"D","text":"一律冷凍數週"}],"answer":"B","rationale":"寄生蟲檢體依檢驗項目可能有特定保存和時間要求，須遵循檢驗室指示，不可自行添加物質。"},{"stem":"病人需抽血檢查空腹血糖，護理師如何確認準備？","options":[{"letter":"A","text":"檢查前喝含糖飲料"},{"letter":"B","text":"依醫囑確認禁食時間及可否飲水，並詢問降糖藥處理指示"},{"letter":"C","text":"自行停用胰島素一整天"},{"letter":"D","text":"只要沒吃固體食物就可喝含糖果汁"}],"answer":"B","rationale":"空腹檢查準備及降糖藥處理須依醫囑，避免飲用含熱量飲料或擅自停藥造成危險。"},{"stem":"病人空腹抽血途中出現冒冷汗、顫抖與意識改變，護理師應優先處理何事？","options":[{"letter":"A","text":"先完成所有例行抽血再評估"},{"letter":"B","text":"立即評估低血糖並依急救流程處理，不為完成檢查延誤"},{"letter":"C","text":"要求繼續禁食直到抽血完成"},{"letter":"D","text":"讓病人獨自離開"}],"answer":"B","rationale":"症狀可能為低血糖，病人安全優先於檢查，應立即評估血糖及依流程處置。"},{"stem":"病人抽血前詢問是否需要停用華法林，護理師應如何回答？","options":[{"letter":"A","text":"抽血前加倍服用華法林"},{"letter":"B","text":"由護理師自行決定是否停藥"},{"letter":"C","text":"一般抽血不應自行停藥；若為特定操作，依醫囑確認用藥計畫"},{"letter":"D","text":"所有抽血都須停藥三天"}],"answer":"C","rationale":"一般靜脈抽血通常不需自行停抗凝血藥；侵入性檢查則須依醫囑權衡風險，病人不可自行調藥。"},{"stem":"病人抽血後穿刺處持續滲血，最適當的處理為何？","options":[{"letter":"A","text":"彎曲手臂並用力按摩"},{"letter":"B","text":"立即移除敷料不再加壓"},{"letter":"C","text":"讓病人自行回家觀察"},{"letter":"D","text":"持續直接加壓並評估出血與抗凝血用藥，必要時通報"}],"answer":"D","rationale":"持續直接加壓可止血，抗凝血或凝血異常者需加強觀察，若仍出血應進一步通報。"},{"stem":"抽血檢體標籤應在何時及如何完成？","options":[{"letter":"A","text":"以床號取代病人身分核對"},{"letter":"B","text":"離開病房後憑記憶標示"},{"letter":"C","text":"依規範在病人旁核對身分後立即標示，確保標籤與檢體一致"},{"letter":"D","text":"先在護理站預先貼好所有標籤再抽血"}],"answer":"C","rationale":"床邊核對與即時標示可預防錯誤病人或錯置檢體，是檢驗安全的重要步驟。"},{"stem":"病人接受血液培養採檢，降低污染風險的關鍵作法為何？","options":[{"letter":"A","text":"先從導管接頭直接取樣而不消毒"},{"letter":"B","text":"嚴格執行皮膚消毒與無菌技術，並依指示採集適當檢體"},{"letter":"C","text":"將採血針放在床上備用"},{"letter":"D","text":"用已消毒棉片重複擦拭多位病人"}],"answer":"B","rationale":"血液培養需嚴格無菌操作以降低污染，採檢部位與套組依臨床情況和流程決定。"},{"stem":"疑似敗血症病人需採血液培養，護理師應如何安排採檢與抗生素？","options":[{"letter":"A","text":"若可迅速完成，依醫囑先採培養再給抗生素，但不得因此延誤急救治療"},{"letter":"B","text":"等待所有培養結果出來後才給抗生素"},{"letter":"C","text":"病人退燒後才採培養"},{"letter":"D","text":"為了培養延遲治療數小時"}],"answer":"A","rationale":"培養宜在抗生素前採取以增加檢出機會，但敗血症治療具時效，採檢不可造成重要治療延誤。"},{"stem":"病人留置周邊靜脈導管處紅腫且發熱，醫師安排血液培養，護理師應注意何者？","options":[{"letter":"A","text":"不需核對抗生素給藥時間"},{"letter":"B","text":"只採集輸液袋內液體"},{"letter":"C","text":"依醫囑從適當部位採集並避免污染，記錄採檢部位與時間"},{"letter":"D","text":"將導管處擠壓出的液體當血液檢體"}],"answer":"C","rationale":"需依培養目的及醫囑選擇適當採檢部位，避免污染並記錄採檢時序，以利判讀。"},{"stem":"血液檢驗報告出現危急值，護理師應如何處理？","options":[{"letter":"A","text":"等例行交班時再報告"},{"letter":"B","text":"只在病歷註記，不聯絡任何人"},{"letter":"C","text":"自行修改檢驗結果"},{"letter":"D","text":"立即依院內流程通知負責醫療人員並確認接收與後續處置"}],"answer":"D","rationale":"危急值須及時傳達並確認接收，確保病人獲得迅速評估與治療。"},{"stem":"病人接受凝血功能檢查，護理師最適當的解讀原則為何？","options":[{"letter":"A","text":"將結果與用藥、出血表現及醫療目標一併評估，不單靠數值自行調藥"},{"letter":"B","text":"只要數值稍異常就自行停抗凝血藥"},{"letter":"C","text":"無出血症狀代表結果不必追蹤"},{"letter":"D","text":"凝血檢查可取代所有臨床評估"}],"answer":"A","rationale":"凝血數值需結合藥物、適應症及臨床出血或血栓風險，由醫療團隊決定調整，護理人員不可自行調藥。"},{"stem":"病人接受骨骼核醫掃描，護理師應如何說明檢查原理？","options":[{"letter":"A","text":"注射少量放射性示蹤劑後以儀器追蹤分布，需依指示配合影像及安全措施"},{"letter":"B","text":"注射後立刻成為強放射源，必須永久隔離"},{"letter":"C","text":"此檢查只需抽血即可完成"},{"letter":"D","text":"檢查完全不使用放射性物質"}],"answer":"A","rationale":"核醫掃描使用放射性示蹤劑成像，須依核醫部門指示安排影像及輻射安全；不應誇大成永久放射源。"},{"stem":"接受核醫骨骼掃描的病人詢問檢查後是否需多喝水，適當回答為何？","options":[{"letter":"A","text":"自行服用利尿劑加速排出"},{"letter":"B","text":"檢查後完全禁止排尿"},{"letter":"C","text":"依核醫部門指示及個人液體限制維持適當水分並按時排尿"},{"letter":"D","text":"不論心腎狀況都須大量灌水"}],"answer":"C","rationale":"適當水分與排尿可依示蹤劑特性及個人狀況安排，但心腎疾病或限水者不可盲目大量補水。"},{"stem":"育齡女性安排核醫檢查，護理師術前應確認何事？","options":[{"letter":"A","text":"是否可能懷孕或哺乳，並依核醫部門規範通報評估"},{"letter":"B","text":"隱瞞懷孕可能避免取消檢查"},{"letter":"C","text":"認為示蹤劑對胎兒與哺乳完全無影響"},{"letter":"D","text":"只詢問是否吃早餐"}],"answer":"A","rationale":"放射性示蹤劑檢查前需確認懷孕及哺乳狀況，由核醫團隊依檢查種類評估風險與安排。"}]},{"title":"COPD：慢性支氣管炎與肺氣腫","questions":[{"stem":"慢性支氣管炎的臨床定義為何？","options":[{"letter":"A","text":"任何急性咳嗽超過3週"},{"letter":"B","text":"FEV1/FVC降低即符合"},{"letter":"C","text":"肺泡壁破壞即符合"},{"letter":"D","text":"每年咳嗽咳痰至少3個月，連續2年，排除其他原因"}],"answer":"D","rationale":"慢性支氣管炎以咳嗽咳痰持續時間定義；肺氣腫則指肺泡壁破壞。"},{"stem":"肺氣腫的主要病理變化為何？","options":[{"letter":"A","text":"肺泡遠端氣腔擴大並有肺泡壁破壞"},{"letter":"B","text":"支氣管急性水腫且可逆"},{"letter":"C","text":"胸膜積液"},{"letter":"D","text":"肺泡纖維化縮小"}],"answer":"A","rationale":"肺泡壁破壞使彈性回縮力下降並促成氣體滯留。"},{"stem":"慢性支氣管炎黏液增加的主要原因為何？","options":[{"letter":"A","text":"胸壁肥厚"},{"letter":"B","text":"氣道發炎及黏液腺、杯狀細胞增生"},{"letter":"C","text":"肺泡表面張力完全消失"},{"letter":"D","text":"腎臟水分排出增加"}],"answer":"B","rationale":"慢性刺激導致氣道發炎、分泌增加及纖毛清除下降。"},{"stem":"COPD最重要且可改變的危險因子為何？","options":[{"letter":"A","text":"吸菸"},{"letter":"B","text":"身高"},{"letter":"C","text":"咖啡因"},{"letter":"D","text":"短期抗生素"}],"answer":"A","rationale":"菸草煙霧是主要危險因子；戒菸有助減緩肺功能下降。"},{"stem":"COPD氣流受限通常具有何種特性？","options":[{"letter":"A","text":"只在睡眠發生"},{"letter":"B","text":"必定由感染造成"},{"letter":"C","text":"持續存在，並非完全可逆"},{"letter":"D","text":"每次吸藥即完全消失"}],"answer":"C","rationale":"COPD為持續氣流受限，可能部分可逆但通常不完全逆轉。"},{"stem":"肺氣腫患者呼氣時易氣體滯留的原因為何？","options":[{"letter":"A","text":"肺泡表面活性劑過多"},{"letter":"B","text":"小氣道呼氣時易動態塌陷"},{"letter":"C","text":"吸氣時聲門關閉"},{"letter":"D","text":"腎功能不足"}],"answer":"B","rationale":"彈性回縮力下降及小氣道失去支撐，使呼氣排空受阻。"},{"stem":"縮唇呼吸的主要作用為何？","options":[{"letter":"A","text":"縮短呼氣時間"},{"letter":"B","text":"避免咳嗽"},{"letter":"C","text":"延長呼氣並維持小氣道通暢"},{"letter":"D","text":"加速呼吸排二氧化碳"}],"answer":"C","rationale":"縮唇呼氣產生輕微正壓，可減少小氣道塌陷及喘促。"},{"stem":"COPD患者呈桶狀胸的主要原因為何？","options":[{"letter":"A","text":"大量胸水"},{"letter":"B","text":"肺容積縮小"},{"letter":"C","text":"肺過度充氣使胸廓前後徑增加"},{"letter":"D","text":"單側肋骨骨折"}],"answer":"C","rationale":"慢性氣體滯留可造成肺過度充氣及桶狀胸。"},{"stem":"COPD患者使用輔助呼吸肌代表何者？","options":[{"letter":"A","text":"呼吸作功增加"},{"letter":"B","text":"氣道阻塞已解除"},{"letter":"C","text":"患者必無缺氧"},{"letter":"D","text":"肺功能正常"}],"answer":"A","rationale":"輔助肌使用反映呼吸負荷增加，應評估窘迫趨勢。"},{"stem":"呼氣延長、呼吸音減弱較符合何者？","options":[{"letter":"A","text":"肺泡出血"},{"letter":"B","text":"肺部無氣體滯留"},{"letter":"C","text":"上呼吸道單純阻塞"},{"letter":"D","text":"氣流受限及肺過度充氣"}],"answer":"D","rationale":"氣流受限延長呼氣，過度充氣亦可使呼吸音減弱。"},{"stem":"COPD低血氧常見機轉為何？","options":[{"letter":"A","text":"血紅素增加"},{"letter":"B","text":"通氣灌流不匹配"},{"letter":"C","text":"胃酸減少"},{"letter":"D","text":"腎臟排氧增加"}],"answer":"B","rationale":"氣道阻塞與肺泡破壞造成通氣灌流分布不均。"},{"stem":"慢性缺氧造成肺動脈高壓的機轉為何？","options":[{"letter":"A","text":"肺血管缺氧性收縮及重塑"},{"letter":"B","text":"支氣管黏液減少"},{"letter":"C","text":"冠狀動脈擴張"},{"letter":"D","text":"腎小球濾過增加"}],"answer":"A","rationale":"缺氧性肺血管收縮與重塑會提高肺血管阻力。"},{"stem":"肺心病右心衰竭可能出現何種表徵？","options":[{"letter":"A","text":"關節紅腫"},{"letter":"B","text":"頸靜脈怒張及下肢水腫"},{"letter":"C","text":"瞳孔散大"},{"letter":"D","text":"黃疸必然出現"}],"answer":"B","rationale":"右心衰竭造成體循環靜脈鬱血。"},{"stem":"COPD急性惡化常見誘因為何？","options":[{"letter":"A","text":"戒菸"},{"letter":"B","text":"適當飲水"},{"letter":"C","text":"呼吸道感染及空氣污染"},{"letter":"D","text":"規律復健"}],"answer":"C","rationale":"感染與刺激物暴露可觸發症狀急遽惡化。"},{"stem":"咳嗽、痰量及呼吸困難較平日明顯增加，應如何判斷？","options":[{"letter":"A","text":"立即停掉所有藥"},{"letter":"B","text":"代表肺功能恢復"},{"letter":"C","text":"必然是心肌梗塞"},{"letter":"D","text":"疑似急性惡化，需進一步評估"}],"answer":"D","rationale":"症狀相對基線加劇須評估氧合、感染及其他可能病因。"},{"stem":"確認持續氣流受限最重要的檢查為何？","options":[{"letter":"A","text":"心電圖"},{"letter":"B","text":"支氣管擴張劑後肺量計"},{"letter":"C","text":"單靠聽診"},{"letter":"D","text":"痰色"}],"answer":"B","rationale":"肺量計客觀確認氣流受限，不能只靠症狀或聽診診斷。"},{"stem":"FEV1代表何者？","options":[{"letter":"A","text":"殘氣量"},{"letter":"B","text":"吸氣容量"},{"letter":"C","text":"呼吸頻率"},{"letter":"D","text":"用力呼氣第一秒呼出量"}],"answer":"D","rationale":"FEV1是用力呼氣第一秒排出的氣體量。"},{"stem":"FEV1/FVC主要協助判斷何者？","options":[{"letter":"A","text":"肺泡表面張力"},{"letter":"B","text":"血液攜氧能力"},{"letter":"C","text":"氣流阻塞"},{"letter":"D","text":"腎濃縮功能"}],"answer":"C","rationale":"FEV1/FVC降低提示呼氣氣流阻塞。"},{"stem":"肺量計檢查前用藥如何處理？","options":[{"letter":"A","text":"先大量吸救援藥"},{"letter":"B","text":"禁水24小時"},{"letter":"C","text":"依檢查指示暫停特定支氣管擴張劑"},{"letter":"D","text":"自行停藥一週"}],"answer":"C","rationale":"是否暫停藥物由檢查目的與醫囑決定，不可自行停掉全部藥。"},{"stem":"急性惡化患者嗜睡，哪項檢查可評估通氣及酸鹼？","options":[{"letter":"A","text":"骨密度"},{"letter":"B","text":"動脈血液氣體"},{"letter":"C","text":"糞便潛血"},{"letter":"D","text":"尿液常規"}],"answer":"B","rationale":"血氣可評估氧合、PaCO2及酸鹼狀態。"},{"stem":"脈搏血氧機能提供何種資訊？","options":[{"letter":"A","text":"直接測量二氧化碳"},{"letter":"B","text":"判定肺炎病原"},{"letter":"C","text":"周邊血氧趨勢，不能測PaCO2"},{"letter":"D","text":"測肺活量"}],"answer":"C","rationale":"血氧機測氧飽和度，不提供二氧化碳或完整酸鹼資訊。"},{"stem":"胸部X光對COPD評估的作用為何？","options":[{"letter":"A","text":"評估過度充氣並協助排除其他胸腔病變"},{"letter":"B","text":"測吸入技巧"},{"letter":"C","text":"精確測FEV1"},{"letter":"D","text":"確認細菌種類"}],"answer":"A","rationale":"影像可協助評估結構及排除肺炎、氣胸等，但不取代肺量計。"},{"stem":"早發或家族性肺氣腫可考慮檢查何者？","options":[{"letter":"A","text":"α1抗胰蛋白酶"},{"letter":"B","text":"凝血因子VIII"},{"letter":"C","text":"甲狀腺抗體"},{"letter":"D","text":"胰島素抗體"}],"answer":"A","rationale":"α1抗胰蛋白酶缺乏是遺傳性肺氣腫原因之一。"},{"stem":"痰量增加且呈膿性，最適當處置為何？","options":[{"letter":"A","text":"立即停氧"},{"letter":"B","text":"限制所有飲水"},{"letter":"C","text":"視為老化不處理"},{"letter":"D","text":"評估感染與惡化徵象並通報"}],"answer":"D","rationale":"痰液改變可能表示感染或惡化，須結合其他徵象評估。"},{"stem":"評估活動耐受度應記錄何者？","options":[{"letter":"A","text":"飲水量而已"},{"letter":"B","text":"髮色"},{"letter":"C","text":"身高"},{"letter":"D","text":"活動喘、血氧與恢復情形"}],"answer":"D","rationale":"症狀、氧合及恢復時間可反映活動功能與治療反應。"},{"stem":"評估呼吸困難最適當方式為何？","options":[{"letter":"A","text":"只在夜間評估"},{"letter":"B","text":"依年齡推估"},{"letter":"C","text":"詢問對日常活動影響並比較個人基線"},{"letter":"D","text":"因主觀而不記錄"}],"answer":"C","rationale":"症狀及功能需由患者報告，並與個人基線比較。"},{"stem":"COPD患者體重下降，優先評估何者？","options":[{"letter":"A","text":"攝食、呼吸作功及營養狀態"},{"letter":"B","text":"視力"},{"letter":"C","text":"要求劇烈運動"},{"letter":"D","text":"立即禁食"}],"answer":"A","rationale":"呼吸負荷與進食困難可造成攝取不足及營養不良。"},{"stem":"COPD患者出現杵狀指，應如何看待？","options":[{"letter":"A","text":"氧合正常證據"},{"letter":"B","text":"非典型單純COPD特徵，須評估其他原因"},{"letter":"C","text":"確診必要條件"},{"letter":"D","text":"吸入藥過量"}],"answer":"B","rationale":"杵狀指應考慮肺癌、支氣管擴張等其他病因。"},{"stem":"最具疾病修飾效益的衛教重點為何？","options":[{"letter":"A","text":"自行服抗生素"},{"letter":"B","text":"長期臥床"},{"letter":"C","text":"避免疫苗"},{"letter":"D","text":"戒菸及提供戒菸支持"}],"answer":"D","rationale":"戒菸可減少持續傷害並延緩肺功能下降。"},{"stem":"患者問受損後戒菸是否仍有用，最佳回應為何？","options":[{"letter":"A","text":"完全無效"},{"letter":"B","text":"改抽低焦油即可"},{"letter":"C","text":"任何階段戒菸都有健康效益"},{"letter":"D","text":"肺泡會立刻再生"}],"answer":"C","rationale":"戒菸在各階段皆有益，但不會使已破壞肺泡再生。"},{"stem":"肺復健的主要目標為何？","options":[{"letter":"A","text":"取代所有藥物"},{"letter":"B","text":"使肺泡恢復正常"},{"letter":"C","text":"消除所有急性惡化"},{"letter":"D","text":"改善運動能力、症狀處理及生活品質"}],"answer":"D","rationale":"肺復健改善功能與生活品質，但不逆轉肺泡破壞。"},{"stem":"安排運動訓練的安全原則為何？","options":[{"letter":"A","text":"依能力漸進並監測症狀"},{"letter":"B","text":"禁止步行"},{"letter":"C","text":"一開始最大強度"},{"letter":"D","text":"忽略胸痛頭暈"}] 制藥物併用風險"},{"letter":"C","text":"鹽分"},{"letter":"D","text":"是否使用牙線"}],"answer":"B","rationale":"鎮靜藥可能抑制呼吸，需由醫療人員評估。"},{"stem":"肺氣腫患者突發單側胸痛、喘加劇且呼吸音減弱，應懷疑何者？","options":[{"letter":"A","text":"氣胸"},{"letter":"B","text":"胃食道逆流"},{"letter":"C","text":"鼻炎"},{"letter":"D","text":"耳炎"}],"answer":"A","rationale":"突發單側胸痛及呼吸音減弱符合氣胸警訊，須緊急評估。"},{"stem":"COPD患者胸悶、心跳不規則，優先作為為何？","options":[{"letter":"A","text":"評估生命徵象、心電圖及缺氧"},{"letter":"B","text":"飲水後等一天"},{"letter":"C","text":"認定焦慮"},{"letter":"D","text":"要求步行"}],"answer":"A","rationale":"胸悶及不整脈可能是嚴重心肺問題，需快速評估。"},{"stem":"痰培養若有醫囑，較佳採檢時機為何？","options":[{"letter":"A","text":"療程結束才採"},{"letter":"B","text":"唾液即可代表痰"},{"letter":"C","text":"不標示檢體"},{"letter":"D","text":"儘可能在抗生素前取得合格痰"}],"answer":"D","rationale":"不延誤治療前提下，抗生素前採取合格檢體較利判讀。"},{"stem":"痰檢體以唾液為主，應如何處理？","options":[{"letter":"A","text":"加自來水"},{"letter":"B","text":"重教深咳並重新採集"},{"letter":"C","text":"直接當深痰送驗"},{"letter":"D","text":"不用重採"}],"answer":"B","rationale":"唾液污染會影響檢體品質，應重新收集下呼吸道痰液。"},{"stem":"發燒、膿痰及喘加劇，優先追蹤何者？","options":[{"letter":"A","text":"指甲長度"},{"letter":"B","text":"感染、血氧、呼吸作功與意識"},{"letter":"C","text":"排便"},{"letter":"D","text":"口渴"}],"answer":"B","rationale":"感染可引發惡化及呼吸衰竭，需監測呼吸與意識。"},{"stem":"給氧後嗜睡加重，應如何處理？","options":[{"letter":"A","text":"任其睡眠"},{"letter":"B","text":"重評呼吸、氧合及血氣並通知團隊"},{"letter":"C","text":"增加鎮靜藥"},{"letter":"D","text":"完全停氧不評估"}],"answer":"B","rationale":"嗜睡可能代表通氣惡化，需緊急評估；氧療不能未評估驟停。"},{"stem":"PaCO2升高且pH下降，最符合何者？","options":[{"letter":"A","text":"呼吸性鹼中毒"},{"letter":"B","text":"代謝性酸中毒"},{"letter":"C","text":"呼吸性酸中毒"},{"letter":"D","text":"代謝性鹼中毒"}],"answer":"C","rationale":"二氧化碳上升使酸性增加，造成呼吸性酸中毒。"},{"stem":"慢性高碳酸血症且HCO3−升高、pH近正常，較可能表示何者？","options":[{"letter":"A","text":"腎臟部分代償慢性呼吸性酸中毒"},{"letter":"B","text":"檢體必錯"},{"letter":"C","text":"急性代謝酸中毒"},{"letter":"D","text":"無CO2滯留"}],"answer":"A","rationale":"慢性CO2滯留可由腎臟保留碳酸氫根部分代償。"},{"stem":"非侵襲性通氣治療前需確認何者？","options":[{"letter":"A","text":"昏迷不能保護氣道仍直接用"},{"letter":"B","text":"患者可保護氣道、面罩合適且可監測"},{"letter":"C","text":"開始後不必評估"},{"letter":"D","text":"漏氣越多越好"}],"answer":"B","rationale":"NIV需適當患者選擇、面罩密合及密切監測。"},{"stem":"NIV患者嘔吐且意識下降，應如何處理？","options":[{"letter":"A","text":"立即求援並評估氣道保護與替代通氣"},{"letter":"B","text":"關警報離開"},{"letter":"C","text":"繼續面罩不處理"},{"letter":"D","text":"餵水"}],"answer":"A","rationale":"嘔吐、意識下降增加吸入風險且可能無法保護氣道。"},{"stem":"NIV治療有效的表現為何？","options":[{"letter":"A","text":"呼吸作功下降且意識、血氣改善"},{"letter":"B","text":"血氧降且心跳快"},{"letter":"C","text":"嗜睡加深"},{"letter":"D","text":"無法耐受面罩"}],"answer":"A","rationale":"呼吸窘迫、氧合及酸鹼趨勢改善可提示療效。"},{"stem":"鼻導管造成耳後發紅，應如何處理？","options":[{"letter":"A","text":"忽略"},{"letter":"B","text":"停止必要氧療"},{"letter":"C","text":"綁更緊"},{"letter":"D","text":"檢查皮膚、調整固定並適當減壓"}],"answer":"D","rationale":"長期鼻導管可能造成壓傷，應減壓並維持必要氧療。"},{"stem":"鼻導管使用者應避免哪項鼻腔照護？","options":[{"letter":"A","text":"評估加濕"},{"letter":"B","text":"檢查黏膜"},{"letter":"C","text":"塗石油類油膏"},{"letter":"D","text":"口腔照護"}],"answer":"C","rationale":"油性產品與氧氣環境有燃燒風險。"},{"stem":"咳嗽造成漏尿，適當護理為何？","options":[{"letter":"A","text":"告知必然不可處理"},{"letter":"B","text":"評估並提供骨盆底訓練或轉介"},{"letter":"C","text":"禁止咳嗽"},{"letter":"D","text":"限制所有液體"}],"answer":"B","rationale":"咳嗽相關尿失禁可評估並採取骨盆底訓練等介入。"},{"stem":"平躺喘加劇應評估何者？","options":[{"letter":"A","text":"體位性呼吸困難及心衰竭等共病"},{"letter":"B","text":"停所有藥"},{"letter":"C","text":"視為正常COPD"},{"letter":"D","text":"只測白天活動"}],"answer":"A","rationale":"端坐呼吸可能提示心衰竭等共病，不能單歸因COPD。"},{"stem":"喘促合併胸痛放射至手臂，應優先考慮何者？","options":[{"letter":"A","text":"只加吸入藥"},{"letter":"B","text":"下次回診再說"},{"letter":"C","text":"急性冠心症等非肺部原因"},{"letter":"D","text":"必然是咳嗽"}],"answer":"C","rationale":"胸痛放射須緊急排除急性冠心症等危急病因。"},{"stem":"COPD患者活動量下降，護理目標較適當為何？","options":[{"letter":"A","text":"避免所有活動"},{"letter":"B","text":"不問患者偏好"},{"letter":"C","text":"永久臥床"},{"letter":"D","text":"安全監測下逐步增加日常活動"}],"answer":"D","rationale":"適度活動與復健可維持功能，需量力及監測。"},{"stem":"COPD患者計畫搭機，護理師應建議何者？","options":[{"letter":"A","text":"氧瓶上機不需確認"},{"letter":"B","text":"所有患者禁飛"},{"letter":"C","text":"行前評估病況、氧氣需求及設備安排"},{"letter":"D","text":"停用吸入藥"}],"answer":"C","rationale":"飛行可能加重低氧，需事先評估並確認航空及設備規定。"},{"stem":"氧氣設備附近有室內吸菸，正確衛教為何？","options":[{"letter":"A","text":"關氧即可旁吸"},{"letter":"B","text":"開窗即安全"},{"letter":"C","text":"包布就能防火"},{"letter":"D","text":"氧氣環境與設備周遭嚴禁吸菸及明火"}],"answer":"D","rationale":"氧氣助燃，患者及家人都須遠離設備吸菸或用火。"},{"stem":"氧氣管線跨越走道，應如何處理？","options":[{"letter":"A","text":"繞樓梯扶手"},{"letter":"B","text":"赤腳跨越"},{"letter":"C","text":"埋在地毯下"},{"letter":"D","text":"整理固定管線並保持通道暢通"}],"answer":"D","rationale":"管線可能造成跌倒，需整理動線並妥善固定。"},{"stem":"何種狀況需立即求助？","options":[{"letter":"A","text":"休息即緩解的輕喘"},{"letter":"B","text":"嚴重喘、發紺、意識改變或救援藥無效"},{"letter":"C","text":"痰量如常"},{"letter":"D","text":"短暫打噴嚏"}],"answer":"B","rationale":"嚴重喘、發紺、意識變化及救援藥無效是急症警訊。"},{"stem":"書面自我管理計畫的主要目的為何？","options":[{"letter":"A","text":"辨識症狀變化並依指示分級行動"},{"letter":"B","text":"自行診斷所有疾病"},{"letter":"C","text":"可自行停藥"},{"letter":"D","text":"取代回診"}],"answer":"A","rationale":"行動計畫協助辨識穩定、惡化與急症，並依預定指示求助。"},{"stem":"因害怕喘而不敢外出，護理師宜如何協助？","options":[{"letter":"A","text":"只給鎮靜藥"},{"letter":"B","text":"停止社交"},{"letter":"C","text":"評估焦慮與活動限制，支持並轉介復健資源"},{"letter":"D","text":"不處理焦慮"}],"answer":"C","rationale":"焦慮可能與喘互相加重，需支持、呼吸技巧及復健等整合照護。"},{"stem":"喘時平穩引導呼吸的目的為何？","options":[{"letter":"A","text":"強迫快速呼吸"},{"letter":"B","text":"取代評估"},{"letter":"C","text":"減少恐慌並協助控制呼吸節奏"},{"letter":"D","text":"取代氧療"}],"answer":"C","rationale":"平穩陪伴可降低恐慌，但不能替代必要治療。"},{"stem":"患者未規律使用維持吸入劑，護理師先了解何者？","options":[{"letter":"A","text":"藥物理解、技巧、可近性及副作用疑慮"},{"letter":"B","text":"共用藥物"},{"letter":"C","text":"取消處方"},{"letter":"D","text":"先責備"}],"answer":"A","rationale":"找出未使用原因才能提供對應教育或資源。"},{"stem":"患者認為維持藥不用每天用，應如何衛教？","options":[{"letter":"A","text":"停救援藥"},{"letter":"B","text":"所有藥只在最喘時用"},{"letter":"C","text":"維持藥依處方規律使用，與救援藥用途不同"},{"letter":"D","text":"每月用一次"}],"answer":"C","rationale":"維持藥和救援藥用途不同，依處方規律使用。"},{"stem":"吸入器存放於高溫車內，應提醒何者？","options":[{"letter":"A","text":"全部冷凍"},{"letter":"B","text":"依產品說明保存並避免不適當高溫"},{"letter":"C","text":"高溫增效"},{"letter":"D","text":"溫度無影響"}],"answer":"B","rationale":"保存條件因產品而異，應依仿單避免高溫等不當環境。"},{"stem":"疲倦但血氧接近平日，仍喘促，應如何處理？","options":[{"letter":"A","text":"任意加氧"},{"letter":"B","text":"不問症狀"},{"letter":"C","text":"判定無事"},{"letter":"D","text":"評估呼吸作功、症狀與其他原因"}],"answer":"D","rationale":"血氧不能完整代表通氣與呼吸作功，需整合評估。"},{"stem":"痰量、顏色及黏稠度評估的意義為何？","options":[{"letter":"A","text":"看髮型"},{"letter":"B","text":"看鞋碼"},{"letter":"C","text":"無臨床用途"},{"letter":"D","text":"比較基線變化以判斷感染或分泌物負荷"}],"answer":"D","rationale":"痰液特性及改變有助評估感染與急性惡化。"},{"stem":"冷空氣使喘加劇，可建議何者？","options":[{"letter":"A","text":"用明火加熱氧氣"},{"letter":"B","text":"以圍巾遮護口鼻並避免直接吸冷空氣"},{"letter":"C","text":"永久不外出"},{"letter":"D","text":"寒風快走"}],"answer":"B","rationale":"遮護口鼻及減少冷空氣刺激可降低症狀誘發。"},{"stem":"清潔劑氣味引發喘促，衛教何者適當？","options":[{"letter":"A","text":"加香氛掩蓋"},{"letter":"B","text":"停維持藥"},{"letter":"C","text":"減少揮發物暴露並保持適當通風"},{"letter":"D","text":"密閉漂白水"}],"answer":"C","rationale":"刺激性氣味可能加重氣道症狀，應減少暴露及通風。"}]},{"title":"Asthma（氣喘）","questions":[{"stem":"氣喘的核心病理為何？","options":[{"letter":"A","text":"肺血管阻塞"},{"letter":"B","text":"慢性氣道發炎與可變性氣流受限"},{"letter":"C","text":"胸膜積液"},{"letter":"D","text":"不可逆肺泡塌陷"}],"answer":"B","rationale":"氣喘具氣道發炎、高反應性及可變性氣流受限。"},{"stem":"冷空氣誘發短暫咳喘，反映何種特性？","options":[{"letter":"A","text":"必有感染"},{"letter":"B","text":"只在夜間發作"},{"letter":"C","text":"症狀會變動"},{"letter":"D","text":"必然持續惡化"}],"answer":"C","rationale":"氣喘症狀可隨時間及誘因變化。"},{"stem":"氣喘呼氣時喘鳴明顯的主因？","options":[{"letter":"A","text":"胸水增加"},{"letter":"B","text":"肺泡破裂"},{"letter":"C","text":"狹窄氣道呼氣時更易受壓"},{"letter":"D","text":"膈肌痙攣"}],"answer":"C","rationale":"呼氣時狹窄氣道受胸腔內壓影響，氣流受限加重。"},{"stem":"支氣管平滑肌收縮的直接結果？","options":[{"letter":"A","text":"氣道變窄、阻力增加"},{"letter":"B","text":"胸膜壓降低"},{"letter":"C","text":"肺泡順應性增加"},{"letter":"D","text":"血氧必然上升"}],"answer":"A","rationale":"支氣管收縮使氣道管徑縮小。"},{"stem":"黏膜水腫及黏液增加會造成何者？","options":[{"letter":"A","text":"氣道阻塞加重"},{"letter":"B","text":"心輸出量增加"},{"letter":"C","text":"呼吸功下降"},{"letter":"D","text":"肺泡通氣必然改善"}],"answer":"A","rationale":"水腫、黏液與收縮共同加重氣道阻塞。"},{"stem":"氣道高反應性意指何者？","options":[{"letter":"A","text":"只對細菌反應"},{"letter":"B","text":"氣道固定閉塞"},{"letter":"C","text":"肺泡無法交換氧氣"},{"letter":"D","text":"對刺激產生過度收縮反應"}],"answer":"D","rationale":"患者對刺激物或運動可出現過強的支氣管反應。"},{"stem":"症狀間歇時氣道發炎可能如何？","options":[{"letter":"A","text":"仍可能存在"},{"letter":"B","text":"必然轉為感染"},{"letter":"C","text":"一定完全消失"},{"letter":"D","text":"代表肺泡塌陷"}],"answer":"A","rationale":"無症狀不代表慢性發炎完全消失。"},{"stem":"呼氣不完全可能造成何種變化？","options":[{"letter":"A","text":"空氣滯留"},{"letter":"B","text":"殘氣量下降"},{"letter":"C","text":"胸水"},{"letter":"D","text":"通氣必然增加"}],"answer":"A","rationale":"氣流受限可造成空氣滯留及過度充氣。"},{"stem":"胸部X光正常如何解讀？","options":[{"letter":"A","text":"確診肺癌"},{"letter":"B","text":"氣喘胸片可能無特殊異常"},{"letter":"C","text":"排除氣喘"},{"letter":"D","text":"肺功能必正常"}],"answer":"B","rationale":"胸片通常無氣喘特異表現，常用於鑑別其他問題。"},{"stem":"何者最可能造成症狀變動？","options":[{"letter":"A","text":"誘因暴露與發炎程度改變"},{"letter":"B","text":"紅血球壽命"},{"letter":"C","text":"瓣膜狹窄"},{"letter":"D","text":"固定胸廓形狀"}],"answer":"A","rationale":"誘因與發炎變化會使症狀及氣流受限起伏。"},{"stem":"患者夜間因咳嗽喘醒，應如何評估？","options":[{"letter":"A","text":"納入控制狀況評估"},{"letter":"B","text":"停掉控制藥"},{"letter":"C","text":"只評估白天活動"},{"letter":"D","text":"視為正常不追蹤"}],"answer":"A","rationale":"夜間覺醒提示可能控制不佳。"},{"stem":"爬樓梯比平日容易喘，優先追問？","options":[{"letter":"A","text":"近視狀況"},{"letter":"B","text":"活動受限及變化"},{"letter":"C","text":"家具顏色"},{"letter":"D","text":"飲水品牌"}],"answer":"B","rationale":"活動耐受度改變可反映控制狀況。"},{"stem":"昨夜嚴重喘醒，今日無喘鳴，宜如何？","options":[{"letter":"A","text":"評估近期症狀與用藥"},{"letter":"B","text":"排除氣喘"},{"letter":"C","text":"判定控制良好"},{"letter":"D","text":"不需追蹤"}],"answer":"A","rationale":"單次聽診不能取代近期症狀與治療評估。"},{"stem":"急性患者只能說單字，代表？","options":[{"letter":"A","text":"氣道已擴張"},{"letter":"B","text":"可能嚴重呼吸窘迫"},{"letter":"C","text":"可返家"},{"letter":"D","text":"藥物已起效"}],"answer":"B","rationale":"說話受限是嚴重呼吸困難警訊，需立即處置。"},{"stem":"嗜睡且呼吸音變弱，最需懷疑？","options":[{"letter":"A","text":"病情改善"},{"letter":"B","text":"單純鼻塞"},{"letter":
