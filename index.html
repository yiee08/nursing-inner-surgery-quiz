},{"letter":"C","text":"依處方按時服用且不與他人共用"},{"letter":"D","text":"症狀好轉時立即停用剩餘藥物"}],"rationale":"抗生素應依處方使用，不自行停藥、加倍或分享；療程問題應詢問醫療人員。","stem":"肺炎病人返家後仍須完成抗生素療程，護理師如何說明用藥方式？"},{"answer":"C","options":[{"letter":"A","text":"下一次服用雙倍劑量補回"},{"letter":"B","text":"借用家人的相同藥物立即補服"},{"letter":"C","text":"依該藥品指示處理，勿自行加倍"},{"letter":"D","text":"停掉後續療程並等待症狀復發"}],"rationale":"漏服處理方式依藥品及距離下次服藥時間而異，應依藥品指示或詢問藥事人員，勿自行加倍。","stem":"肺炎病人表示忘記服用一次抗生素，護理師應如何指導？"},{"answer":"A","options":[{"letter":"A","text":"聯絡醫療人員評估，若腫脹或呼吸困難立即求救"},{"letter":"B","text":"不需理會，照原方式持續服用"},{"letter":"C","text":"自行加量以快速控制皮疹"},{"letter":"D","text":"將藥物轉給家人確認是否也會出疹"}],"rationale":"新發皮疹需評估可能藥物反應；若合併腫脹或呼吸困難，應視為急症立即求援。","stem":"肺炎病人服藥後出現新發皮疹，護理師的建議何者最適當？"},{"answer":"A","options":[{"letter":"A","text":"藥物過敏及肝腎疾病等重要病史"},{"letter":"B","text":"最近的髮型、鞋碼及飲食喜好"},{"letter":"C","text":"睡眠時間、慣用手及居家照明"},{"letter":"D","text":"是否偏好錠劑顏色及包裝形式"}],"rationale":"藥物過敏及肝腎疾病可能影響抗生素安全與劑量，應於用藥前確認並記錄。","stem":"肺炎病人將開始使用抗生素，護理師詢問用藥史時，何種病史應特別確認？"},{"answer":"C","options":[{"letter":"A","text":"為避免交互作用應自行停掉抗生素"},{"letter":"B","text":"不同品牌成藥可不查成分直接併用"},{"letter":"C","text":"先核對成分及可能交互作用再併用"},{"letter":"D","text":"只要是非處方藥就沒有交互作用"}],"rationale":"成藥可能含重複成分或與處方藥交互作用，應先核對並諮詢醫療或藥事人員。","stem":"肺炎病人自行服用成藥並使用處方抗生素，護理師應提醒何者？"},{"answer":"D","options":[{"letter":"A","text":"留存至下次咳嗽時自行服用"},{"letter":"B","text":"沖入飲水中供家人共同使用"},{"letter":"C","text":"分享給有相似症狀的親友"},{"letter":"D","text":"依藥事人員建議安全處置剩餘藥物"}],"rationale":"剩餘抗生素不可自行留用或分享，應依藥事人員或藥品回收規範安全處置。","stem":"肺炎病人完成療程後仍有剩餘抗生素，護理師應如何指導？"},{"answer":"C","options":[{"letter":"A","text":"不論情況一律立即重複服用"},{"letter":"B","text":"改服他人藥物補足原劑量"},{"letter":"C","text":"先詢問醫療或藥事人員，不自行重複服藥"},{"letter":"D","text":"自行停掉剩餘療程以免再嘔吐"}],"rationale":"是否補服需考量藥物種類及嘔吐時間，應先詢問醫療或藥事人員以避免重複給藥。","stem":"肺炎病人服用抗生素後不久嘔吐，詢問是否應立刻補服一劑，護理師應如何回應？"},{"answer":"B","options":[{"letter":"A","text":"不評估即可在同一處追加藥物"},{"letter":"B","text":"評估靜脈通路並依機構規範處理"},{"letter":"C","text":"忽略局部症狀並提高輸注速度"},{"letter":"D","text":"按摩紅腫處後維持原輸注"}],"rationale":"紅腫痛可能提示靜脈炎或外滲，須評估通路並依規範處理，不能忽略或加快輸注。","stem":"肺炎病人接受靜脈抗生素，輸液處出現紅、腫及疼痛，護理師應如何處理？"},{"answer":"A","options":[{"letter":"A","text":"停止可疑輸注並立即緊急評估"},{"letter":"B","text":"請病人步行以改善喘促"},{"letter":"C","text":"僅記錄皮膚顏色並等待輸注結束"},{"letter":"D","text":"加快輸注以盡快完成療程"}],"rationale":"輸注中喘鳴及潮紅可能是急性過敏反應，應停止可疑輸注並立即評估及通報。","stem":"肺炎病人輸注抗生素時出現喘鳴及潮紅，護理師應採取何種優先處置？"},{"answer":"B","options":[{"letter":"A","text":"正常輸液反應，不需檢查呼吸"},{"letter":"B","text":"可能容量過多，需評估並通報"},{"letter":"C","text":"已證明感染完全控制可停止評估"},{"letter":"D","text":"單純因食慾增加造成的暫時不適"}],"rationale":"呼吸困難、頸靜脈怒張與水腫可能提示容量過多，需立即評估循環與呼吸並回報。","stem":"肺炎病人輸液中出現呼吸困難、頸靜脈怒張及周邊水腫，護理師應考慮何種狀況？"},{"answer":"A","options":[{"letter":"A","text":"依個別限水計畫安排液體攝取"},{"letter":"B","text":"只要口乾即可自行取消限水"},{"letter":"C","text":"為稀釋痰液不受限制地大量飲水"},{"letter":"D","text":"停止所有口服藥物以減少液體攝取"}],"rationale":"補水建議須配合心衰竭及個別限水醫囑，不能一概大量飲水或自行取消限制。","stem":"肺炎病人合併心衰竭且有醫囑限制水分，護理師提供補水建議時何者適當？"},{"answer":"C","options":[{"letter":"A","text":"判斷為感染痊癒而停止追蹤"},{"letter":"B","text":"僅檢查視力，不需詢問尿量"},{"letter":"C","text":"水分狀態及輸入輸出情形"},{"letter":"D","text":"只觀察食慾，不需評估口腔"}],"rationale":"口乾、深色尿及發燒可能與水分不足有關，應評估水分狀態及輸入輸出。","stem":"肺炎病人發燒，主訴口乾且尿液顏色較深，護理師應進一步評估何者？"},{"answer":"D","options":[{"letter":"A","text":"將尿量減少視為正常且不需回報"},{"letter":"B","text":"立即要求病人自行停用所有藥物"},{"letter":"C","text":"只詢問病人是否喜歡喝水"},{"letter":"D","text":"先核對輸出紀錄並評估灌流與腎功能"}],"rationale":"尿量減少須先確認紀錄與輸出，再評估灌流、水分及腎功能，並依整體狀況處理。","stem":"肺炎病人尿量較前減少，護理師首先應如何評估？"},{"answer":"B","options":[{"letter":"A","text":"離開病室讓病人自行平靜"},{"letter":"B","text":"陪伴並以簡短平穩語句引導，同時處理呼吸"},{"letter":"C","text":"快速連續提問以便一次完成評估"},{"letter":"D","text":"要求病人停止呼吸困難的主訴"}],"rationale":"陪伴及簡短平穩溝通可降低焦慮負荷，同時仍須優先評估及處理呼吸問題。","stem":"肺炎病人喘促且焦慮，護理師與其溝通時何種方式較適當？"},{"answer":"D","options":[{"letter":"A","text":"視為情緒問題，待病人自行休息"},{"letter":"B","text":"只記錄主訴，延後至例行查房"},{"letter":"C","text":"鼓勵連續說話以測試耐力"},{"letter":"D","text":"可能呼吸窘迫，立即評估並尋求協助"}],"rationale":"說話受限表示呼吸負荷可能增加，是呼吸窘迫警訊，需立即評估並求援。","stem":"肺炎病人喘到無法說完整句子，護理師應如何判斷及處理？"},{"answer":"A","options":[{"letter":"A","text":"呼吸作功增加，需持續評估病況"},{"letter":"B","text":"屬於正常呼吸，不必監測"},{"letter":"C","text":"代表呼吸肌正在進行有效訓練"},{"letter":"D","text":"表示氧合穩定，可停止觀察"}],"rationale":"使用輔助呼吸肌反映呼吸作功增加，可能是呼吸窘迫徵象，須持續評估。","stem":"肺炎病人呼吸時明顯使用輔助呼吸肌，護理師應如何解讀？"},{"answer":"A","options":[{"letter":"A","text":"警覺呼吸衰竭或疲乏並立即求援"},{"letter":"B","text":"視為病情改善並停止呼吸監測"},{"letter":"C","text":"讓病人獨自休息，稍後再查看"},{"letter":"D","text":"等交班時再將變化告知下一班"}],"rationale":"呼吸變慢合併意識變差可能是呼吸肌疲乏或呼吸衰竭，不能誤認為改善，須立即求援。","stem":"肺炎病人原本呼吸急促，後來呼吸變慢且意識變差，護理師應採取何種行動？"},{"answer":"C","options":[{"letter":"A","text":"只依氧氣流量下降判斷完全痊癒"},{"letter":"B","text":"病人表示舒服即可立即停氧"},{"letter":"C","text":"整體狀況穩定且氧合達個別目標"},{"letter":"D","text":"不再測量血氧以免造成焦慮"}],"rationale":"氧氣需求下降須配合整體臨床穩定及氧合達個別目標判斷，不能只因流量下降就停氧。","stem":"肺炎病人氧氣需求較先前減少，護理師判斷是否改善時應依據何者？"},{"answer":"C","options":[{"letter":"A","text":"先判定設備故障，不必查看病人"},{"letter":"B","text":"等下一班護理師接手再處理"},{"letter":"C","text":"評估病人及供氧設備並立即通報"},{"letter":"D","text":"自行調至最大流量後離開病室"}],"rationale":"氧氣需求突增可能代表病情惡化或設備問題，應同時評估病人與設備並立即通報。","stem":"肺炎病人氧氣需求突然增加，護理師最適當的處理方式為何？"},{"answer":"C","options":[{"letter":"A","text":"床單顏色及窗簾開合方向"},{"letter":"B","text":"病人餐具是否已清洗"},{"letter":"C","text":"氧氣導管位置、連接狀況及氣源供應"},{"letter":"D","text":"病室牆面裝飾是否移位"}],"rationale":"確認導管位置、連接及氧源可排查供氧中斷，但仍須同步評估病人狀況。","stem":"肺炎病人血氧偏低，護理師初步檢查氧療設備時應先確認何者？"},{"answer":"B","options":[{"letter":"A","text":"只會出現喉部閉合聲音"},{"letter":"B","text":"實變區可聽到支氣管呼吸音"},{"letter":"C","text":"腸蠕動音取代所有肺部聲音"},{"letter":"D","text":"必定聽到完全正常的呼吸音"}],"rationale":"肺實變可改變聲音傳導，使原本較少在周邊聽到的支氣管呼吸音變得明顯。","stem":"肺炎病人影像顯示肺實變，聽診時可能出現何種呼吸音改變？"},{"answer":"B","options":[{"letter":"A","text":"胃泡氣體傳至胸腔造成濁音"},{"letter":"B","text":"肺實變或胸腔積液使組織密度增加"},{"letter":"C","text":"肺部過度充氣造成共鳴增加"},{"letter":"D","text":"外耳道積液造成胸部叩診改變"}],"rationale":"肺實變或胸水會增加局部密度，可能出現叩診濁音，仍需配合其他檢查判斷。","stem":"肺炎病人肺部叩診出現濁音，護理師應考慮何種可能？"},{"answer":"A","options":[{"letter":"A","text":"配合影像檢查並結合臨床評估"},{"letter":"B","text":"只依痰液顏色確認胸水存在"},{"letter":"C","text":"不需評估，等待症狀自行消失"},{"letter":"D","text":"僅詢問視力變化即可確認診斷"}],"rationale":"影像檢查可協助確認胸水，仍須與症狀、理學檢查及臨床狀況合併判讀。","stem":"肺炎病人疑有胸水，護理師應如何協助進一步評估？"},{"answer":"C","options":[{"letter":"A","text":"身高變化及視力是否清晰"},{"letter":"B","text":"食慾改變及最近一次理髮時間"},{"letter":"C","text":"呼吸狀況、穿刺處及氣胸徵象"},{"letter":"D","text":"是否偏好不同床單顏色"}],"rationale":"胸腔穿刺後應觀察呼吸變化、穿刺處出血或滲液，以及氣胸等併發症徵象。","stem":"肺炎病人接受胸腔穿刺後，護理師應優先觀察哪些狀況？"},{"answer":"B","options":[{"letter":"A","text":"增加呼吸困難以測試肺功能"},{"letter":"B","text":"協助病人安全穩定並配合操作"},{"letter":"C","text":"使病人軀幹不穩以便快速定位"},{"letter":"D","text":"直接以身體重量壓迫預定穿刺處"}],"rationale":"正確姿勢有助維持病人穩定並配合操作，應兼顧安全、舒適及呼吸狀況。","stem":"護理師協助肺炎病人準備胸腔穿刺姿勢，主要目的為何？"},{"answer":"C","options":[{"letter":"A","text":"使用同房病人姓名避免漏寫"},{"letter":"B","text":"不需標示，檢驗室可自行推測"},{"letter":"C","text":"正確病人身分及檢體種類等必要資料"},{"letter":"D","text":"只寫病床號即可辨識檢體"}],"rationale":"檢體須以正確病人身分及檢體種類等規定資料標示，確保辨識與檢驗結果正確。","stem":"護理師送驗肺炎病人的檢體，標示時最重要的內容為何？"},{"answer":"B","options":[{"letter":"A","text":"所有檢查皆須固定禁食相同時間"},{"letter":"B","text":"依檢查種類及醫囑確認準備要求"},{"letter":"C","text":"不需準備，直接依原飲食進行"},{"letter":"D","text":"一律停止所有常規藥物與飲水"}],"rationale":"禁食及其他準備要求依檢查種類與醫囑而異，不應一概而論或自行停藥。","stem":"肺炎病人準備接受檢查，家屬詢問是否需要禁食，護理師應如何確認？"},{"answer":"A","options":[{"letter":"A","text":"核對禁食狀況、同意程序及呼吸基線"},{"letter":"B","text":"不必確認檢查同意或生命徵象"},{"letter":"C","text":"略過呼吸評估以避免病人緊張"},{"letter":"D","text":"先提供餐點並不需詢問過敏史"}],"rationale":"術前依流程確認禁食、同意及呼吸基線等，可協助掌握風險與檢查前狀態。","stem":"肺炎病人預定接受支氣管鏡檢查，護理師術前準備何者較完整？"},{"answer":"C","options":[{"letter":"A","text":"立即給水測試吞嚥是否正常"},{"letter":"B","text":"催促病人快速吞嚥恢復反射"},{"letter":"C","text":"暫緩口服並持續觀察呼吸狀況"},{"letter":"D","text":"平躺餵食以避免疲倦"}],"rationale":"咽喉麻醉未退、咽反射未恢復時口服可能造成吸入，應暫緩口服並觀察呼吸。","stem":"肺炎病人支氣管鏡檢查後咽反射尚未恢復，護理師應如何照護？"},{"answer":"B","options":[{"letter":"A","text":"請病人自行休息，不需再評估"},{"letter":"B","text":"立即評估呼吸並通報醫療團隊"},{"letter":"C","text":"視為常見反應，隔日再記錄"},{"letter":"D","text":"提供大量食物補充體力"}],"rationale":"檢查後喘促惡化可能與出血、氣胸或其他併發症有關，須立即評估並通報。","stem":"肺炎病人支氣管鏡檢查後喘促明顯惡化，護理師應採取何項措施？"},{"answer":"D","options":[{"letter":"A","text":"抵達檢查室後才重新連接氧氣"},{"letter":"B","text":"不需交接氧療需求及病況"},{"letter":"C","text":"讓病人自行搬運氧氣鋼瓶"},{"letter":"D","text":"確認供氧與必要監測全程不中斷"}],"rationale":"轉送過程須維持供氧及必要監測連續，並確認設備與交接，以避免途中照護中斷。","stem":"肺炎病人需使用氧氣轉送影像檢查，護理師應如何確保照護安全？"},{"answer":"C","options":[{"letter":"A","text":"隱瞞當班發生的呼吸變化"},{"letter":"B","text":"只描述衣著，不需交代治療狀況"},{"letter":"C","text":"氧氣需求、呼吸趨勢、治療反應及待辦事項"},{"letter":"D","text":"病人床號及午餐偏好即可"}],"rationale":"氧氣需求、呼吸變化、治療反應與待辦事項是交班評估的重要資訊，有助及時延續照護。","stem":"肺炎病人交班時，護理師應優先傳達哪些資訊以維持照護連續？"},{"answer":"C","options":[{"letter":"A","text":"自行停用抗生素並觀察一日"},{"letter":"B","text":"加厚被褥後不再測量生命徵象"},{"letter":"C","text":"評估生命徵象及感染變化並回報"},{"letter":"D","text":"等出院時再告知醫療團隊"}],"rationale":"新發寒顫發燒可能代表感染變化，應評估生命徵象及整體狀況並回報，不可自行停藥。","stem":"肺炎病人突然出現寒顫及發燒，護理師應採取何種處置？"},{"answer":"B","options":[{"letter":"A","text":"停止監測以免增加病人焦慮"},{"letter":"B","text":"持續評估整體狀況，不以退燒單獨判改善"},{"letter":"C","text":"立即取消所有已安排的治療"},{"letter":"D","text":"退燒即代表痊癒，可停止所有觀察"}],"rationale":"體溫下降不代表呼吸與循環狀況已恢復，仍需追蹤呼吸急促、心搏及其他臨床表現。","stem":"肺炎病人退燒後仍呼吸急促且心跳加快，護理師應如何判斷？"},{"answer":"A","options":[{"letter":"A","text":"降低口腔菌量並維持口腔清潔"},{"letter":"B","text":"完全取代吞嚥功能評估及安全進食措施"},{"letter":"C","text":"使所有類型肺炎立即痊癒"},{"letter":"D","text":"取代照護前後手部衛生"}],"rationale":"口腔照護可降低口腔菌量、維持清潔，但不能取代吞嚥評估、感染預防或其他治療措施。","stem":"護理師為有吸入風險的肺炎病人執行口腔照護，其預防感染的主要作用為何？"}]},{"title":"肺結核","questions":[{"answer":"B","options":[{"letter":"A","text":"黴漿菌引起非典型肺炎"},{"letter":"B","text":"結核分枝桿菌造成慢性感染"},{"letter":"C","text":"肺炎鏈球菌感染肺泡所致"},{"letter":"D","text":"流感病毒持續侵犯呼吸道"}],"rationale":"肺結核的病原為結核分枝桿菌，其他選項為不同呼吸道病原。","stem":"痰培養確認患者感染肺結核，最可能的致病菌為何？"},{"answer":"C","options":[{"letter":"A","text":"握手接觸患者皮膚造成感染"},{"letter":"B","text":"蚊蟲叮咬後將病原帶入血液"},{"letter":"C","text":"吸入患者咳嗽散出的感染性飛沫核"},{"letter":"D","text":"主要因共用餐具而經消化道傳染"}],"rationale":"肺結核主要經空氣傳播，吸入感染性微粒是關鍵途徑，並非一般接觸或共餐。","stem":"護理師向新確診肺結核患者說明傳染方式，何者最正確？"},{"answer":"D","options":[{"letter":"A","text":"與患者使用相同清潔衣物"},{"letter":"B","text":"短暫在戶外與患者握手交談"},{"letter":"C","text":"在通風餐廳與患者一同用餐"},{"letter":"D","text":"長時間同處通風不良的患者房間"}],"rationale":"長時間暴露於通風差且有傳染性患者的空間風險較高；空氣流通與暴露時間是重要因素。","stem":"家屬詢問何種照護情境較可能增加肺結核暴露風險，何者適當？"},{"answer":"A","options":[{"letter":"A","text":"免疫細胞聚集形成肉芽腫"},{"letter":"B","text":"局部血管形成血栓阻斷菌體"},{"letter":"C","text":"組織形成水泡隔開病原"},{"letter":"D","text":"脂肪栓塞封閉感染區域"}],"rationale":"結核感染常形成肉芽腫以包圍、限制病原；血栓、水泡與脂肪栓塞不是此種免疫結構。","stem":"護理師解釋結核感染的免疫反應，何種結構可包圍並限制病原？"},{"answer":"A","options":[{"letter":"A","text":"細胞壁富含分枝菌酸等脂質"},{"letter":"B","text":"菌體具有可自行移動的鞭毛"},{"letter":"C","text":"菌體缺少完整細胞膜構造"},{"letter":"D","text":"細菌能形成耐熱休眠孢子"}],"rationale":"富含分枝菌酸的脂質細胞壁使結核菌具有抗酸性，並非鞭毛或孢子所致。","stem":"檢驗人員說明結核分枝桿菌可抗酸染色，其主要原因為何？"},{"answer":"C","options":[{"letter":"A","text":"優先追查餐後腹瀉及飲食感染"},{"letter":"B","text":"先以鼻塞及短暫耳痛作診斷"},{"letter":"C","text":"先評估慢性呼吸與全身結核症狀"},{"letter":"D","text":"以突發皮疹判定呼吸道感染"}],"rationale":"慢性咳嗽、盜汗及體重下降是肺結核常見的呼吸與全身表現，需進一步評估。","stem":"一名患者持續咳嗽數週，合併夜間盜汗及體重減輕，最應考慮何種評估？"},{"answer":"D","options":[{"letter":"A","text":"先給止咳藥並留在一般候診區"},{"letter":"B","text":"等待胸片結果後再採取防護"},{"letter":"C","text":"先讓患者與多人共用候診空間"},{"letter":"D","text":"安排空氣防護並儘速評估結核可能"}],"rationale":"疑似肺結核應先降低候診區暴露並進行評估，不應等檢查結果才採取防護。","stem":"急診候診者咳嗽數週且體重下降，護理師尚未完成評估，優先措施為何？"},{"answer":"D","options":[{"letter":"A","text":"暫留走廊病床等待檢查完成"},{"letter":"B","text":"安排護理站旁單人病床觀察"},{"letter":"C","text":"安排一般多人病室並加床簾"},{"letter":"D","text":"安排負壓隔離病室並依流程照護"}],"rationale":"疑似具傳染性肺結核應採空氣隔離，負壓病室可降低污染空氣外逸。","stem":"住院患者疑似具傳染性肺結核，適當的病室安置為何？"},{"answer":"B","options":[{"letter":"A","text":"佩戴手套並以外科口罩防護"},{"letter":"B","text":"佩戴合適密合的N95或更高等級呼吸器"},{"letter":"C","text":"僅佩戴手套並維持適當距離"},{"letter":"D","text":"佩戴護目鏡並以布口罩遮住口鼻"}],"rationale":"空氣防護需使用合適密合的N95或更高等級呼吸器；手套或一般口罩不能取代。","stem":"護理師需進入疑似肺結核患者病室執行照護，應佩戴何者？"},{"answer":"A","options":[{"letter":"A","text":"患者戴外科口罩並縮短離室停留時間"},{"letter":"B","text":"患者留在走廊等待排程避免打擾病室"},{"letter":"C","text":"護理師戴手套即可讓患者不戴口罩"},{"letter":"D","text":"讓患者咳嗽時暫時取下口罩透氣"}],"rationale":"離室時患者戴外科口罩可減少感染性微粒散出，並應減少停留與暴露。","stem":"隔離中的肺結核患者需離室接受檢查，何種安排較適當？"},{"answer":"B","options":[{"letter":"A","text":"多人病室內床邊直接咳痰"},{"letter":"B","text":"通風良好的指定採檢處"},{"letter":"C","text":"護理站旁以便立即交接檢體"},{"letter":"D","text":"門窗關閉的小型處置室"}],"rationale":"咳痰可能產生感染性氣溶膠，應在通風良好的指定處採集，而非多人病室或密閉空間。","stem":"護理師安排疑似肺結核患者採集痰液，何處最合適？"},{"answer":"C","options":[{"letter":"A","text":"工作人員僅需手套即可執行檢查"},{"letter":"B","text":"由家屬近距離陪同即可降低暴露"},{"letter":"C","text":"此檢查可能產生氣溶膠，依空氣防護流程安排"},{"letter":"D","text":"檢查前解除空氣隔離以方便移動"}],"rationale":"支氣管鏡可能增加氣溶膠暴露，須依空氣防護及相關流程安排；不得因檢查而任意解除隔離。","stem":"疑似肺結核患者將接受支氣管鏡檢查，護理師應特別注意何事？"},{"answer":"A","options":[{"letter":"A","text":"身體對結核抗原的免疫反應"},{"letter":"B","text":"結核藥物在血中的濃度"},{"letter":"C","text":"肺部病灶大小與疾病嚴重程度"},{"letter":"D","text":"痰液中結核菌的實際數量"}],"rationale":"TST評估對結核抗原的細胞性免疫反應，不能單獨判定活動性肺結核。","stem":"接觸者接受結核菌素皮膚試驗（TST），護理師說明此試驗主要評估何者？"},{"answer":"A","options":[{"letter":"A","text":"依規定於施打後48至72小時判讀"},{"letter":"B","text":"施打後立即觀察注射處反應"},{"letter":"C","text":"施打後一週再測量反應範圍"},{"letter":"D","text":"等一個月後再由醫師評估"}],"rationale":"TST通常於施打後48至72小時判讀，過早或過晚都不符合標準判讀時程。","stem":"患者接受TST後詢問何時回院判讀，護理師應如何說明？"},{"answer":"B","options":[{"letter":"A","text":"注射處紅斑的最大直徑"},{"letter":"B","text":"可觸及硬結的橫向直徑"},{"letter":"C","text":"局部瘀青的面積大小"},{"letter":"D","text":"上臂整體周徑變化"}],"rationale":"TST依硬結而非紅斑判讀，測量硬結直徑是關鍵鑑別點。","stem":"護理師判讀TST局部反應時，應記錄測量何者？"},{"answer":"C","options":[{"letter":"A","text":"可直接取代痰液培養檢查"},{"letter":"B","text":"可直接確定肺部空洞病灶"},{"letter":"C","text":"通常較不受BCG接種影響"},{"letter":"D","text":"可單獨判定患者的傳染力"}],"rationale":"IGRA通常不受BCG接種影響，但陽性仍不能區分潛伏感染與活動性結核。","stem":"曾接種BCG的接觸者需檢查潛伏結核感染，與TST相比IGRA的優點為何？"},{"answer":"C","options":[{"letter":"A","text":"先自行開始多種抗結核藥物"},{"letter":"B","text":"不需追蹤，因為沒有咳嗽症狀"},{"letter":"C","text":"評估症狀並安排影像等檢查排除活動病"},{"letter":"D","text":"告知已確診具傳染性的活動性結核"}],"rationale":"IGRA陽性不能區分潛伏與活動性結核，應評估症狀並以影像等方式排除活動性疾病。","stem":"一名無症狀者IGRA陽性，護理師協助後續評估時何者適當？"},{"answer":"D","options":[{"letter":"A","text":"影像異常可直接確定結核菌藥物敏感性"},{"letter":"B","text":"胸片可以直接辨認痰液中的病原菌"},{"letter":"C","text":"胸片異常代表患者必然具有傳染性"},{"letter":"D","text":"影像可支持評估但不能單獨確診結核"}],"rationale":"胸部影像可支持診斷及評估病灶，但需合併臨床與微生物檢查，不能單獨確診或判藥敏。","stem":"患者胸部X光出現疑似結核病灶，護理師說明影像檢查的角色何者正確？"},{"answer":"B","options":[{"letter":"A","text":"表示抗結核療程已經完成"},{"letter":"B","text":"顯示有抗酸菌，仍需確認菌種"},{"letter":"C","text":"表示菌株已確認且必定對藥物敏感"},{"letter":"D","text":"可完全排除非結核分枝桿菌感染"}],"rationale":"抗酸塗片陽性代表檢出抗酸菌，但不能單獨確認結核菌種或藥物敏感性。","stem":"痰液抗酸塗片呈陽性，護理師向患者解釋結果時何者正確？"},{"answer":"B","options":[{"letter":"A","text":"可直接測出肺活量與呼吸儲備"},{"letter":"B","text":"可確認病原並提供進一步藥敏檢驗"},{"letter":"C","text":"主要評估服藥態度及配合程度"},{"letter":"D","text":"主要用來測量患者血氧濃度"}],"rationale":"痰培養可確認病原菌並可進行藥物敏感性檢驗，這是其重要診斷價值。","stem":"患者詢問痰液培養相較塗片的用途，護理師應如何說明？"},{"answer":"A","options":[{"letter":"A","text":"可快速偵測菌核酸及部分抗藥性"},{"letter":"B","text":"主要用於評估肺功能變化"},{"letter":"C","text":"可取代所有培養與臨床評估"},{"letter":"D","text":"可保證任何檢體結果絕不出錯"}],"rationale":"分子檢測可快速偵測結核菌核酸及部分抗藥性，但仍須與培養及臨床資料整合。","stem":"醫療團隊安排結核分子快速檢測，護理師對其功能的說明何者恰當？"},{"answer":"A","options":[{"letter":"A","text":"咳出深部下呼吸道痰液至無菌容器"},{"letter":"B","text":"收集後置室溫數日再交檢驗"},{"letter":"C","text":"用紙巾接住痰液後再放入袋中"},{"letter":"D","text":"將口腔唾液吐入容器作為痰液"}],"rationale":"應深咳取得下呼吸道痰液並置無菌容器，唾液品質不佳，檢體須妥善送驗。","stem":"護理師指導患者留取結核痰檢體，何種作法最能取得適當檢體？"},{"answer":"C","options":[{"letter":"A","text":"放在護理站桌面等待下一班交接"},{"letter":"B","text":"交由患者自行帶回家後送驗"},{"letter":"C","text":"密封標示並依規定流程運送"},{"letter":"D","text":"倒入水槽沖洗容器以便回收"}],"rationale":"痰檢體應密封、正確標示並依生物檢體規範運送，以兼顧檢驗品質與安全。","stem":"患者完成痰液採集後，護理師應如何處理檢體？"},{"answer":"D","options":[{"letter":"A","text":"視力變化及眼睛乾澀情形"},{"letter":"B","text":"近期排便型態及腹部不適程度"},{"letter":"C","text":"指甲長度與末梢皮膚完整性"},{"letter":"D","text":"氣道通暢、呼吸狀態與出血量"}],"rationale":"咳血可能影響氣道與氧合，應先評估呼吸狀態及出血程度，再依情況處置。","stem":"肺結核患者告知咳出血絲痰，護理師優先應評估何者？"},{"answer":"C","options":[{"letter":"A","text":"先提供飲食衛教並觀察咳嗽變化"},{"letter":"B","text":"協助步行前往影像檢查室"},{"letter":"C","text":"維持氣道與氧合並立即啟動緊急支援"},{"letter":"D","text":"等待例行巡房再評估呼吸情形"}],"rationale":"大量咳血合併呼吸窘迫是危及生命的急症，優先維持氣道與氧合並啟動支援。","stem":"肺結核患者突然大量咳血並呼吸窘迫，護理師首要處置為何？"},{"answer":"A","options":[{"letter":"A","text":"評估攝取狀況並提供少量多餐"},{"letter":"B","text":"只提供清流質直到咳嗽停止"},{"letter":"C","text":"限制飲水以避免夜間咳嗽"},{"letter":"D","text":"限制蛋白質以減輕消化負擔"}],"rationale":"應先評估營養攝取並以可耐受方式支持營養，少量多餐可協助食慾不佳者增加攝取。","stem":"肺結核患者食慾差且近期體重下降，護理師何種措施較合宜？"},{"answer":"A","options":[{"letter":"A","text":"依症狀耐受安排休息並逐步增加活動"},{"letter":"B","text":"發燒時照常進行高強度運動"},{"letter":"C","text":"不論疲倦程度均要求固定運動量"},{"letter":"D","text":"維持長期絕對臥床避免任何耗能"}],"rationale":"活動安排應配合病況與耐受度，適度休息並逐步活動，避免過度運動或不必要臥床。","stem":"肺結核患者仍有疲倦但病況穩定，活動與休息如何安排？"},{"answer":"C","options":[{"letter":"A","text":"戴好呼吸器即可不必執行手部衛生"},{"letter":"B","text":"患者無症狀時可省略洗手程序"},{"letter":"C","text":"落實標準防護及手部衛生"},{"letter":"D","text":"共用照護器材可不清潔直接使用"}],"rationale":"空氣隔離不能取代標準防護，手部衛生與器材處理仍須落實。","stem":"護理師照護空氣隔離中的肺結核患者，仍應遵守何項一般感染控制措施？"},{"answer":"A","options":[{"letter":"A","text":"門保持關閉以維持預期空氣流向"},{"letter":"B","text":"門開關不影響負壓可任意處理"},{"letter":"C","text":"以風扇朝走廊吹送室內空氣"},{"letter":"D","text":"門常開向走廊方便觀察患者"}],"rationale":"維持病室門關閉有助於負壓及空氣流向控制，減少污染空氣外逸。","stem":"護理師進出負壓隔離病室時，如何管理病室門較恰當？"},{"answer":"D","options":[{"letter":"A","text":"進入病室前先取下以便說話"},{"letter":"B","text":"仍在患者床邊時立即摘除"},{"letter":"C","text":"患者咳嗽時暫時摘除呼吸器"},{"letter":"D","text":"離開隔離環境後依流程取下"}],"rationale":"應避免在可能受污染的隔離環境內摘除呼吸器，離開後依院內流程取下。","stem":"護理師完成負壓病室照護後，何時取下呼吸器較適當？"},{"answer":"A","options":[{"letter":"A","text":"先通知接收單位、患者戴口罩並縮短停留"},{"letter":"B","text":"不通知接收單位，抵達後再說明"},{"letter":"C","text":"為避免移動而取消所有必要檢查"},{"letter":"D","text":"讓患者在公共區自行排隊等候"}],"rationale":"預先協調可維持必要照護並降低暴露，患者戴口罩且減少停留是重要措施。","stem":"具傳染性肺結核患者需轉送檢查，護理師如何安排較安全？"},{"answer":"A","options":[{"letter":"A","text":"說明口罩可減少散播並協助舒適配戴"},{"letter":"B","text":"責罵患者並停止提供必要照護"},{"letter":"C","text":"不再提醒並允許患者直接外出"},{"letter":"D","text":"只要求陪同家屬戴口罩即可"}],"rationale":"尊重且清楚說明口罩減少感染性微粒散出，並協助處理不適，有助提升配合。","stem":"隔離患者拒絕戴外科口罩外出檢查，護理師最佳回應為何？"},{"answer":"D","options":[{"letter":"A","text":"所有接觸者不需評估即可接受多藥治療"},{"letter":"B","text":"不必通知公衛單位或安排任何追蹤"},{"letter":"C","text":"將患者與接觸者個資公開供社區查詢"},{"letter":"D","text":"依公衛程序評估接觸者並安排後續追蹤"}],"rationale":"接觸者追蹤應依公衛程序及個別暴露風險評估安排，並維護個人隱私。","stem":"確診肺結核後，患者詢問同住者如何安排接觸者追蹤，護理師應如何回應？"},{"answer":"B","options":[{"letter":"A","text":"只要碰過患者餐具就必然感染"},{"letter":"B","text":"主要經空氣傳播，共餐器具不是主要途徑"},{"letter":"C","text":"共用餐具是肺結核最主要的傳播方式"},{"letter":"D","text":"所有用過的餐具均需焚燒處理"}],"rationale":"肺結核主要經空氣傳播，共餐器具不是主要傳染途徑；應聚焦空氣防護而非過度處置餐具。","stem":"患者擔心與家人共餐會傳染肺結核，護理師的說明何者正確？"},{"answer":"A","options":[{"letter":"A","text":"仍應依處方完成療程並與團隊追蹤"},{"letter":"B","text":"只在咳嗽加劇時恢復服藥"},{"letter":"C","text":"將剩餘藥物分享給有咳嗽的家人"},{"letter":"D","text":"症狀緩解即可停止所有抗結核藥物"}],"rationale":"症狀改善不代表病原已清除，應依處方完成療程；過早停藥會增加治療失敗、復發或抗藥風險。","stem":"肺結核患者咳嗽已減輕，表示希望自行停藥，護理師應如何衛教？"},{"answer":"C","options":[{"letter":"A","text":"等症狀再出現時才恢復服藥"},{"letter":"B","text":"立即停止全部抗結核藥物"},{"letter":"C","text":"聯絡治療團隊並依指示處理"},{"letter":"D","text":"下次自行服用雙倍劑量補回"}],"rationale":"漏服時不宜自行加倍或停掉全部藥物，應聯絡治療團隊依個別處方指示處理。","stem":"患者回想昨天漏服一劑抗結核藥，護理師建議何種處理？"},{"answer":"D","options":[{"letter":"A","text":"單用利福平作為完整初始療程"},{"letter":"B","text":"以止咳藥與退燒藥取代抗結核治療"},{"letter":"C","text":"異菸鹼醯胺單藥持續治療"},{"letter":"D","text":"常用異菸鹼醯胺、利福平、吡嗪醯胺及乙胺丁醇"}],"rationale":"常見初始方案包含HRZE四種藥物，實際用藥仍須依個案狀況及醫囑調整。","stem":"新診斷且推定藥物敏感的肺結核患者，團隊討論常見初始多藥方案，何者符合？"},{"answer":"D","options":[{"letter":"A","text":"藥物需任意交替以避免固定服藥"},{"letter":"B","text":"合併用藥只為快速減輕咳嗽症狀"},{"letter":"C","text":"多藥治療主要為了減少藥物療效"},{"letter":"D","text":"適當聯合用藥可提高療效並降低抗藥風險"}],"rationale":"規則且適當的聯合抗結核治療可提高療效並降低抗藥性產生的風險。","stem":"患者詢問為何肺結核常需合併多種藥物，護理師應說明何者？"},{"answer":"C","options":[{"letter":"A","text":"建議自行停掉所有抗結核藥物"},{"letter":"B","text":"建議加倍服藥以加速症狀改善"},{"letter":"C","text":"回報評估周邊神經症狀及維生素B6需求"},{"letter":"D","text":"告知屬正常反應而不需追蹤"}],"rationale":"手足麻木可能為異菸鹼醯胺相關周邊神經毒性，需回報評估，是否補充B6依醫囑決定。","stem":"服用異菸鹼醯胺期間患者新發手足麻木，護理師應如何處理？"},{"answer":"C","options":[{"letter":"A","text":"可能腎衰竭，應限制所有飲水"},{"letter":"B","text":"代表肝臟正常，不需留意其他症狀"},{"letter":"C","text":"常見色素變化，但若伴黃疸應儘速通報"},{"letter":"D","text":"表示藥物失效，應立即自行停藥"}],"rationale":"利福平可使尿液等體液呈橘紅色，通常是預期現象；黃疸等症狀則可能提示肝損傷需通報。","stem":"患者服用利福平後發現尿液呈橘紅色，護理師應如何衛教？"},{"answer":"C","options":[{"letter":"A","text":"兩種藥物沒有交互作用可忽略"},{"letter":"B","text":"利福平會使避孕效果必然增強"},{"letter":"C","text":"可能降低避孕效果，應與醫療團隊討論替代或追加避孕"},{"letter":"D","text":"服藥期間必然造成永久不孕"}],"rationale":"利福平可能加速荷爾蒙避孕藥代謝而降低效果，需討論適當替代或追加避孕方式。","stem":"患者服用利福平並使用口服避孕藥，護理師應提醒何種事項？"},{"answer":"B","options":[{"letter":"A","text":"先將藥液滴在鏡片上再配戴"},{"letter":"B","text":"淚液可能染色鏡片，可考慮改戴眼鏡"},{"letter":"C","text":"清洗鏡片即可確定不會發生染色"},{"letter":"D","text":"隱形眼鏡可吸收藥物治療肺結核"}],"rationale":"利福平可使淚液呈橘紅色並染色軟式隱形眼鏡，可考慮治療期間改戴眼鏡。","stem":"使用利福平的患者平時配戴軟式隱形眼鏡，護理師應如何衛教？"},{"answer":"B","options":[{"letter":"A","text":"自行增加藥量以維持抗菌效果"},{"letter":"B","text":"儘速通報醫療團隊評估肝毒性"},{"letter":"C","text":"建議多喝果汁後照常服藥"},{"letter":"D","text":"將變色視為正常藥物色素反應並觀察"}],"rationale":"橘紅色體液可為常見現象，但黃疸合併深色尿可能表示肝損傷，應儘速回報評估。","stem":"服用利福平的患者出現眼白發黃及深色尿，護理師最適當的處置為何？"},{"answer":"D","options":[{"letter":"A","text":"藥物造成永久性耳聾"},{"letter":"B","text":"藥物造成牙齦增生與出血"},{"letter":"C","text":"藥物造成視神經炎及辨色異常"},{"letter":"D","text":"藥物可能使尿酸升高並引起關節痛"}],"rationale":"吡嗪醯胺可使尿酸升高並造成關節不適，應評估症狀並回報團隊。","stem":"服用吡嗪醯胺的患者新發關節疼痛，護理師應優先考慮何種藥物反應？"},{"answer":"C","options":[{"letter":"A","text":"嗅覺敏銳度與味覺變化"},{"letter":"B","text":"牙齦腫脹與口腔潰瘍"},{"letter":"C","text":"視力變化及色覺辨識能力"},{"letter":"D","text":"耳廓形狀與聽力變化"}],"rationale":"乙胺丁醇可能造成視神經毒性，視力與色覺監測是重要安全評估。","stem":"患者開始使用乙胺丁醇，護理師追蹤時應特別監測何者？"},{"answer":"D","options":[{"letter":"A","text":"建議自行加量並觀察數日"},{"letter":"B","text":"視為藥物有效的預期治療反應"},{"letter":"C","text":"等療程結束後再告知醫療團隊"},{"letter":"D","text":"儘速通知治療團隊評估視神經毒性"}],"rationale":"新發辨色異常可能是乙胺丁醇相關視神經毒性，應及早回報評估，不宜延至療程結束。","stem":"服用乙胺丁醇的患者表示最近辨色能力變差，護理師應如何處理？"},{"answer":"B","options":[{"letter":"A","text":"增加飲酒以促進食慾"},{"letter":"B","text":"儘速回報評估可能的肝毒性"},{"letter":"C","text":"先自行服用成藥緩解不適"},{"letter":"D","text":"忍耐至下次例行回診再提及"}],"rationale":"噁心與右上腹不適可能是肝毒性警訊，應儘速回報評估，而非自行用藥或延後處理。","stem":"服用異菸鹼醯胺的患者出現噁心及右上腹不適，護理師應建議何者？"},{"answer":"D","options":[{"letter":"A","text":"改在服藥日以外飲酒即可避免交互作用"},{"letter":"B","text":"只要少量飲酒即可確保治療安全"},{"letter":"C","text":"飲酒可減輕抗結核藥物的不適反應"},{"letter":"D","text":"建議避免飲酒並與團隊討論肝臟風險"}],"rationale":"部分抗結核藥物具有肝毒性，飲酒可能增加肝臟負擔，應避免並依個別狀況與團隊討論。","stem":"正在接受多種抗結核藥物治療的患者詢問是否可飲酒，護理師應如何建議？"},{"answer":"A","options":[{"letter":"A","text":"追蹤症狀、服藥情形及可能藥物不良反應"},{"letter":"B","text":"只確認咳嗽是否消失，不必詢問用藥反應"},{"letter":"C","text":"只記錄體重，不需查看檢驗與症狀"},{"letter":"D","text":"若能工作即視為治療已完成"}],"rationale":"追蹤需整合症狀、服藥遵從性及藥物不良反應，不能僅以症狀改善或活動能力判定療程完成。","stem":"患者接受抗結核治療期間回診追蹤，護理師應著重確認何者？"},{"answer":"B","options":[{"letter":"A","text":"自行減量可避免所有藥物交互作用"},{"letter":"B","text":"開始前先告知治療團隊確認交互作用"},{"letter":"C","text":"先停掉抗結核藥再開始新藥"},{"letter":"D","text":"只要是草藥即可直接與抗結核藥併用"}],"rationale":"草藥及處方藥均可能有交互作用，開始前應由團隊確認，不可自行停藥或調整劑量。","stem":"結核治療中的患者想自行加用草藥及新處方藥，護理師應建議何者？"},{"answer":"B","options":[{"letter":"A","text":"告知懷孕期間所有結核藥均禁用"},{"letter":"B","text":"儘早與治療團隊討論計畫並評估用藥"},{"letter":"C","text":"立即自行停用全部抗結核藥物"},{"letter":"D","text":"等懷孕確認後再告知任何醫療人員"}],"rationale":"懷孕計畫涉及疾病與藥物個別評估，應及早與治療團隊討論，不可自行停藥或假定所有藥物皆禁用。","stem":"正在接受肺結核治療的患者表示計畫懷孕，護理師的回應何者最適當？"},{"answer":"D","options":[{"letter":"A","text":"先提供飲食建議再評估呼吸情形"},{"letter":"B","text":"請患者回家觀察是否自然消退"},{"letter":"C","text":"記錄皮疹範圍並安排下次門診追蹤"},{"letter":"D","text":"立即啟動緊急處置並維持呼吸道與生命徵象"}],"rationale":"唇腫與呼吸困難提示嚴重過敏反應，需立即處置並優先維持呼吸道與生命徵象。","stem":"結核患者服藥後出現全身皮疹、唇腫及呼吸困難，護理師首要處置為何？"},{"answer":"D","options":[{"letter":"A","text":"自行將所有抗結核藥加倍服用"},{"letter":"B","text":"建議自行減少飲水以改善噁心"},{"letter":"C","text":"告知是正常色素變化並照常等待回診"},{"letter":"D","text":"儘速通報治療團隊評估肝臟不良反應"}],"rationale":"黃疸合併持續噁心可能提示藥物相關肝損傷，需儘速評估；不可與利福平造成的單純橘紅色體液混淆。","stem":"結核治療期間患者出現黃疸並持續噁心，護理師應採取何種措施？"},{"answer":"B","options":[{"letter":"A","text":"只追蹤咳嗽，不需評估血糖控制"},{"letter":"B","text":"協調追蹤血糖、結核治療及用藥狀況"},{"letter":"C","text":"等結核療程結束後再處理糖尿病"},{"letter":"D","text":"因感染而自行停用糖尿病藥物"}],"rationale":"糖尿病合併結核需整合血糖控制與結核治療追蹤，並留意整體用藥與病況。","stem":"糖尿病患者同時接受肺結核治療，護理師應加強哪項照護？"},{"answer":"D","options":[{"letter":"A","text":"暫不告知團隊以免延誤療程"},{"letter":"B","text":"只詢問患者平日是否容易咳嗽"},{"letter":"C","text":"先給藥後再確認過去肝臟病史"},{"letter":"D","text":"既有肝病狀況、用藥及相關基礎檢查"}],"rationale":"慢性肝病影響抗結核藥物安全性，治療前需掌握病史、用藥及相關基礎狀況供團隊評估。","stem":"慢性肝病患者即將開始抗結核治療，護理師應先協助團隊掌握何者？"},{"answer":"B","options":[{"letter":"A","text":"你應該每天都有照規定服藥吧？"},{"letter":"B","text":"最近服藥有哪些困難或漏服情形？"},{"letter":"C","text":"家人會替你確定每一劑都已服用嗎？"},{"letter":"D","text":"不按時服藥就是不配合治療嗎？"}],"rationale":"以開放、不責備方式詢問可了解實際困難與漏服情形，有助共同規劃支持措施。","stem":"護理師評估患者是否能按時服用抗結核藥，何種詢問方式較合宜？"},{"answer":"D","options":[{"letter":"A","text":"告知忘記服藥代表不適合繼續治療"},{"letter":"B","text":"建議只在家人有空時才服藥"},{"letter":"C","text":"要求患者自行增加下一次藥量補足"},{"letter":"D","text":"共同設計提醒方式並評估可行支持"}],"rationale":"應先找出遺忘原因並與患者共同安排提醒或支持方法，不宜責備或建議自行加量。","stem":"患者表示常因工作忙碌忘記服用結核藥，護理師何種支持較適當？"},{"answer":"A","options":[{"letter":"A","text":"確認用藥執行並提供持續治療支持"},{"letter":"B","text":"證明患者已無感染性而可解除隔離"},{"letter":"C","text":"以觀察取代所有臨床追蹤及檢查"},{"letter":"D","text":"讓患者不必了解自己的治療計畫"}],"rationale":"DOT旨在支持並確認治療執行，協助完成療程；不能取代臨床追蹤，也不能單獨判定傳染性。","stem":"患者接受直接觀察治療（DOT），護理師向其說明主要目的為何？"},{"answer":"D","options":[{"letter":"A","text":"開始服藥當天即可不再採空氣防護"},{"letter":"B","text":"咳嗽減少後即可自行停止隔離"},{"letter":"C","text":"只要胸部影像改善便能立即解除"},{"letter":"D","text":"依臨床、檢驗及院內公衛規範由團隊判定"}],"rationale":"解除隔離需依整體臨床與檢驗資訊及相關規範判定，不能僅以症狀或單一影像決定。","stem":"患者詢問何時可解除肺結核空氣隔離，護理師應如何回應？"},{"answer":"C","options":[{"letter":"A","text":"可不告知同住者任何防護注意事項"},{"letter":"B","text":"自行停止藥物以免家人接觸藥物"},{"letter":"C","text":"依團隊指示服藥並遵循居家空氣防護建議"},{"letter":"D","text":"所有家人都需立即服用多種抗結核藥"}],"rationale":"居家期間應遵循治療團隊的服藥與空氣防護建議，接觸者則依公衛評估處理。","stem":"具傳染性的肺結核患者依計畫居家治療，護理師應提供何種建議？"},{"answer":"C","options":[{"letter":"A","text":"直接提供患者剩餘藥物給接觸者"},{"letter":"B","text":"只要無咳嗽就不需任何評估"},{"letter":"C","text":"依公衛程序安排接觸者評估與追蹤"},{"letter":"D","text":"告知所有接觸者均已感染，不必再檢查"}],"rationale":"密切接觸者應依公衛程序進行個別評估與追蹤，無症狀也不能單憑此點排除感染。","stem":"確診肺結核患者的密切接觸者詢問是否需要檢查，護理師應如何處理？"},{"answer":"A","options":[{"letter":"A","text":"以紙巾遮掩咳嗽並妥善處理後執行手部衛生"},{"letter":"B","text":"面向他人咳嗽以避免污染衣袖"},{"letter":"C","text":"咳嗽時取下口罩讓痰液順利排出"},{"letter":"D","text":"將用過紙巾放在床旁桌面稍後再清理"}],"rationale":"咳嗽時以紙巾遮掩、妥善丟棄並洗手可減少分泌物散播，避免朝向他人或隨意放置。","stem":"護理師指導肺結核患者咳嗽禮節，何種做法較適當？"},{"answer":"A","options":[{"letter":"A","text":"立即以清水或生理食鹽水沖洗眼睛"},{"letter":"B","text":"先完成工作再於下班後沖洗"},{"letter":"C","text":"先以乾紙巾用力擦拭眼球"},{"letter":"D","text":"以消毒液直接滴入眼睛處理"}],"rationale":"眼部遭檢體暴露應立即以清水或生理食鹽水充分沖洗，再依職業暴露流程通報評估。","stem":"護理師處理痰液時不慎遭檢體濺入眼睛，第一步應如何做？"},{"answer":"A","options":[{"letter":"A","text":"潛伏結核感染，仍須依評估追蹤"},{"letter":"B","text":"檢驗陽性代表目前正排出大量痰菌"},{"letter":"C","text":"已確診具傳染性的活動性肺結核"},{"letter":"D","text":"已完成結核治療，不需後續處理"}],"rationale":"潛伏結核感染常無症狀且無活動性疾病證據；陽性免疫檢驗不等同具傳染性的活動性結核。","stem":"一名接觸者IGRA陽性但無結核症狀，胸部評估未見活動病證據，較符合何種情況？"},{"answer":"D","options":[{"letter":"A","text":"等待咳嗽出現後再做任何檢查"},{"letter":"B","text":"不評估症狀即可先使用單一藥物"},{"letter":"C","text":"直接依接觸者意願選擇多藥治療"},{"letter":"D","text":"先排除活動性結核並由團隊評估治療"}],"rationale":"開始潛伏感染治療前應先排除活動性結核，避免以不適當的預防性方案治療活動病。","stem":"接觸者有潛伏結核感染可能，準備開始預防性治療前最重要的步驟為何？"},{"answer":"B","options":[{"letter":"A","text":"不需追蹤或進一步評估"},{"letter":"B","text":"安排團隊評估並排除活動性疾病"},{"letter":"C","text":"直接判定患者具高度傳染性"},{"letter":"D","text":"因無症狀即可排除活動性結核"}],"rationale":"免疫抑制者需審慎評估；IGRA陽性不能區分潛伏與活動病，仍應排除活動性結核。","stem":"免疫抑制者IGRA陽性且目前無症狀，護理師協助後續處理何者適當？"},{"answer":"C","options":[{"letter":"A","text":"因免疫低下可排除肺結核可能"},{"letter":"B","text":"先觀察數週，症狀惡化再通報"},{"letter":"C","text":"儘速啟動結核評估並採取適當空氣防護"},{"letter":"D","text":"只提供營養建議而不進行感染評估"}],"rationale":"HIV感染者有慢性咳嗽及消瘦需儘速評估結核並採取防護，免疫低下不會排除結核可能。","stem":"HIV感染者近期咳嗽且體重減輕，護理師應採取何種措施？"},{"answer":"D","options":[{"letter":"A","text":"以紅斑直徑作為TST陽性依據"},{"letter":"B","text":"將紅斑面積換算成痰菌量"},{"letter":"C","text":"以整個上臂周徑判定反應大小"},{"letter":"D","text":"依硬結判讀，單有紅斑不作硬結測量"}],"rationale":"TST以硬結而非紅斑判讀；只有紅斑而無硬結，不應將紅斑直徑當成陽性測量值。","stem":"護理師判讀TST時發現注射處有紅斑但觸診無硬結，應如何記錄與判讀？"},{"answer":"B","options":[{"letter":"A","text":"在未確認前自行開始單一抗結核藥"},{"letter":"B","text":"持續評估並依計畫採集培養或分子檢體"},{"letter":"C","text":"依塗片陰性立即排除結核並停止評估"},{"letter":"D","text":"僅以胸片正常與否判定是否感染"}],"rationale":"塗片陰性不能完全排除肺結核，仍需結合臨床並依計畫進行培養或分子檢查。","stem":"患者痰抗酸塗片陰性，但臨床仍高度懷疑肺結核，後續處理何者適當？"},{"answer":"A","options":[{"letter":"A","text":"立即處理氣道與氧合並啟動緊急支援"},{"letter":"B","text":"提供水分並鼓勵患者自行步行"},{"letter":"C","text":"先安排常規營養評估及飲食衛教"},{"letter":"D","text":"先記錄痰液顏色並等待下一次巡房"}],"rationale":"大量咳血及發紺顯示氣道與氧合可能受威脅，應優先緊急處置並啟動支援。","stem":"肺結核患者突然大量咳血並發紺，護理師應優先採取何項行動？"},{"answer":"C","options":[{"letter":"A","text":"以厚重棉被覆蓋減少夜間著涼"},{"letter":"B","text":"不需處理，盜汗不影響患者休息"},{"letter":"C","text":"評估體溫與舒適度並協助更換乾爽衣被"},{"letter":"D","text":"限制所有水分避免繼續出汗"}],"rationale":"應評估發燒與盜汗情形，並協助更換乾爽衣被以促進舒適及休息。","stem":"肺結核患者夜間盜汗弄濕床單，護理師何種照護較適當？"},{"answer":"B","options":[{"letter":"A","text":"建議自行停用抗結核藥以減少夜咳"},{"letter":"B","text":"評估咳嗽原因與症狀並依計畫提供舒適措施"},{"letter":"C","text":"要求患者停止咳嗽以維持病室安靜"},{"letter":"D","text":"未評估前自行增加止咳藥劑量"}],"rationale":"先評估咳嗽與相關症狀，再依醫療計畫提供舒適措施；不可自行加藥或停抗結核藥。","stem":"肺結核患者表示夜間咳嗽影響睡眠，護理師較適當的作法為何？"},{"answer":"B","options":[{"letter":"A","text":"忽略情緒以免延長護理時間"},{"letter":"B","text":"主動關懷並安排安全可行的溝通支持"},{"letter":"C","text":"解除隔離讓患者自行到公共區活動"},{"letter":"D","text":"告知隔離期間不應與任何人交談"}],"rationale":"隔離可能造成孤立感，應提供關懷與安全的溝通支持，不能因此忽略感染控制。","stem":"隔離中的肺結核患者表示感到孤單，護理師何種回應最適當？"},{"answer":"D","options":[{"letter":"A","text":"責備患者不負責任並要求立即簽署治療同意"},{"letter":"B","text":"告知拒治者不再提供任何照護"},{"letter":"C","text":"向病房其他人公布病情以獲取支持"},{"letter":"D","text":"傾聽顧慮並以保密、非批判方式討論治療"}],"rationale":"應尊重患者並傾聽污名顧慮，以保密及非批判方式提供資訊和支持，促進共同決策。","stem":"患者因擔心遭污名而拒絕肺結核治療，護理師回應何者較適當？"},{"answer":"B","options":[{"letter":"A","text":"只交代出院日期而不說明藥物"},{"letter":"B","text":"服藥計畫、不良反應辨識及追蹤安排"},{"letter":"C","text":"鼓勵症狀改善後自行停藥"},{"letter":"D","text":"不提供感染防護或接觸者資訊"}],"rationale":"出院準備需包含規則服藥、重要不良反應、追蹤及感染防護等資訊，協助持續安全治療。","stem":"肺結核患者準備出院，護理師進行出院準備時最應納入何者？"},{"answer":"A","options":[{"letter":"A","text":"聯絡治療單位或藥師確認藥物與服法"},{"letter":"B","text":"暫停全部治療直到症狀再出現"},{"letter":"C","text":"向其他患者借用相同顏色的藥物"},{"letter":"D","text":"依記憶自行挑選外觀相似藥物服用"}],"rationale":"藥袋遺失且藥名不明時應向治療單位或藥師核實，避免錯藥、漏藥或自行借藥。","stem":"患者發現藥袋遺失且不清楚藥物名稱，護理師應建議何者？"},{"answer":"B","options":[{"letter":"A","text":"成藥不需告知團隊，可與所有抗結核藥併用"},{"letter":"B","text":"使用前先確認成分並詢問治療團隊"},{"letter":"C","text":"減少成藥劑量即可避免任何交互作用"},{"letter":"D","text":"先停抗結核藥數日再開始成藥"}],"rationale":"成藥可能與抗結核藥交互作用或造成重複不良反應，使用前應確認成分並諮詢團隊。","stem":"肺結核患者準備開始服用新的成藥，護理師應提醒何者？"},{"answer":"C","options":[{"letter":"A","text":"以其他患者的用藥紀錄替代核對"},{"letter":"B","text":"依患者記憶給藥而不查醫囑"},{"letter":"C","text":"核對患者身分、醫囑、藥物及過敏等資訊"},{"letter":"D","text":"只核對藥袋顏色與患者床號"}],"rationale":"給藥前應依安全給藥原則核對患者身分、醫囑與藥物，並確認過敏及相關用藥資訊。","stem":"護理師準備給予肺結核患者抗結核藥物，重要的給藥安全核對為何？"},{"answer":"B","options":[{"letter":"A","text":"不論處方如何都可與其他藥物任意併服"},{"letter":"B","text":"依個別藥物指示及處方確認服藥與食物關係"},{"letter":"C","text":"所有藥物均應自行改成睡前服用"},{"letter":"D","text":"所有抗結核藥都必須與高脂餐同服"}],"rationale":"服藥時程與食物關係需依個別藥物及處方確認，不宜概括套用或自行更改。","stem":"患者詢問抗結核藥應在何時服用及是否需配合食物，護理師應如何回應？"},{"answer":"A","options":[{"letter":"A","text":"請患者用自己的方式示範或說明服藥計畫"},{"letter":"B","text":"提高語速一次講完所有藥物資訊"},{"letter":"C","text":"只把藥袋交給家屬而不與患者溝通"},{"letter":"D","text":"請患者回答是否聽懂即可結束衛教"}],"rationale":"請患者以自己的方式回述或示範可確認理解程度，並據此調整衛教方法。","stem":"患者識字有限，護理師想確認其理解服藥方式，何種方法最適當？"},{"answer":"B","options":[{"letter":"A","text":"先完成飲食攝取紀錄再觀察呼吸"},{"letter":"B","text":"優先評估氣道、呼吸與氧合並啟動支援"},{"letter":"C","text":"安排患者自行步行至放射科檢查"},{"letter":"D","text":"等待咳血自行停止後再通知醫師"}],"rationale":"大量咳血與呼吸急促可能迅速危及氣道及氧合，應先處理呼吸問題並及時啟動支援。","stem":"肺結核患者大量咳血合併呼吸急促，護理師應先做何種評估與處置？"},{"answer":"A","options":[{"letter":"A","text":"立即通報並安排緊急評估可能中樞神經侵犯"},{"letter":"B","text":"給予口服止痛藥後不再追蹤"},{"letter":"C","text":"鼓勵休息並等待症狀自然消退"},{"letter":"D","text":"視為一般疲倦，安排隔日例行回診"}],"rationale":"頭痛、頸僵及意識改變可能提示結核中樞神經侵犯或其他急症，需立即通報及評估。","stem":"結核患者新發劇烈頭痛、頸部僵硬及意識改變，護理師應如何處理？"},{"answer":"D","options":[{"letter":"A","text":"先詢問飲食偏好並安排營養諮詢"},{"letter":"B","text":"鼓勵患者自行下床走動觀察耐受"},{"letter":"C","text":"記錄症狀後等例行查房再處理"},{"letter":"D","text":"立即評估呼吸循環並啟動急症處置"}],"rationale":"胸痛、呼吸急促與血氧下降提示急性呼吸循環問題，優先評估並啟動急症處置。","stem":"肺結核治療中的患者突發胸痛、呼吸急促且血氧下降，護理師首先應做什麼？"},{"answer":"B","options":[{"letter":"A","text":"陽性結果可區分所有結核菌與非結核菌"},{"letter":"B","text":"塗片可見抗酸菌，但仍需檢查確認菌種"},{"letter":"C","text":"染色結果可直接判定治療療程已完成"},{"letter":"D","text":"陽性代表菌株已完成藥物敏感性分析"}],"rationale":"抗酸染色可顯示抗酸菌，但不能可靠區分結核菌與非結核分枝桿菌，仍需後續確認。","stem":"痰液抗酸染色陽性時，患者詢 :"A","text":"只要碰觸患者手部就會直接感染"},{"letter":"B","text":"握手是結核菌最主要的傳播方式"},{"letter":"C","text":"肺結核主要經空氣傳播，日常握手非主要途徑"},{"letter":"D","text":"握手後必須立即預防性服用多種藥物"}],"rationale":"肺結核主要經空氣傳播，日常握手不是主要傳播途徑；應依實際空氣暴露評估風險。","stem":"家屬詢問日常握手是否會感染肺結核，護理師應如何說明？"},{"answer":"D","options":[{"letter":"A","text":"只要共用衣物就必然感染結核"},{"letter":"B","text":"所有衣物必須焚燒才能避免傳播"},{"letter":"C","text":"患者衣物不可在家中清洗或收納"},{"letter":"D","text":"衣物接觸不是主要途徑，依一般清潔方式處理即可"}],"rationale":"肺結核主要透過空氣傳播，衣物接觸不是主要途徑，無須採取焚燒等過度處置。","stem":"家屬擔心患者衣物會傳染肺結核，護理師較適當的衛教為何？"},{"answer":"A","options":[{"letter":"A","text":"依公衛流程儘速安排幼兒接觸者評估"},{"letter":"B","text":"直接讓幼兒服用患者剩餘抗結核藥"},{"letter":"C","text":"等幼兒出現嚴重症狀再進行追蹤"},{"letter":"D","text":"幼兒無咳嗽即可完全不需評估"}],"rationale":"幼兒密切接觸具傳染性患者應依公衛程序及時評估，即使無症狀也不宜自行排除或用藥。","stem":"具傳染性肺結核患者家中有幼兒曾密切接觸，護理師應建議何者？"},{"answer":"C","options":[{"letter":"A","text":"同住者必定全部感染且會發病"},{"letter":"B","text":"只有共用餐具者會感染結核"},{"letter":"C","text":"接觸後感染與否須依暴露及個別評估判定"},{"letter":"D","text":"接觸者不需評估，因結核不會人傳人"}],"rationale":"接觸者不一定都感染或發病，需依暴露情況與個別風險安排評估追蹤。","stem":"患者問家中每位接觸者是否都會感染，護理師應如何回答？"},{"answer":"C","options":[{"letter":"A","text":"等到出現咳血再考慮是否治療"},{"letter":"B","text":"直接使用患者剩餘藥物完成療程"},{"letter":"C","text":"確認已排除活動性結核並由團隊評估方案"},{"letter":"D","text":"只要接觸過患者就自行開始用藥"}],"rationale":"預防治療前需先排除活動性結核並由團隊決定適當方案，避免不適當單一預防治療。","stem":"接觸者準備接受潛伏結核感染預防治療，護理師應確認何項前置評估？"},{"answer":"A","options":[{"letter":"A","text":"肺外結核可侵犯淋巴結、骨骼或中樞神經等處"},{"letter":"B","text":"結核菌只會侵犯肺泡，不會影響其他器官"},{"letter":"C","text":"只要胸部影像正常即可排除所有肺外結核"},{"letter":"D","text":"肺外結核僅會發生在皮膚表面"}],"rationale":"結核可侵犯肺外器官，如淋巴結、骨骼及中樞神經；胸片正常不能排除肺外結核。","stem":"患者詢問結核病是否只侵犯肺部，護理師應如何說明？"},{"answer":"C","options":[{"letter":"A","text":"病灶位置可直接證明菌種及全部藥敏"},{"letter":"B","text":"影像可取代痰培養與臨床評估"},{"letter":"C","text":"影像可評估病灶，但菌種與抗藥性需微生物檢查"},{"letter":"D","text":"只要有肺葉陰影即確定具傳染性"}],"rationale":"影像能協助評估肺部病灶，但不能單獨確診結核菌種或抗藥性，仍需微生物與臨床資料。","stem":"患者胸部影像顯示肺葉病灶，詢問是否已能確認結核與抗藥性，何者為適當說明？"},{"answer":"D","options":[{"letter":"A","text":"自行開始單一抗結核藥物觀察反應"},{"letter":"B","t 乙醯膽鹼釋放"},{"letter":"B","text":"破壞肌動蛋白"},{"letter":"C","text":"造成視神經發炎"},{"letter":"D","text":"壓迫脊髓前角"}],"answer":"A","rationale":"此症候群為突觸前神經肌肉傳導障礙，可與小細胞肺癌相關。"},{"stem":"肺癌侵犯上腔靜脈，最典型表現為何？","options":[{"letter":"A","text":"耳鳴"},{"letter":"B","text":"右上腹餐後痛"},{"letter":"C","text":"臉頸腫脹、上肢水腫及頸靜脈怒張"},{"letter":"D","text":"單側小腿腫脹"}],"answer":"C","rationale":"上腔靜脈阻塞使上半身靜脈回流受阻，呼吸惡化需立即評估。"},{"stem":"肺尖腫瘤造成肩痛、尺側手臂麻木及眼瞼下垂，最可能為何？","options":[{"letter":"A","text":"庫欣氏症候群"},{"letter":"B","text":"Pancoast-Tobias症候群"},{"letter":"C","text":"腎病症候群"},{"letter":"D","text":"馬凡氏症候群"}],"answer":"B","rationale":"肺尖腫瘤侵犯臂神經叢及交感神經鏈，可有肩臂痛及Horner徵象。"},{"stem":"肺癌患者單側聲帶麻痺、聲音沙啞，可能侵犯何神經？","options":[{"letter":"A","text":"坐骨神經"},{"letter":"B","text":"視神經"},{"letter":"C","text":"喉返神經"},{"letter":"D","text":"正中神經"}],"answer":"C","rationale":"肺腫瘤或縱膈淋巴結可能壓迫喉返神經。"},{"stem":"咳血患者的初步評估最應包含何者？","options":[{"letter":"A","text":"出血量、顏色、頻率及呼吸循環狀況"},{"letter":"B","text":"只問痰液氣味"},{"letter":"C","text":"立即限制所有飲水"},{"letter":"D","text":"只記錄咳嗽聲"}],"answer":"A","rationale":"需評估咳血嚴重度及生命徵象；大量咳血可能危及氣道。"},{"stem":"疑似肺癌者的吸菸史評估，最需記錄何者？","options":[{"letter":"A","text":"慣用手"},{"letter":"B","text":"剪髮日期"},{"letter":"C","text":"吸菸量、年數及戒菸時間"},{"letter":"D","text":"鞋號"}],"answer":"C","rationale":"累積吸菸暴露是重要風險資訊，也應詢問二手菸及職業暴露。"},{"stem":"石綿暴露史與何種疾病風險相關？","options":[{"letter":"A","text":"肺癌及惡性胸膜間皮瘤"},{"letter":"B","text":"僅有氣喘"},{"letter":"C","text":"膀胱結石"},{"letter":"D","text":"甲狀腺腫"}],"answer":"A","rationale":"石綿暴露可增加肺癌及胸膜間皮瘤風險。"},{"stem":"肺癌患者活動時呼吸急促，護理師首先取得何種資料？","options":[{"letter":"A","text":"呼吸頻率、血氧、呼吸型態及生命徵象"},{"letter":"B","text":"身高"},{"letter":"C","text":"食慾"},{"letter":"D","text":"指甲長度"}],"answer":"A","rationale":"先評估氧合及呼吸窘迫，再依結果處置。"},{"stem":"追蹤肺癌患者營養狀況，最適當的方式為何？","options":[{"letter":"A","text":"以單次體重取代追蹤"},{"letter":"B","text":"只記錄尿色"},{"letter":"C","text":"定期記錄體重、攝取量及相關症狀"},{"letter":"D","text":"限制蛋白質"}],"answer":"C","rationale":"趨勢性資料有助辨識營養不良並調整支持措施。"},{"stem":"癌症骨痛評估何者最完整？","options":[{"letter":"A","text":"疼痛難忍 ":"A","text":"體溫"},{"letter":"B","text":"血氧"},{"letter":"C","text":"組織或細胞檢體病理分析"},{"letter":"D","text":"聽診"}],"answer":"C","rationale":"病理檢體可確診及分型，分子檢測可協助治療選擇。"},{"stem":"腫瘤基因結果未出，患者詢問是否開始特定標靶藥，應如何回應？","options":[{"letter":"A","text":"由團隊依分子結果及臨床條件決定"},{"letter":"B","text":"所有肺癌都適用同藥"},{"letter":"C","text":"可自行開始"},{"letter":"D","text":"基因檢測無關治療"}],"answer":"A","rationale":"標靶治療需依特定分子變異及臨床條件選擇。"},{"stem":"腦部MRI檢查前，護理師應確認何者？","options":[{"letter":"A","text":"襪子顏色"},{"letter":"B","text":"指甲長度"},{"letter":"C","text":"胸部X光日期"},{"letter":"D","text":"植入物、金屬異物及裝置相容性"}],"answer":"D","rationale":"MRI前需篩檢植入物與金屬安全性。"},{"stem":"肺功能檢查對肺癌手術評估的主要用途為何？","options":[{"letter":"A","text":"評估肺功能及手術呼吸儲備"},{"letter":"B","text":"判定組織型態"},{"letter":"C","text":"取代切片確診"},{"letter":"D","text":"檢查基因突變"}],"answer":"A","rationale":"肺功能檢查評估通氣及手術耐受度，不負責癌症病理診斷。"},{"stem":"痰液細胞學檢查應如何採檢？","options":[{"letter":"A","text":"先加水稀釋"},{"letter":"B","text":"只收口水"},{"letter":"C","text":"室溫放數日再送"},{"letter":"D","text":"依指示深咳取得下呼吸道痰液，避免只收唾液"}],"answer":"D","rationale":"應採深部痰液並依檢驗室要求儘速送檢。"},{"stem":"肺葉切除術前呼吸訓練宜包含何者？","options":[{"letter":"A","text":"深呼吸、有效咳嗽及誘發性肺量計"},{"letter":"B","text":"完全禁止咳嗽"},{"letter":"C","text":"快速淺呼吸"},{"letter":"D","text":"避免所有活動"}],"answer":"A","rationale":"術前練習有助術後肺擴張與分泌物清除。"},{"stem":"化療患者發燒、發冷，護理師應如何處置？","options":[{"letter":"A","text":"不再量體溫"},{"letter":"B","text":"立即評估並依發燒／嗜中性球低下流程通報"},{"letter":"C","text":"只擦澡不通報"},{"letter":"D","text":"自行服退燒藥等數日"}],"answer":"B","rationale":"化療期間發燒可能為嚴重感染，應及時評估，不可延誤。"},{"stem":"咳血患者呼吸急促迅速惡化，優先處置為何？","options":[{"letter":"A","text":"大量飲水"},{"letter":"B","text":"先完成病歷"},{"letter":"C","text":"維持氣道與氧合並緊急求援"},{"letter":"D","text":"讓患者離開病室"}],"answer":"C","rationale":"大量咳血可能造成氣道阻塞，須立即處理呼吸威脅。"},{"stem":"上腔靜脈症候群患者臉部腫脹、呼吸不適，適當措施為何？","options":[{"letter":"A","text":"頭低腳高"},{"letter":"B","text":"抬高床頭並監測呼吸、血氧及神經狀態"},{"letter":"C","text":"平躺不觀察"},{"letter":"D","text":"加壓包紮上肢"}],"answer":"B","rationale":"抬高床頭可減輕上半身靜脈壓，惡化時需即刻通報。"},{"stem":"疑似SIADH患者低血鈉且混亂，優先監測何者？","options":[{"letter":"A","text":"神經狀態、抽搐風險及血鈉"},{"letter":"B","text":"增加自由飲水"},{"letter":"C","text":"大量飲水"},{"letter":"D","text":"只記錄尿色"}],"answer":"A","rationale":"低血鈉可致腦水腫及抽搐，水分處置需依醫囑。"},{"stem":"骨轉移疼痛患者的照護何者適當？","options":[{"letter":"A","text":"禁止所有止痛藥"},{"letter":"B","text":"要求忍痛"},{"letter":"C","text":"用力按摩病灶"},{"letter":"D","text":"依處方止痛並安全協助活動"}],"answer":"D","rationale":"癌痛需適當治療；骨轉移處避免強力按摩及不當負重。"},{"stem":"胸管接頭鬆脫且患者呼吸窘迫，應如何處理？","options":[{"letter":"A","text":"引流瓶抬高"},{"letter":"B","text":"拔管"},{"letter":"C","text":"任意夾管離開"},{"letter":"D","text":"呼叫支援，依胸管意外流程處理並評估呼吸"}],"answer":"D","rationale":"須立即維持系統安全及處理呼吸惡化，不可任意拔管或抬高引流瓶。"},{"stem":"胸管水封室呼吸性波動消失，護理師下一步為何？","options":[{"letter":"A","text":"常規夾管"},{"letter":"B","text":"擠壓胸管"},{"letter":"C","text":"檢查管路折曲阻塞並評估病人"},{"letter":"D","text":"引流瓶放床上"}],"answer":"C","rationale":"波動消失可能為肺復張或管路問題，應先評估病人與系統。"},{"stem":"術後疼痛使病人不敢咳嗽，最適當指導為何？","options":[{"letter":"A","text":"依處方止痛並以枕頭支托切口咳嗽"},{"letter":"B","text":"停止深呼吸"},{"letter":"C","text":"禁止咳嗽"},{"letter":"D","text":"拆敷料按壓"}],"answer":"A","rationale":"止痛及支托切口可助有效咳嗽，降低肺部併發症。"},{"stem":"居家氧療安全衛教何者正確？","options":[{"letter":"A","text":"以油膏塗設備"},{"letter":"B","text":"氧氣旁可吸菸"},{"letter":"C","text":"任意提高流量"},{"letter":"D","text":"遠離火源，依處方使用氧氣並避免油性產品"}],"answer":"D","rationale":"氧氣助燃，須禁菸避火，流量依處方設定。"},{"stem":"放射治療皮膚乾燥紅斑，照護方式何者適當？","options":[{"letter":"A","text":"用力搓洗標記"},{"letter":"B","text":"溫和清潔、避免摩擦曝曬，依指示使用護膚品"},{"letter":"C","text":"長時間熱敷"},{"letter":"D","text":"自塗刺激性藥膏"}],"answer":"B","rationale":"照射皮膚需溫和照護，護膚品依放療團隊指示。"},{"stem":"胸部放射治療後吞嚥痛可能源於何者？","options":[{"letter":"A","text":"青光眼"},{"letter":"B","text":"食道黏膜炎"},{"letter":"C","text":"闌尾炎"},{"letter":"D","text":"膽囊炎"}],"answer":"B","rationale":"胸部照射可能刺激食道黏膜，影響吞嚥。"},{"stem":"化療白血球低下期間，最重要感染預防為何？","options":[{"letter":"A","text":"勤洗手並避免接觸感染者，發燒即聯絡團隊"},{"letter":"B","text":"共用餐具"},{"letter":"C","text":"探訪感冒親友"},{"letter":"D","text":"發燒等下次門診"}],"answer":"A","rationale":"免疫低下時感染可能迅速惡化，手部衛生與及時通報重要。"},{"stem":"血小板低下患 ,"options":[{"letter":"A","text":"依安全指示處理，勿任意磨粉或破碎"},{"letter":"B","text":"一律磨粉"},{"letter":"C","text":"與糖果混放"},{"letter":"D","text":"不需洗手"}],"answer":"A","rationale":"部分藥物接觸有危害，應依藥師及產品指示安全處理。"},{"stem":"放療定位標記變淡，病人應如何處理？","options":[{"letter":"A","text":"化妝品遮蓋"},{"letter":"B","text":"通知放療團隊補標，不自行擦除或重畫"},{"letter":"C","text":"用力擦掉"},{"letter":"D","text":"自行重畫"}],"answer":"B","rationale":"定位標記應由治療團隊維護以確保照射準確。"},{"stem":"放療吞嚥困難時，飲食照護何者適當？","options":[{"letter":"A","text":"強迫乾硬食物"},{"letter":"B","text":"評估吞嚥安全，選較柔軟易吞食物並回報惡化"},{"letter":"C","text":"不記錄攝取"},{"letter":"D","text":"停止水分"}],"answer":"B","rationale":"食道刺激可影響攝食，需調整質地並評估營養水分。"},{"stem":"治療後噁心的適當照護為何？","options":[{"letter":"A","text":"禁食不補液"},{"letter":"B","text":"依醫囑止吐、少量多餐並記錄攝取與嘔吐"},{"letter":"C","text":"不通報持續症狀"},{"letter":"D","text":"自行加倍抗癌藥"}],"answer":"B","rationale":"止吐及飲食調整可改善症狀，需注意脫水與治療耐受。"},{"stem":"化療口腔潰瘍時適當飲食為何？","options":[{"letter":"A","text":"停止清潔"},{"letter":"B","text":"辛辣酸硬食物"},{"letter":"C","text":"酒精漱口"},{"letter":"D","text":"柔軟、溫涼、不刺激食物"}],"answer":"D","rationale":"柔軟不刺激食物可減少黏膜疼痛，並應溫和清潔。"},{"stem":"咳嗽伴發燒及痰量增加，護理師應如何判斷？","options":[{"letter":"A","text":"自行服剩餘抗生素"},{"letter":"B","text":"視為腫瘤固有症狀"},{"letter":"C","text":"限制咳嗽"},{"letter":"D","text":"評估感染可能並通報"}],"answer":"D","rationale":"發燒與痰變化可能為感染，應評估並由團隊決定治療。"},{"stem":"肺癌患者體重下降及肌肉流失，適當轉介為何？","options":[{"letter":"A","text":"停止稱重"},{"letter":"B","text":"營養師評估及營養支持"},{"letter":"C","text":"理髮服務"},{"letter":"D","text":"立即減重飲食"}],"answer":"B","rationale":"癌症營養不良需及早評估與個別化支持。"},{"stem":"肺癌患者情緒低落，護理師最適當回應為何？","options":[{"letter":"A","text":"避免談感受"},{"letter":"B","text":"保證治癒"},{"letter":"C","text":"傾聽並評估支持需求，必要時轉介心理資源"},{"letter":"D","text":"否定負面情緒"}],"answer":"C","rationale":"支持性溝通與轉介有助因應，避免不實承諾。"},{"stem":"晚期肺癌患者希望討論生活品質，護理師應如何協助？","options":[{"letter":"A","text":"排除病人只問家屬"},{"letter":"B","text":"避談偏好"},{"letter":"C","text":"自行決定停治療"},{"letter":"D","text":"尊重病人意願，安排與團隊討論照護目標"}],"answer":"D","rationale":"共同決策應以病人價值及偏好為中心。"},{"stem":"緩和照護的正確說明為何？","options":[{"letter":"A","text":"不提供止痛"},{"letter":"B","text":"著重症狀與生活品質，可與適當抗癌治療並行"},{"letter":"C","text":"等同放棄所有治療"},{"letter":"D","text":"只適用最後一天"}],"answer":"B","rationale":"緩和照護可於疾病不同階段提供支持，並可與抗癌治療並行。"},{"stem":"肺癌患者出院衛教最應包含何者？","options":[{"letter":"A","text":"不說警訊"},{"letter":"B","text":"只說有疼痛才就醫"},{"letter":"C","text":"取消追蹤"},{"letter":"D","text":"追蹤計畫、聯絡方式及發燒喘或大量咳血等警訊"}],"answer":"D","rationale":"明確追蹤與急症警訊可避免延誤照護。"},{"stem":"治療後影像腫瘤縮小，是否可停止追蹤？","options":[{"letter":"A","text":"代表永遠治癒"},{"letter":"B","text":"仍需依團隊安排追蹤疾病與治療相關問題"},{"letter":"C","text":"自行停檢"},{"letter":"D","text":"只需忍耐症狀"}],"answer":"B","rationale":"影像改善不等同完全治癒，仍需追蹤。"},{"stem":"患者想用草藥取代抗癌治療，護理師宜如何回應？","options":[{"letter":"A","text":"停處方藥即可"},{"letter":"B","text":"草藥都安全有效"},{"letter":"C","text":"先告知團隊所有補充品，評估交互作用，勿自行取代治療"},{"letter":"D","text":"不必告知"}],"answer":"C","rationale":"補充品可能交互作用或有毒性，勿擅自取代治療。"},{"stem":"突發劇烈頭痛、嘔吐及意識改變，護理師應如何處理？","options":[{"letter":"A","text":"安排例行追蹤"},{"letter":"B","text":"讓患者自行開車"},{"letter":"C","text":"先給食物"},{"letter":"D","text":"立即評估並通報腦部轉移或急性神經事件可能"}],"answer":"D","rationale":"新發神經警訊可能代表顱內急症，需立即評估。"},{"stem":"疑似腦轉移患者，優先神經評估為何？","options":[{"letter":"A","text":"忽略頭痛"},{"letter":"B","text":"只看尿色"},{"letter":"C","text":"指甲生長"},{"letter":"D","text":"意識、瞳孔、肢體力量及抽搐"}],"answer":"D","rationale":"神經變化可提示疾病進展或顱內壓問題。"},{"stem":"脊椎骨轉移患者移位時何者安全？","options":[{"letter":"A","text":"快速扭轉軀幹"},{"letter":"B","text":"獨自搬重物"},{"letter":"C","text":"評估骨折風險並保護脊椎，避免扭轉負重"},{"letter":"D","text":"用力按摩"}],"answer":"C","rationale":"脊椎轉移有病理性骨折及脊髓壓迫風險，需謹慎移位。"},{"stem":"肺癌患者出現杵狀指，何種解讀正確？","options":[{"letter":"A","text":"是肺癌唯一確診法"},{"letter":"B","text":"可決定分期"},{"letter":"C","text":"表示無缺氧"},{"letter":"D","text":"可能與肺部疾病相關，但非單獨確診證據"}],"answer":"D","rationale":"杵狀指是非特異性體徵，需整合其他評估。"},{"stem":"單側呼吸音減弱且胸廓不對稱，適當作法為何？","options":[{"letter":"A","text":"評估呼吸、血氧、生命徵象並通知團隊"},{"letter":"B","text":"安排步行"},{"letter":"C","text":"視為正常"},{"letter":"D","text":"只查腹部"}],"answer":"A","rationale":"可能與積液、氣胸或阻塞相關，需整體評估。"},{"stem":"少量血絲痰且生命徵象穩定，護理師應如何處置？","options":[{"letter":"A","text":"停所有藥"},{"letter":"B","text":"劇烈運動誘發咳嗽"},{"letter":"C","text":"不記錄"},{"letter":"D","text":"記錄量與特徵、追蹤變化並通知團隊"}],"answer":"D","rationale":"少量咳血仍需評估趨勢，增加或伴呼吸症狀時應緊急處理。"},{"stem":"免疫治療後黃疸、尿色變深，應如何處理？","options":[{"letter":"A","text":"當作正常染色"},{"letter":"B","text":"自行加止痛藥"},{"letter":"C","text":"療程完再說"},{"letter":"D","text":"儘速通報評估肝功能與免疫相關不良反應"}],"answer":"D","rationale":"免疫治療可能引發肝炎，黃疸需及時評估。"},{"stem":"尿量減少、口乾的肺癌患者，優先評估何者？","options":[{"letter":"A","text":"只問口渴"},{"letter":"B","text":"不看禁忌大量飲水"},{"letter":"C","text":"水分狀態、輸入輸出、腎功能及用藥"},{"letter":"D","text":"停止記尿量"}],"answer":"C","rationale":"尿少可能與脫水或腎損傷有關，需綜合評估。"},{"stem":"免疫治療後頻尿、口渴及血糖異常，應如何處理？","options":[{"letter":"A","text":"必然正常"},{"letter":"B","text":"昏迷才處理"},{"letter":"C","text":"儘速回報評估免疫相關內分泌異常"},{"letter":"D","text":"自行停飲食"}],"answer":"C","rationale":"免疫治療可能影響內分泌器官，需及早評估代謝急症。"},{"stem":"新發嚴重腹痛並持續嘔吐，護理師應如何處置？","options":[{"letter":"A","text":"視為普通噁心"},{"letter":"B","text":"未評估先給瀉藥"},{"letter":"C","text":"立即評估腹部、生命徵象及水分並通報"},{"letter":"D","text":"強迫進食"}],"answer":"C","rationale":"可能為治療毒性、阻塞或其他急症，須立即評估。"},{"stem":"居家氧氣環境安全何者正確？","options":[{"letter":"A","text":"用蠟燭測漏"},{"letter":"B","text":"設備穩固通風、遠離火源並備妥緊急聯絡"},{"letter":"C","text":"不討論故障處理"},{"letter":"D","text":"放瓦斯爐旁"}],"answer":"B","rationale":"居家氧療需防火並規劃設備故障與緊急求助方式。"},{"stem":"睡眠受咳嗽影響，使用鎮咳藥前應先評估何者？","options":[{"letter":"A","text":"用家人剩藥"},{"letter":"B","text":"痰液、呼吸狀況、症狀變化及既有藥物"},{"letter":"C","text":"只問睡眠時數"},{"letter":"D","text":"完全禁水"}],"answer":"B","rationale":"需先釐清咳嗽原因，避免抑制必要排痰或不當用藥。"},{"stem":"出院計畫何者最能促進肺癌連續照護？","options":[{"letter":"A","text":"確認用藥、警訊、回診、聯絡方式及理解"},{"letter":"B","text":"只給檢查單"},{"letter":"C","text":"讓病人自行猜"},{"letter":"D","text":"不問支持"}],"answer":"A","rationale":"出院計畫應包含藥物與追蹤資訊並確認病人理解。"},{"stem":"病人突然失去意識，旁人不確定呼吸，護理師第一步為何？","options":[{"letter":"A","text":"確認安全、評估反應呼吸並啟動急救流程"},{"letter":"B","text":"先通知家屬"},{"letter":"C","text":"先問完整病史"},{"letter":"D","text":"離開病人"}],"answer":"A","rationale":"先依急救流程評估反應及呼吸並呼叫支援。"},{"stem":"病人拒絕支氣管鏡，護理師適當處置為何？","options":[{"letter":"A","text":"未同意先鎮靜檢查"},{"letter":"B","text":"說拒絕即無照護權"},{"letter":"C","text":"強迫接受"},{"letter":"D","text":"了解疑慮、提供資訊並協助與團隊討論選項"}],"answer":"D","rationale":"尊重知情自主，協助病人釐清風險與替代方案。"},{"stem":"患者詢問肺癌治療是否一定有效，適當回答為何？","options":[{"letter":"A","text":"保證治癒"},{"letter":"B","text":"宣稱全無效"},{"letter":"C","text":"以他人預後保證相同"},{"letter":"D","text":"療效依病理、分期、分子特性與個人狀況而異"}],"answer":"D","rationale":"應避免絕對承諾，個別療效由團隊依疾病特徵評估。"},{"stem":"記錄患者吸菸史，何項資訊最完整？","options":[{"letter":"A","text":"只寫吸菸者"},{"letter":"B","text":"自行推算"},{"letter":"C","text":"過去量與年限、戒菸時間及目前狀態"},{"letter":"D","text":"不記既往暴露"}],"answer":"C","rationale":"應區分過去與目前暴露並記錄具體資料。"},{"stem":"癌症患者單側腿腫痛，護理師應優先考慮何者？","options":[{"letter":"A","text":"必定藥物過敏"},{"letter":"B","text":"按摩腿部"},{"letter":"C","text":"靜脈血栓並評估呼吸症狀，通知團隊"},{"letter":"D","text":"劇烈跑步"}],"answer":"C","rationale":"癌症增加血栓風險，避免按摩疑似血栓肢體；喘需警覺肺栓塞。"}]},{"title":"腫瘤與護理","questions":[{"stem":"病理報告指出癌細胞已在遠端器官形成病灶。此現象應如何記錄？","options":[{"letter":"A","text":"腫瘤細胞成熟度增加並依評估結果處理"},{"letter":"B","text":"局部侵犯至鄰近組織並依評估結果處理"},{"letter":"C","text":"轉移並依評估結果處理"},{"letter":"D","text":"細胞程序性死亡增加並依評估結果處理"}],"answer":"C","rationale":"遠端擴散為轉移；良性腫瘤通常不轉移。"},{"stem":"病理檢體顯示腫瘤細胞成熟，外觀與來源組織相近。此結果代表何種特性？","options":[{"letter":"A","text":"細胞形態較不成熟並依評估結果處理"},{"letter":"B","text":"病灶範圍已屬晚期並依評估結果處理"},{"letter":"C","text":"腫瘤已侵犯遠端器官並依評估結果處理"},{"letter":"D","text":"分化良好並依評估結果處理"}],"answer":"D","rationale":"描述細胞分化程度，不代表良性，也不能單獨判定分期。"},{"stem":"護理師向病人解釋TNM分期，其中M項主要描述何種狀況？","options":[{"letter":"A","text":"細胞分化成熟程度並依評估結果處理"},{"letter":"B","text":"區域淋巴結受侵犯情形"},{"letter":"C","text":"遠端轉移並依評估結果處理"},{"letter":"D","text":"原發腫瘤侵犯範圍並依評估結果處理"}],"answer":"C","rationale":"T為原發腫瘤，N為區域淋巴結，M為遠端轉移。"},{"stem":"醫師說明腫瘤分級時，護理師應指出其主要依據何者？","options":[{"letter":"A","text":"原發腫瘤及淋巴結範圍"},{"letter":"B","text":"細胞形態及分化並依評估結果處理"},{"letter":"C","text":"腫瘤造成的症狀程度並依評估結果處理"},{"letter":"D","text":"遠端轉移器官的數目並依評估結果處理"}],"answer":"B","rationale":"分級描述細胞特性；分期描述疾病範圍。"},{"stem":"病人因母親曾罹患癌症而擔心自己必然發病。何種回應最恰當？","options":[{"letter":"A","text":"可能提高部分癌症風險但非必然"},{"letter":"B","text":"有家族史應自行停用處方藥"},{"letter":"C","text":"家族史不會影響任何癌症風險"},{"letter":"D","text":"家族成員罹癌即代表本人發病"}],"answer":"A","rationale":"家族史可能提示遺傳易感性，須結合個人風險評估。"},{"stem":"健康諮詢時，民眾希望降低未來罹癌風險。下列何者屬初級預防？","options":[{"letter":"A","text":"戒菸並依評估結果處理"},{"letter":"B","text":"定期接受癌症篩檢並依評估結果處理"},{"letter":"C","text":"完成治療後定期追蹤並依評估結果處理"},{"letter":"D","text":"治療癌症相關疼痛並依評估結果處理"}],"answer":"A","rationale":"初級預防是降低致癌暴露及促進健康。"},{"stem":"無症狀民眾詢問癌症篩檢的目的。護理師如何說明最適當？","options":[{"letter":"A","text":"保證受檢者不會罹癌並依評估結果處理"},{"letter":"B","text":"確認篩檢陽性即為癌症"},{"letter":"C","text":"完全取代後續診斷檢查"},{"letter":"D","text":"無症狀族群早期發現可能病灶"}],"answer":"D","rationale":"篩檢陽性仍須進一步診斷確認。"},{"stem":"門診病人表示近期體重持續下降且吞嚥困難，護理師應建議何者？","options":[{"letter":"A","text":"建議及早就醫評估並依評估結果處理"},{"letter":"B","text":"先自行使用成藥觀察數月"},{"letter":"C","text":"將症狀直接判定為癌症"},{"letter":"D","text":"無發燒可暫不進一步評估"}],"answer":"A","rationale":"持續警訊應評估，但症狀本身不能確診癌症。"},{"stem":"影像發現腫塊後安排切片，病理檢查的主要價值為何？","options":[{"letter":"A","text":"依影像即可判定腫瘤惡性"},{"letter":"B","text":"病理提供組織診斷並依評估結果處理"},{"letter":"C","text":"藉疼痛程度確認組織型態"},{"letter":"D","text":"以腫瘤標記單獨確認病理"}],"answer":"B","rationale":"組織病理是確定腫瘤性質的重要依據。"},{"stem":"病人看到腫瘤標記升高而認為已確診癌症，護理師如何說明？","options":[{"letter":"A","text":"數值升高即代表癌症復發"},{"letter":"B","text":"單次結果可確診所有癌症"},{"letter":"C","text":"檢驗正常即可排除癌症"},{"letter":"D","text":"配合臨床用於評估或追蹤"}],"answer":"D","rationale":"標記可能受非癌因素影響，不宜單獨確診或排除。"},{"stem":"病人即將接受含顯影劑檢查，護理師檢查前應優先確認何者？","options":[{"letter":"A","text":"過敏反應史及腎功能風險"},{"letter":"B","text":"是否按摩的相關狀況並依評估結果處理"},{"letter":"C","text":"慣用手的相關狀況並依評估結果處理"},{"letter":"D","text":"最喜歡的食物的相關狀況"}],"answer":"A","rationale":"依流程評估顯影劑反應史、腎功能及檢查準備。"},{"stem":"病人完成骨髓穿刺返病房，護理師應優先評估何者？","options":[{"letter":"A","text":"穿刺處出血及生命徵象"},{"letter":"B","text":"視力的相關狀況並依評估結果處理"},{"letter":"C","text":"排尿顏色的相關狀況並依評估結果處理"},{"letter":"D","text":"味覺的相關狀況並依評估結果處理"}],"answer":"A","rationale":"須觀察出血、疼痛與感染，特別留意止血情形。"},{"stem":"病人將接受切片並詢問抗凝血藥是否自行停用，護理師如何回應？","options":[{"letter":"A","text":"與出血無關的相關狀況"},{"letter":"B","text":"永久停用的相關狀況並依評估結果處理"},{"letter":"C","text":"依醫療團隊評估調整，不可自行停"},{"letter":"D","text":"加倍服用的相關狀況並依評估結果處理"}],"answer":"C","rationale":"自行停藥有血栓風險；圍檢查用藥由團隊決定。"},{"stem":"病人排定正子攝影，護理師應先核對哪項檢查準備？","options":[{"letter":"A","text":"禁食及血糖等檢查準備"},{"letter":"B","text":"檢查後劇烈運動的相關狀況"},{"letter":"C","text":"自行停掉所有藥物並依評估結果處理"},{"letter":"D","text":"是否完成化療的相關狀況"}],"answer":"A","rationale":"準備依檢查單及機構要求辦理，不自行更動藥物。"},{"stem":"腫瘤治療前進行完整用藥核對，主要目的為何？","options":[{"letter":"A","text":"取代病史的相關狀況並依評估結果處理"},{"letter":"B","text":"辨識交互作用及安全風險"},{"letter":"C","text":"確認偏好顏色的相關狀況"},{"letter":"D","text":"避免病人提問的相關狀況"}],"answer":"B","rationale":"用藥核對可發現交互作用、出血及器官毒性風險。"},{"stem":"病人將開始化療，療程前安排全血球計數的主要目的為何？","options":[{"letter":"A","text":"評估血球基線及骨髓抑制"},{"letter":"B","text":"評估視力的相關狀況並依評估結果處理"},{"letter":"C","text":"確診腫瘤位置的相關狀況"},{"letter":"D","text":"取代影像的相關狀況並依評估結果處理"}],"answer":"A","rationale":"基線及追蹤血球有助判斷治療安全。"},{"stem":"化療前檢驗肝腎功能，主要協助團隊評估何者？","options":[{"letter":"A","text":"判定病人是否配合並依評估結果處理"},{"letter":"B","text":"協助評估藥物代謝排除與安全"},{"letter":"C","text":"保證沒有副作用的相關狀況"},{"letter":"D","text":"確診癌症的相關狀況並依評估結果處理"}],"answer":"B","rationale":"器官功能影響部分藥物代謝、排除及劑量評估。"},{"stem":"病人表示尚未理解化療風險且猶豫是否同意，護理師應如何處理？","options":[{"letter":"A","text":"代簽同意書的相關狀況"},{"letter":"B","text":"由家屬代決的相關狀況"},{"letter":"C","text":"要求立即開始的相關狀況"},{"letter":"D","text":"鼓勵提問並協助團隊說明、確認知情同意"}],"answer":"D","rationale":"病人有權理解、提問並參與決策，護理師不可代簽。"},{"stem":"化療輸注中病人主訴穿刺處灼熱且見腫脹，第一步應如何處置？","options":[{"letter":"A","text":"熱敷後繼續的相關狀況"},{"letter":"B","text":"停止輸注並依外滲流程處理"},{"letter":"C","text":"拔管丟棄所有資料並依評估結果處理"},{"letter":"D","text":"加快輸注的相關狀況並依評估結果處理"}],"answer":"B","rationale":"疑似外滲須立即停藥並依藥物專屬流程處理。"},{"stem":"護理師更換抗癌藥輸注管路時，何種作法符合安全原則？","options":[{"letter":"A","text":"徒手處理的相關狀況並依評估結果處理"},{"letter":"B","text":"依危害性藥物程序使用防護裝備"},{"letter":"C","text":"剩藥倒水槽的相關狀況"},{"letter":"D","text":"床上打開容器的相關狀況"}],"answer":"B","rationale":"依危害性藥物防護及廢棄規範可減少職業暴露。"},{"stem":"化療病人噁心影響進食，護理師應優先提供何種照護？","options":[{"letter":"A","text":"療程全程禁食的相關狀況"},{"letter":"B","text":"自行停抗癌藥的相關狀況"},{"letter":"C","text":"評估攝取並依醫囑止吐、少量多餐"},{"letter":"D","text":"告知無法處理的相關狀況"}],"answer":"C","rationale":"評估症狀、水分與營養，結合止吐治療及飲食調整。"},{"stem":"化療病人口腔黏膜紅痛，何種口腔清潔方式較適當？","options":[{"letter":"A","text":"酒精漱口的相關狀況並依評估結果處理"},{"letter":"B","text":"硬刷刮潰瘍的相關狀況"},{"letter":"C","text":"軟毛牙刷溫和清潔並依評估結果處理"},{"letter":"D","text":"停止清潔的相關狀況並依評估結果處理"}],"answer":"C","rationale":"溫和清潔減少損傷；避免刺激性用品及停止清潔。"},{"stem":"病人接受化療後足部麻木，返家照護何者最安全？","options":[{"letter":"A","text":"泡燙水的相關狀況並依評估結果處理"},{"letter":"B","text":"赤腳走路的相關狀況並依評估結果處理"},{"letter":"C","text":"每日查足並避免赤腳並依評估結果處理"},{"letter":"D","text":"不必回報的相關狀況並依評估結果處理"}],"answer":"C","rationale":"感覺減退增加燙傷外傷風險，應保護並觀察足部。"},{"stem":"病人使用具心臟毒性風險的抗癌藥，應配合追蹤何者？","options":[{"letter":"A","text":"嗅覺偏好的相關狀況並依評估結果處理"},{"letter":"B","text":"牙齒排列的相關狀況並依評估結果處理"},{"letter":"C","text":"指甲長度的相關狀況並依評估結果處理"},{"letter":"D","text":"心功能與相關症狀並依評估結果處理"}],"answer":"D","rationale":"部分抗癌藥影響心臟，依藥物及醫囑監測。"},{"stem":"化療期間病人新發呼吸困難，護理師應優先採取何種行動？","options":[{"letter":"A","text":"立即評估呼吸、生命徵象並通報"},{"letter":"B","text":"大量飲水觀察的相關狀況"},{"letter":"C","text":"步行測試的相關狀況並依評估結果處理"},{"letter":"D","text":"下次門診再說的相關狀況"}],"answer":"A","rationale":"可能為感染、肺毒性或急症，需立即評估。"},{"stem":"化療病人出現腹瀉，護理師應優先監測何者？","options":[{"letter":"A","text":"限制所有液體的相關狀況"},{"letter":"B","text":"食物顏色的相關狀況並依評估結果處理"},{"letter":"C","text":"水分狀態、次數及電解質風險"},{"letter":"D","text":"不評估而自行止瀉並依評估結果處理"}],"answer":"C","rationale":"腹瀉可能造成脫水及電解質異常。"},{"stem":"病人漏服一劑口服抗癌藥並詢問補救方式，護理師如何指導？","options":[{"letter":"A","text":"與下一劑同服的相關狀況"},{"letter":"B","text":"停藥至回診的相關狀況"},{"letter":"C","text":"下次加倍的相關狀況並依評估結果處理"},{"letter":"D","text":"依藥品指示或聯絡團隊，不自行加倍"}],"answer":"D","rationale":"漏服處理因藥而異，加倍可能增加毒性。"},{"stem":"病人服口服抗癌藥後嘔吐，詢問是否再服一劑，如何回答？","options":[{"letter":"A","text":"下月再服的相關狀況並依評估結果處理"},{"letter":"B","text":"立即服兩倍的相關狀況"},{"letter":"C","text":"先依藥品指示聯絡團隊，不自行補服"},{"letter":"D","text":" em":"乳房切除後病人表達悲傷，護理師應如何溝通？","options":[{"letter":"A","text":"要求感恩的相關狀況並依評估結果處理"},{"letter":"B","text":"叫病人別哭的相關狀況"},{"letter":"C","text":"接納感受並邀請表達並依評估結果處理"},{"letter":"D","text":"轉移話題的相關狀況並依評估結果處理"}],"answer":"C","rationale":"同理傾聽有助調適，避免否定情緒。"},{"stem":"病人詢問服用草藥能否減輕治療副作用，護理師如何回應？","options":[{"letter":"A","text":"確認成分並先與治療團隊核對"},{"letter":"B","text":"不必記錄的相關狀況並依評估結果處理"},{"letter":"C","text":"停抗癌藥改草藥的相關狀況"},{"letter":"D","text":"天然一律安全的相關狀況"}],"answer":"A","rationale":"草藥可能與治療交互作用，需先核對。"},{"stem":"病人打算以特殊飲食取代抗癌治療，護理師應如何回應？","options":[{"letter":"A","text":"尊重疑慮並提供資訊、促進團隊討論"},{"letter":"B","text":"要求停治療的相關狀況"},{"letter":"C","text":"羞辱病人的相關狀況並依評估結果處理"},{"letter":"D","text":"保證飲食治癒的相關狀況"}],"answer":"A","rationale":"尊重知情決策並澄清飲食不能取代必要診療。"},{"stem":"病人擔心癌症治療影響生育，治療前應採取何種作為？","options":[{"letter":"A","text":"治療後才討論的相關狀況"},{"letter":"B","text":"治療前討論生育保存並轉介"},{"letter":"C","text":"保證自然懷孕的相關狀況"},{"letter":"D","text":"治療均不影響的相關狀況"}],"answer":"B","rationale":"部分治療影響生育，應及早討論保存選項。"},{"stem":"病人擔心癌症治療影響性功能，護理師如何提供支持？","options":[{"letter":"A","text":"避免討論的相關狀況並依評估結果處理"},{"letter":"B","text":"不屬護理範圍的相關狀況"},{"letter":"C","text":"尊重地評估困擾並提供資訊或轉介"},{"letter":"D","text":"假設不需親密關係並依評估結果處理"}],"answer":"C","rationale":"性健康是整體照護的一部分，應尊重隱私並支持。"},{"stem":"病人因交通與費用困難可能中斷治療，護理師可如何協助？","options":[{"letter":"A","text":"告知無關照護的相關狀況"},{"letter":"B","text":"自行解決的相關狀況並依評估結果處理"},{"letter":"C","text":"評估需求並轉介社工資源"},{"letter":"D","text":"不記錄的相關狀況並依評估結果處理"}],"answer":"C","rationale":"社會資源可協助治療可近性及經濟交通障礙。"},{"stem":"病人情緒低落並表示失去希望，護理師應如何評估及處理？","options":[{"letter":"A","text":"保證治療成功的相關狀況"},{"letter":"B","text":"叫病人想開點的相關狀況"},{"letter":"C","text":"避免詢問安全的相關狀況"},{"letter":"D","text":"評估情緒與自傷風險並提供支持轉介"}],"answer":"D","rationale":"需正視心理困擾與安全風險，必要時立即轉介。"},{"stem":"病人詢問接受緩和照護是否代表停止所有抗癌治療，如何說明？","options":[{"letter":"A","text":"否，可與抗癌治療並行，重視症狀與生活品質"},{"letter":"B","text":"是，只能停止治療後接受"},{"letter":"C","text":"會加速死亡的相關狀況"},{"letter":"D","text":"僅最後一天使用的相關狀況"}],"answer":"A","rationale":"緩和照護可在疾病不同階段提供，不等於放棄照護。"},{"stem":"具決策能力病人知情後選擇不再接受抗腫瘤治療，護理師如何支持？","options":[{"letter":"A","text":"強迫治療的相關狀況並依評估結果處理"},{"letter":"B","text":"尊重選擇並持續症狀照護"},{"letter":"C","text":"只聽家屬的相關狀況並依評估結果處理"},{"letter":"D","text":"停止全部護理的相關狀況"}],"answer":"B","rationale":"病人有自主權，仍應持續舒適與支持照護。"},{"stem":"病人與家屬對治療目標看法不同，護理師應如何處理？","options":[{"letter":"A","text":"只聽聲音大的家屬並依評估結果處理"},{"letter":"B","text":"隱瞞病情的相關狀況並依評估結果處理"},{"letter":"C","text":"釐清病人價值與意願並促進團隊溝通"},{"letter":"D","text":"護理師代選的相關狀況"}],"answer":"C","rationale":"具決策能力病人之意願為核心，護理師促進溝通。"},{"stem":"病人拒絕建議的檢查，護理師首先應如何處理？","options":[{"letter":"A","text":"不記錄的相關狀況並依評估結果處理"},{"letter":"B","text":"了解原因、確認理解並與團隊溝通"},{"letter":"C","text":"強行檢查的相關狀況並依評估結果處理"},{"letter":"D","text":"威脅同意的相關狀況並依評估結果處理"}],"answer":"B","rationale":"尊重自主，確認病人了解目的、風險及替代方案。"},{"stem":"完成化療副作用衛教後，如何確認病人理解警訊及處置？","options":[{"letter":"A","text":"要求家屬代答的相關狀況"},{"letter":"B","text":"給大量資料即離開並依評估結果處理"},{"letter":"C","text":"只問懂不懂的相關狀況"},{"letter":"D","text":"請病人回述警訊及處理方式"}],"answer":"D","rationale":"回述法能確認理解並補足資訊。"},{"stem":"癌症病人準備出院，緊急衛教最需說明何者？","options":[{"letter":"A","text":"需立即聯絡的症狀及聯絡途徑"},{"letter":"B","text":"有不適自行停藥的相關狀況"},{"letter":"C","text":"不提夜間求助的相關狀況"},{"letter":"D","text":"只有下次日期的相關狀況"}],"answer":"A","rationale":"明確警訊及聯絡方式可避免急症延誤。"},{"stem":"中心靜脈導管病人返家後，何種照護指導正確？","options":[{"letter":"A","text":"自行剪導管的相關狀況"},{"letter":"B","text":"寒顫等換藥再說的相關狀況"},{"letter":"C","text":"維持清潔並留意發燒、紅腫或滲液"},{"letter":"D","text":"不潔處理接頭的相關狀況"}],"answer":"C","rationale":"遵守導管照護指引並及早回報感染徵象。"},{"stem":"化療病人返家需處理可能污染的體液或衣物，何種作法適當？","options":[{"letter":"A","text":"放食物區的相關狀況並依評估結果處理"},{"letter":"B","text":"按治療中心指引使用防護並分開處理"},{"letter":"C","text":"徒手清嘔吐物的相關狀況"},{"letter":"D","text":"與幼兒衣物混洗的相關狀況"}],"answer":"B","rationale":"部分藥物可經體液排出，依特定指引防護處理。"},{"stem":"使用居家氧氣的癌症病人仍有吸菸習慣，首要衛教為何？","options":[{"letter":"A","text":"氧氣不助燃的相關狀況"},{"letter":"B","text":"開窗即可吸菸的相關狀況"},{"letter":"C","text":"氧氣附近禁菸禁火並提供戒菸支持"},{"letter":"D","text":"提高氧流量吸菸的相關狀況"}],"answer":"C","rationale":"氧氣助燃，火災風險極高，須嚴禁火源。"},{"stem":"免疫功能 持清潔及營養。"},{"stem":"周邊神經病變病人穿鞋前，何種建議有助預防受傷？","options":[{"letter":"A","text":"赤腳試地面的相關狀況"},{"letter":"B","text":"穿緊鞋的相關狀況並依評估結果處理"},{"letter":"C","text":"尖物測感覺的相關狀況"},{"letter":"D","text":"檢查鞋內異物並穿合腳鞋襪"}],"answer":"D","rationale":"感覺減退時不易發現異物或壓傷，應先檢查鞋內。"}]}];
const $=id=>document.getElementById(id);const topicSel=$('topic');
const ALL='全部主題';topicSel.innerHTML=`<option value="${ALL}">${ALL}</option>`+BANK.map((t,i)=>`<option value="${i}">${t.title}</option>`).join('');
let list=[],pos=0,answers={},wrongIds=new Set(JSON.parse(localStorage.getItem('nurseWrong')||'[]')),marked=new Set(JSON.parse(localStorage.getItem('nurseMarked')||'[]')),runWrong=[];
const ident=q=>q.ti+'-'+q.qi;
function baseList(){let ids=[];let sel=topicSel.value;BANK.forEach((t,ti)=>{if(sel!==ALL&&Number(sel)!==ti)return;t.questions.forEach((q,qi)=>ids.push({ti,qi,...q}))});return ids}
function start(){let a=baseList();if($('range').value==='wrong')a=a.filter(q=>wrongIds.has(ident(q)));if($('range').value==='marked')a=a.filter(q=>marked.has(ident(q)));if($('shuffle').checked)a.sort(()=>Math.random()-.5);list=a;pos=0;answers={};runWrong=[];$('complete').style.display='none';$('quiz').classList.remove('hide');render()}
function render(){if(!list.length){$('quiz').classList.add('hide');$('complete').style.display='block';$('finalscore').textContent='0 題';$('summary').textContent=$('range').value==='wrong'?'目前沒有錯題，太好了！':$('range').value==='marked'?'尚未收藏題目。':'沒有符合條件的題目。';$('retryWrong').classList.add('hide');return}if(pos>=list.length){finish();return}let q=list[pos],key=ident(q),chosen=answers[key],exam=$('mode').value==='exam';$('qmeta').textContent=`${BANK[q.ti].title}　｜　第 ${q.qi+1} 題`;$('stem').textContent=q.stem;$('counter').textContent=`第 ${pos+1} / ${list.length} 題`;$('progress').style.width=(100*pos/list.length)+'%';$('prev').disabled=pos===0;$('next').textContent=pos===list.length-1?'完成本回合':'下一題';$('mark').textContent=marked.has(key)?'★ 已收藏':'☆ 收藏';let box=$('options');box.innerHTML='';q.options.forEach(o=>{let b=document.createElement('button');b.className='opt';b.innerHTML=`<span class="letter">${o.letter}</span><span></span>`;b.lastChild.textContent=o.text;if(chosen!==undefined){b.disabled=true;if(!exam&&o.letter===q.answer)b.classList.add('correct');if(!exam&&o.letter===chosen&&chosen!==q.answer)b.classList.add('wrong')}else if(exam&&answers[key]!==undefined)b.disabled=true;b.onclick=()=>select(o.letter);box.appendChild(b)});let f=$('feedback');f.className='feedback';if(chosen!==undefined&&!exam){f.classList.add('show',chosen===q.answer?'ok':'no');f.innerHTML=`<b>${chosen===q.answer?'答對了！':'答案是 '+q.answer+'。'}</b>${q.rationale}`}else if(exam&&chosen!==undefined){f.classList.add('show');f.innerHTML='<b>已記錄答案</b>測驗模式將於本回合結束後顯示答案與解析。'}else if(chosen!==undefined&&exam){f.classList.add('show');f.innerHTML=`<b>本題答案：${q.answer}</b>${q.rationale}`}updateStats()}
function select(letter){let q=list[pos],key=ident(q);if(answers[key]!==undefined)return;answers[key]=letter;if(letter!==q.answer){wrongIds.add(key);runWrong.push(key)}else wrongIds.delete(key);save();if($('mode').value==='exam'){updateStats();render()}else render()}
function updateStats(){let answered=Object.keys(answers).length,correct=Object.entries(answers).filter(([k,v])=>{let q=list.find(x=>ident(x)===k);return q&&v===q.answer}).length;$('score').textContent=`答對 ${correct} / 已答 ${answered}`}
function finish(){let correct=Object.entries(answers).filter(([k,v])=>{let q=list.find(x=>ident(x)===k);return q&&v===q.answer}).length;$('quiz').classList.add('hide');$('complete').style.display='block';$('finalscore').textContent=`${correct} / ${list.length}`;$('summary').textContent=`答對 ${correct} 題，答錯 ${list.length-correct} 題。進度已保存在這台裝置。`;$('retryWrong').classList.toggle('hide',runWrong.length===0);$('progress').style.width='100%'}
function save(){localStorage.setItem('nurseWrong',JSON.stringify([...wrongIds]));localStorage.setItem('nurseMarked',JSON.stringify([...marked]))}
$('prev').onclick=()=>{pos=Math.max(0,pos-1);render()};$('next').onclick=()=>{if(pos===list.length-1){finish();return}pos++;render()};$('mark').onclick=()=>{let key=ident(list[pos]);marked.has(key)?marked.delete(key):marked.add(key);save();render()};$('topic').onchange=start;$('range').onchange=start;$('mode').onchange=start;$('shuffle').onchange=start;$('jump').onkeydown=e=>{if(e.key==='Enter'){let n=Number(e.target.value);if(n>=1&&n<=100){let ix=list.findIndex(q=>q.qi===n-1);if(ix>=0){pos=ix;render()}else alert('目前的題目範圍中找不到此題號。')}}};$('restart').onclick=start;$('retryWrong').onclick=()=>{$('range').value='wrong';start()};start();
</script></body></html>
