<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123a4a"><title>護理科內外科｜隨身刷題</title>
<style>
:root{--ink:#183b48;--muted:#60747c;--teal:#167c76;--bg:#f2f6f5;--card:#fff;--line:#dce7e4;--ok:#16744c;--bad:#b8403b;--gold:#efb84f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;line-height:1.55}.app{max-width:760px;margin:auto;min-height:100vh;padding:0 16px 34px}.top{margin:0 -16px 16px;padding:18px 18px 16px;background:linear-gradient(135deg,#123a4a,#167c76);color:white;position:sticky;top:0;z-index:3;box-shadow:0 4px 14px #15394422}.top h1{font-size:20px;margin:0 0 3px}.top p{margin:0;font-size:12px;opacity:.85}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.controls label{font-size:12px;color:var(--muted);font-weight:700}.controls select,.controls input{width:100%;margin-top:4px;padding:11px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-size:15px}.switchrow{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:4px 0 12px}.stats{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin:10px 1px}.bar{height:7px;background:#dce7e4;border-radius:9px;overflow:hidden;margin:0 0 14px}.bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .2s}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 6px 22px #193f4a0b}.qmeta{color:var(--teal);font-size:12px;font-weight:800;margin-bottom:8px}.stem{font-size:18px;font-weight:750;line-height:1.55;margin:0 0 16px}.opt{width:100%;display:flex;align-items:flex-start;text-align:left;gap:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:12px;border-radius:13px;margin:9px 0;font-size:15px;line-height:1.45;cursor:pointer}.opt:active{transform:scale(.99)}.letter{flex:none;width:26px;height:26px;border-radius:50%;background:#eaf2f0;color:#315c60;display:grid;place-items:center;font-weight:800;font-size:13px}.opt.selected{border-color:var(--teal);background:#edf7f5}.opt.correct{border-color:#65ad84;background:#eff9f2}.opt.wrong{border-color:#d9827b;background:#fff2f0}.opt:disabled{cursor:default}.feedback{display:none;margin-top:12px;padding:13px;border-radius:12px;font-size:14px}.feedback.show{display:block}.feedback.ok{background:#eef8f1;border:1px solid #d2ead8}.feedback.no{background:#fff4f2;border:1px solid #f0d4cf}.feedback b{display:block;margin-bottom:5px}.actions{display:flex;gap:9px;margin-top:14px}.btn{border:0;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:750;cursor:pointer}.primary{background:var(--teal);color:#fff;flex:1}.secondary{background:#e8efed;color:var(--ink)}.small{font-size:12px;color:var(--muted);text-align:center;margin:12px 0}.empty{text-align:center;padding:32px 16px;color:var(--muted)}.complete{display:none;text-align:center;padding:26px 16px}.complete h2{margin:0 0 8px}.complete .score{font-size:36px;font-weight:850;color:var(--teal)}.hide{display:none!important}@media(min-width:620px){.app{padding-top:10px}.top{border-radius:0 0 18px 18px}.stem{font-size:20px}}
</style></head><body><main class="app"><header class="top"><h1>護理科內外科｜隨身刷題</h1><p>10 個主題・1,000 題・情境判斷與均衡答案位置｜附解析｜可離線使用</p></header>
<div class="controls"><label>選擇主題<select id="topic"></select></label><label>練習模式<select id="mode"><option value="practice">逐題練習（答後看解析）</option><option value="exam">測驗模式（最後看成績）</option></select></label></div>
<div class="controls"><label>題目範圍<select id="range"><option value="all">全部題目</option><option value="wrong">錯題重練</option><option value="marked">我的收藏</option></select></label><label>快速跳題<input id="jump" type="number" min="1" max="100" placeholder="輸入題號 1–100"></label></div>
<div class="switchrow"><input type="checkbox" id="shuffle"> <label for="shuffle">隨機出題（每次開始重新抽序）</label></div>
<div class="stats"><span id="counter">準備開始</span><span id="score">答對 0 / 已答 0</span></div><div class="bar"><i id="progress"></i></div>
<section class="card" id="quiz"><div class="qmeta" id="qmeta"></div><p class="stem" id="stem"></p><div id="options"></div><div class="feedback" id="feedback"></div><div class="actions"><button class="btn secondary" id="prev">上一題</button><button class="btn secondary" id="mark">☆ 收藏</button><button class="btn primary" id="next">下一題</button></div></section>
<section class="card complete" id="complete"><h2>本回合完成</h2><div class="score" id="finalscore"></div><p id="summary"></p><button class="btn primary" id="retryWrong">重練本回合錯題</button><div style="height:8px"></div><button class="btn secondary" id="restart">重新開始</button></section>
<p class="small">題目為學習練習用途，非官方考題；臨床照護請遵循最新指引與機構規範。</p></main>
<script>
const BANK=[{"title":"呼吸系統處置","questions":[{"stem":"肺炎病人突然呼吸急促、嘴唇發紺，脈搏血氧飽和度持續下降。護理師應優先採取何項措施？","options":[{"letter":"A","text":"協助側臥並先進行完整肺部叩診"},{"letter":"B","text":"協助高坐臥並立即評估呼吸與氧合"},{"letter":"C","text":"協助半坐臥並先完成痰液培養採檢"},{"letter":"D","text":"維持原姿勢並先查閱最近胸部影像"}],"answer":"B","rationale":"發紺與血氧下降提示急性氧合障礙，應先改善姿勢並評估氣道、呼吸及氧合，隨即提供必要支持。"},{"stem":"病人呼吸時出現胸骨上凹陷，並明顯使用頸部輔助呼吸肌。此項觀察最適合判讀為何？","options":[{"letter":"A","text":"呼吸肌活動較強，顯示氧合已改善"},{"letter":"B","text":"呼吸頻率代償下降，顯示通氣改善"},{"letter":"C","text":"胸壁活動受到限制，主要反映疼痛"},{"letter":"D","text":"呼吸作功明顯增加，可能出現窘迫"}],"answer":"D","rationale":"胸骨上凹陷與輔助呼吸肌使用均是呼吸作功增加的徵象，須警覺氣道阻塞或呼吸窘迫。"},{"stem":"慢性阻塞性肺病病人走路後感到喘，護理師示範縮唇呼吸。何項指導最適當？","options":[{"letter":"A","text":"以口緩慢吸氣，再經鼻快速吐氣"},{"letter":"B","text":"以鼻深吸氣後，閉氣直到喘感減輕"},{"letter":"C","text":"以鼻吸氣後縮唇，緩慢延長吐氣"},{"letter":"D","text":"以鼻緩慢吸氣，再用力快速吐盡"}],"answer":"C","rationale":"縮唇呼吸以緩慢、較長的呼氣維持氣道壓力，有助減少小氣道提早塌陷與氣體滯留。"},{"stem":"慢性阻塞性肺病病人經評估可耐受腹式呼吸訓練。護理師請其將手放在腹部，應指導何種動作？","options":[{"letter":"A","text":"吸氣時收緊腹肌，吐氣時維持收縮"},{"letter":"B","text":"吸氣時抬高雙肩，吐氣時放鬆腹部"},{"letter":"C","text":"吸氣時腹部內縮，吐氣時腹部鼓起"},{"letter":"D","text":"吸氣時腹部鼓起，吐氣時腹部內縮"}],"answer":"D","rationale":"腹式呼吸以橫膈活動為主，吸氣時腹部上升、吐氣時下降；訓練仍須依病人耐受性調整。"},{"stem":"病人使用鼻導管氧氣後抱怨鼻腔乾燥，氧合仍需氧療維持。護理師應如何處理？","options":[{"letter":"A","text":"縮短氧療時間，改以間歇給氧緩解"},{"letter":"B","text":"調降氧氣流量，待鼻腔舒適後再評估"},{"letter":"C","text":"評估鼻黏膜，依需要採適當加濕措施"},{"letter":"D","text":"改用氧氣面罩，維持原設定後觀察"}],"answer":"C","rationale":"應先評估黏膜與設備需求，採適當加濕或水性保濕措施；低流量氧療並非一律需要加濕，也不可僅因乾燥任意降低必要氧療。"},{"stem":"病人準備返家使用氧氣，家屬詢問居家環境如何安排。何項衛教最重要？","options":[{"letter":"A","text":"將氧氣設備遠離火源，禁止室內吸菸"},{"letter":"B","text":"將氧氣鋼瓶直立固定，避免設備傾倒"},{"letter":"C","text":"將氧氣管線沿牆固定，減少行走絆倒"},{"letter":"D","text":"將氧氣設備靠近窗邊，保持室內通風"}],"answer":"A","rationale":"氧氣具有助燃作用，禁菸與遠離火源是預防燃燒傷害的首要措施；設備固定與管線安全也須落實。"},{"stem":"肺炎病人開始氧療後，護理師欲判斷氧合是否改善。何組資料最具直接參考價值？","options":[{"letter":"A","text":"每日體重變化與液體出入量的紀錄"},{"letter":"B","text":"體溫變化與白血球計數的追蹤結果"},{"letter":"C","text":"血氧飽和度趨勢與呼吸窘迫的變化"},{"letter":"D","text":"痰液顏色變化與每日痰量的紀錄"}],"answer":"C","rationale":"血氧飽和度趨勢配合呼吸型態、意識與膚色，較能直接評估氧療效果；感染或體液資料不能取代氧合評估。"},{"stem":"病人意識清楚、無明顯呼吸窘迫，但指尖血氧讀值忽高忽低，手指冰冷且訊號不佳。護理師宜先如何處理？","options":[{"letter":"A","text":"先停止氧療數分鐘，再比較兩次讀值"},{"letter":"B","text":"改測另一指尖一次，直接採用較高值"},{"letter":"C","text":"維持目前探頭位置，增加氧流量再測"},{"letter":"D","text":"溫暖末梢並確認探頭，檢查訊號再測"}],"answer":"D","rationale":"末梢灌流不佳與探頭位置不當可能造成誤讀，應改善測量條件並確認訊號品質，再結合臨床狀況判斷。"},{"stem":"病人完成橈動脈血液氣體採樣後，穿刺處仍有少量滲血。護理師最適當的處置為何？","options":[{"letter":"A","text":"以冰袋覆蓋傷口，觀察局部腫脹變化"},{"letter":"B","text":"輕揉穿刺處周圍，促進血液循環恢復"},{"letter":"C","text":"直接持續加壓止血，並評估遠端灌流"},{"letter":"D","text":"以彈性繃帶包紮，稍後再檢查手部"}],"answer":"C","rationale":"動脈穿刺後須直接加壓至止血，並觀察血腫及遠端循環；不宜按摩穿刺處。"},{"stem":"呼吸變淺的病人動脈血液氣體顯示pH降低、PaCO₂升高，HCO₃⁻仍在參考範圍。最符合何種酸鹼異常？","options":[{"letter":"A","text":"以二氧化碳滯留為主的呼吸性酸中毒"},{"letter":"B","text":"以二氧化碳排出增加為主的呼吸性鹼中毒"},{"letter":"C","text":"以碳酸氫根增加為主的代謝性鹼中毒"},{"letter":"D","text":"以碳酸氫根流失為主的代謝性酸中毒"}],"answer":"A","rationale":"pH降低合併PaCO₂升高支持呼吸性酸中毒；HCO₃⁻未升高表示尚未出現明顯腎臟代償。"},{"stem":"病人即將接受肺功能檢查，詢問候診時能否抽菸。護理師應如何回應？","options":[{"letter":"A","text":"改抽低焦油香菸，減少對測值的影響"},{"letter":"B","text":"抽菸後先休息片刻，再照原時間檢查"},{"letter":"C","text":"候診時可少量抽菸，入檢查室前停止"},{"letter":"D","text":"依檢查單位規定禁菸，避免影響測值"}],"answer":"D","rationale":"抽菸可能影響氣道與肺功能測量，應依檢查單位指示避免抽菸，並確認檢查前用藥規定。"},{"stem":"病人接受使用咽喉局部麻醉的支氣管鏡檢查後，呼吸穩定但感到口渴。何項處置最適當？","options":[{"letter":"A","text":"協助含冰塊潤喉，待不適減輕再飲水"},{"letter":"B","text":"先給少量溫開水，再觀察是否有咳嗽"},{"letter":"C","text":"先給濃稠流質食物，避免清水嗆入"},{"letter":"D","text":"確認咽喉反射恢復，再依指示給飲食"}],"answer":"D","rationale":"咽喉局部麻醉會降低保護性反射，恢復前飲水、含冰或進食均可能造成吸入。"},{"stem":"胸腔穿刺後，病人突然出現患側胸痛、呼吸困難，該側呼吸音明顯減弱。護理師應優先懷疑何種併發症？","options":[{"letter":"A","text":"胸膜腔進氣造成的醫源性氣胸"},{"letter":"B","text":"肺部感染造成的肺泡實質浸潤"},{"letter":"C","text":"支氣管痙攣造成的急性氣流受限"},{"letter":"D","text":"黏液栓塞造成的局部肺葉不張"}],"answer":"A","rationale":"胸腔穿刺後突發單側胸痛、呼吸困難與呼吸音減弱，應優先警覺醫源性氣胸並立即通報。"},{"stem":"育齡病人準備接受胸部X光檢查，尚未確認妊娠可能。護理師檢查前最應完成何項評估？","options":[{"letter":"A","text":"詢問近期呼吸道感染及抗生素使用"},{"letter":"B","text":"詢問最近進食時間及吞嚥功能狀況"},{"letter":"C","text":"詢問懷孕可能，依放射檢查流程處理"},{"letter":"D","text":"詢問含碘顯影劑反應及腎功能狀況"}],"answer":"C","rationale":"涉及游離輻射的檢查須確認妊娠可能，依流程進行必要性與暴露風險評估；一般胸部X光不使用含碘顯影劑。"},{"stem":"肺炎病人需採集痰液培養，能自行有效咳嗽。何項採檢指導最適當？","options":[{"letter":"A","text":"以清水漱口後，收集口腔內自然分泌液"},{"letter":"B","text":"先進食溫熱早餐，再收集餐後咳出物"},{"letter":"C","text":"以消毒液漱口後，收集第一口咳出物"},{"letter":"D","text":"以清水漱口後，深咳痰液入無菌容器"}],"answer":"D","rationale":"痰液培養應取得下呼吸道分泌物，清水漱口可減少口腔污染；唾液與食物殘渣會降低檢體品質。"},{"stem":"醫師開立痰液培養及首劑抗生素，病人目前穩定且可立即咳痰。護理師應如何安排？","options":[{"letter":"A","text":"先給首劑抗生素，再於次日清晨採痰"},{"letter":"B","text":"先觀察抗生素反應，再決定是否採痰"},{"letter":"C","text":"先待體溫恢復正常，再安排痰液採集"},{"letter":"D","text":"先迅速採集痰液，再給予首劑抗生素"}],"answer":"D","rationale":"狀況允許時，抗生素前採檢可提高培養的判讀價值；不得為等待檢體而延誤必要的急性治療。"},{"stem":"肺炎病人開始抗生素治療後，護理師欲同時評估療效與用藥安全。何組資料最適當？","options":[{"letter":"A","text":"體溫、呼吸與痰液變化及不良反應"},{"letter":"B","text":"飲食攝取、睡眠時數與每日活動量"},{"letter":"C","text":"疼痛程度、關節活動與皮膚完整性"},{"letter":"D","text":"體重、下肢水腫與每日液體出入量"}],"answer":"A","rationale":"體溫、呼吸及痰液變化可反映感染治療反應，並須同步觀察過敏、腹瀉等藥物不良反應。"},{"stem":"病人服用抗生素後出現全身蕁麻疹、喘鳴及嘴唇腫脹。護理師應優先採取何項行動？","options":[{"letter":"A","text":"依處方給口服抗組織胺，稍後重新評估"},{"letter":"B","text":"啟動緊急處置，支持氣道循環並求援"},{"letter":"C","text":"提供口腔冰敷，觀察腫脹是否自行減輕"},{"letter":"D","text":"安排過敏檢驗，待結果確認後調整藥物"}],"answer":"B","rationale":"皮膚症狀合併喘鳴及血管性水腫提示過敏性休克風險，須立即啟動處置，依流程準備肌肉注射腎上腺素並暫停後續致敏藥物。"},{"stem":"流感病人在病室咳嗽時常直接用手遮住口鼻。護理師應提供何項衛教？","options":[{"letter":"A","text":"面向病室空曠區咳嗽，避免接觸物品"},{"letter":"B","text":"咳嗽時暫時摘下口罩，離床後再戴回"},{"letter":"C","text":"持續用手遮住口鼻，咳完擦乾即可"},{"letter":"D","text":"改用衛生紙或手肘遮掩，並清潔雙手"}],"answer":"D","rationale":"使用衛生紙或手肘遮掩咳嗽並執行手部衛生，可減少飛沫散布及手部污染造成的傳播。"},{"stem":"病人因長期咳嗽與疑似肺結核住院，尚待檢驗確認。護理師應優先安排何種感染管制？","options":[{"letter":"A","text":"採標準防護，抽痰時再佩戴醫用口罩"},{"letter":"B","text":"採飛沫隔離，進房時佩戴醫用口罩"},{"letter":"C","text":"採接觸隔離，進房時穿隔離衣與手套"},{"letter":"D","text":"採空氣隔離，進房時使用適當呼吸防護"}],"answer":"D","rationale":"疑似具傳染性的肺結核即應採空氣隔離，工作人員使用經適合度測試的N95或同等級呼吸防護具，不必等待確診。"},{"stem":"疑似肺結核病人需深咳採集痰液。護理師應優先選擇何種採檢地點？","options":[{"letter":"A","text":"院內指定具適當通風的隔離採檢區"},{"letter":"B","text":"病房走廊末端，避開人員活動時採集"},{"letter":"C","text":"共用浴室內，開啟一般抽風設備採集"},{"letter":"D","text":"一般單人病室內，關閉房門後採集"}],"answer":"A","rationale":"深咳採痰可能散布感染性微粒，應在符合空氣傳播感染管制要求的指定區域採集。"},{"stem":"肺結核病人服藥後咳嗽減輕，表示想自行停止部分藥物。護理師應如何衛教？","options":[{"letter":"A","text":"依原療程規律服藥，勿因改善自行停藥"},{"letter":"B","text":"先停用較易不適的藥，待咳嗽復發再用"},{"letter":"C","text":"先減少每日服藥次數，觀察症狀變化"},{"letter":"D","text":"先保留症狀改善最快的藥，再回診討論"}],"answer":"A","rationale":"抗結核治療需規律完成療程，自行減藥或停藥可能造成治療失敗、復發及抗藥性。"},{"stem":"使用抗結核藥物的病人發現眼白與皮膚變黃，致電詢問是否可等下次門診。何項建議最適當？","options":[{"letter":"A","text":"先改於餐後服藥，觀察黃疸是否減輕"},{"letter":"B","text":"先增加每日飲水量，記錄尿色再回診"},{"letter":"C","text":"儘速聯絡醫療團隊，評估藥物肝毒性"},{"letter":"D","text":"先調整飲食油脂量，維持原追蹤時間"}],"answer":"C","rationale":"黃疸可能提示藥物相關肝損傷，須儘速評估肝功能及用藥，不宜等待例行回診或僅以飲食調整處理。"},{"stem":"服用異菸肼的病人出現新症狀。何項最提示周邊神經病變，應回報醫療團隊？","options":[{"letter":"A","text":"雙手雙腳持續麻木，伴隨刺痛感覺"},{"letter":"B","text":"久坐後肩頸痠痛，伸展後逐漸減輕"},{"letter":"C","text":"進食後偶有腹脹，排氣後明顯改善"},{"letter":"D","text":"起床時輕微鼻塞，活動後逐漸緩解"}],"answer":"A","rationale":"異菸肼可能造成周邊神經病變，肢端麻木或刺痛須回報，並由醫療團隊評估維生素B6補充。"},{"stem":"使用利福平的病人發現尿液呈橘紅色，沒有排尿疼痛或其他新不適。護理師應如何說明？","options":[{"letter":"A","text":"可能是水分不足，增加飲水後再服藥"},{"letter":"B","text":"可能是尿路感染，需先改用其他藥物"},{"letter":"C","text":"可能是藥物肝毒性，需立即急救處置"},{"letter":"D","text":"可為藥物體液染色，依指示持續服藥"}],"answer":"D","rationale":"利福平可使尿液、汗液及淚液呈橘紅色，屬常見藥物作用；若合併其他異常症狀仍須回報。"},{"stem":"氣喘病人突然喘鳴，說話須中斷換氣。護理師應優先採取何項措施？","options":[{"letter":"A","text":"評估用藥遵從性，先補足日常控制藥"},{"letter":"B","text":"評估呼吸訓練技巧，先練習腹式呼吸"},{"letter":"C","text":"評估誘發因素，先完成居家環境衛教"},{"letter":"D","text":"評估呼吸嚴重度，依處方給急救吸入藥"}],"answer":"D","rationale":"說話受限提示較嚴重的急性氣流阻塞，應立即評估並依處方使用急救型支氣管擴張劑，同步支持氧合與求援。"},{"stem":"氣喘病人吸入短效β₂致效劑後喘感改善，但出現輕微手抖。護理師最適當的回應為何？","options":[{"letter":"A","text":"可能是過敏反應，先停用所有吸入藥物"},{"letter":"B","text":"可能是氣喘未控制，先增加吸入劑量"},{"letter":"C","text":"可能是常見副作用，評估心悸及嚴重度"},{"letter":"D","text":"可能是低血糖，先補充糖分再使用藥物"}],"answer":"C","rationale":"短效β₂致效劑可引起手抖及心悸，應評估程度與生命徵象，不能僅憑手抖自行加藥或認定為過敏。"},{"stem":"病人開始使用吸入型類固醇。為降低口腔念珠菌感染風險，使用後應如何照護？","options":[{"letter":"A","text":"以清水輕含片刻，再吞下漱口水"},{"letter":"B","text":"以溫水飲用潤喉，再擦拭嘴唇周圍"},{"letter":"C","text":"以牙刷清潔門牙，再直接進食點心"},{"letter":"D","text":"以清水充分漱口，再吐掉漱口水"}],"answer":"D","rationale":"吸入型類固醇使用後漱口並吐掉漱口水，可減少口咽部藥物殘留及念珠菌感染風險。"},{"stem":"病人依處方需在同一時段分別使用短效支氣管擴張劑及吸入型類固醇，兩者為不同吸入器。一般應如何安排？","options":[{"letter":"A","text":"先吸類固醇，待喘感改善再吸擴張劑"},{"letter":"B","text":"先吸擴張劑，再依裝置指示吸類固醇"},{"letter":"C","text":"先吸類固醇，再依裝置指示吸擴張劑"},{"letter":"D","text":"將兩藥交替噴出，再同時深吸入氣道"}],"answer":"B","rationale":"分別使用時通常先擴張氣道，再使用吸入型類固醇；實際操作與間隔仍應遵循處方及裝置指示。"},{"stem":"病人使用傳統需手動按壓的定量噴霧吸入器，未加輔助艙。何項操作正確？","options":[{"letter":"A","text":"先按壓後再緩慢吸氣，吸完立即咳嗽"},{"letter":"B","text":"快速深吸時按壓藥罐，吸完立即吐氣"},{"letter":"C","text":"先深吸後再按壓藥罐，隨即緩慢吐氣"},{"letter":"D","text":"緩慢深吸時同步按壓，吸完短暫閉氣"}],"answer":"D","rationale":"定量噴霧吸入器需協調按壓與緩慢深吸氣，吸入後短暫閉氣可增加藥物沉積。"},{"stem":"護理師觀察病人使用乾粉吸入器。何項吸氣技巧最適當？","options":[{"letter":"A","text":"先向外吐氣，再經鼻緩慢而深地吸入"},{"letter":"B","text":"先向內吐氣，再經口快速而深地吸入"},{"letter":"C","text":"先向內吐氣，再經口緩慢而淺地吸入"},{"letter":"D","text":"先向外吐氣，再經口快速而深地吸入"}],"answer":"D","rationale":"乾粉吸入器通常需要足夠快速且深的經口吸氣帶動藥粉；吐氣應避開裝置，避免水氣使藥粉受潮。"},{"stem":"氣喘病人近來夜間常因喘醒，急救吸入器使用次數也增加，目前未呈急性窘迫。護理師應建議何者？","options":[{"letter":"A","text":"改在睡前使用急救藥，維持原回診日"},{"letter":"B","text":"先暫停控制型藥物，確認是否藥物所致"},{"letter":"C","text":"儘速回診評估控制程度與治療計畫"},{"letter":"D","text":"先減少日間活動量，觀察夜間症狀"}],"answer":"C","rationale":"夜間症狀與急救藥需求增加提示氣喘控制不佳，須評估吸入技巧、遵從性及治療計畫，而非自行調藥。"},{"stem":"氣喘病人練習峰流速測量。何項作法最有助取得可信的紀錄？","options":[{"letter":"A","text":"咳嗽後快速吹氣一次，直接記錄該測值"},{"letter":"B","text":"深吸後快速用力吹氣，重測記錄最高值"},{"letter":"C","text":"坐直後緩慢吐氣三次，記錄三次平均值"},{"letter":"D","text":"淺吸後持續緩慢吹氣，重測記錄最低值"}],"answer":"B","rationale":"峰流速測量需充分吸氣後快速用力呼氣，通常重複三次並記錄有效測量中的最高值。"},{"stem":"氣喘病人的峰流速落入個人書面行動計畫的危險區，並感到呼吸困難。最適當的處理為何？","options":[{"letter":"A","text":"先補足控制藥物，維持原定門診追蹤"},{"letter":"B","text":"立即依計畫急救，並尋求醫療協助"},{"letter":"C","text":"先增加運動暖身，再重新測量峰流速"},{"letter":"D","text":"先休息至隔日，再測量確認是否持續"}],"answer":"B","rationale":"危險區合併呼吸困難提示嚴重氣流受限，應依個人化計畫立即處理並求助，不能等待例行追蹤。"},{"stem":"慢性阻塞性肺病急性惡化病人有低血氧，醫師已開立氧療目標。護理師應如何給氧？","options":[{"letter":"A","text":"先等待血氣結果，確認無滯留後才給氧"},{"letter":"B","text":"先提高至最大流量，待症狀消失再減量"},{"letter":"C","text":"先維持最低流量，僅依喘感決定調整"},{"letter":"D","text":"依目標滴定氧氣，追蹤氧合及通氣狀態"}],"answer":"D","rationale":"低氧須及時治療，並依目標滴定氧氣、監測血氧及必要的血氣；不能因擔心二氧化碳滯留而延誤給氧。"},{"stem":"慢性阻塞性肺病病人穿衣與洗澡時容易喘。何項節能衛教最適當？","options":[{"letter":"A","text":"活動時縮短吐氣，利用閉氣增加力量"},{"letter":"B","text":"集中完成費力活動，結束後再充分休息"},{"letter":"C","text":"分段活動安排休息，費力時配合吐氣"},{"letter":"D","text":"活動前延長臥床，當日避免離床走動"}],"answer":"C","rationale":"分段活動、休息與費力時吐氣可降低呼吸負荷；閉氣用力可能增加不適，不宜取代節能技巧。"},{"stem":"慢性阻塞性肺病病人痰液黏稠，無限水指示且可安全飲水。何項措施較有助排痰？","options":[{"letter":"A","text":"睡前使用止咳措施，減少夜間痰液移動"},{"letter":"B","text":"適當補充水分，配合有效咳嗽排痰"},{"letter":"C","text":"減少飲水並增加休息，避免咳嗽疲累"},{"letter":"D","text":"採持續快速淺呼吸，使分泌物向上移動"}],"answer":"B","rationale":"適當水分與有效咳嗽有助分泌物排出，仍須依心腎功能及吞嚥安全調整。"},{"stem":"慢性阻塞性肺病病人詢問肺復健的預期效益。護理師應如何說明？","options":[{"letter":"A","text":"主要改善運動耐受、症狀與日常功能"},{"letter":"B","text":"主要增加肺泡數目，改善既有結構破壞"},{"letter":"C","text":"主要縮短藥物療程，減少感染治療需求"},{"letter":"D","text":"主要提高靜態肺容量，消除固定氣流受限"}],"answer":"A","rationale":"肺復健結合運動、教育與自我管理，可改善活動能力及生活品質，但無法逆轉既有肺泡破壞。"},{"stem":"慢性阻塞性肺病病人認為肺已受損，戒菸沒有意義。護理師何項回應最適當？","options":[{"letter":"A","text":"只在症狀加重時戒菸，即可避免病情進展"},{"letter":"B","text":"戒菸可減緩肺功能惡化，可提供戒菸支持"},{"letter":"C","text":"先完成肺復健療程，再戒菸較能恢復肺泡"},{"letter":"D","text":"改抽低焦油香菸，可達到相近保護效果"}],"answer":"B","rationale":"戒菸可減緩肺功能下降並降低其他健康風險，應提供行為支持及適當藥物協助，不宜宣稱可恢復已破壞的肺泡。"},{"stem":"肺氣腫病人呈桶狀胸。護理師解釋此表現時，應指出何種主要機轉？","options":[{"letter":"A","text":"胸膜液體壓迫肺部，造成胸廓擴張"},{"letter":"B","text":"肺泡廣泛塌陷縮小，造成胸廓固定"},{"letter":"C","text":"肺泡破壞降低回縮力，造成氣體滯留"},{"letter":"D","text":"支氣管急性收縮，造成胸壁肌肉增厚"}],"answer":"C","rationale":"肺泡破壞使彈性回縮力下降，呼氣時氣體滯留與過度充氣，可形成桶狀胸。"},{"stem":"慢性支氣管炎病人長期咳嗽、咳痰。何種病理變化最能解釋此表現？","options":[{"letter":"A","text":"肺泡間隔破壞，導致氣體交換面積減少"},{"letter":"B","text":"肺泡表面張力上升，導致肺泡反覆塌陷"},{"letter":"C","text":"氣道慢性發炎，導致黏液分泌量增加"},{"letter":"D","text":"胸膜纖維增厚，導致胸廓擴張受到限制"}],"answer":"C","rationale":"慢性支氣管炎的核心變化為氣道慢性發炎及黏液分泌增加，造成咳嗽、咳痰與氣流受限。"},{"stem":"病人突發右側胸痛與呼吸困難，右胸叩診呈過清音，呼吸音減弱。最應優先懷疑何者？","options":[{"letter":"A","text":"胸膜腔積液壓迫肺部所致的胸腔積液"},{"letter":"B","text":"肺實質發炎浸潤所致的右側肺炎"},{"letter":"C","text":"肺泡內液體增加所致的急性肺水腫"},{"letter":"D","text":"胸膜腔內空氣累積所致的右側氣胸"}],"answer":"D","rationale":"急性單側胸痛、呼吸音減弱與叩診過清音支持氣胸；胸腔積液或實質浸潤通常呈濁音。"},{"stem":"胸部外傷病人疑似張力性氣胸，出現嚴重呼吸窘迫、低血壓及頸靜脈怒張。護理師應如何處理？","options":[{"letter":"A","text":"立即啟動急救，準備減壓而不等待影像"},{"letter":"B","text":"先追蹤血氧變化，待血壓回升後再通報"},{"letter":"C","text":"先採動脈血氣檢查，依數據決定求援時機"},{"letter":"D","text":"先安排胸部電腦斷層，確認後再準備處置"}],"answer":"A","rationale":"張力性氣胸可迅速造成阻塞性休克，臨床高度懷疑且循環不穩時，不可為影像確認延誤緊急減壓。"},{"stem":"病人胸管水封室的液面隨吸氣與吐氣起伏，呼吸狀態穩定。此現象通常表示何者？","options":[{"letter":"A","text":"引流管路受到阻塞，需立即強力擠壓"},{"letter":"B","text":"胸腔壓力變化仍可傳導至水封系統"},{"letter":"C","text":"肺部已完成再擴張，可以立即拔除胸管"},{"letter":"D","text":"胸管位置已移出胸腔，需立即重新置管"}],"answer":"B","rationale":"水封液面隨呼吸波動通常反映胸腔壓力傳導，但不能單憑此現象判定肺已完全擴張或決定拔管。"},{"stem":"護理師發現胸管引流裝置的水封室持續冒泡，並非抽吸控制室冒泡。應如何處理？","options":[{"letter":"A","text":"評估病人與漏氣，依流程檢查接頭並通報"},{"letter":"B","text":"增加抽吸壓力，待水封冒泡減少後再評估"},{"letter":"C","text":"持續夾閉胸管，待下一班確認漏氣來源"},{"letter":"D","text":"提高引流裝置，利用液體逆流重建水封"}],"answer":"A","rationale":"水封室持續冒泡可能來自病人或系統漏氣，須評估並檢查連接；長時間任意夾管可能導致張力性氣胸。"},{"stem":"病人翻身時胸管意外從胸壁脫出。護理師發現後應優先採取何項措施？","options":[{"letter":"A","text":"先將原胸管推回，恢復引流後再通知醫師"},{"letter":"B","text":"先收集脫出胸管，保留器材等待醫師檢查"},{"letter":"C","text":"依流程覆蓋開口，立即求援並評估呼吸"},{"letter":"D","text":"先安排床邊影像，確認有無氣胸再覆蓋"}],"answer":"C","rationale":"須立即以適當無菌敷料依流程覆蓋開口、評估呼吸並求援，同時警覺張力性氣胸；不可自行將脫出的胸管插回。"},{"stem":"胸管與引流裝置意外分離，胸管仍留在病人胸腔內。護理師應優先如何處理？","options":[{"letter":"A","text":"先夾閉至醫師到場，再恢復胸管引流"},{"letter":"B","text":"先以原接頭直接接回，再安排裝置消毒"},{"letter":"C","text":"依流程恢復無菌水封，並評估呼吸及通報"},{"letter":"D","text":"先維持管端開放，再確認是否需要重接"}],"answer":"C","rationale":"系統分離會破壞水封與無菌性，應立即依機構流程維持暫時無菌水封或更換無菌裝置，避免持續開放或長時間夾管。"},{"stem":"護理師協助胸管病人由床上移至椅子。引流裝置應如何放置？","options":[{"letter":"A","text":"高於胸部並保持直立，促進液體回流"},{"letter":"B","text":"與胸部等高並保持直立，減少引流速度"},{"letter":"C","text":"低於胸部並橫放固定，減少裝置傾倒"},{"letter":"D","text":"低於胸部並保持直立，避免傾倒及牽拉"}],"answer":"D","rationale":"引流裝置應低於胸部並保持直立，以維持水封及降低逆流風險，移位時也須避免管路受壓與牽拉。"},{"stem":"胸管病人翻身後，引流管被身體壓住並形成折曲。護理師最適當的處置為何？","options":[{"letter":"A","text":"先用力擠壓胸管，再檢查病人疼痛程度"},{"letter":"B","text":"解除壓迫與折曲，再評估引流及呼吸"},{"letter":"C","text":"先夾閉近端胸管，再調整病人的姿勢"},{"letter":"D","text":"先調高抽吸壓力，再觀察液體是否流動"}],"answer":"B","rationale":"折曲與壓迫會阻礙引流，應先解除並重新評估；不宜以提高抽吸或常規強力擠壓取代管路整理。"},{"stem":"護理師評估可能發生肺栓塞的病人。何組急性症狀最具提示性？","options":[{"letter":"A","text":"反覆夜間喘鳴，伴接觸過敏原後咳嗽"},{"letter":"B","text":"逐漸加重咳嗽，伴持續膿痰與發燒"},{"letter":"C","text":"活動後呼吸困難，伴雙腿水腫與端坐呼吸"},{"letter":"D","text":"突發呼吸困難，伴深呼吸加劇的胸痛"}],"answer":"D","rationale":"肺栓塞常表現為突發呼吸困難與胸膜性胸痛，也可能伴心搏過速或低血氧，但症狀本身不能確診。"},{"stem":"術後病人突然呼吸困難、心搏過速且血氧下降，護理師懷疑肺栓塞。何項措施應優先執行？","options":[{"letter":"A","text":"立即評估生命徵象、支持氧合並緊急通報"},{"letter":"B","text":"先採痰液培養，再通知醫師評估感染"},{"letter":"C","text":"先協助步行活動，再觀察血氧是否改善"},{"letter":"D","text":"立即進行下肢按摩，促進靜脈血液回流"}],"answer":"A","rationale":"疑似肺栓塞合併低氧須先支持呼吸及循環並緊急求援，不能以活動或按摩延誤處置。"},{"stem":"肺栓塞病人接受抗凝血治療。何項新發現最需立即評估出血風險？","options":[{"letter":"A","text":"原有乾咳持續，未伴胸痛或血氧下降"},{"letter":"B","text":"活動後輕微疲倦，休息後逐漸改善"},{"letter":"C","text":"出現黑色柏油樣便，伴不明皮下瘀青"},{"letter":"D","text":"餐後偶有噁心，未伴腹痛或嘔吐"}],"answer":"C","rationale":"黑色柏油樣便與不明瘀青提示可能出血，抗凝血治療期間須及時評估並依藥物種類追蹤相關檢驗。"},{"stem":"病人返家後需自行注射低分子量肝素。何項衛教正確？","options":[{"letter":"A","text":"同一腹部位置反覆注射，減少新針孔"},{"letter":"B","text":"腹部皮下注射並輪替，注射後避免揉搓"},{"letter":"C","text":"腹部皮下注射並輪替，注射後按摩吸收"},{"letter":"D","text":"上臂肌肉注射並輪替，注射後避免揉搓"}],"answer":"B","rationale":"低分子量肝素採皮下注射，常選腹部並輪替部位；注射後避免揉搓，以減少瘀青與出血。"},{"stem":"病人突然咳出粉紅色泡沫痰，伴嚴重呼吸困難，疑似急性肺水腫。護理師首要處置為何？","options":[{"letter":"A","text":"採平躺並抬高雙腿，先改善周邊循環"},{"letter":"B","text":"採高坐臥並支持氧合，立即通知團隊"},{"letter":"C","text":"採側臥並先採痰液，確認是否肺部感染"},{"letter":"D","text":"採半坐臥並先測體重，估算水分增加量"}],"answer":"B","rationale":"粉紅色泡沫痰合併嚴重呼吸困難提示急性肺水腫，須先採有利呼吸的姿勢、支持氧合並啟動緊急處置。"},{"stem":"心因性肺水腫病人接受靜脈利尿劑後，護理師应優先追蹤何組資料？","options":[{"letter":"A","text":"食慾、睡眠、活動量與腸蠕動變化"},{"letter":"B","text":"痰量、痰色、體溫與白血球變化"},{"letter":"C","text":"疼痛、肌力、關節活動與皮膚變化"},{"letter":"D","text":"尿量、體重、血壓與電解質變化"}],"answer":"D","rationale":"利尿劑的療效與安全性須依體液變化、血壓及電解質評估，以偵測低血壓、脫水或電解質異常。"},{"stem":"病人因白天嗜睡就診。何組病史最支持阻塞型睡眠呼吸中止症的可能性？","options":[{"letter":"A","text":"大聲打鼾且被目擊呼吸暫停，白天嗜睡"},{"letter":"B","text":"夜間胸悶喘鳴，伴急救吸入藥需求增加"},{"letter":"C","text":"入睡困難且睡眠時間不足，白天疲倦"},{"letter":"D","text":"夜間反覆乾咳，伴季節性鼻癢與流淚"}],"answer":"A","rationale":"大聲打鼾、目擊呼吸暫停與白天嗜睡是典型線索，仍須進一步睡眠評估才能確診。"},{"stem":"使用持續性正壓呼吸器的病人抱怨口鼻乾燥，仍願意持續治療。護理師應先建議何項措施？","options":[{"letter":"A","text":"縮短每晚使用時間，待乾燥緩解再延長"},{"letter":"B","text":"檢查面罩漏氣與加濕，依專業指示調整"},{"letter":"C","text":"改用口呼吸入睡，減少鼻腔氣流刺激"},{"letter":"D","text":"自行調低治療壓力，觀察乾燥是否改善"}],"answer":"B","rationale":"漏氣或加濕不足可能造成乾燥，應先檢查設備並與團隊討論，不宜自行改壓力或縮短必要治療。"},{"stem":"全身麻醉後的病人仍嗜睡，呼吸淺慢。護理師首要處置為何？","options":[{"letter":"A","text":"先檢查尿量變化，再調整靜脈輸液"},{"letter":"B","text":"先提供安靜環境，再觀察甦醒程度"},{"letter":"C","text":"維持氣道通暢，立即評估呼吸與氧合"},{"letter":"D","text":"先評估切口疼痛，再追加止痛藥物"}],"answer":"C","rationale":"麻醉後淺慢呼吸可能反映呼吸抑制或氣道阻塞，須先確保氣道、通氣與氧合。"},{"stem":"病人痰多且無力咳出，護理師考慮執行抽吸。開始程序前應先做何事？","options":[{"letter":"A","text":"先增加抽吸壓力，再說明可能不適"},{"letter":"B","text":"先依固定時間抽吸，再檢查呼吸音變化"},{"letter":"C","text":"評估抽吸適應症與氧合，並說明程序"},{"letter":"D","text":"先估算痰液顏色，再選擇抗生素種類"}],"answer":"C","rationale":"抽吸須依分泌物滯留等臨床適應症執行，先評估呼吸音、氧合與耐受性，才能降低缺氧及氣道創傷風險。"},{"stem":"護理師執行開放式氣管內抽吸。何項技術最安全？","options":[{"letter":"A","text":"先灌入生理食鹽水，再延長抽吸時間"},{"letter":"B","text":"遇阻力继续推进，再增加負壓抽吸"},{"letter":"C","text":"置入时不抽吸，退出时短暫施加負壓"},{"letter":"D","text":"置入时持續抽吸，退出時停止負壓"}],"answer":"C","rationale":"導管置入時不施加負壓，退出時短暫抽吸並監測反應，可降低缺氧與黏膜損傷；不應常規灌入生理食鹽水。"},{"stem":"氣管造口病人突然呼吸困難，管內可見大量分泌物。護理師應優先採取何项措施？","options":[{"letter":"A","text":"先調整固定帶，再觀察呼吸音是否恢復"},{"letter":"B","text":"先更換造口敷料，再測量局部皮膚溫度"},{"letter":"C","text":"立即評估氣道，依需要抽吸並呼叫協助"},{"letter":"D","text":"先採集痰液檢體，再等待培養結果處理"}],"answer":"C","rationale":"可見分泌物合併呼吸困難提示氣道阻塞，須立即評估並依流程清除分泌物，同時準備緊急氣道支援。"},{"stem":"氣管造口病人反覆出現乾硬痰塊。日常照護中何項措施最有助預防堵塞？","options":[{"letter":"A","text":"維持適當氣道加濕，持續評估分泌物"},{"letter":"B","text":"每日常規灌入食鹽水，使痰塊容易脫落"},{"letter":"C","text":"固定時段深部抽吸，避免等待痰液累積"},{"letter":"D","text":"增加敷料覆蓋層數，保留造口周圍熱度"}],"answer":"A","rationale":"氣管造口繞過上呼吸道加溫加濕功能，適當加濕可減少分泌物乾燥；抽吸應依需要，而非固定深部抽吸。"},{"stem":"新置氣管造口管意外脫出，病人開始呼吸困難。護理師最適當的處置為何？","options":[{"letter":"A","text":"先將原管盲目插回，再確認是否有氣流"},{"letter":"B","text":"先安排造口攝影，再決定是否重新置管"},{"letter":"C","text":"立即求援並給氧，依緊急氣道流程處置"},{"letter":"D","text":"先封閉造口傷口，再等待病人自行恢復"}],"answer":"C","rationale":"新造口通道尚未成熟，盲目重插可能形成假道；應立即求援、提供氧氣並由受訓人員依氣道流程處置。"},{"stem":"病人拔除氣管內管後聲音微弱、呼吸費力。護理師應優先如何處理？","options":[{"letter":"A","text":"評估氣道與呼吸，給予支持並立即通報"},{"letter":"B","text":"先鼓勵長時間說話，再比較聲音強弱"},{"letter":"C","text":"先提供溫水潤喉，再觀察聲音是否恢復"},{"letter":"D","text":"先評估吞嚥功能，再安排拔管後飲食"}],"answer":"A","rationale":"拔管後呼吸費力須警覺上呼吸道阻塞或呼吸衰竭，不能僅將聲音變化視為暫時不適。"},{"stem":"病人進食時持續咳嗽，聲音濕濁且血氧下降。護理師应立即採取何項措施？","options":[{"letter":"A","text":"改餵清水沖下食物，觀察咳嗽變化"},{"letter":"B","text":"停止口服進食，評估氣道與吞嚥安全"},{"letter":"C","text":"改成仰頭吞嚥，增加食物通過速度"},{"letter":"D","text":"減慢餵食速度，完成餐點後安排評估"}],"answer":"B","rationale":"咳嗽、濕聲及血氧下降提示吸入風險，應立即停止餵食、評估呼吸，並進一步安排吞嚥評估。"},{"stem":"病人需鼻胃管灌食，無抬高床頭禁忌。為降低吸入風險，應採何種姿勢？","options":[{"letter":"A","text":"灌食時抬高床尾，結束後改側臥"},{"letter":"B","text":"灌食時維持低頭位，結束後改坐姿"},{"letter":"C","text":"灌食時平躺，結束後再抬高床頭"},{"letter":"D","text":"灌食時抬高床頭，之後依流程維持"}],"answer":"D","rationale":"灌食期間抬高床頭，並依流程維持灌食後姿勢，可降低胃內容物逆流與吸入風險。"},{"stem":"病人戴氧氣面罩時突然噁心欲吐，意識清楚。護理師應優先如何處理？","options":[{"letter":"A","text":"先協助平躺休息，再降低氧氣流量"},{"letter":"B","text":"維持面罩緊貼口鼻，待止吐藥生效"},{"letter":"C","text":"協助側轉移開面罩，清理後恢復氧療"},{"letter":"D","text":"先採集嘔吐物檢體，再調整面罩位置"}],"answer":"C","rationale":"嘔吐時須讓嘔吐物順利排出並防止吸入，短暫移開面罩處理後應迅速恢復必要氧療及重新評估。"},{"stem":"原本意識清楚的病人呼吸急促，隨後出現混亂與躁動。護理師最適當的判斷為何？","options":[{"letter":"A","text":"可能是住院焦慮，先安排心理支持"},{"letter":"B","text":"可能是氧合或通氣異常，須立即評估"},{"letter":"C","text":"可能是環境刺激，先降低病室照明"},{"letter":"D","text":"可能是失眠反應，先調整夜間睡眠"}],"answer":"B","rationale":"呼吸異常合併急性意識改變可能反映低氧或二氧化碳異常，須先評估生理原因，再考慮心理因素。"},{"stem":"慢性呼吸疾病病人新出現頭痛、嗜睡及淺呼吸。護理師應優先警覺何種狀況？","options":[{"letter":"A","text":"肺泡通氣不足，可能造成二氧化碳滯留"},{"letter":"B","text":"睡眠品質改善，表示身體疲憊正在恢復"},{"letter":"C","text":"氣道反應降低，表示急性症狀正在改善"},{"letter":"D","text":"肺泡換氣增加，可能造成二氧化碳偏低"}],"answer":"A","rationale":"頭痛、嗜睡與淺呼吸可能提示高碳酸血症或通氣衰竭，應迅速評估並通報，不能視為單純睡意。"},{"stem":"呼吸衰竭病人正接受氧療，血氧讀值尚在目標內。除血氧外，何組資料最能及早發現通氣惡化？","options":[{"letter":"A","text":"呼吸頻率深度、意識及呼吸作功"},{"letter":"B","text":"飲食攝取、睡眠時間及排便型態"},{"letter":"C","text":"體溫、痰液顏色及白血球計數"},{"letter":"D","text":"體重、皮膚彈性及下肢水腫程度"}],"answer":"A","rationale":"血氧不能單獨反映二氧化碳排除或呼吸肌疲憊，須整合呼吸型態、作功與意識，必要時檢查血氣。"},{"stem":"病人暴露於燃燒廢氣後頭痛、噁心，但一般指尖血氧顯示正常。護理師应如何判斷？","options":[{"letter":"A","text":"較支持焦慮過度換氣，先進行呼吸放鬆"},{"letter":"B","text":"仍可能一氧化碳中毒，須緊急檢測與處置"},{"letter":"C","text":"較支持輕度脫水，先補水後重新測血氧"},{"letter":"D","text":"可排除組織缺氧，優先處理腸胃症狀"}],"answer":"B","rationale":"一般脈搏血氧儀無法可靠區分氧合血紅素與碳氧血紅素，正常讀值不能排除一氧化碳中毒，須提供氧療並進一步檢測。"},{"stem":"火災受困病人吸入濃煙後聲音沙啞，口鼻周圍有焦黑痕跡。護理師最應優先關注何者？","options":[{"letter":"A","text":"吞嚥耐受程度，先試飲少量溫開水"},{"letter":"B","text":"進展性氣道水腫，立即啟動氣道評估"},{"letter":"C","text":"口腔清潔程度，先去除焦黑附著物"},{"letter":"D","text":"外表燒傷面積，先估算皮膚損傷比例"}],"answer":"B","rationale":"濃煙暴露合併沙啞與焦黑痕跡須警覺吸入性傷害及進展性氣道水腫，應及早評估氣道而非等待明顯阻塞。"},{"stem":"成人進食時疑似哽塞，但仍能大聲咳嗽、發聲與呼吸。護理師最適當的處置為何？","options":[{"letter":"A","text":"先給少量水飲用，促進食物向下移動"},{"letter":"B","text":"立即施行腹部推擠，直到食物排出"},{"letter":"C","text":"立即以手指探入口腔，搜尋阻塞異物"},{"letter":"D","text":"鼓勵持續有效咳嗽，密切觀察惡化"}],"answer":"D","rationale":"仍能有效咳嗽表示氣道尚有氣流，應鼓勵咳嗽並觀察；不宜喝水或盲目挖取異物。"},{"stem":"成人進食後突然無法說話、咳嗽或呼吸，仍有意識。護理師應立即如何處理？","options":[{"letter":"A","text":"協助坐下休息，等待咳嗽反射恢復"},{"letter":"B","text":"準備胸部影像，確認異物位置後處理"},{"letter":"C","text":"啟動求援，依成人嚴重哽塞流程解除"},{"letter":"D","text":"協助喝水吞嚥，利用液體沖開阻塞"}],"answer":"C","rationale":"無法說話、咳嗽或呼吸提示嚴重氣道阻塞，須立即求援並依現行成人哽塞流程處理；若失去反應則轉入心肺復甦流程。"},{"stem":"護理師發現成人病人無反應、無正常呼吸，且無法確認脈搏。應優先採取何項行動？","options":[{"letter":"A","text":"啟動急救系統，立即開始高品質復甦"},{"letter":"B","text":"先安排心電圖檢查，再通知急救團隊"},{"letter":"C","text":"先等待醫師確認，再開始胸部按壓"},{"letter":"D","text":"先取得完整血壓，再判定是否心跳停止"}],"answer":"A","rationale":"無反應、無正常呼吸且未能迅速確認脈搏時，應立即啟動急救並開始心肺復甦，避免延誤。"},{"stem":"心肺復甦期間AED送達，裝置提示即將分析心律。護理師應如何配合？","options":[{"letter":"A","text":"持續觸摸頸動脈，確認分析期間脈搏"},{"letter":"B","text":"確認無人接觸病人，分析後依提示處理"},{"letter":"C","text":"先拔除所有氧氣設備，再啟動心律分析"},{"letter":"D","text":"持續按壓直到分析結束，再依提示離開"}],"answer":"B","rationale":"AED分析與電擊時均須確認無人接觸病人，以避免干擾判讀及電擊傷害，並盡量縮短按壓中斷。"},{"stem":"病人胸痛並呼吸困難，疑似急性冠心症。護理師的初步處置何者最適當？","options":[{"letter":"A","text":"先協助步行測試，再判斷胸痛是否持續"},{"letter":"B","text":"評估生命徵象與氧合，啟動急性胸痛流程"},{"letter":"C","text":"先安排肺功能檢查，再評估心臟相關原因"},{"letter":"D","text":"先給最大流量氧氣，再評估是否需要監測"}],"answer":"B","rationale":"疑似急性冠心症須迅速評估、取得心電圖並啟動流程；氧療依低氧或其他臨床適應症使用，不是一律給最大流量。"},{"stem":"腹部手術後併肺炎的病人因傷口疼痛不敢咳嗽。何項指導最適當？","options":[{"letter":"A","text":"咳嗽時支托傷口，並依醫囑適時止痛"},{"letter":"B","text":"咳嗽時收緊腹肌，暫停止痛以維持警醒"},{"letter":"C","text":"先採平躺縮小胸廓，再快速淺咳排痰"},{"letter":"D","text":"先避免深呼吸咳嗽，待傷口癒合再練習"}],"answer":"A","rationale":"傷口支托與適當止痛可促進深呼吸及有效咳嗽，減少分泌物滯留；不宜因疼痛完全避免肺擴張活動。"},{"stem":"術後病人使用誘發性肺量計。何項操作表示已理解護理師的指導？","options":[{"letter":"A","text":"坐直後快速吹氣，讓指示器上升再休息"},{"letter":"B","text":"坐直後緩慢深吸，短暫閉氣再放鬆吐氣"},{"letter":"C","text":"坐直後短促吸氣，連續吸入而不休息"},{"letter":"D","text":"躺平後緩慢吹氣，讓指示器維持固定"}],"answer":"B","rationale":"誘發性肺量計用於訓練緩慢深吸氣與肺擴張，不是用力吹氣；應依照護計畫配合咳嗽及活動。"},{"stem":"術後病人因深呼吸時疼痛而拒絕活動。護理師應優先採取何項措施？","options":[{"letter":"A","text":"先要求完成活動，再依疼痛反應給藥"},{"letter":"B","text":"延後呼吸訓練，待疼痛自然緩解再活動"},{"letter":"C","text":"縮短所有離床時間，減少手術部位牽拉"},{"letter":"D","text":"評估並處理疼痛，再協助安全活動訓練"}],"answer":"D","rationale":"先適當控制疼痛可增加深呼吸與活動的耐受性，降低肺不張及分泌物滯留風險。"},{"stem":"長期臥床病人目前呼吸穩定，護理師擬定預防肺不張措施。何項計畫最適當？","options":[{"letter":"A","text":"定期翻身並練習深呼吸，依能力活動"},{"letter":"B","text":"固定給予氧氣，取代每日肺擴張訓練"},{"letter":"C","text":"維持固定臥姿，必要時再進行深部抽吸"},{"letter":"D","text":"限制離床與咳嗽，降低呼吸肌耗氧需求"}],"answer":"A","rationale":"翻身、深呼吸咳嗽及適度活動能改善通氣與分泌物清除；氧療本身不能取代肺擴張措施。"},{"stem":"病人單側小腿腫痛，隨後突發呼吸困難。護理師應如何處理？","options":[{"letter":"A","text":"先熱敷患側小腿，再安排例行門診追蹤"},{"letter":"B","text":"先按摩患側小腿，再比較雙側腫脹程度"},{"letter":"C","text":"減少不必要活動，緊急通報疑似肺栓塞"},{"letter":"D","text":"先協助快走活動，再觀察呼吸困難變化"}],"answer":"C","rationale":"單側小腿腫痛提示深層靜脈栓塞可能，合併突發呼吸困難須警覺肺栓塞並立即評估，不可按摩患肢。"},{"stem":"肺癌病人接受化學治療後出現發燒，咳嗽與呼吸不適加劇。護理師最應優先考量何者？","options":[{"letter":"A","text":"可能為一般治療反應，維持原回診安排"},{"letter":"B","text":"可能為睡眠不足反應，先安排休息觀察"},{"letter":"C","text":"可能為藥物短暫刺激，先延後感染評估"},{"letter":"D","text":"可能為免疫抑制相關感染，須立即評估"}],"answer":"D","rationale":"化學治療可能造成嗜中性白血球低下，發燒合併呼吸道症狀須及時評估感染，不能視為例行治療反應。"},{"stem":"肺癌病人突然咳出大量鮮紅色血液，伴呼吸急促。護理師首要處置為何？","options":[{"letter":"A","text":"維持氣道與氧合，評估出血並緊急求援"},{"letter":"B","text":"先鼓勵持續強咳，再量測每次出血量"},{"letter":"C","text":"先採集痰液培養，再決定是否需要求援"},{"letter":"D","text":"先完整詢問出血史，再安排呼吸評估"}],"answer":"A","rationale":"大量咳血可能因血液阻塞氣道而危及生命，須先維持氣道及氧合，同時評估循環與出血。"},{"stem":"大量咳血病人已確認左肺為出血來源，正等待緊急處置。若病況允許，應優先採何種姿勢？","options":[{"letter":"A","text":"左側臥讓出血側向下，減少健側受污染"},{"letter":"B","text":"仰臥讓胸部平置，方便血液向兩側分流"},{"letter":"C","text":"頭低腳高讓血液回流，改善腦部灌流"},{"letter":"D","text":"右側臥讓健側向下，增加健側肺部灌流"}],"answer":"A","rationale":"已知出血側時採出血側朝下，可減少血液流入健側肺；仍須持續維持氣道並配合急救團隊處置。"},{"stem":"病人有右側胸腔積液與呼吸困難。護理師在積液區最可能發現何組徵象？","options":[{"letter":"A","text":"呼吸音增強，胸部叩診呈清音"},{"letter":"B","text":"呼吸音減弱，胸部叩診呈濁音"},{"letter":"C","text":"喘鳴音明顯，胸部叩診呈過清音"},{"letter":"D","text":"呼吸音減弱，胸部叩診呈過清音"}],"answer":"B","rationale":"胸膜腔液體會削弱呼吸音傳導，叩診通常呈濁音；過清音較支持氣胸或過度充氣。"},{"stem":"胸腔積液病人準備接受胸腔穿刺放液。護理師應如何協助？","options":[{"letter":"A","text":"依操作需求擺位，監測症狀與生命徵象"},{"letter":"B","text":"協助仰臥伸展雙臂，鼓勵持續深咳"},{"letter":"C","text":"協助頭低腳高，依固定時間測量體重"},{"letter":"D","text":"協助俯臥壓迫胸部，觀察引流顏色即可"}],"answer":"A","rationale":"可依病人狀況與操作需求採坐姿前傾支托或適當側臥，並監測呼吸、疼痛及生命徵象。"},{"stem":"胸腔穿刺放液期間，病人新出現胸痛、持續咳嗽與呼吸不適。護理師應如何處理？","options":[{"letter":"A","text":"立即告知操作者，配合暫停或調整放液"},{"letter":"B","text":"先鼓勵加快呼吸，待放液完成再回報"},{"letter":"C","text":"先調高放液速度，減少病人受苦時間"},{"letter":"D","text":"先協助改成平躺，維持原放液速度"}],"answer":"A","rationale":"新發胸痛、持續咳嗽與呼吸不適可能反映放液不耐受或併發症，須立即回報並評估，不宜加速放液。"},{"stem":"護理師為呼吸困難但可配合的病人進行肺部聽診。何項方式最適當？","options":[{"letter":"A","text":"隔著衣服比較兩側，請其快速淺呼吸"},{"letter":"B","text":"先聽完左胸全部位置，再改聽右胸"},{"letter":"C","text":"只聽兩側肺尖位置，請其持續閉氣"},{"letter":"D","text":"由上而下比較對稱位置，請其張口呼吸"}],"answer":"D","rationale":"由上而下比較左右對稱位置，有助辨識局部差異；應直接接觸皮膚，請病人張口較深呼吸並留意疲憊或頭暈。"},{"stem":"病人肺部聽診出現高音調、連續哨笛樣聲音，以吐氣時較明顯。最符合何種呼吸音？","options":[{"letter":"A","text":"氣道狹窄時氣流通過所產生的喘鳴音"},{"letter":"B","text":"發炎胸膜相互摩擦所產生的摩擦音"},{"letter":"C","text":"肺泡或小氣道再張開所產生的爆裂音"},{"letter":"D","text":"較大氣道分泌物振動所產生的鼾音"}],"answer":"A","rationale":"連續、高音調哨笛樣聲音符合喘鳴，常與氣道狹窄有關；爆裂音通常短促且不連續。"},{"stem":"護理師在病人吸氣時聽到細小、短促且不連續的爆裂音。何項判讀最適當？","options":[{"letter":"A","text":"主要提示上呼吸道阻塞，須立即解除異物"},{"letter":"B","text":"可能為小氣道再張開或液體，須綜合判讀"},{"letter":"C","text":"主要提示局部支氣管狹窄，可直接定位"},{"letter":"D","text":"主要提示大氣道分泌物，咳嗽後應消失"}],"answer":"B","rationale":"细爆裂音可與小氣道或肺泡再張開、液體或間質病變有關，可見於多種疾病，不能單獨確診。"},{"stem":"病人吸氣與吐氣皆可聽到粗糙低音調的連續聲音，咳嗽後聲音有所改變。最可能為何？","options":[{"letter":"A","text":"鼾音，常來自較大氣道內分泌物振動"},{"letter":"B","text":"胸膜摩擦音，來自兩層胸膜相互摩擦"},{"letter":"C","text":"喉鳴音，常來自喉部或氣管上段狹窄"},{"letter":"D","text":"細爆裂音，常來自周邊小氣道再張開"}],"answer":"A","rationale":"鼾音為低音調連續聲，常與較大氣道分泌物有關，咳嗽後可能改變；胸膜摩擦音通常不因咳嗽而消失。"},{"stem":"護理師在病人右胸單一區域持續聽到高音調哨笛聲，吸氣與吐氣均可聞及。此表現最提示何者？","options":[{"letter":"A","text":"雙側肺泡廣泛充液造成的細爆裂音"},{"letter":"B","text":"較大氣道分泌物振動造成的低調鼾音"},{"letter":"C","text":"局部支氣管狹窄或阻塞造成的喘鳴"},{"letter":"D","text":"兩層胸膜表面摩擦造成的胸膜摩擦音"}],"answer":"C","rationale":"局部持續喘鳴須考慮局部支氣管狹窄或阻塞，與多區域喘鳴的判讀不同，應進一步查明原因。"},{"stem":"嚴重氣喘病人原本明顯喘鳴，之後變得安靜、喘鳴消失，但胸廓起伏減弱且意識變差。護理師應如何判斷？","options":[{"letter":"A","text":"喘鳴減少表示藥物有效，持續原觀察即可"},{"letter":"B","text":"可能為寂靜胸與呼吸疲憊，須立即急救"},{"letter":"C","text":"胸廓活動減少表示焦慮緩解，可降低監測"},{"letter":"D","text":"安靜表示進入恢復期，可延後呼吸評估"}],"answer":"B","rationale":"嚴重氣流減少時可能不再產生可聞喘鳴，合併胸廓活動及意識惡化是危及生命的警訊。"},{"stem":"病人咳嗽無力且痰液滯留，擬接受姿位引流。護理師開始前最應確認何者？","options":[{"letter":"A","text":"痰液顏色與氣味，據此決定統一引流時間"},{"letter":"B","text":"受累肺段、耐受性與禁忌，選擇適當姿勢"},{"letter":"C","text":"病人活動偏好，據此採相同頭低位引流"},{"letter":"D","text":"近期食慾與體重，據此安排所有肺段姿勢"}],"answer":"B","rationale":"姿位引流須依受累肺段、耐受性及禁忌個別化安排，不能一律採頭低位，並須持續監測呼吸反應。"},{"stem":"病人接受胸壁叩擊排痰，護理師指導家屬選擇叩擊位置。何組區域應避免？","options":[{"letter":"A","text":"經評估可耐受的左右外側胸壁區域"},{"letter":"B","text":"姿位引流時指定的非骨突胸壁區域"},{"letter":"C","text":"受累肺段對應的肋骨間胸壁區域"},{"letter":"D","text":"脊椎、胸骨、腎臟區與明顯骨突處"}],"answer":"D","rationale":"叩擊須避開脊椎、胸骨、腎臟區及骨突，以免造成疼痛或組織損傷，並先評估其他禁忌。"},{"stem":"病人完成胸部物理治療後，分泌物已鬆動且可自行咳嗽。護理師接著應鼓勵何項措施？","options":[{"letter":"A","text":"直接進行深部抽吸，取代自主排痰活動"},{"letter":"B","text":"有效咳嗽排出分泌物，觀察痰液與呼吸"},{"letter":"C","text":"先平躺延長閉氣，增加痰液回流速度"},{"letter":"D","text":"先安靜休息並避免咳嗽，降低胸壁疼痛"}],"answer":"B","rationale":"胸部物理治療可鬆動分泌物，之後須藉有效咳嗽排出，並評估痰液、呼吸音與氧合變化。"},{"stem":"病人痰液由清稀轉為大量膿性，並伴新發燒。護理師最適當的處理為何？","options":[{"letter":"A","text":"先增加止咳藥使用，再觀察發燒是否改善"},{"letter":"B","text":"先自行更換抗生素，再追蹤痰液顏色"},{"letter":"C","text":"評估感染與呼吸變化，通報並依指示採檢"},{"letter":"D","text":"先認定排痰治療有效，維持原計畫觀察"}],"answer":"C","rationale":"痰液性質改變合併發燒可能提示感染惡化，須綜合評估並通報；膿性痰本身不足以單獨判定病原。"},{"stem":"護理師已採集病人的呼吸道分泌物檢體。接下來何項處理最符合病人安全與檢體品質要求？","options":[{"letter":"A","text":"先放置床邊保管，交班時再集中標示"},{"letter":"B","text":"先加入食鹽水稀釋，再統一送交檢驗"},{"letter":"C","text":"依流程核對並標示，按保存規定迅速送驗"},{"letter":"D","text":"先轉倒至較大容器，再補登病人資料"}],"answer":"C","rationale":"採檢後應依流程確認病人身分、正確標示並迅速送驗，保存方式須符合檢驗要求，不可任意稀釋或轉裝。"},{"stem":"病人準備接受使用含碘顯影劑的胸部電腦斷層檢查。護理師應優先評估何組資料？","options":[{"letter":"A","text":"過去睡眠檢查結果、鼾聲與日間嗜睡"},{"letter":"B","text":"過去顯影劑反應、腎功能與相關用藥"},{"letter":"C","text":"過去吞嚥評估結果、食量與進食姿勢"},{"letter":"D","text":"過去肺功能測值、痰量與吸入器技巧"}],"answer":"B","rationale":"含碘顯影劑檢查須重視既往顯影劑反應、腎功能及相關用藥風險，依流程安排準備；海鮮過敏不能直接等同顯影劑過敏。"}]},{"title":"常見診斷檢查","questions":[{"stem":"病人準備接受含碘顯影劑電腦斷層，檢查前告訴護理師：「上次注射顯影劑後，全身起疹子，而且喘不過氣。」護理師應優先採取何項措施？","options":[{"letter":"A","text":"核對此次顯影劑與過去不同後，照原排程進行"},{"letter":"B","text":"先請醫師開立抗過敏藥物，再照原排程進行"},{"letter":"C","text":"先確認急救藥品及監測設備，再照原排程進行"},{"letter":"D","text":"暫緩檢查並通報放射科醫師，評估反應史與替代方案"}],"answer":"D","rationale":"曾因顯影劑出現全身蕁麻疹與喘鳴，須先通報團隊並評估反應史、替代方案或預防措施；不能僅靠更換顯影劑、備妥急救設備或給藥便照常進行。"},{"stem":"病人完成含碘顯影劑電腦斷層後返回病房。護理師進行檢查後評估時，應優先確認哪項狀況？","options":[{"letter":"A","text":"有無口中金屬味或短暫全身發熱感"},{"letter":"B","text":"有無禁食後的飢餓感或輕微胃部不適"},{"letter":"C","text":"有無呼吸困難、喉頭腫脹或全身過敏徵象"},{"letter":"D","text":"有無排尿次數增加或尿液顏色改變"}],"answer":"C","rationale":"顯影劑使用後應優先辨識威脅呼吸道的過敏反應。短暫金屬味、熱感或其他不適的評估，不能取代呼吸狀態確認。"},{"stem":"病人預定接受腹部含碘顯影劑電腦斷層，護理師發現近期檢驗顯示腎功能較前惡化。檢查前最適當的處理為何？","options":[{"letter":"A","text":"依當日尿量是否正常，決定能否按原計畫檢查"},{"letter":"B","text":"核對近期腎功能與醫囑，通報團隊評估顯影劑風險"},{"letter":"C","text":"依目前是否出現水腫，決定能否按原計畫檢查"},{"letter":"D","text":"沿用先前腎功能正常的結果，按原醫囑安排檢查"}],"answer":"B","rationale":"腎功能不全可能增加顯影劑相關腎損傷風險，須核對近期腎功能、臨床狀況與醫囑並通報團隊。不能只依尿量、水腫或較早的正常結果判斷安全性。"},{"stem":"糖尿病病人平日服用metformin，今日將接受含碘顯影劑檢查，詢問是否需要停藥。護理師最適當的處理為何？","options":[{"letter":"A","text":"檢查前先暫停服藥，檢查完成後即恢復原劑量"},{"letter":"B","text":"依檢查前後的進食時間，決定停藥與恢復時機"},{"letter":"C","text":"依檢查當日的血糖高低，決定是否暫停服藥"},{"letter":"D","text":"依腎功能、院內流程與醫囑，確認暫停及恢復時機"}],"answer":"D","rationale":"metformin是否需暫停及何時恢復，須依腎功能、臨床狀況、院內流程與醫囑確認。不能僅依血糖、進食時間或檢查是否完成決定。"},{"stem":"病人完成含碘顯影劑檢查，無補充水分的禁忌，醫療團隊也未限制水分。護理師提供返家衛教時，哪項最適當？","options":[{"letter":"A","text":"依醫囑維持適當水分，尿量明顯減少或過敏時通報"},{"letter":"B","text":"維持平日飲水量，尿量減少時留待下次回診討論"},{"letter":"C","text":"將額外水分集中短時間喝完，以加快顯影劑排出"},{"letter":"D","text":"先減少飲水以休息腎臟，尿量恢復後再正常飲水"}],"answer":"A","rationale":"適當水分有助於顯影劑排出，並應通報尿量明顯減少或過敏症狀。補水仍須依醫囑與個別狀況，不宜自行限制水分或集中大量飲用。"},{"stem":"急診病人突然出現單側肢體無力與言語不清，醫師因疑似中風安排腦部電腦斷層。護理師應如何準備檢查？","options":[{"letter":"A","text":"先完成完整入院護理評估，再聯繫影像檢查單位"},{"letter":"B","text":"迅速核對身分、檢查需求及相關顯影劑安全資訊"},{"letter":"C","text":"先確認病人已完成例行禁食，再進行影像準備"},{"letter":"D","text":"先向家屬取得完整病史，再安排病人前往檢查"}],"answer":"B","rationale":"疑似急性中風的影像評估具時效性，應迅速完成必要核對與安全評估。非必要的完整評估、等候家屬或例行禁食，不應延誤檢查。"},{"stem":"病人接受頭部電腦斷層後，擔心輻射對身體的影響，詢問護理師是否安全。下列說明何者最適當？","options":[{"letter":"A","text":"檢查後仍有輻射殘留，宜暫時避免近距離接觸家人"},{"letter":"B","text":"只有注射顯影劑時，才會產生游離輻射曝露"},{"letter":"C","text":"主要以磁場成像，通常不必考慮游離輻射曝露"},{"letter":"D","text":"會使用游離輻射，團隊將依需要減少不必要曝露"}],"answer":"D","rationale":"電腦斷層使用游離輻射，應依臨床需要選擇檢查並減少不必要曝露；是否使用顯影劑不會改變此成像原理，檢查後病人也不會帶有放射性。"},{"stem":"病人因腹痛安排腹部電腦斷層，準備檢查時表示月經延遲，可能已懷孕。護理師應優先採取何項措施？","options":[{"letter":"A","text":"先改為不使用顯影劑的檢查，再按原排程進行"},{"letter":"B","text":"先依腹部症狀安排檢查，完成後再確認懷孕狀況"},{"letter":"C","text":"先取得病人同意簽名，再按原排程進行腹部檢查"},{"letter":"D","text":"確認懷孕可能並通報團隊，依急迫性評估檢查方式"}],"answer":"D","rationale":"可能懷孕時須先確認並通報放射科及開單團隊，衡量檢查效益、風險與替代方案。取得同意或改為不使用顯影劑，不能取代此安全評估。"},{"stem":"病人即將接受腹部電腦斷層，表示擔心狹窄空間，害怕檢查中無法求助。護理師的哪項說明最適當？","options":[{"letter":"A","text":"檢查時盡量保持不動，可透過對講系統聯繫人員"},{"letter":"B","text":"檢查中可依舒適度微調姿勢，機器會自動修正影像"},{"letter":"C","text":"全程保持深而規律的呼吸，不必配合個別屏氣指令"},{"letter":"D","text":"機器運作後便不能聯繫人員，可等拍攝結束再反映"}],"answer":"A","rationale":"說明保持不動及對講聯繫方式，可減輕焦慮並改善影像品質。檢查時應依技術人員指示，而非自行調整姿勢或呼吸方式。"},{"stem":"病人準備接受磁振造影，安全篩檢時表示曾植入心律調節器。護理師應如何決定後續安排？","options":[{"letter":"A","text":"確認病人平時心律穩定後，即可安排進入磁場區"},{"letter":"B","text":"先核對裝置型號與磁振安全條件，再決定是否進入"},{"letter":"C","text":"確認裝置為近期植入款式後，即可安排進入磁場區"},{"letter":"D","text":"確認植入傷口已癒合後，即可安排進入磁場區"}],"answer":"B","rationale":"心律調節器是否能接受磁振造影，須確認裝置型號及符合的磁振安全條件，並依專業團隊程序辦理。傷口癒合、心律穩定或植入時間，均不能取代裝置安全確認。"},{"stem":"病人準備進入磁振造影檢查區，護理師發現其仍戴著可拆式金屬項鍊與手環。最適當的處置為何？","options":[{"letter":"A","text":"先詢問病人首飾是否為純金，再安排病人進入磁場區"},{"letter":"B","text":"先確認首飾不在掃描部位，再安排病人進入磁場區"},{"letter":"C","text":"依安全流程取下可移除金屬物，進場前再次檢查"},{"letter":"D","text":"先用膠帶固定首飾位置，再安排病人進入磁場區"}],"answer":"C","rationale":"金屬物可能造成磁場相關傷害或影像干擾，應依流程移除並再次檢查。僅固定首飾、避開掃描部位或詢問材質，不能取代安全檢核。"},{"stem":"病人先前接受過電腦斷層，這次安排磁振造影，詢問兩者是否都使用游離輻射。護理師對磁振造影的說明何者正確？","options":[{"letter":"A","text":"使用低劑量Ｘ光輔助成像，游離輻射曝露量較小"},{"letter":"B","text":"使用磁場與無線電波成像，不使用游離輻射"},{"letter":"C","text":"會使用游離輻射成像，但檢查後不會持續放射"},{"letter":"D","text":"只有使用顯影劑時，才會伴隨游離輻射曝露"}],"answer":"B","rationale":"磁振造影以磁場與無線電波成像，不使用游離輻射；此原理不同於電腦斷層，也不因是否使用顯影劑而改變。"},{"stem":"有嚴重腎功能不全的病人，預定接受含釓顯影劑磁振造影。護理師核對檢查準備時，應採取何項措施？","options":[{"letter":"A","text":"確認腎功能並通報團隊，評估顯影劑適用性與替代方案"},{"letter":"B","text":"先確認目前尿量與水腫情形，再按原排程施打"},{"letter":"C","text":"先確認過去注射顯影劑未過敏，再按原排程施打"},{"letter":"D","text":"先將腎功能異常註記病歷，檢查後再安排追蹤"}],"answer":"A","rationale":"嚴重腎功能不全者使用釓顯影劑，須先由團隊依腎功能與安全規範評估適用性。過去未過敏、目前尿量或檢查後追蹤，均不能取代檢查前的風險評估。"},{"stem":"有幽閉恐懼症的病人在磁振造影準備期間極度焦慮，表示無法繼續檢查。護理師最適當的措施為何？","options":[{"letter":"A","text":"先安排病人休息再重試，檢查完成後再說明求助方式"},{"letter":"B","text":"先指導病人閉眼放鬆，待能保持姿勢就照原流程進行"},{"letter":"C","text":"先說明流程與溝通方式，通知團隊評估支持或替代安排"},{"letter":"D","text":"先直接替病人改期，待焦慮自行改善後再安排檢查"}],"answer":"C","rationale":"應先透過流程說明與溝通降低焦慮，並通知團隊評估適當支持或替代方式。僅休息、閉眼放鬆或直接改期，未充分處理病人的支持與安全需求。"},{"stem":"病人完成一般磁振造影後，詢問：「回家後需要和家人隔離，避免把輻射傳給他們嗎？」護理師應如何回答？","options":[{"letter":"A","text":"先沐浴並更換貼身衣物，再恢復與家人的近距離接觸"},{"letter":"B","text":"與成人可維持一般接觸，與幼兒則宜暫時保持距離"},{"letter":"C","text":"一般磁振造影不會使身體帶有放射性，無須隔離"},{"letter":"D","text":"未使用顯影劑可正常接觸，若有使用則應先隔離"}],"answer":"C","rationale":"一般磁振造影不使用放射性同位素，檢查後病人不會帶有放射性。因此無須隔離家人，也不需依接觸對象或更衣沐浴決定能否接觸。"},{"stem":"病人第一次接受胸部Ｘ光，詢問拍攝時應如何配合，才能避免影像模糊。護理師應提供哪項指導？","options":[{"letter":"A","text":"拍攝前先咳嗽清除痰液，拍攝時維持正常呼吸"},{"letter":"B","text":"拍攝前先吐氣使胸廓放鬆，拍攝時再緩慢吸氣"},{"letter":"C","text":"依技術人員指示保持姿勢，拍攝時短暫屏住呼吸"},{"letter":"D","text":"保持姿勢並持續緩慢呼吸，拍攝時不需特別屏氣"}],"answer":"C","rationale":"依技術人員指示保持姿勢並短暫屏氣，有助於取得清晰影像。拍攝時持續呼吸或改變呼吸動作，可能造成影像模糊。"},{"stem":"病人因咳嗽安排胸部Ｘ光，檢查前表示可能懷孕。護理師最適當的作為為何？","options":[{"letter":"A","text":"先加強病人腹部遮蔽，再按原定流程進行拍攝"},{"letter":"B","text":"依流程確認並通報檢查團隊，評估臨床必要性與防護"},{"letter":"C","text":"先取得病人同意接受檢查，再按原定流程進行"},{"letter":"D","text":"先向病人說明僅拍攝胸部，再按原定流程進行"}],"answer":"B","rationale":"可能懷孕須納入影像安全評估，依流程確認並通報團隊，評估檢查必要性與防護。僅遮蔽、說明拍攝部位或取得同意，不能取代團隊評估。"},{"stem":"病人剛完成胸部Ｘ光，擔心身上有輻射殘留，不敢回家抱孫子。護理師的哪項說明正確？","options":[{"letter":"A","text":"先沐浴並更換貼身衣物，就能去除檢查後的輻射"},{"letter":"B","text":"先增加飲水促進排出，待排尿後就不必擔心殘留"},{"letter":"C","text":"先避免近距離接觸幼兒，待身體自然排除輻射"},{"letter":"D","text":"一般Ｘ光是短暫外部曝露，拍攝後身體不會成為放射源"}],"answer":"D","rationale":"一般Ｘ光是短暫的外部輻射曝露，拍攝後不會有放射性物質留在體內。無須透過飲水、沐浴或避免接觸幼兒來排除輻射。"},{"stem":"病人預定接受上消化道鋇劑攝影。護理師進行檢查前準備評估時，應優先確認哪項內容？","options":[{"letter":"A","text":"確認已吃少量清淡餐點，並記錄是否有胃部不適"},{"letter":"B","text":"確認已自行服用瀉藥清腸，並記錄最近排便情形"},{"letter":"C","text":"確認已飲水使胃部充盈，並詢問腹脹與噁心情形"},{"letter":"D","text":"確認依指示禁食，並評估吞嚥能力與腸阻塞病況"}],"answer":"D","rationale":"上消化道鋇劑攝影通常須依檢查單位指示禁食，以減少胃內容物干擾，並確認吞嚥及腸阻塞等相關病況。不能自行以進食、飲水充盈或瀉藥清腸取代規定準備。"},{"stem":"病人完成鋇劑吞嚥檢查，詢問返家後如何幫助鋇劑排出。護理師提供哪項衛教最適當？","options":[{"letter":"A","text":"若有便祕先自行觀察，待糞便恢復原色才回報"},{"letter":"B","text":"無液體限制時依指示補水，並留意便祕與排便情形"},{"letter":"C","text":"檢查後先減少飲水與進食，讓腸道休息至排便恢復"},{"letter":"D","text":"糞便變白時先自行服用瀉藥，待排便恢復再停藥"}],"answer":"B","rationale":"鋇劑可能使糞便呈白色並造成便祕，無液體限制者應依指示補充水分並注意排便。不可自行減少水分、使用瀉藥或因等待糞便恢復原色而延後回報便祕。"},{"stem":"病人接受鋇劑攝影後兩天未排便，且腹部脹痛逐漸加劇。護理師最優先的處置為何？","options":[{"letter":"A","text":"先記錄排便與疼痛變化，待例行查房時再反映"},{"letter":"B","text":"評估腹部與排便狀況，並儘速通知醫療團隊"},{"letter":"C","text":"先依一般便祕照護調整飲食，觀察腹脹是否緩解"},{"letter":"D","text":"先增加飲水與輕度活動，待下一次排便後再評估"}],"answer":"B","rationale":"鋇劑攝影後未排便且脹痛加劇，應警覺鋇劑滯留並儘速通報評估，不宜僅按一般便祕處理。"},{"stem":"病人預定接受鋇劑灌腸檢查，護理師在送檢前應優先確認哪項準備？","options":[{"letter":"A","text":"確認已依醫囑及檢查單位指示完成腸道準備"},{"letter":"B","text":"確認近期排便規律且沒有腹痛，即可安排檢查"},{"letter":"C","text":"確認晨間已自然排便，據此判定腸道準備完成"},{"letter":"D","text":"確認已完成禁食與基本生命徵象測量，再送檢"}],"answer":"A","rationale":"鋇劑灌腸需依醫囑及檢查單位流程完成腸道清潔，以利影像判讀；自然排便或禁食不能取代腸道準備。"},{"stem":"鋇劑灌腸進行中，病人突然出現劇烈腹痛並冒冷汗。護理師應優先採取哪項措施？","options":[{"letter":"A","text":"先降低灌注速度並安撫，待腹痛緩解後再續做"},{"letter":"B","text":"先協助變換臥姿並深呼吸，觀察腹痛是否緩解"},{"letter":"C","text":"先暫停灌注並觀察疼痛，待持續不適時再通報"},{"letter":"D","text":"停止灌注並通知放射科醫師，評估生命徵象"}],"answer":"D","rationale":"劇烈腹痛伴冒冷汗可能是穿孔等嚴重併發症的警訊，應立即停止操作、通報並評估，不宜等待症狀自行緩解。"},{"stem":"病人接受咽喉局部麻醉後完成胃鏡檢查，返病房時詢問何時可以喝水。護理師應採用哪項進食安全判斷？","options":[{"letter":"A","text":"確認意識清醒且能自行坐起後，先給少量溫水"},{"letter":"B","text":"確認吞嚥及咽喉反射恢復後，再依指示進食飲水"},{"letter":"C","text":"確認噁心與腹脹已消退後，先由清流質開始進食"},{"letter":"D","text":"確認咽喉不痛且可以說話後，再給予軟質食物"}],"answer":"B","rationale":"咽喉局部麻醉會降低保護性反射，須確認吞嚥及咽喉反射恢復後再依指示飲食；清醒或能說話不代表已無吸入風險。"},{"stem":"病人接受胃鏡切片後返病房，持續劇烈腹痛，腹部僵硬且心跳加快。護理師最適當的處置為何？","options":[{"letter":"A","text":"立即通知醫師並密切監測，警覺穿孔或出血"},{"letter":"B","text":"先依醫囑止痛並觀察反應，待無效時再通報"},{"letter":"C","text":"先協助下床緩慢走動排氣，再評估腹痛與心跳"},{"letter":"D","text":"先調整舒適臥姿並觀察，待腹部脹氣減輕再評估"}],"answer":"A","rationale":"劇烈腹痛、腹部僵硬及心跳加快可能提示穿孔或出血，須立即通報與監測，不能視為一般檢查後脹氣。"},{"stem":"病人胃鏡檢查後僅有輕微咽喉不適，未出現其他異常。護理師提供返家衛教時，哪項說明最適當？","options":[{"letter":"A","text":"喉痛可先減少說話，呼吸不順時先坐起休息觀察"},{"letter":"B","text":"喉痛緩解表示已恢復，腹痛時先走動排氣再追蹤"},{"letter":"C","text":"喉痛可能是黏膜刺激，吐血量少時可先休息觀察"},{"letter":"D","text":"輕微喉痛可短暫出現，吐血、呼吸困難或劇烈腹痛須就醫"}],"answer":"D","rationale":"輕微咽喉刺激可能短暫發生，但吐血、呼吸困難或嚴重腹痛是需立即就醫評估的警訊。"},{"stem":"病人即將接受大腸鏡檢查，表示已拿到清腸藥但不確定如何準備。護理師應優先確認哪項內容？","options":[{"letter":"A","text":"確認清腸劑用法、排便情形及禁食指示均已理解"},{"letter":"B","text":"確認已服完整份清腸劑，即可判定腸道準備完成"},{"letter":"C","text":"確認當日已自然排便，再依一般飲食方式準備"},{"letter":"D","text":"確認檢查前已禁食且沒有腹痛，再安排接受檢查"}],"answer":"A","rationale":"大腸鏡準備須確認清腸劑使用、排便結果與禁食指示，不能只憑服完藥或已排便就判定準備充分。"},{"stem":"病人長期服用抗凝血藥，預計接受大腸鏡息肉切除，詢問是否應停藥。護理師最適當的處理為何？","options":[{"letter":"A","text":"自行減半抗凝血藥，以兼顧栓塞與切除出血風險"},{"letter":"B","text":"檢查當日自行停藥，切除後再恢復原本服用劑量"},{"letter":"C","text":"先維持原有用藥，僅在進入檢查室時告知醫師"},{"letter":"D","text":"核對抗凝血藥，依團隊醫囑調整且勿自行停藥"}],"answer":"D","rationale":"息肉切除的出血風險須與停藥後的栓塞風險一併考量，應核對藥物並依醫囑及團隊計畫調整，不可自行減量或停藥。"},{"stem":"病人接受鎮靜完成大腸鏡後自覺清醒，準備返家。護理師應確認病人理解哪項安全指示？","options":[{"letter":"A","text":"當日勿駕車或操作危險機械，並由陪同者協助返家"},{"letter":"B","text":"返家可先處理重要文件，駕車則等精神恢復再決定"},{"letter":"C","text":"先在院內休息至自覺清醒，再自行駕車返回住處"},{"letter":"D","text":"先由家人陪同搭車返家，精神恢復後可操作機械"}],"answer":"A","rationale":"鎮靜藥可能持續影響判斷力與反應時間，不能以自覺清醒作為駕車或操作機械的依據，返家也應有適當陪同。"},{"stem":"病人大腸鏡息肉切除後返家，致電表示出現大量鮮血便並感到暈眩。護理師應如何指導？","options":[{"letter":"A","text":"先改清淡飲食並減少活動，觀察下次排便情形"},{"letter":"B","text":"立即回院或尋求緊急醫療，接受出血與循環評估"},{"letter":"C","text":"先臥床休息並增加飲水，待暈眩改善後再聯絡"},{"letter":"D","text":"先記錄血便次數與顏色，於下次門診回報醫師"}],"answer":"B","rationale":"大量鮮血便合併暈眩可能是息肉切除後出血或循環不穩，應立即接受緊急評估，不宜在家等待。"},{"stem":"病人的糞便潛血篩檢呈陽性，擔心自己已罹患大腸癌。護理師最適當的說明為何？","options":[{"letter":"A","text":"表示已有足夠證據診斷癌症，可直接討論癌症治療"},{"letter":"B","text":"表示較可能來自痔瘡出血，可待肛門症狀改善再追蹤"},{"letter":"C","text":"表示可能受採檢因素影響，重採陰性即可結束追蹤"},{"letter":"D","text":"表示需進一步評估出血來源，尚不能確診癌症"}],"answer":"D","rationale":"糞便潛血陽性提示可能有消化道出血，需進一步評估來源；不能直接確診癌症，也不能逕自歸因於痔瘡或採檢問題。"},{"stem":"病人準備接受糞便潛血篩檢，詢問是否應先自行停用處方藥。護理師最適當的回答為何？","options":[{"letter":"A","text":"沿用上次篩檢的停藥方式，完成採便後恢復用藥"},{"letter":"B","text":"先停用可能造成出血的處方藥，再採集糞便檢體"},{"letter":"C","text":"依檢測方式及醫療指示準備，勿自行停用處方藥"},{"letter":"D","text":"維持原本用藥即可，直接採便而不需核對準備說明"}],"answer":"C","rationale":"不同糞便潛血檢測方式的飲食及用藥限制可能不同，應依本次檢查說明與醫療指示準備，避免自行停藥。"},{"stem":"病人預定接受腹部超音波評估膽囊，護理師應確認哪項檢查前準備？","options":[{"letter":"A","text":"檢查前完成瀉劑清腸，以降低糞便對影像干擾"},{"letter":"B","text":"檢查前改吃清淡早餐，以減少腸胃刺激與不適"},{"letter":"C","text":"檢查前飲水並避免排尿，待膀胱充盈後再檢查"},{"letter":"D","text":"依檢查單位指示禁食，以利膽囊及上腹部觀察"}],"answer":"D","rationale":"膽囊超音波常需依指示禁食，避免進食造成膽囊收縮而影響觀察；膀胱充盈不是此項檢查的主要準備。"},{"stem":"病人將接受經腹部骨盆腔超音波，醫囑要求檢查時膀胱充盈。護理師應提供哪項指導？","options":[{"letter":"A","text":"持續少量飲水且照常排尿，以保持膀胱舒適"},{"letter":"B","text":"檢查前以禁食代替飲水，避免腸胃內容物影響"},{"letter":"C","text":"先飲水再排空膀胱，減少探頭壓迫造成的不適"},{"letter":"D","text":"依指示飲水且暫緩排尿，明顯不適時告知人員"}],"answer":"D","rationale":"經腹部骨盆腔超音波可藉適度充盈膀胱改善聲窗，應依指示飲水並避免檢查前排尿；若不適應告知檢查人員。"},{"stem":"病人接受超音波檢查前詢問：「這項檢查會像X光一樣產生輻射嗎？」護理師應如何說明？","options":[{"letter":"A","text":"檢查以聲波傳遞與反射成像，不使用游離輻射"},{"letter":"B","text":"檢查使用放射性示蹤劑，由儀器接收訊號成像"},{"letter":"C","text":"檢查使用低劑量X光，輻射量通常較電腦斷層少"},{"letter":"D","text":"檢查使用磁場與無線電波，不會產生游離輻射"}],"answer":"A","rationale":"診斷超音波是利用聲波成像，不使用游離輻射；磁場、X光及放射性示蹤劑不是其成像原理。"},{"stem":"病人預定接受肝臟超音波，送檢前表示已經進食。護理師最適當的處理為何？","options":[{"letter":"A","text":"照原時程送病人接受檢查，僅在病歷註記已進食"},{"letter":"B","text":"先自行取消本次超音波，再通知病人另約檢查"},{"letter":"C","text":"告知檢查單位已進食，確認是否需延後或調整"},{"letter":"D","text":"讓病人等待至不再感到飽脹，再照原安排送檢"}],"answer":"C","rationale":"進食可能影響膽囊或上腹部影像，應據實通知檢查單位，由團隊決定是否調整，不能自行判定可照常進行或取消。"},{"stem":"病人將接受甲狀腺細針抽吸。為規劃穿刺安全，護理師在檢查前最應詢問哪項資訊？","options":[{"letter":"A","text":"是否曾有顯影劑過敏或檢查後皮膚發疹的情形"},{"letter":"B","text":"是否近期聲音沙啞或吞嚥時感到頸部壓迫不適"},{"letter":"C","text":"是否害怕針頭或曾在抽血與注射時發生暈針"},{"letter":"D","text":"是否使用抗凝血藥，或曾有異常出血的情形"}],"answer":"D","rationale":"細針抽吸有出血風險，抗凝血藥使用與出血傾向是檢查前安全評估的重點，後續處理應依醫囑規劃。"},{"stem":"病人接受甲狀腺細針抽吸後，穿刺處僅有輕微瘀青，生命徵象穩定。護理師最適當的照護為何？","options":[{"letter":"A","text":"依指示局部加壓，觀察腫脹、出血及呼吸吞嚥"},{"letter":"B","text":"以溫熱敷促進瘀青消退，定時查看穿刺處膚色"},{"letter":"C","text":"覆蓋敷料並定時更換，以敷料滲血量判定恢復"},{"letter":"D","text":"優先觀察聲音與疼痛，待主訴加劇再查看頸部"}],"answer":"A","rationale":"局部加壓及觀察可協助辨識持續出血或血腫；若頸部腫脹伴呼吸或吞嚥困難，須緊急處理。"},{"stem":"病人完成肝臟切片後返病房，目前無明顯不適。護理師應採取哪項術後照護？","options":[{"letter":"A","text":"先協助坐起與短距離行走，再觀察穿刺處及腹痛"},{"letter":"B","text":"依醫囑給予止痛並休息，以疼痛改善判定恢復"},{"letter":"C","text":"以舒適姿勢休息並常規換藥，待不適時再量生命徵象"},{"letter":"D","text":"依醫囑採指定姿勢，監測生命徵象、穿刺處與腹痛"}],"answer":"D","rationale":"肝臟切片後應依醫囑臥床或採指定姿勢，並監測生命徵象、穿刺處及腹痛以辨識出血，不能僅以沒有疼痛判定安全。"},{"stem":"病人肝臟切片後突然右上腹劇痛，伴肩部牽涉痛及血壓下降。護理師應優先採取哪項處置？","options":[{"letter":"A","text":"先檢查穿刺處並更換敷料，再觀察肩痛是否改善"},{"letter":"B","text":"先給予止痛並安撫情緒，待疼痛減輕後再重測血壓"},{"letter":"C","text":"先協助調整臥床姿勢，待休息後再評估疼痛及血壓"},{"letter":"D","text":"立即通報並評估出血及循環，持續監測生命徵象"}],"answer":"D","rationale":"肝臟切片後腹痛與肩部牽涉痛合併低血壓，可能提示內出血，應立即通報並評估循環，不宜先等待止痛或休息效果。"},{"stem":"病人預定接受乳房穿刺切片，術前藥物核對時發現正在服用抗血小板藥，並詢問是否需要停藥。護理師最適當的處理為何？","options":[{"letter":"A","text":"照原用藥安排穿刺，術後再依出血情形調整計畫"},{"letter":"B","text":"核對用藥並聯繫醫療團隊，確認出血風險與用藥計畫"},{"letter":"C","text":"先暫停抗血小板用藥，待穿刺完成後再回報醫師"},{"letter":"D","text":"核對最近一次服藥時間，依服藥間隔決定是否穿刺"}],"answer":"B","rationale":"乳房穿刺有出血風險，抗血小板藥物應由醫療團隊依個別風險訂定用藥計畫，不宜自行停藥或僅依服藥間隔決定。"},{"stem":"病人完成乳房穿刺切片，準備返家時詢問穿刺處的照護方式。護理師提供哪項衛教最適當？","options":[{"letter":"A","text":"以溫水浸泡穿刺處清潔，待敷料自然脫落後再更換"},{"letter":"B","text":"依指示保持敷料清潔乾燥，觀察出血及紅腫熱痛"},{"letter":"C","text":"穿刺處有腫脹時輕柔按摩，幫助瘀血吸收減輕不適"},{"letter":"D","text":"每日提早移除敷料，讓穿刺處暴露以便觀察變化"}],"answer":"B","rationale":"穿刺處應依指示保持清潔乾燥，並觀察出血、血腫及感染徵象。若腫脹快速擴大或持續出血，應及時回報醫療人員。"},{"stem":"病人即將接受腰椎穿刺，護理師需完成與穿刺安全直接相關的術前評估。下列哪組確認事項最適當？","options":[{"letter":"A","text":"確認血壓、降壓藥物使用、活動耐受度及檢查同意流程"},{"letter":"B","text":"確認血糖、降血糖藥物使用、飲食狀況及檢查同意流程"},{"letter":"C","text":"確認體溫、止痛藥物使用、疼痛程度及檢查同意流程"},{"letter":"D","text":"確認凝血、抗凝血用藥、神經學基準及檢查同意流程"}],"answer":"D","rationale":"腰椎穿刺前應確認凝血狀況與抗凝血用藥，以評估出血風險，並建立神經學基準及完成檢查同意流程。"},{"stem":"病人接受腰椎穿刺後表示：「一坐起來頭就更痛，躺下會比較舒服。」護理師最適當的處理為何？","options":[{"letter":"A","text":"安排坐姿休息並觀察頭痛，待症狀持續後再通知團隊"},{"letter":"B","text":"先鼓勵病人下床緩慢活動，觀察活動後是否減輕頭痛"},{"letter":"C","text":"先依一般緊張性頭痛照護，暫不列為穿刺後異常回報"},{"letter":"D","text":"評估頭痛並通知醫療團隊，依醫囑給予支持處置"}],"answer":"D","rationale":"穿刺後出現坐起加劇、平躺改善的姿勢性頭痛，可能與腦脊髓液漏相關。應評估並通知醫療團隊，依醫囑提供補液等支持處置。"},{"stem":"腰椎穿刺後，病人詢問：「是不是每個人都必須平躺相同時間，才能下床？」護理師的說明何者最適當？","options":[{"letter":"A","text":"以是否能自行下床決定活動，無力時先休息再作觀察"},{"letter":"B","text":"待穿刺處沒有滲血便可活動，頭痛時再自行延長休息"},{"letter":"C","text":"依統一平躺時程安排休息，無症狀也須完成才可活動"},{"letter":"D","text":"依醫囑與流程安排休息活動，頭痛或神經症狀須回報"}],"answer":"D","rationale":"腰椎穿刺後的休息與活動應依醫囑、院內流程及個別狀況安排，不能套用所有病人一致的固定規則。出現頭痛、麻木或無力等症狀應回報。"},{"stem":"護理師巡視腰椎穿刺後的病人，發現穿刺處滲血，且病人表示下肢出現原本沒有的無力。此時應優先採取哪項行動？","options":[{"letter":"A","text":"先更換穿刺處敷料，待滲血停止後再確認下肢肌力"},{"letter":"B","text":"先協助病人調整臥位，觀察下肢無力是否因姿勢改善"},{"letter":"C","text":"立即通知醫師，並評估神經狀態與穿刺處出血情形"},{"letter":"D","text":"先協助病人休息保暖，待無力改善後再評估穿刺處"}],"answer":"C","rationale":"穿刺後新發下肢無力合併滲血，可能代表嚴重併發症，應立即進行神經學與穿刺處評估並通知醫師，不宜等待改善。"},{"stem":"病人首次接受腦波檢查，擔心頭皮上的電極會將電流送入腦部。護理師對檢查原理的說明何者正確？","options":[{"letter":"A","text":"頭皮電極用來記錄腦部電活動，不會將電流注入腦內"},{"letter":"B","text":"頭皮電極會定位腦部放射訊號，用來分析腦部活動區域"},{"letter":"C","text":"頭皮電極會送出微弱電流，再記錄腦部受到刺激的反應"},{"letter":"D","text":"頭皮電極會接收腦部影像訊號，用來判讀腦組織結構"}],"answer":"A","rationale":"腦波檢查以頭皮電極記錄腦部電位變化，不是向腦內輸入電流，也不使用游離輻射或直接呈現腦組織影像。"},{"stem":"病人預定接受腦波檢查，醫囑要求以睡眠剝奪協助誘發異常腦波。護理師應提供哪項檢查前衛教？","options":[{"letter":"A","text":"依檢查單位指示調整睡眠，避免自行加用鎮靜藥物"},{"letter":"B","text":"檢查前維持平常睡眠作息，到院後再配合延後入睡"},{"letter":"C","text":"檢查前以咖啡維持整夜清醒，完成準備後自行前往"},{"letter":"D","text":"檢查前自行減少睡眠即可，睡不著時可加用安眠藥物"}],"answer":"A","rationale":"睡眠剝奪應依檢查單位指示準備，鎮靜藥物或咖啡因可能影響檢查結果，不能自行以藥物或咖啡調整準備方式。"},{"stem":"病人完成腦波檢查後，發現頭皮仍有電極膏殘留，詢問應如何處理。護理師的說明何者最適當？","options":[{"letter":"A","text":"先讓電極膏留在頭皮保護皮膚，待自然乾燥後再清除"},{"letter":"B","text":"先以指甲刮除乾燥的電極膏，再用洗髮精清潔頭皮"},{"letter":"C","text":"依指示以洗髮方式清除電極膏，通常不代表皮膚受傷"},{"letter":"D","text":"以酒精反覆擦拭殘留電極膏，待清除乾淨後再洗頭"}],"answer":"C","rationale":"電極膏通常可依指示用洗髮方式清除，殘留本身不代表皮膚受傷。應避免刺激性溶劑或刮除造成刺激，並觀察頭皮是否不適。"},{"stem":"病人即將接受神經傳導檢查及肌電圖，其中肌电圖預計使用針電極。護理師術前最需優先確認哪組資訊？","options":[{"letter":"A","text":"詢問止痛藥物、疼痛程度及平時的肌肉活動耐受情形"},{"letter":"B","text":"詢問抗凝血用藥、出血傾向及相關神經肌肉症狀"},{"letter":"C","text":"詢問皮膚過敏、保養品使用及檢查部位的清潔情形"},{"letter":"D","text":"詢問近期運動、肌肉疲勞及檢查前的活動安排情形"}],"answer":"B","rationale":"針電極肌電圖涉及肌肉穿刺，應優先確認抗凝血用藥與出血傾向，並了解神經肌肉症狀基準。"},{"stem":"病人接受肌電圖後，表示針刺部位有輕微痠痛，詢問返家後應注意什麼。護理師的衛教何者最適當？","options":[{"letter":"A","text":"局部痠痛宜自行增加止痛藥，待疼痛控制後再評估"},{"letter":"B","text":"局部痠痛可短暫出現，加劇疼痛、腫脹或出血須回報"},{"letter":"C","text":"局部痠痛可用按摩緩解，腫脹時持續揉按幫助吸收"},{"letter":"D","text":"局部痠痛多為神經受損表現，應暫停患肢活動並回診"}],"answer":"B","rationale":"肌電圖後可能有短暫局部痠痛，不代表神經受損；若疼痛加劇、明顯腫脹或持續出血，則需回報評估，不宜按摩或自行加藥。"},{"stem":"護理師準備為病人記錄靜息心電圖，希望減少干擾並取得可供判讀的波形。下列準備方式何者最適當？","options":[{"letter":"A","text":"以病人舒適度調整胸前電極位置，保持導線鬆弛"},{"letter":"B","text":"協助病人持續交談放鬆，並在記錄時維持自然動作"},{"letter":"C","text":"協助病人短暫步行暖身，再躺下依位置貼妥電極"},{"letter":"D","text":"協助病人安靜休息，依正確位置將電極貼於皮膚"}],"answer":"D","rationale":"靜息心電圖應讓病人安靜休息並正確放置電極，以減少動作干擾及電極位置錯誤造成的判讀問題。"},{"stem":"記錄心電圖時，護理師發現波形有明顯基線漂移，且病人正在顫抖。下列處理何者最適當？","options":[{"letter":"A","text":"先保持原電極位置重複列印，選擇較平穩的片段判讀"},{"letter":"B","text":"先調高儀器濾波強度，將較清晰的波形作為正式結果"},{"letter":"C","text":"先依異常波形通知醫師，將漂移圖形列為心律異常"},{"letter":"D","text":"先評估病人，改善顫抖與電極接觸後重新記錄"}],"answer":"D","rationale":"顫抖或電極接觸不良可能造成心電圖偽差，應先評估病人並排除干擾後重做；若有真正危急心律，不可因重做而延誤處置。"},{"stem":"病人主訴胸痛，剛記錄的心電圖出現疑似急性缺血變化。護理師最優先的行動為何？","options":[{"letter":"A","text":"立即評估生命徵象，依急救流程通知醫療團隊"},{"letter":"B","text":"先安排床上休息觀察，待胸痛緩解後再評估生命徵象"},{"letter":"C","text":"先詢問胸痛誘發原因，完成詳細病史後再回報醫師"},{"letter":"D","text":"先重做心電圖確認變化，取得正式判讀後再通知醫師"}],"answer":"A","rationale":"胸痛合併疑似急性缺血變化，需立即評估生命徵象並啟動團隊處置，不能等待正式判讀、症狀緩解或完整病史才回報。"},{"stem":"病人因間歇性心悸接受24小時心電圖監測，準備配戴記錄器返家。護理師提供哪項衛教最適當？","options":[{"letter":"A","text":"只記錄活動內容與睡眠時間，待回診時再回想症狀"},{"letter":"B","text":"配戴期間以臥床休息為主，藉此減少日常活動干擾"},{"letter":"C","text":"洗澡前自行移除記錄器，洗完再重新接回全部電極"},{"letter":"D","text":"記錄症狀及發生時間，依指示使用記錄器與電極"}],"answer":"D","rationale":"記錄症狀及發生時間有助於對照心律變化。活動與設備使用應依檢查指示安排，避免自行拆除或弄濕設備。"},{"stem":"病人進行運動心電圖測試時，突然出現胸痛、呼吸困難及頭暈。護理師應優先如何處理？","options":[{"letter":"A","text":"先詢問是否空腹或疲倦，確認原因後再決定是否停測"},{"letter":"B","text":"先降低運動強度繼續測試，觀察症狀是否逐漸緩解"},{"letter":"C","text":"立即停止運動並通知團隊，同時評估生命徵象"},{"letter":"D","text":"先協助病人站立休息，症狀減輕後接續原測試"}],"answer":"C","rationale":"運動中出現胸痛、呼吸困難或頭暈，是停止測試並立即評估的警訊，不應只降低強度或等待症狀改善。"},{"stem":"病人首次接受經胸心臟超音波，詢問檢查如何進行。護理師的說明何者正確？","options":[{"letter":"A","text":"由靜脈注入放射性示蹤劑，觀察心肌灌流與功能變化"},{"letter":"B","text":"由胸壁放置探頭觀察心臟結構與功能，屬非侵入性檢查"},{"letter":"C","text":"由血管置入導管到達心臟，觀察心腔壓力與血流變化"},{"letter":"D","text":"由口腔置入探頭靠近心臟，觀察心臟結構與功能變化"}],"answer":"B","rationale":"經胸心臟超音波以胸壁探頭取得心臟結構與功能影像，通常屬非侵入性檢查，不使用游離輻射。"},{"stem":"病人接受經食道心臟超音波時使用咽喉局部麻醉，檢查後詢問何時可以喝水或進食。護理師應以哪項條件作為開始飲食的依據？","options":[{"letter":"A","text":"待咽喉麻醉消退且吞嚥反射恢復，再依指示開始飲食"},{"letter":"B","text":"待噁心感消退且沒有喉嚨疼痛，即可開始清淡飲食"},{"letter":"C","text":"待生命徵象穩定且能自行坐起，即可先飲用溫水"},{"letter":"D","text":"待病人意識清楚且能回答問題，即可先少量飲水"}],"answer":"A","rationale":"咽喉麻醉尚未消退、吞嚥反射未恢復前飲食有吸入風險，不能僅以清醒、無疼痛或生命徵象穩定判定可進食。"},{"stem":"病人完成經食道心臟超音波後，出現呼吸困難及頸部腫脹。護理師最優先的處理為何？","options":[{"letter":"A","text":"先安置半坐臥並觀察呼吸，待症狀未改善再通知醫師"},{"letter":"B","text":"立即啟動緊急評估並通知醫師，維持呼吸道安全"},{"letter":"C","text":"先安撫病人並指導緩慢呼吸，待焦慮降低後再回報"},{"letter":"D","text":"先檢查咽喉麻醉恢復情形，待反射恢復後再評估腫脹"}],"answer":"B","rationale":"檢查後呼吸困難合併頸部腫脹，可能代表嚴重併發症或呼吸道威脅，應立即緊急評估、通知醫師並維持呼吸道安全。"},{"stem":"病人預定接受心導管檢查，護理師正在進行檢查前安全核對。下列哪組確認事項最適當？","options":[{"letter":"A","text":"確認顯影劑反應史、腎功能、抗凝血用藥及禁食指示"},{"letter":"B","text":"確認食物過敏史、腎功能、止痛用藥及禁食指示"},{"letter":"C","text":"確認顯影劑反應史、肝功能、降壓用藥及禁食指示"},{"letter":"D","text":"確認麻醉反應史、腎功能、抗凝血用藥及睡眠情形"}],"answer":"A","rationale":"心導管檢查可能使用顯影劑且涉及血管穿刺，應確認顯影劑反應史、腎功能與抗凝血用藥，並依醫囑核對禁食準備。"},{"stem":"病人經股動脈接受心導管檢查後返回病房，護理師發現穿刺處敷料迅速被鮮血浸濕。此時最優先的處置為何？","options":[{"letter":"A","text":"先測量生命徵象並記錄，再等待醫師評估穿刺處"},{"letter":"B","text":"先協助平躺並限制患肢活動，再觀察滲血變化"},{"letter":"C","text":"立即加壓止血並通報團隊，同時監測生命徵象"},{"letter":"D","text":"先更換無菌敷料並觀察滲血，再決定是否加壓"}],"answer":"C","rationale":"股動脈穿刺處快速出血可能造成失血，應立即加壓止血，並通報及監測循環；單純換藥或觀察不足以控制出血。"},{"stem":"病人經右側股動脈接受心導管檢查後，右足出現蒼白、冰冷，且足背脈搏較左側微弱。護理師應優先如何處理？","options":[{"letter":"A","text":"先溫敷患側足部並評估，再判斷是否需要通報"},{"letter":"B","text":"先評估麻醉恢復與肌力，待恢復後再比較脈搏"},{"letter":"C","text":"立即比較兩側肢體循環，並通報醫師評估灌流"},{"letter":"D","text":"先抬高患肢並觀察膚色，稍後重測足背脈搏"}],"answer":"C","rationale":"穿刺側足部蒼白、冰冷及脈搏減弱提示動脈灌流受損，需立即比較循環並通報，不宜先以保暖或等待麻醉恢復處理。"},{"stem":"心導管檢查後，病人的股動脈穿刺處出現搏動性腫塊，且短時間內明顯擴大。護理師最適當的處置為何？","options":[{"letter":"A","text":"先調整患肢姿勢並抬高，稍後再測量腫塊大小"},{"letter":"B","text":"標記腫塊邊界並記錄，待例行查房時再回報"},{"letter":"C","text":"持續評估腫塊與循環，立即通知醫療團隊處理"},{"letter":"D","text":"先更換敷料並固定患肢，觀察腫塊是否自行縮小"}],"answer":"C","rationale":"快速擴大或具有搏動性的腫塊需警覺血腫或假性動脈瘤等血管併發症，應立即通報，不能等待例行查房。"},{"stem":"病人經橈動脈接受心導管檢查後，護理師欲及早發現穿刺相關出血與手部缺血。下列哪組評估最適當？","options":[{"letter":"A","text":"評估腕部疼痛與腫脹，並檢查局部敷料是否潮濕"},{"letter":"B","text":"評估手部灌流與感覺，並檢查穿刺處是否出血"},{"letter":"C","text":"評估前臂皮膚完整性，並檢查手部握力變化"},{"letter":"D","text":"評估肩肘關節活動度，並檢查上臂肌力變化"}],"answer":"B","rationale":"橈動脈入路後應重點確認手部灌流、感覺及穿刺處止血情形；僅評估疼痛、肌力或敷料，無法完整掌握遠端循環。"},{"stem":"病人接受心導管檢查後突然表示胸口疼痛，監測心電圖也出現新的變化。護理師應優先採取哪項處置？","options":[{"letter":"A","text":"先檢查穿刺處與末梢循環，再安排胸痛評估"},{"letter":"B","text":"立即評估胸痛與循環，並通報醫療團隊處理"},{"letter":"C","text":"先協助放鬆並減少刺激，待胸痛緩解後再評估"},{"letter":"D","text":"先評估疼痛與呼吸型態，觀察休息後是否改善"}],"answer":"B","rationale":"新發胸痛合併心電圖變化需警覺急性心肌缺血等併發症，應立即評估並通報，不宜僅休息觀察。"},{"stem":"病人接受冠狀動脈攝影後詢問：「多喝水可以幫助顯影劑排出嗎？」護理師最適當的衛教為何？","options":[{"letter":"A","text":"為減少腎臟代謝負擔，當天減少飲水並觀察尿量"},{"letter":"B","text":"以尿色轉清作為補水目標，暫時不需查看穿刺處"},{"letter":"C","text":"為加快顯影劑排出，短時間內儘量多喝開水"},{"letter":"D","text":"若無限水，依醫囑補充水分並觀察尿量及穿刺處"}],"answer":"D","rationale":"水分補充應依心腎狀況、液體限制及醫囑調整，並持續觀察尿量與穿刺處；不可自行大量飲水。"},{"stem":"平時使用吸入型支氣管擴張劑的病人即將接受肺功能檢查，詢問當天是否仍要用藥。護理師最適當的處理為何？","options":[{"letter":"A","text":"為取得未用藥的基準值，自行停用支氣管擴張劑"},{"letter":"B","text":"依檢查目的及醫囑，確認支氣管擴張劑是否暫緩"},{"letter":"C","text":"為避免症狀影響吹氣表現，檢查前增加吸入劑量"},{"letter":"D","text":"為維持平日呼吸狀況，不必確認即可照常用藥"}],"answer":"B","rationale":"支氣管擴張劑是否暫緩使用取決於檢查目的及醫囑，不能自行停藥、加量或未確認便照常使用。"},{"stem":"病人首次接受需測量用力呼氣的肺量計檢查。為取得可靠結果，護理師應如何指導吹氣動作？","options":[{"letter":"A","text":"含緊吹嘴深吸氣後，緩慢而均勻地吐氣至末"},{"letter":"B","text":"含緊吹嘴吸氣後，分段用力吐氣並短暫休息"},{"letter":"C","text":"含緊吹嘴深吸氣後，快速用力並持續吐氣到底"},{"letter":"D","text":"含緊吹嘴後，維持平常潮氣呼吸直到測試完成"}],"answer":"C","rationale":"用力呼氣測試需密封吹嘴，深吸氣後快速、用力且持續吐氣；緩慢呼氣、分段中斷或淺呼吸會影響結果。"},{"stem":"病人進行肺量計測試時，用力吐氣後表示頭暈，身體也出現搖晃。護理師應優先如何處理？","options":[{"letter":"A","text":"先協助站起舒展身體，待頭暈稍緩後繼續測試"},{"letter":"B","text":"先引導深快呼吸調整，再立即重做用力呼氣測試"},{"letter":"C","text":"立即停止測試，協助安全坐臥並評估頭暈症狀"},{"letter":"D","text":"先縮短每次吹氣時間，讓病人持續完成剩餘測試"}],"answer":"C","rationale":"用力呼氣後出現頭暈時，應先停止測試、預防跌倒並評估症狀，不宜要求立即重做或站立活動。"},{"stem":"病人接受支氣管鏡檢查時使用鎮靜藥及咽喉局部麻醉，檢查後返回恢復區。護理師優先應確認哪組項目？","options":[{"letter":"A","text":"先確認活動能力、步態穩定及自行返家意願"},{"letter":"B","text":"先確認咽喉疼痛程度、聲音變化及咳痰情形"},{"letter":"C","text":"先確認禁食時間、飢餓程度及飲食恢復需求"},{"letter":"D","text":"先確認呼吸、血氧及咽喉反射的恢復情形"}],"answer":"D","rationale":"鎮靜及咽喉麻醉後須優先評估呼吸、氧合與反射恢復，咽喉反射尚未恢復前不可進食或飲水。"},{"stem":"病人接受支氣管鏡肺組織切片後，突然呼吸急促，聽診發現單側呼吸音明顯減弱。護理師最適當的判斷與處置為何？","options":[{"letter":"A","text":"懷疑氣胸，立即評估呼吸並通知醫師處理"},{"letter":"B","text":"懷疑支氣管痙攣，先指導緩慢呼吸並觀察"},{"letter":"C","text":"懷疑咽喉麻醉殘效，先維持禁食等待恢復"},{"letter":"D","text":"懷疑焦慮引發過度換氣，先安撫並調整呼吸"}],"answer":"A","rationale":"肺組織切片後突發呼吸困難合併單側呼吸音減弱，需優先警覺氣胸，立即評估並通知醫師。"},{"stem":"病人接受支氣管鏡檢查後咳出少量血絲痰。持續觀察時，下列哪項變化最需要立即通報？","options":[{"letter":"A","text":"咳痰後出現輕微喉癢，休息後可自行緩解"},{"letter":"B","text":"偶爾乾咳並有少量血絲，出血未持續增加"},{"letter":"C","text":"咳血量逐漸增加，並出現呼吸困難或血氧下降"},{"letter":"D","text":"檢查後聲音短暫沙啞，呼吸與血氧保持穩定"}],"answer":"C","rationale":"少量血絲痰可能短暫出現，但出血增加、呼吸困難或血氧下降提示較嚴重的併發症，需立即通報。"},{"stem":"病人需留取痰液培養檢體，詢問如何避免口腔分泌物污染。護理師最適當的採檢指導為何？","options":[{"letter":"A","text":"先咳痰至檢體瓶內，再漱口以完成口腔清潔"},{"letter":"B","text":"漱口後深咳取下呼吸道痰液，避免收集唾液"},{"letter":"C","text":"漱口後輕清喉嚨，收集咽喉處容易取得的分泌物"},{"letter":"D","text":"漱口後收集口腔內分泌物，選取較濃稠者入瓶"}],"answer":"B","rationale":"採檢前漱口並以深咳取得下呼吸道痰液，可減少口腔污染；唾液或咽喉分泌物不能取代深部痰液。"},{"stem":"疑似肺結核的病人持續咳嗽，醫師安排結核菌痰液檢查。護理師協助採檢時，最適當的防護安排為何？","options":[{"letter":"A","text":"採接觸防護措施，於一般單人房內協助採痰"},{"letter":"B","text":"採標準防護措施，於一般單人房內協助採痰"},{"letter":"C","text":"採空氣傳染防護，依適當隔離流程安排採痰"},{"letter":"D","text":"採飛沫防護措施，於一般單人房內協助採痰"}],"answer":"C","rationale":"疑似肺結核病人咳嗽採痰時，應採取空氣傳染防護及適當隔離流程，僅採標準、接觸或飛沫防護不足。"},{"stem":"護理師已協助病人取得痰液培養檢體並蓋緊容器。接下來哪項處理最能確保檢體品質與病人安全？","options":[{"letter":"A","text":"先以床號標示檢體，送達後再補上病人資料"},{"letter":"B","text":"先集中病房檢體，待交班時再統一送交檢驗室"},{"letter":"C","text":"核對病人身分與檢體標示，依規定儘速送驗"},{"letter":"D","text":"先保留檢體觀察痰液外觀，待醫師查房再送驗"}],"answer":"C","rationale":"正確核對病人身分、完成檢體標示並及時送驗，是維持檢體品質與避免辨識錯誤的必要步驟。"},{"stem":"病人完成橈動脈採血以進行動脈血液氣體分析。拔除採血針後，護理師最重要的局部處置為何？","options":[{"letter":"A","text":"持續直接加壓至止血，並評估手部遠端循環"},{"letter":"B","text":"先抬高手臂減少局部出血，待滲血時再加壓"},{"letter":"C","text":"短暫按壓後立即鬆手，貼上敷料再觀察滲血"},{"letter":"D","text":"以無菌敷料覆蓋穿刺處，稍後再確認是否滲血"}],"answer":"A","rationale":"動脈穿刺後需持續直接加壓至止血，不能僅覆蓋敷料或短暫按壓；同時應確認遠端循環未受影響。"},{"stem":"護理師剛取得病人的動脈血液氣體檢體。為減少檢體處理造成的結果偏差，接下來最適當的作法為何？","options":[{"letter":"A","text":"比照一般血液檢體保存，待例行收件時段再送驗"},{"letter":"B","text":"保留針筒內少量空氣，輕搖混勻後依規定送驗"},{"letter":"C","text":"依檢驗室規範妥善處理，並儘速將檢體送驗"},{"letter":"D","text":"先完成其他床邊照護，再將檢體集中送至檢驗室"}],"answer":"C","rationale":"血氣結果會受送驗延遲及檢體處理方式影響，應依檢驗室規範妥善處理並儘速送驗，避免空氣干擾。"},{"stem":"病人即將由橈動脈採血，詢問護理師為何先進行Allen測試。下列哪項說明最適當？","options":[{"letter":"A","text":"評估手部側枝循環是否足以維持遠端灌流"},{"letter":"B","text":"評估手腕神經傳導是否足以維持手部感覺"},{"letter":"C","text":"評估橈動脈血流壓力是否足以完成動脈採血"},{"letter":"D","text":"評估手部靜脈回流是否足以避免穿刺後腫脹"}],"answer":"A","rationale":"Allen測試用於評估尺動脈等側枝循環，以降低橈動脈穿刺後手部灌流不足的風險，並非測量動脈壓力或神經功能。"},{"stem":"病人需自行留取尿液常規檢查的中段尿，表示不清楚應從何時開始接尿。護理師最適當的指導為何？","options":[{"letter":"A","text":"清潔會陰後全程接取尿液，再取中間部分作為檢體"},{"letter":"B","text":"清潔會陰後先排大部分尿，再以容器接取末段尿"},{"letter":"C","text":"清潔會陰後立即接取最初段尿液，再將餘尿排掉"},{"letter":"D","text":"清潔會陰後先排少量尿，再將中段尿接入指定容器"}],"answer":"D","rationale":"中段尿應在清潔會陰、排掉最初少量尿液後接取，以減少尿道口及皮膚菌污染；不是收集全程尿液後再分取。"},{"stem":"留置導尿病人因疑似泌尿道感染需採集尿液培養檢體。護理師應選擇哪種採檢方式？","options":[{"letter":"A","text":"依流程消毒導尿管採樣口，再無菌抽取新鮮尿液"},{"letter":"B","text":"消毒集尿袋出口，無菌接取袋內尚未排出的尿液"},{"letter":"C","text":"消毒導尿管與尿袋接頭，短暫拆開後收集新鮮尿液"},{"letter":"D","text":"先排空集尿袋，待新尿流入後由袋底無菌接取"}],"answer":"A","rationale":"尿液培養應由消毒後的採樣口，以無菌方式取得新鮮尿液；尿袋內尿液容易受污染，也不應拆開接頭採檢。"},{"stem":"病人疑似泌尿道感染，醫師同時開立尿液培養與抗生素，第一劑尚未給予。護理師如何安排採檢與給藥最適當？","options":[{"letter":"A","text":"待抗生素療程結束後，再採集尿液評估治療效果"},{"letter":"B","text":"先完成第一劑抗生素，再立即採集尿液培養檢體"},{"letter":"C","text":"若不延誤治療，先採集尿液培養檢體再開始給藥"},{"letter":"D","text":"先觀察抗生素治療反應，症狀未改善時再採集培養"}],"answer":"C","rationale":"抗生素可能降低尿液培養的陽性率，因此宜在開始給藥前採檢，但不能為了採檢延誤必要治療。"},{"stem":"護理師已完成尿液檢體採集，但因運送作業延誤，預期無法及時送達檢驗室。下列處理何者最適當？","options":[{"letter":"A","text":"密封置於護理站常溫，等例行收件時統一送驗"},{"letter":"B","text":"依檢驗室規範保存，記錄採集時間並安排送驗"},{"letter":"C","text":"先將檢體冷藏保存，以送出時間作為標示時間"},{"letter":"D","text":"轉裝至較大的清潔容器，完成交班後再安排送驗"}],"answer":"B","rationale":"延遲送檢可能改變尿液檢體成分，應依檢驗室規範保存並記錄實際採集時間，不宜任意轉裝或以送出時間取代。"},{"stem":"病人預定從今天早晨開始收集24小時尿液，詢問第一泡尿應如何處理。護理師的指導何者正確？","options":[{"letter":"A","text":"排空膀胱並棄尿、記錄起始時間，再收集後續全部尿液"},{"letter":"B","text":"保留起始時第一次尿液，記錄時間並收集後續尿液"},{"letter":"C","text":"排空膀胱並棄尿、記錄起始時間，每次只留中段尿液"},{"letter":"D","text":"排空膀胱並棄尿，待下一次排尿才記錄起始時間"}],"answer":"A","rationale":"開始時應排空膀胱、丟棄該次尿液並記錄時間，再完整收集至24小時結束時的尿液。"},{"stem":"病人正在收集24小時尿液，下午告知護理師有一次排尿忘記收集。護理師應如何處理？","options":[{"letter":"A","text":"延長收集至補足一次排尿，再將全部檢體送驗"},{"letter":"B","text":"通報檢查單位，依指示重新完整收集尿液"},{"letter":"C","text":"記錄漏收情形，依原結束時間將其餘檢體送驗"},{"letter":"D","text":"收集下一次尿液補入，維持原訂收集起迄時間"}],"answer":"B","rationale":"漏收會使24小時尿液總量與檢驗結果失準，不能用補收或延長一次排尿取代，應據實通報並依指示重新收集。"},{"stem":"病人月經延遲，尿液妊娠試驗呈陰性，但仍高度懷疑懷孕。護理師最適當的回應為何？","options":[{"letter":"A","text":"說明早期仍可能陰性，依醫囑安排複驗或進一步檢查"},{"letter":"B","text":"依本次陰性結果判定未孕，安排一般月經追蹤"},{"letter":"C","text":"請病人多喝水後立即複驗，確認是否為早期懷孕"},{"letter":"D","text":"待月經恢復後再進行複驗，暫不安排其他懷孕評估"}],"answer":"A","rationale":"檢測時間及尿液濃度會影響結果，單次陰性不能完全排除早期懷孕；臨床懷疑持續時應依醫囑追蹤。"},{"stem":"病人第一次自行採集糞便檢體，詢問如何避免檢體不合格。護理師應提供哪項指導？","options":[{"letter":"A","text":"避免尿液與馬桶水污染，以指定容器標示後送驗"},{"letter":"B","text":"排便後直接由馬桶內取樣，裝入指定容器送驗"},{"letter":"C","text":"採樣後先送至檢驗室，容器標籤再由家屬補齊"},{"letter":"D","text":"將同次尿液與糞便一起留取，裝入指定容器送驗"}],"answer":"A","rationale":"糞便檢體應避免尿液及馬桶水污染，並使用指定容器、正確標示及依規定送驗，以維持檢體品質。"},{"stem":"病人預定接受糞便寄生蟲檢查，詢問採集後應如何保存與送驗。護理師最適當的指導為何？","options":[{"letter":"A","text":"採集後先冷凍保存，累積檢體後再統一送交檢驗"},{"letter":"B","text":"依檢驗室指定容器、保存方式與採集時間送驗"},{"letter":"C","text":"採集後自行加入酒精保存，避免運送途中變質"},{"letter":"D","text":"使用一般乾燥容器採集，所有寄生蟲檢體均先冷藏"}],"answer":"B","rationale":"寄生蟲檢查可能有不同的容器、保存及時間要求，應遵循檢驗室指示，不可自行添加保存物質或一律冷藏、冷凍。"},{"stem":"使用降糖藥的病人預定接受空腹血糖檢查，詢問能否喝水及是否需要停藥。護理師應如何確認檢查準備？","options":[{"letter":"A","text":"依醫囑確認禁食與飲水規定，並核對降糖藥指示"},{"letter":"B","text":"確認已停止所有降糖藥，再請病人持續禁食候檢"},{"letter":"C","text":"請病人少量飲用含糖飲料，再依原禁食時間抽血"},{"letter":"D","text":"確認未吃固體食物即可，飲料與降糖藥照常使用"}],"answer":"A","rationale":"空腹檢查的禁食、飲水及降糖藥處理應依醫囑確認，不可將含熱量飲料視為可飲用的水，也不可自行停藥。"},{"stem":"病人為空腹抽血而禁食，採血過程中突然冒冷汗、顫抖並出現意識改變。護理師應優先採取哪項措施？","options":[{"letter":"A","text":"先停止採血並臥床休息，觀察症狀是否自行改善"},{"letter":"B","text":"先完成剩餘檢體採集，再通知醫師評估血糖"},{"letter":"C","text":"通知醫師並等待到場，再測血糖決定後續處置"},{"letter":"D","text":"立即評估血糖並依急救流程處理，暫停例行採血"}],"answer":"D","rationale":"冒冷汗、顫抖與意識改變可能是低血糖表現，應立即評估並依流程處理，不可為完成檢查或等待人員而延誤。"},{"stem":"長期服用華法林的病人預定接受一般靜脈抽血，擔心出血而詢問是否停藥。護理師最適當的回應為何？","options":[{"letter":"A","text":"待抽血檢查結果正常後，再恢復原華法林用藥"},{"letter":"B","text":"一般抽血勿自行停藥，特殊操作再依醫囑確認"},{"letter":"C","text":"抽血當日先暫停華法林，完成抽血後再恢復用藥"},{"letter":"D","text":"先減少當次華法林劑量，以降低穿刺處出血風險"}],"answer":"B","rationale":"一般靜脈抽血通常不需自行停用抗凝血藥；若涉及特定操作，應依醫囑確認用藥計畫，不可自行停藥或減量。"},{"stem":"病人完成靜脈抽血後，穿刺處仍持續滲血。護理師最適當的處置為何？","options":[{"letter":"A","text":"直接持續加壓，評估出血與抗凝血用藥並視需要通報"},{"letter":"B","text":"屈曲手肘壓住棉球，待敷料乾燥後再評估滲血"},{"letter":"C","text":"先抬高手臂並冷敷，待腫脹改善後再確認滲血"},{"letter":"D","text":"先更換乾燥敷料覆蓋，待例行巡房再評估出血"}],"answer":"A","rationale":"持續直接加壓是穿刺處止血的關鍵，並應評估抗凝血用藥及出血情形；若持續出血，需進一步通報。"},{"stem":"護理師需連續為數名病人抽血，為避免檢體與病人身分錯置，應採取哪項標示方式？","options":[{"letter":"A","text":"採血後先將試管送檢，再請檢驗室核對身分標示"},{"letter":"B","text":"先依床號在護理站貼標籤，再攜至病人旁採檢"},{"letter":"C","text":"在病人旁核對身分，採檢後立即標示對應試管"},{"letter":"D","text":"完成所有病人採血後，回護理站核對名單貼標籤"}],"answer":"C","rationale":"在病人旁核對身分並於採檢後立即標示，可確保檢體與標籤一致，避免依床號、記憶或集中作業造成錯置。"},{"stem":"護理師準備由病人的周邊靜脈採集血液培養檢體。下列哪項操作最能降低培養污染風險？","options":[{"letter":"A","text":"消毒後以裸手觸摸確認血管，再進行穿刺採血"},{"letter":"B","text":"僅以酒精快速擦拭皮膚，採用一般抽血方式採檢"},{"letter":"C","text":"嚴格完成皮膚消毒並採無菌技術，依指示採集檢體"},{"letter":"D","text":"先戴無菌手套清除皮膚污垢，無須另行皮膚消毒"}],"answer":"C","rationale":"血液培養應嚴格執行皮膚消毒與無菌技術；消毒後再以裸手觸摸，或以手套取代皮膚消毒，均可能增加污染。"},{"stem":"急診病人疑似敗血症，醫師同時開立血液培養與抗生素，且病人需立即治療。護理師如何安排最適當？","options":[{"letter":"A","text":"先等採檢人員到場完成培養，再給第一劑抗生素"},{"letter":"B","text":"先完成其他例行抽血，再統一採培養並給抗生素"},{"letter":"C","text":"能迅速完成時先採培養再給藥，不因採檢延誤治療"},{"letter":"D","text":"先給抗生素並觀察退燒，再安排血液培養採檢"}],"answer":"C","rationale":"血液培養宜在抗生素前採集以增加檢出機會，但敗血症治療具時效，不能因等待採檢而延誤必要治療。"},{"stem":"住院病人留置周邊靜脈導管處紅腫，並出現發燒，醫師安排血液培養。護理師執行採檢時應採取哪項作法？","options":[{"letter":"A","text":"依醫囑選擇採血部位並避免污染，記錄部位與時間"},{"letter":"B","text":"從最易穿刺部位採血，以送達檢驗室時間作記錄"},{"letter":"C","text":"僅從原留置導管抽血，以免周邊穿刺影響培養"},{"letter":"D","text":"先完成抗生素給藥，待局部紅腫改善後再採血"}],"answer":"A","rationale":"應依培養目的與醫囑選擇適當採檢部位、避免污染，並記錄實際採檢部位與時間，以利結果判讀。"},{"stem":"檢驗室來電通知住院病人的血液檢驗出現危急值。護理師接獲訊息後，最適當的處理為何？","options":[{"letter":"A","text":"先觀察病人是否有症狀，出現異常再通知醫師"},{"letter":"B","text":"先登錄危急值並交班，請下一班追蹤醫療處置"},{"letter":"C","text":"立即依流程通知負責醫療人員，確認接收與後續處置"},{"letter":"D","text":"先核對前次檢驗結果，待例行查房再向醫師報告"}],"answer":"C","rationale":"危急值須立即依院內流程傳達並確認接收與後續處置，不能等例行查房、交班或出現症狀才通報。"},{"stem":"使用抗凝血藥的病人收到凝血功能報告，部分數值與參考範圍不同。護理師的判讀與後續處理何者最適當？","options":[{"letter":"A","text":"結合用藥、出血表現與治療目標評估，不自行調藥"},{"letter":"B","text":"依檢驗是否超出參考值，建議病人先暫停抗凝血藥"},{"letter":"C","text":"依病人有無出血症狀，決定是否需要追蹤異常數值"},{"letter":"D","text":"依單次凝血檢驗結果，判定目前抗凝血治療是否合適"}],"answer":"A","rationale":"凝血結果須結合用藥、臨床表現與治療目標判讀，不能僅憑單次數值或有無出血決定用藥及追蹤。"},{"stem":"病人預定接受核醫骨骼掃描，詢問這項檢查如何產生影像。護理師的說明何者正確？","options":[{"letter":"A","text":"注射一般顯影劑後拍攝Ｘ光，依顯影程度判讀病灶"},{"letter":"B","text":"注射少量放射性示蹤劑，追蹤分布成像並配合安全措施"},{"letter":"C","text":"以磁場與無線電波成像，觀察骨骼及周圍組織"},{"letter":"D","text":"以電腦斷層照射骨骼，重建影像判讀骨骼病灶"}],"answer":"B","rationale":"核醫骨骼掃描利用放射性示蹤劑在體內的分布成像，病人須依核醫部門指示配合影像及輻射安全措施。"},{"stem":"病人完成核醫骨骼掃描後詢問：「多喝水是不是能幫助藥劑排出？」護理師最適當的回答為何？","options":[{"letter":"A","text":"為加速示蹤劑排出，檢查後可暫停原有的限水措施"},{"letter":"B","text":"依核醫指示及個人限水情形補充水分，並適時排尿"},{"letter":"C","text":"若擔心水分攝取不足，可自行服用利尿劑促進排出"},{"letter":"D","text":"先維持較少飲水量，待示蹤劑作用結束後再恢復飲水"}],"answer":"B","rationale":"適當水分與排尿應依核醫指示及個人狀況安排；有心腎疾病或限水者不可盲目增加飲水，也不可自行使用利尿劑。"},{"stem":"育齡女性預定接受核醫檢查，護理師在注射示蹤劑前進行安全評估。下列作法何者最適當？","options":[{"letter":"A","text":"確認月經是否規則，週期正常者即可照常檢查"},{"letter":"B","text":"確認有無早孕相關症狀，出現症狀時才通報評估"},{"letter":"C","text":"確認懷孕可能與哺乳情形，依核醫規範通報評估"},{"letter":"D","text":"確認是否正在哺乳，未哺乳者即可照常安排檢查"}],"answer":"C","rationale":"放射性示蹤劑檢查前須確認懷孕可能及哺乳狀況，再由核醫團隊依檢查種類評估，不能只依月經規則或有無症狀判定安全。"}]},{"title":"COPD：慢性支氣管炎與肺氣腫","questions":[{"stem":"慢性支氣管炎的臨床定義為何？","options":[{"letter":"A","text":"FEV1/FVC降低即符合"},{"letter":"B","text":"任何急性咳嗽超過3週"},{"letter":"C","text":"每年咳嗽咳痰至少3個月，連續2年，排除其他原因"},{"letter":"D","text":"肺泡壁破壞即符合"}],"answer":"C","rationale":"慢性支氣管炎以咳嗽咳痰持續時間定義；肺氣腫則指肺泡壁破壞。"},{"stem":"肺氣腫的主要病理變化為何？","options":[{"letter":"A","text":"肺泡遠端氣腔擴大並有肺泡壁破壞"},{"letter":"B","text":"胸膜積液"},{"letter":"C","text":"肺泡纖維化縮小"},{"letter":"D","text":"支氣管急性水腫且可逆"}],"answer":"A","rationale":"肺泡壁破壞使彈性回縮力下降並促成氣體滯留。"},{"stem":"慢性支氣管炎黏液增加的主要原因為何？","options":[{"letter":"A","text":"腎臟水分排出增加"},{"letter":"B","text":"胸壁肥厚"},{"letter":"C","text":"氣道發炎及黏液腺、杯狀細胞增生"},{"letter":"D","text":"肺泡表面張力完全消失"}],"answer":"C","rationale":"慢性刺激導致氣道發炎、分泌增加及纖毛清除下降。"},{"stem":"COPD最重要且可改變的危險因子為何？","options":[{"letter":"A","text":"身高"},{"letter":"B","text":"吸菸"},{"letter":"C","text":"咖啡因"},{"letter":"D","text":"短期抗生素"}],"answer":"B","rationale":"菸草煙霧是主要危險因子；戒菸有助減緩肺功能下降。"},{"stem":"COPD氣流受限通常具有何種特性？","options":[{"letter":"A","text":"必定由感染造成"},{"letter":"B","text":"每次吸藥即完全消失"},{"letter":"C","text":"持續存在，並非完全可逆"},{"letter":"D","text":"只在睡眠發生"}],"answer":"C","rationale":"COPD為持續氣流受限，可能部分可逆但通常不完全逆轉。"},{"stem":"肺氣腫患者呼氣時易氣體滯留的原因為何？","options":[{"letter":"A","text":"小氣道呼氣時易動態塌陷"},{"letter":"B","text":"吸氣時聲門關閉"},{"letter":"C","text":"肺泡表面活性劑過多"},{"letter":"D","text":"腎功能不足"}],"answer":"A","rationale":"彈性回縮力下降及小氣道失去支撐，使呼氣排空受阻。"},{"stem":"縮唇呼吸的主要作用為何？","options":[{"letter":"A","text":"加速呼吸排二氧化碳"},{"letter":"B","text":"縮短呼氣時間"},{"letter":"C","text":"延長呼氣並維持小氣道通暢"},{"letter":"D","text":"避免咳嗽"}],"answer":"C","rationale":"縮唇呼氣產生輕微正壓，可減少小氣道塌陷及喘促。"},{"stem":"一位COPD患者呈桶狀胸的主要原因為何？","options":[{"letter":"A","text":"肺過度充氣使胸廓前後徑增加"},{"letter":"B","text":"大量胸水"},{"letter":"C","text":"單側肋骨骨折"},{"letter":"D","text":"肺容積縮小"}],"answer":"A","rationale":"慢性氣體滯留可造成肺過度充氣及桶狀胸。"},{"stem":"一位COPD患者使用輔助呼吸肌代表何者？","options":[{"letter":"A","text":"患者必無缺氧"},{"letter":"B","text":"氣道阻塞已解除"},{"letter":"C","text":"肺功能正常"},{"letter":"D","text":"呼吸作功增加"}],"answer":"D","rationale":"輔助肌使用反映呼吸負荷增加，應評估窘迫趨勢。"},{"stem":"呼氣延長、呼吸音減弱較符合何者？","options":[{"letter":"A","text":"上呼吸道單純阻塞"},{"letter":"B","text":"肺泡出血"},{"letter":"C","text":"氣流受限及肺過度充氣"},{"letter":"D","text":"肺部無氣體滯留"}],"answer":"C","rationale":"氣流受限延長呼氣，過度充氣亦可使呼吸音減弱。"},{"stem":"COPD低血氧常見機轉為何？","options":[{"letter":"A","text":"通氣灌流不匹配"},{"letter":"B","text":"血紅素增加"},{"letter":"C","text":"腎臟排氧增加"},{"letter":"D","text":"胃酸減少"}],"answer":"A","rationale":"氣道阻塞與肺泡破壞造成通氣灌流分布不均。"},{"stem":"慢性缺氧造成肺動脈高壓的機轉為何？","options":[{"letter":"A","text":"肺血管缺氧性收縮及重塑"},{"letter":"B","text":"腎小球濾過增加"},{"letter":"C","text":"冠狀動脈擴張"},{"letter":"D","text":"支氣管黏液減少"}],"answer":"A","rationale":"缺氧性肺血管收縮與重塑會提高肺血管阻力。"},{"stem":"肺心病右心衰竭可能出現何種表徵？","options":[{"letter":"A","text":"黃疸必然出現"},{"letter":"B","text":"瞳孔散大"},{"letter":"C","text":"關節紅腫"},{"letter":"D","text":"頸靜脈怒張及下肢水腫"}],"answer":"D","rationale":"右心衰竭造成體循環靜脈鬱血。"},{"stem":"COPD急性惡化常見誘因為何？","options":[{"letter":"A","text":"呼吸道感染及空氣污染"},{"letter":"B","text":"適當飲水"},{"letter":"C","text":"規律復健"},{"letter":"D","text":"戒菸"}],"answer":"A","rationale":"感染與刺激物暴露可觸發症狀急遽惡化。"},{"stem":"咳嗽、痰量及呼吸困難較平日明顯增加，應如何判斷？","options":[{"letter":"A","text":"代表肺功能恢復"},{"letter":"B","text":"疑似急性惡化，需進一步評估"},{"letter":"C","text":"立即停掉所有藥"},{"letter":"D","text":"必然是心肌梗塞"}],"answer":"B","rationale":"症狀相對基線加劇須評估氧合、感染及其他可能病因。"},{"stem":"確認持續氣流受限最重要的檢查為何？","options":[{"letter":"A","text":"痰色"},{"letter":"B","text":"支氣管擴張劑後肺量計"},{"letter":"C","text":"心電圖"},{"letter":"D","text":"單靠聽診"}],"answer":"B","rationale":"肺量計客觀確認氣流受限，不能只靠症狀或聽診診斷。"},{"stem":"FEV1代表何者？","options":[{"letter":"A","text":"用力呼氣第一秒呼出量"},{"letter":"B","text":"呼吸頻率"},{"letter":"C","text":"殘氣量"},{"letter":"D","text":"吸氣容量"}],"answer":"A","rationale":"FEV1是用力呼氣第一秒排出的氣體量。"},{"stem":"FEV1/FVC主要協助判斷何者？","options":[{"letter":"A","text":"肺泡表面張力"},{"letter":"B","text":"氣流阻塞"},{"letter":"C","text":"腎濃縮功能"},{"letter":"D","text":"血液攜氧能力"}],"answer":"B","rationale":"FEV1/FVC降低提示呼氣氣流阻塞。"},{"stem":"肺量計檢查前用藥如何處理？","options":[{"letter":"A","text":"禁水24小時"},{"letter":"B","text":"先大量吸救援藥"},{"letter":"C","text":"自行停藥一週"},{"letter":"D","text":"依檢查指示暫停特定支氣管擴張劑"}],"answer":"D","rationale":"是否暫停藥物由檢查目的與醫囑決定，不可自行停掉全部藥。"},{"stem":"急性惡化患者嗜睡，哪項檢查可評估通氣及酸鹼？","options":[{"letter":"A","text":"骨密度"},{"letter":"B","text":"糞便潛血"},{"letter":"C","text":"動脈血液氣體"},{"letter":"D","text":"尿液常規"}],"answer":"C","rationale":"血氣可評估氧合、PaCO2及酸鹼狀態。"},{"stem":"脈搏血氧機能提供何種資訊？","options":[{"letter":"A","text":"判定肺炎病原"},{"letter":"B","text":"直接測量二氧化碳"},{"letter":"C","text":"周邊血氧趨勢，不能測PaCO2"},{"letter":"D","text":"測肺活量"}],"answer":"C","rationale":"血氧機測氧飽和度，不提供二氧化碳或完整酸鹼資訊。"},{"stem":"胸部X光對COPD評估的作用為何？","options":[{"letter":"A","text":"確認細菌種類"},{"letter":"B","text":"精確測FEV1"},{"letter":"C","text":"評估過度充氣並協助排除其他胸腔病變"},{"letter":"D","text":"測吸入技巧"}],"answer":"C","rationale":"影像可協助評估結構及排除肺炎、氣胸等，但不取代肺量計。"},{"stem":"早發或家族性肺氣腫可考慮檢查何者？","options":[{"letter":"A","text":"α1抗胰蛋白酶"},{"letter":"B","text":"胰島素抗體"},{"letter":"C","text":"甲狀腺抗體"},{"letter":"D","text":"凝血因子VIII"}],"answer":"A","rationale":"α1抗胰蛋白酶缺乏是遺傳性肺氣腫原因之一。"},{"stem":"痰量增加且呈膿性，最適當處置為何？","options":[{"letter":"A","text":"視為老化不處理"},{"letter":"B","text":"評估感染與惡化徵象並通報"},{"letter":"C","text":"限制所有飲水"},{"letter":"D","text":"立即停氧"}],"answer":"B","rationale":"痰液改變可能表示感染或惡化，須結合其他徵象評估。"},{"stem":"評估活動耐受度應記錄何者？","options":[{"letter":"A","text":"身高"},{"letter":"B","text":"髮色"},{"letter":"C","text":"飲水量而已"},{"letter":"D","text":"活動喘、血氧與恢復情形"}],"answer":"D","rationale":"症狀、氧合及恢復時間可反映活動功能與治療反應。"},{"stem":"評估呼吸困難最適當方式為何？","options":[{"letter":"A","text":"因主觀而不記錄"},{"letter":"B","text":"只在夜間評估"},{"letter":"C","text":"依年齡推估"},{"letter":"D","text":"詢問對日常活動影響並比較個人基線"}],"answer":"D","rationale":"症狀及功能需由患者報告，並與個人基線比較。"},{"stem":"一位COPD患者體重下降，優先評估何者？","options":[{"letter":"A","text":"立即禁食"},{"letter":"B","text":"視力"},{"letter":"C","text":"攝食、呼吸作功及營養狀態"},{"letter":"D","text":"要求劇烈運動"}],"answer":"C","rationale":"呼吸負荷與進食困難可造成攝取不足及營養不良。"},{"stem":"一位COPD患者出現杵狀指，應如何看待？","options":[{"letter":"A","text":"確診必要條件"},{"letter":"B","text":"吸入藥過量"},{"letter":"C","text":"非典型單純COPD特徵，須評估其他原因"},{"letter":"D","text":"氧合正常證據"}],"answer":"C","rationale":"杵狀指應考慮肺癌、支氣管擴張等其他病因。"},{"stem":"最具疾病修飾效益的衛教重點為何？","options":[{"letter":"A","text":"長期臥床"},{"letter":"B","text":"避免疫苗"},{"letter":"C","text":"戒菸及提供戒菸支持"},{"letter":"D","text":"自行服抗生素"}],"answer":"C","rationale":"戒菸可減少持續傷害並延緩肺功能下降。"},{"stem":"患者詢問受損後戒菸是否仍有用，最佳回應為何？","options":[{"letter":"A","text":"肺泡會立刻再生"},{"letter":"B","text":"任何階段戒菸都有健康效益"},{"letter":"C","text":"改抽低焦油即可"},{"letter":"D","text":"完全無效"}],"answer":"B","rationale":"戒菸在各階段皆有益，但不會使已破壞肺泡再生。"},{"stem":"肺復健的主要目標為何？","options":[{"letter":"A","text":"取代所有藥物"},{"letter":"B","text":"改善運動能力、症狀處理及生活品質"},{"letter":"C","text":"消除所有急性惡化"},{"letter":"D","text":"使肺泡恢復正常"}],"answer":"B","rationale":"肺復健改善功能與生活品質，但不逆轉肺泡破壞。"},{"stem":"安排運動訓練的安全原則為何？","options":[{"letter":"A","text":"依能力漸進並監測症狀"},{"letter":"B","text":"禁止步行"},{"letter":"C","text":"一開始最大強度"},{"letter":"D","text":"忽略胸痛頭暈"}],"answer":"A","rationale":"個別化漸進運動較安全；胸痛、暈厥等需停止並評估。"},{"stem":"活動喘時應教導何種呼吸？","options":[{"letter":"A","text":"快速張口喘"},{"letter":"B","text":"只吸不呼"},{"letter":"C","text":"閉氣用力"},{"letter":"D","text":"鼻吸、縮唇緩慢呼氣"}],"answer":"D","rationale":"縮唇呼吸能延長呼氣並減少小氣道塌陷。"},{"stem":"洗澡易喘，何種調整較適當？","options":[{"letter":"A","text":"極熱水站立洗"},{"letter":"B","text":"坐姿洗浴並預備用品，節省體力"},{"letter":"C","text":"最疲累時洗"},{"letter":"D","text":"憋氣洗澡"}],"answer":"B","rationale":"坐姿、備物及節能可減少活動負擔。"},{"stem":"進食容易喘，何種建議適當？","options":[{"letter":"A","text":"避免蛋白質"},{"letter":"B","text":"走動快速吃"},{"letter":"C","text":"餐前大量喝水"},{"letter":"D","text":"少量多餐並選營養密度高食物"}],"answer":"D","rationale":"少量多餐可減少單次負荷，並兼顧營養攝取。"},{"stem":"流感疫苗對一位COPD患者的主要好處為何？","options":[{"letter":"A","text":"治癒肺氣腫"},{"letter":"B","text":"取代吸入藥"},{"letter":"C","text":"降低感染及相關併發症風險"},{"letter":"D","text":"立即恢復肺功能"}],"answer":"C","rationale":"疫苗可降低感染與嚴重併發症風險，不能治癒COPD
