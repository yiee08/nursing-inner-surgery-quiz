:"D","text":"只照胸片"}],"answer":"C","rationale":"功能受損是控制評估的重要面向。"},{"stem":"因副作用疑慮不規律用藥，護理師宜？","options":[{"letter":"A","text":"說絕無風險"},{"letter":"B","text":"傾聽並平衡說明利弊，共同討論"},{"letter":"C","text":"責備"},{"letter":"D","text":"叫其停藥"}],"answer":"B","rationale":"非批判溝通可提升安全依從與共同決策。"},{"stem":"患者認為緩解藥越常用越好，應澄清？","options":[{"letter":"A","text":"頻繁需求可能表示控制不佳"},{"letter":"B","text":"越多越穩定"},{"letter":"C","text":"可取代控制藥"},{"letter":"D","text":"無限使用"}],"answer":"A","rationale":"需求增加需重新評估控制及治療計畫。"},{"stem":"穩定後要求減少控制藥，宜？","options":[{"letter":"A","text":"家屬決定"},{"letter":"B","text":"按感覺立即減"},{"letter":"C","text":"自行停藥"},{"letter":"D","text":"由醫療人員評估後調整"}],"answer":"D","rationale":"降階須依控制及風險，在醫療監督下進行。"},{"stem":"回診攜帶吸入器的好處？","options":[{"letter":"A","text":"可檢視實際操作"},{"letter":"B","text":"可與人交換"},{"letter":"C","text":"取代肺量計"},{"letter":"D","text":"免除症狀評估"}],"answer":"A","rationale":"現場觀察可發現技巧及裝置問題。"},{"stem":"控制藥使用正確仍有症狀，調整前確認？","options":[{"letter":"A","text":"診斷、依從、技巧、暴露與共病"},{"letter":"B","text":"直接加倍"},{"letter":"C","text":"只量體溫"},{"letter":"D","text":"藥物顏色"}],"answer":"A","rationale":"需先找可修正因素，避免盲目升級。"},{"stem":"計量窗顯示吸入器用盡，應？","options":[{"letter":"A","text":"搖晃猜量"},{"letter":"B","text":"倒入別裝置"},{"letter":"C","text":"依指示更換"},{"letter":"D","text":"刺穿藥罐"}],"answer":"C","rationale":"依計量器判讀並及時更換較可靠。"},{"stem":"急性發作患者拒絕吸入治療，先？","options":[{"letter":"A","text":"昏迷再處理"},{"letter":"B","text":"確認原因、說明風險並持續監測"},{"letter":"C","text":"停止觀察"},{"letter":"D","text":"強行不解釋"}],"answer":"B","rationale":"尊重溝通同時不可忽略急症監測及處置。"},{"stem":"非處方止咳藥可否取代氣喘藥？","options":[{"letter":"A","text":"不能取代控制或急性支氣管擴張治療"},{"letter":"B","text":"所有均適用"},{"letter":"C","text":"止咳即改善"},{"letter":"D","text":"可停處方藥"}],"answer":"A","rationale":"止咳藥不處理氣道發炎或收縮。"}]},{"title":"肋膜疾病與胸部外傷","questions":[{"stem":"胸腔積液患者平躺時呼吸更喘，最可能的直接原因為何？","options":[{"letter":"A","text":"積液刺激肺泡分泌胰島素"},{"letter":"B","text":"肋膜液增加使氣道阻力消失"},{"letter":"C","text":"積液使肺受壓而限制擴張"},{"letter":"D","text":"胸膜腔壓力下降使肺過度膨脹"}],"answer":"C","rationale":"胸膜腔液體壓迫肺組織，減少可擴張肺容積；平躺可加重呼吸不適。"},{"stem":"胸腔積液患者接受胸腔穿刺前，護理師應優先確認哪項？","options":[{"letter":"A","text":"已完成凝血與抗凝藥物風險評估"},{"letter":"B","text":"已給予鎮靜藥使患者入睡"},{"letter":"C","text":"已禁食至少12小時"},{"letter":"D","text":"已停止所有氧氣治療"}],"answer":"A","rationale":"穿刺前須評估出血風險、用藥及相關檢驗；禁食並非一律要求，氧氣不可任意停用。"},{"stem":"胸腔穿刺時，患者突然劇烈咳嗽並訴胸痛，護理師應如何處理？","options":[{"letter":"A","text":"將患者改為平躺並繼續操作"},{"letter":"B","text":"鼓勵患者深呼吸以加快抽液"},{"letter":"C","text":"請患者用力咳出胸腔液"},{"letter":"D","text":"立即告知操作者並依指示暫停抽液"}],"answer":"D","rationale":"突發咳嗽或胸痛可能表示肺復張或胸膜刺激等狀況，應立即告知操作者並評估，避免強行繼續。"},{"stem":"胸腔穿刺後患者出現呼吸急促、低血壓及單側呼吸音減弱，應優先懷疑何種併發症？","options":[{"letter":"A","text":"胃食道逆流"},{"letter":"B","text":"氣胸"},{"letter":"C","text":"鼻竇炎"},{"letter":"D","text":"單純肌肉痠痛"}],"answer":"B","rationale":"穿刺可能造成氣胸；呼吸窘迫、低血壓及患側呼吸音下降須立即評估並通報。"},{"stem":"胸腔積液送檢時，最能協助判別滲出液與漏出液的檢體為何？","options":[{"letter":"A","text":"痰液與尿液"},{"letter":"B","text":"單獨測量胸水顏色"},{"letter":"C","text":"胸水與糞便潛血"},{"letter":"D","text":"胸水及同時抽取的血清蛋白與LDH"}],"answer":"D","rationale":"依胸水與血清蛋白、LDH等比較可使用Light標準分類；單看顏色不足以判斷。"},{"stem":"患者因心衰竭造成漏出性胸腔積液，護理照護的治療方向為何？","options":[{"letter":"A","text":"安排胸膜剝脫術作為常規首選"},{"letter":"B","text":"限制所有蛋白質攝取"},{"letter":"C","text":"立即長期使用抗結核藥"},{"letter":"D","text":"處理心衰竭及液體負荷"}],"answer":"D","rationale":"漏出液常源自全身性壓力或膠體滲透壓改變，治療重點是處理病因，如心衰竭與液體負荷。"},{"stem":"惡性胸腔積液反覆造成呼吸困難，患者接受胸膜固定術，護理師應說明其目的為何？","options":[{"letter":"A","text":"清除所有肺泡分泌物"},{"letter":"B","text":"使胸膜兩層貼合以減少液體再累積"},{"letter":"C","text":"增加胸膜腔空間以容納更多液體"},{"letter":"D","text":"治療肺動脈栓塞"}],"answer":"B","rationale":"胸膜固定術促使臟層與壁層胸膜黏合，減少胸膜腔再積液。"},{"stem":"胸膜炎患者吸氣時胸痛明顯，較適當的舒適護理為何？","options":[{"letter":"A","text":"避免評估疼痛以免患者焦慮"},{"letter":"B","text":"要求長時間閉氣"},{"letter":"C","text":"依處方給予止痛並協助採舒適姿勢"},{"letter":"D","text":"按摩患側胸膜以消除摩擦音"}],"answer":"C","rationale":"止痛及適當姿勢可減輕胸膜性疼痛，促進有效呼吸；閉氣可能造成通氣不足。"},{"stem":"胸膜炎患者聽診有胸膜摩擦音，其成因為何？","options":[{"letter":"A","text":"發炎的胸膜表面於呼吸時互相摩擦"},{"letter":"B","text":"胃內容物逆流至咽喉"},{"letter":"C","text":"心瓣膜狹窄造成血流湍流"},{"letter":"D","text":"支氣管內有大量液體流動"}],"answer":"A","rationale":"胸膜表面發炎粗糙，呼吸時臟層與壁層胸膜摩擦可產生摩擦音。"},{"stem":"患者發燒、胸痛且胸水呈膿性，最適當的照護重點為何？","options":[{"letter":"A","text":"停止所有引流以避免蛋白流失"},{"letter":"B","text":"鼓勵自行拔除胸管"},{"letter":"C","text":"依醫囑取得培養並配合抗感染及引流治療"},{"letter":"D","text":"以止咳藥取代抗感染治療"}],"answer":"C","rationale":"膿胸通常需培養、抗感染治療及適當引流；單純止咳或自行拔管可能延誤或惡化病情。"},{"stem":"膿胸患者胸管引流液突然停止，且管路可見折曲，護理師首先應如何處理？","options":[{"letter":"A","text":"自行以無菌液體沖洗胸膜腔"},{"letter":"B","text":"檢查並解除外部管路折曲"},{"letter":"C","text":"夾閉胸管觀察一整班"},{"letter":"D","text":"立刻擠壓胸管全長"}],"answer":"B","rationale":"先檢查可見的管路阻塞或折曲並確保系統通暢；不可任意擠壓、沖洗或長時間夾管。"},{"stem":"患者的胸腔積液檢查呈乳白色，可能提示何種情況？","options":[{"letter":"A","text":"乳糜胸"},{"letter":"B","text":"肺栓塞"},{"letter":"C","text":"血胸"},{"letter":"D","text":"單純氣胸"}],"answer":"A","rationale":"胸導管或淋巴管受損可使富含脂質的乳糜進入胸膜腔，胸水可能呈乳白色。"},{"stem":"乳糜胸患者接受低脂、中鏈脂肪酸飲食指導，其主要目的為何？","options":[{"letter":"A","text":"溶解胸膜纖維化"},{"letter":"B","text":"減少經淋巴吸收的長鏈脂肪負荷"},{"letter":"C","text":"改善胸腔內氧氣分壓"},{"letter":"D","text":"增加胸膜液生成"}],"answer":"B","rationale":"長鏈脂肪主要經淋巴吸收；依醫療團隊建議調整脂肪種類可減少乳糜流量。"},{"stem":"胸腔積液患者接受胸部X光檢查，護理師應如何準備？","options":[{"letter":"A","text":"要求患者先拔除胸管"},{"letter":"B","text":"安排檢查前常規禁水一日"},{"letter":"C","text":"依指示協助移除胸前金屬物並配合姿勢"},{"letter":"D","text":"不需確認妊娠可能性"}],"answer":"C","rationale":"胸部X光需配合影像姿勢並避免金屬遮蔽；適用時應依規範評估妊娠可能性。"},{"stem":"胸腔積液患者接受超音波導引穿刺，其優點為何？","options":[{"letter":"A","text":"可取代胸水化驗"},{"letter":"B","text":"可定位積液並避開不適合穿刺處"},{"letter":"C","text":"可直接確診所有癌症"},{"letter":"D","text":"可保證完全沒有氣胸風險"}],"answer":"B","rationale":"超音波有助辨識液體位置與深度、提高操作安全，但不能取代檢驗或消除所有風險。"},{"stem":"患者胸水細胞學檢查陰性，但仍高度懷疑惡性胸膜病變，應如何理解結果？","options":[{"letter":"A","text":"代表胸水一定是漏出液"},{"letter":"B","text":"已證明沒有癌症"},{"letter":"C","text":"陰性結果不能完全排除惡性病變"},{"letter":"D","text":"可停止所有後續評估"}],"answer":"C","rationale":"細胞學檢查有其敏感度限制，陰性不能單獨排除惡性病變，仍須依臨床判斷進一步評估。"},{"stem":"胸膜腔積液造成患側呼吸音降低，主要機轉為何？","options":[{"letter":"A","text":"胸水使胸壁傳導聲音增強"},{"letter":"B","text":"液體使患側支氣管永久擴張"},{"letter":"C","text":"液體限制肺膨脹並減弱通氣"},{"letter":"D","text":"積液直接增加肺泡通氣"}],"answer":"C","rationale":"胸膜腔液體壓迫肺，降低肺膨脹及通氣，因此患側呼吸音可能減弱。"},{"stem":"患者接受胸腔穿刺後，護理師應優先追蹤何項狀況？","options":[{"letter":"A","text":"足背動脈搏動作為唯一評估"},{"letter":"B","text":"當日視力變化"},{"letter":"C","text":"排便顏色"},{"letter":"D","text":"呼吸狀態、生命徵象及穿刺處"}],"answer":"D","rationale":"需觀察呼吸窘迫、血氧、生命徵象及局部出血等，及早發現氣胸或其他併發症。"},{"stem":"患者胸水細菌培養結果尚未出爐，臨床疑似細菌性胸膜感染，抗生素照護原則為何？","options":[{"letter":"A","text":"等培養結果出來前一律不給藥"},{"letter":"B","text":"依醫囑及採檢時機儘速給藥並監測反應"},{"letter":"C","text":"症狀減輕即擅自停藥"},{"letter":"D","text":"自行以剩餘抗生素替代處方"}],"answer":"B","rationale":"依醫療團隊指示取得必要檢體後，及時給予處方抗生素並監測療效與不良反應；不可自行停換藥。"},{"stem":"胸膜固定術後患者應接受何項衛教？","options":[{"letter":"A","text":"胸痛代表療效失敗，不須告知醫療人員"},{"letter":"B","text":"永久避免所有深呼吸"},{"letter":"C","text":"依醫囑活動與止痛，並回報呼吸困難或發燒"},{"letter":"D","text":"胸管有任何輸出都自行拔除"}],"answer":"C","rationale":"術後疼痛可能影響呼吸，需配合止痛與呼吸照護；呼吸惡化、感染徵象應儘速回報。"},{"stem":"外傷後患者一側胸廓起伏減少、呼吸音消失且頸靜脈怒張，應優先考慮何者？","options":[{"letter":"A","text":"單純胸膜摩擦音"},{"letter":"B","text":"肺不張以外的消化道疾病"},{"letter":"C","text":"張力性氣胸"},{"letter":"D","text":"慢性支氣管炎"}],"answer":"C","rationale":"單側呼吸音消失合併循環受損或頸靜脈怒張，須高度懷疑張力性氣胸並立即處置。"},{"stem":"疑似張力性氣胸患者血壓快速下降，護理師最優先的行動為何？","options":[{"letter":"A","text":"等待胸部X光確診後再通報"},{"letter":"B","text":"啟動緊急處置並立即通知醫療團隊"},{"letter":"C","text":"安排例行門診追蹤"},{"letter":"D","text":"先餵水觀察是否改善"}],"answer":"B","rationale":"張力性氣胸可迅速造成阻塞性休克，臨床不穩定時不可等待影像才求援或處置。"},{"stem":"胸部穿刺傷患者有開放性胸壁傷口並聽見吸氣時空氣聲，第一線護理處置為何？","options":[{"letter":"A","text":"以手指探入傷口尋找異物"},{"letter":"B","text":"給予飲水並觀察"},{"letter":"C","text":"依急救流程覆蓋適當敷料並立即求援"},{"letter":"D","text":"將傷口完全敞開等待自行閉合"}],"answer":"C","rationale":"開放性氣胸須迅速處置傷口並呼叫支援；敷料方式依急救規範與臨床流程執行，避免探入傷口。"},{"stem":"開放性氣胸傷口已覆蓋具排氣功能的敷料，患者突然呼吸惡化，護理師應如何做？","options":[{"letter":"A","text":"加壓密封敷料後離開患者"},{"letter":"B","text":"立即重新評估敷料與呼吸，通知團隊並依流程處置"},{"letter":"C","text":"自行拔除任何胸管"},{"letter":"D","text":"等待下一次生命徵象測量"}],"answer":"B","rationale":"病況惡化可能表示氣體排出受阻或氣胸進展，須立即評估並依急救流程處理。"},{"stem":"胸部鈍傷患者肋骨骨折，最重要的常規護理措施為何？","options":[{"letter":"A","text":"長期臥床避免肺部擴張"},{"letter":"B","text":"充分止痛並鼓勵深呼吸及有效咳嗽"},{"letter":"C","text":"避免任何止痛以保留評估能力"},{"letter":"D","text":"緊緊環繞胸部以限制所有胸廓活動"}],"answer":"B","rationale":"止痛有助通氣及咳嗽，降低肺不張與分泌物滯留；胸部緊束會限制呼吸。"},{"stem":"多根相鄰肋骨多處骨折造成胸壁反常運動，屬於何種傷害？","options":[{"letter":"A","text":"肺栓塞"},{"letter":"B","text":"胸膜固定術"},{"letter":"C","text":"單純肋軟骨炎"},{"letter":"D","text":"連枷胸"}],"answer":"D","rationale":"多根連續肋骨多處骨折形成游離胸壁區，吸氣時可反常內陷，稱連枷胸。"},{"stem":"連枷胸患者出現呼吸窘迫，護理師優先處理的原則為何？","options":[{"letter":"A","text":"以口服止痛藥取代呼吸評估"},{"letter":"B","text":"讓患者仰臥並停止監測"},{"letter":"C","text":"確保呼吸道與氧合並立即求援"},{"letter":"D","text":"先以胸帶緊束胸廓"}],"answer":"C","rationale":"連枷胸可能伴肺挫傷及低氧，須優先維持呼吸道、氧合並密切監測。"},{"stem":"胸部外傷後數小時患者低氧加劇、肺部浸潤增加，應考慮何種傷害？","options":[{"letter":"A","text":"慢性鼻炎"},{"letter":"B","text":"單純皮膚擦傷"},{"letter":"C","text":"腎結石"},{"letter":"D","text":"肺挫傷"}],"answer":"D","rationale":"肺挫傷可在受傷後逐漸出現水腫、出血與低氧，需持續觀察而非僅看初始影像。"},{"stem":"肺挫傷患者的輸液照護應注意何事？","options":[{"letter":"A","text":"只監測尿色即可"},{"letter":"B","text":"完全禁用任何液體"},{"letter":"C","text":"大量快速補液而不需評估"},{"letter":"D","text":"依循環狀態謹慎給液並監測肺部與氧合"}],"answer":"D","rationale":"過量液體可能加重肺水腫與氣體交換障礙；仍須依循環灌流及醫囑平衡補液。"},{"stem":"胸部外傷後胸膜腔大量積血，常稱為何種情形？","options":[{"letter":"A","text":"血胸"},{"letter":"B","text":"膿胸"},{"letter":"C","text":"氣胸"},{"letter":"D","text":"乳糜胸"}],"answer":"A","rationale":"血液進入胸膜腔稱血胸，可造成肺受壓及失血性休克。"},{"stem":"血胸患者胸管引流大量鮮紅血液且血壓下降，護理師應如何處理？","options":[{"letter":"A","text":"夾閉胸管以免繼續失血"},{"letter":"B","text":"立即通報並依失血與胸腔引流緊急流程處置"},{"letter":"C","text":"先讓患者步行促進循環"},{"letter":"D","text":"以暖敷代替生命徵象監測"}],"answer":"B","rationale":"大量出血與低血壓提示持續出血或休克，須立即求援；不可任意夾管或延誤評估。"},{"stem":"胸部外傷患者疑似大血胸，哪項表現最支持失血性休克？","options":[{"letter":"A","text":"單純打噴嚏"},{"letter":"B","text":"心搏加快、血壓下降、皮膚濕冷"},{"letter":"C","text":"脈搏緩慢且皮膚溫暖"},{"letter":"D","text":"食慾增加"}],"answer":"B","rationale":"心搏過速、低血壓及周邊灌流不良是失血性休克警訊。"},{"stem":"胸腔引流系統中的水封室持續冒泡，可能代表何者？","options":[{"letter":"A","text":"系統或患者仍有空氣漏出"},{"letter":"B","text":"水封液應立即倒空"},{"letter":"C","text":"患者已完全康復"},{"letter":"D","text":"胸管已必然阻塞"}],"answer":"A","rationale":"持續冒泡可能反映漏氣，需檢查患者與系統連接並依機構流程判別，不能直接認定阻塞。"},{"stem":"胸腔引流水封室僅在咳嗽或呼吸時間歇冒泡，常見解釋為何？","options":[{"letter":"A","text":"必然發生張力性氣胸"},{"letter":"B","text":"胸膜腔空氣正在排出或漏氣逐漸減少"},{"letter":"C","text":"水封室功能失效"},{"letter":"D","text":"胸管內必定有血栓"}],"answer":"B","rationale":"間歇冒泡可見於排出胸膜腔殘餘空氣，需結合病況觀察；並非一概代表嚴重故障。"},{"stem":"胸管水封室液面隨呼吸上下波動，稱為何種現象？","options":[{"letter":"A","text":"潮汐現象"},{"letter":"B","text":"支氣管痙攣"},{"letter":"C","text":"脈搏短絀"},{"letter":"D","text":"胸膜摩擦音"}],"answer":"A","rationale":"水封液面隨呼吸變化稱潮汐，通常反映胸膜腔壓力傳導；消失需配合臨床及管路評估。"},{"stem":"胸管連接處意外脫開，護理師首要作為為何？","options":[{"letter":"A","text":"將患者胸管剪短"},{"letter":"B","text":"將胸管永久夾住"},{"letter":"C","text":"依緊急流程維持水封並立即重新連接或求援"},{"letter":"D","text":"讓胸管末端暴露於空氣"}],"answer":"C","rationale":"系統脫開會破壞密閉引流，應迅速依機構流程恢復水封與連接並評估患者，不宜任意剪管或長夾。"},{"stem":"患者胸管意外脫出胸壁，應如何處理？","options":[{"letter":"A","text":"將脫出的管子自行插回"},{"letter":"B","text":"立即以無菌敷料覆蓋並求援，監測呼吸"},{"letter":"C","text":"忽略傷口，只記錄引流量"},{"letter":"D","text":"以棉花塞入傷口深處"}],"answer":"B","rationale":"胸管脫出需立即覆蓋傷口並通知醫療團隊，觀察呼吸窘迫；不可自行重新插入。"},{"stem":"患者胸管系統需短暫移位，護理師應採取何原則？","options":[{"letter":"A","text":"保持引流裝置低於胸部並避免不必要夾管"},{"letter":"B","text":"任意長時間夾閉胸管"},{"letter":"C","text":"將引流瓶放在床面以上"},{"letter":"D","text":"拔除水封裝置再移動"}],"answer":"A","rationale":"裝置低於胸部有助避免液體逆流；胸管不應例行或任意長時間夾閉，以免張力性氣胸。"},{"stem":"胸管引流液突然不再波動，但患者呼吸平穩，第一步應為何？","options":[{"letter":"A","text":"立刻以止血鉗夾緊"},{"letter":"B","text":"將引流瓶抬高至胸部上方"},{"letter":"C","text":"檢查管路是否折曲、受壓或阻塞"},{"letter":"D","text":"立即拔除胸管"}],"answer":"C","rationale":"先查核外部管路及患者狀況；波動消失可能有多種原因，不能僅憑此拔管或夾管。"},{"stem":"胸腔引流瓶被打翻但仍連接胸管，護理師應優先如何處理？","options":[{"letter":"A","text":"停止所有監測"},{"letter":"B","text":"立即將胸管拔除"},{"letter":"C","text":"直立裝置並確認水封與系統完整，評估患者"},{"letter":"D","text":"以手擠壓患者胸壁"}],"answer":"C","rationale":"應恢復裝置正確直立與水封功能，檢查連接並評估患者；依機構流程處理系統污染或損壞。"},{"stem":"護理師交班胸管引流量時，最恰當的作法為何？","options":[{"letter":"A","text":"每次交班將收集瓶歸零"},{"letter":"B","text":"依刻度記錄時間、量與性狀並比較趨勢"},{"letter":"C","text":"只寫有或沒有引流"},{"letter":"D","text":"不記錄血性變化"}],"answer":"B","rationale":"量、顏色與趨勢有助發現出血或病情變化；不可任意倒空或忽略異常性狀。"},{"stem":"患者胸管引流液由淡紅轉為鮮紅且量增加，護理師應如何做？","options":[{"letter":"A","text":"等到例行查房再報告"},{"letter":"B","text":"夾住胸管阻止引流"},{"letter":"C","text":"只加強飲水"},{"letter":"D","text":"立即評估生命徵象並通知醫療團隊"}],"answer":"D","rationale":"鮮紅血液增加可能表示活動性出血，需及時評估循環及通報。"},{"stem":"胸管拔除後，護理師應優先觀察哪些情形？","options":[{"letter":"A","text":"停止所有胸部評估"},{"letter":"B","text":"僅觀察食慾"},{"letter":"C","text":"僅評估雙手握力"},{"letter":"D","text":"呼吸困難、血氧變化及穿刺處滲漏"}],"answer":"D","rationale":"拔管後需觀察氣胸復發、出血或傷口漏氣等，並依醫囑安排後續影像或監測。"},{"stem":"胸管拔除時患者應如何配合呼吸？","options":[{"letter":"A","text":"不需聽從指示"},{"letter":"B","text":"依操作者指示在適當呼吸時相配合"},{"letter":"C","text":"用力咳嗽直到拔管完成"},{"letter":"D","text":"自行快速深呼吸不停"}],"answer":"B","rationale":"依醫療團隊指示配合呼吸或屏氣，可降低空氣進入胸膜腔的風險；具體時機依操作流程。"},{"stem":"胸部外傷患者呼吸急促，護理師初評最重要的第一步為何？","options":[{"letter":"A","text":"先取得完整病史再處置"},{"letter":"B","text":"先安排衛教"},{"letter":"C","text":"依急救評估先確保呼吸道通暢並評估呼吸"},{"letter":"D","text":"先測量身高體重"}],"answer":"C","rationale":"創傷處置遵循優先維持呼吸道與呼吸的原則，不可因完整病史而延誤急救。"},{"stem":"胸部外傷患者使用氧氣後，仍需持續評估何項指標？","options":[{"letter":"A","text":"僅看氧氣流量"},{"letter":"B","text":"呼吸功、意識、血氧與呼吸音"},{"letter":"C","text":"僅問是否口渴"},{"letter":"D","text":"只測體溫"}],"answer":"B","rationale":"氧氣治療不能取代對通氣及灌流的評估，需綜合呼吸功、意識、血氧及肺部發現。"},{"stem":"胸部外傷患者疼痛導致淺快呼吸，疼痛控制的臨床目的為何？","options":[{"letter":"A","text":"避免患者活動一週"},{"letter":"B","text":"促進深呼吸與有效咳嗽，降低肺部併發症"},{"letter":"C","text":"取代氧氣治療"},{"letter":"D","text":"使患者完全不需監測"}],"answer":"B","rationale":"適當鎮痛可改善胸廓活動與肺部擴張，減少分泌物滯留及肺不張。"},{"stem":"給予鴉片類止痛藥後，護理師最應監測何種藥物安全問題？","options":[{"letter":"A","text":"毛髮生長速度"},{"letter":"B","text":"聽力立即變化"},{"letter":"C","text":"鎮靜程度與呼吸抑制"},{"letter":"D","text":"瞳孔散大是唯一指標"}],"answer":"C","rationale":"鴉片類藥物可能造成嗜睡及呼吸抑制，應依風險監測呼吸、意識與鎮痛效果。"},{"stem":"胸部外傷患者同時使用抗凝血藥，護理師應特別注意何事？","options":[{"letter":"A","text":"出血徵象及凝血狀況並通報相關用藥資訊"},{"letter":"B","text":"任意停用所有藥物而不告知"},{"letter":"C","text":"自行追加抗凝血藥"},{"letter":"D","text":"忽略皮下瘀青"}],"answer":"A","rationale":"抗凝血可能增加胸腔或其他部位出血風險；需評估與通報，藥物調整由處方團隊決定。"},{"stem":"患者外傷後胸壁瘀青，呼吸狀況暫穩，護理師的適當作法為何？","options":[{"letter":"A","text":"持續觀察呼吸與疼痛變化，警覺延遲性併發症"},{"letter":"B","text":"讓患者獨自離院"},{"letter":"C","text":"因生命徵象正常便不再評估"},{"letter":"D","text":"按摩瘀青處以消除血腫"}],"answer":"A","rationale":"胸部傷害可能出現延遲性肺挫傷或氣胸，需依病況持續觀察。"},{"stem":"胸部外傷患者有皮下氣腫，觸診呈捻髮感，最可能代表什麼？","options":[{"letter":"A","text":"骨髓炎"},{"letter":"B","text":"單純水腫"},{"letter":"C","text":"皮下膿瘍已確診"},{"letter":"D","text":"空氣進入皮下組織"}],"answer":"D","rationale":"皮下氣腫是空氣進入皮下組織的觸診表現，胸部外傷時須評估是否有氣胸或氣道損傷。"},{"stem":"胸部外傷後縱膈偏移合併低血壓，提示何種危急狀況？","options":[{"letter":"A","text":"單純肋骨挫傷"},{"letter":"B","text":"胃潰瘍"},{"letter":"C","text":"張力性氣胸造成縱膈受壓"},{"letter":"D","text":"穩定胸膜炎"}],"answer":"C","rationale":"胸膜腔壓力升高可推移縱膈、妨礙靜脈回流並導致休克，須緊急處理。"},{"stem":"疑似氣胸患者因呼吸困難安排胸部影像，若病況快速不穩，應如何處理？","options":[{"letter":"A","text":"必須等影像報告才能採取任何行動"},{"letter":"B","text":"先停止監測"},{"letter":"C","text":"先啟動緊急評估與處置，不因等待影像延誤"},{"letter":"D","text":"安排患者步行至放射科"}],"answer":"C","rationale":"不穩定患者依臨床急救優先處理；影像不能延誤危及生命狀況的處置。"},{"stem":"胸部外傷患者的脈搏血氧飽和度突然下降，護理師第一步應為何？","options":[{"letter":"A","text":"立即確認患者狀況與訊號品質並評估呼吸"},{"letter":"B","text":"只重新貼上數值而不看患者"},{"letter":"C","text":"等待一小時再測"},{"letter":"D","text":"先拔除所有監測設備"}],"answer":"A","rationale":"應同時確認患者與設備訊號，迅速評估呼吸、循環並採取必要升級處置。"},{"stem":"患者胸部外傷後出現咳血，護理師應優先評估什麼？","options":[{"letter":"A","text":"氣道通暢、出血量與氧合狀態"},{"letter":"B","text":"排尿次數"},{"letter":"C","text":"當日食物偏好"},{"letter":"D","text":"視力敏銳度"}],"answer":"A","rationale":"咳血可能代表肺或氣道損傷，需優先確保氣道、評估呼吸與出血。"},{"stem":"胸部外傷合併疑似頸椎損傷時，移動患者應如何進行？","options":[{"letter":"A","text":"不需固定頭頸"},{"letter":"B","text":"先坐起再評估"},{"letter":"C","text":"單獨拉扯手臂翻身"},{"letter":"D","text":"維持脊椎對線並依團隊方式搬運"}],"answer":"D","rationale":"合併脊椎傷害可能時，需依創傷流程維持對線並協同搬運，避免加重神經損傷。"},{"stem":"患者肋骨骨折接受止痛藥後，護理師應評估哪項療效？","options":[{"letter":"A","text":"是否出現嗜睡才算有效"},{"letter":"B","text":"患者是否完全無須呼吸"},{"letter":"C","text":"胸廓是否不再活動"},{"letter":"D","text":"疼痛減輕且能較有效深呼吸、咳嗽"}],"answer":"D","rationale":"止痛療效應兼顧疼痛控制與功能性呼吸，並同時注意藥物不良反應。"},{"stem":"肋骨骨折患者出院後何種症狀應儘速就醫？","options":[{"letter":"A","text":"輕微局部壓痛逐日減輕"},{"letter":"B","text":"呼吸困難加重或發紺"},{"letter":"C","text":"短暫想睡但容易喚醒且符合用藥指示"},{"letter":"D","text":"瘀青顏色逐漸變淡"}],"answer":"B","rationale":"呼吸惡化或發紺可能表示氣胸、肺部併發症或低氧，需緊急評估。"},{"stem":"胸部外傷患者使用抗生素後出現呼吸困難、全身蕁麻疹，應優先考慮何者？","options":[{"letter":"A","text":"藥物已發揮正常作用"},{"letter":"B","text":"預期胸壁疼痛"},{"letter":"C","text":"嚴重過敏反應"},{"letter":"D","text":"單純胸膜積液"}],"answer":"C","rationale":"呼吸困難合併蕁麻疹可能為嚴重過敏反應，須立即停止可疑藥物並依急救流程處置、通報。"},{"stem":"胸腔積液患者接受利尿劑治療心衰竭，護理師應監測何項安全指標？","options":[{"letter":"A","text":"血壓、尿量與電解質變化"},{"letter":"B","text":"僅測瞳孔"},{"letter":"C","text":"只觀察胸痛"},{"letter":"D","text":"完全不需記錄體重"}],"answer":"A","rationale":"利尿劑可能造成低血容量、低血壓及電解質異常，需監測灌流、尿量及相關檢驗。"},{"stem":"患者服用利尿劑後感到站起時暈眩，護理師首先應如何做？","options":[{"letter":"A","text":"再追加一劑利尿劑"},{"letter":"B","text":"忽略症狀並停止所有觀察"},{"letter":"C","text":"協助坐臥、預防跌倒並評估血壓"},{"letter":"D","text":"鼓勵立即快走"}],"answer":"C","rationale":"可能有姿勢性低血壓或容量不足，先防跌倒並評估，再依醫囑處理。"},{"stem":"胸膜疾病患者接受胸水檢體採集，標本標示最重要的原則為何？","options":[{"letter":"A","text":"只標病房不標患者"},{"letter":"B","text":"床旁核對身分並正確標記檢體種類與時間"},{"letter":"C","text":"與其他患者檢體合併"},{"letter":"D","text":"先送出後再確認身分"}],"answer":"B","rationale":"正確身分、檢體種類及採集時間可避免檢驗錯誤；須遵循機構檢體流程。"},{"stem":"胸腔穿刺前，患者表示不理解操作目的，護理師最適當的回應為何？","options":[{"letter":"A","text":"告訴患者不需了解即可直接進行"},{"letter":"B","text":"代替患者簽署同意書"},{"letter":"C","text":"確認疑問並請執行者再次說明，確保知情同意流程完成"},{"letter":"D","text":"以保證無風險安撫患者"}],"answer":"C","rationale":"應尊重患者自主並協助取得充分說明；不可代簽或保證無風險。"},{"stem":"胸腔穿刺採坐姿前傾時，護理師應如何協助？","options":[{"letter":"A","text":"支撐患者手臂並維持穩定舒適姿勢"},{"letter":"B","text":"使患者平躺以方便咳嗽"},{"letter":"C","text":"要求患者突然扭轉身體"},{"letter":"D","text":"讓患者自行站立不扶持"}],"answer":"A","rationale":"穩定姿勢可利於操作並降低跌倒或突然移動風險，需全程觀察耐受度。"},{"stem":"胸腔穿刺後穿刺處敷料迅速被血液浸濕，護理師應如何處理？","options":[{"letter":"A","text":"只記錄敷料顏色"},{"letter":"B","text":"鼓勵用力咳嗽止血"},{"letter":"C","text":"評估患者與出血情況並立即通知醫療團隊"},{"letter":"D","text":"撕除敷料後不再覆蓋"}],"answer":"C","rationale":"持續滲血需評估出血及循環並及時通報；不能忽視或延誤處理。"},{"stem":"胸膜腔壓力正常低於大氣壓，其生理意義為何？","options":[{"letter":"A","text":"阻止胸廓呼吸運動"},{"letter":"B","text":"使肺泡永久塌陷"},{"letter":"C","text":"使血液停止回流心臟"},{"letter":"D","text":"有助肺維持擴張並貼附胸壁"}],"answer":"D","rationale":"胸膜腔負壓有助肺隨胸廓擴張；空氣進入胸膜腔可破壞此關係而造成肺塌陷。"},{"stem":"氣胸的基本病理生理為何？","options":[{"letter":"A","text":"空氣進入胸膜腔，使肺部分或全部塌陷"},{"letter":"B","text":"血液進入胃腔造成潰瘍"},{"letter":"C","text":"胸膜腔內壓降低使肺擴張過度"},{"letter":"D","text":"液體進入心包造成心肌肥厚"}],"answer":"A","rationale":"胸膜腔空氣破壞正常胸膜壓力關係，使肺回縮塌陷程度不一。"},{"stem":"自發性氣胸患者突然胸痛與呼吸困難，護理師評估時首先關注何者？","options":[{"letter":"A","text":"呼吸窘迫程度、血氧及患側呼吸音"},{"letter":"B","text":"每日視力"},{"letter":"C","text":"近期飲食纖維量"},{"letter":"D","text":"皮膚色素變化"}],"answer":"A","rationale":"需迅速判斷氣胸對通氣與氧合的影響，並辨認是否進展為張力性氣胸。"},{"stem":"小型且穩定的自發性氣胸患者，醫療團隊採觀察策略，護理師應如何照護？","options":[{"letter":"A","text":"鼓勵劇烈運動測試耐受"},{"letter":"B","text":"密切監測症狀與氧合，依計畫追蹤影像"},{"letter":"C","text":"忽略呼吸突然惡化"},{"letter":"D","text":"讓患者自行離院且不需衛教"}],"answer":"B","rationale":"部分穩定患者可依醫療判斷觀察，但需追蹤症狀與影像並提供惡化警訊衛教。"},{"stem":"氣胸患者接受胸管治療後，何種變化最需要立即通報？","options":[{"letter":"A","text":"依計畫活動後略疲倦"},{"letter":"B","text":"局部輕微牽拉感但呼吸穩定"},{"letter":"C","text":"引流裝置保持直立"},{"letter":"D","text":"突發呼吸困難及血氧下降"}],"answer":"D","rationale":"突發呼吸惡化可能表示氣胸擴大、管路問題或其他併發症，須即時評估。"},{"stem":"胸管固定處皮膚出現紅腫、熱痛及膿性分泌物，護理師應如何處理？","options":[{"letter":"A","text":"評估感染徵象、依流程處理並通知醫療團隊"},{"letter":"B","text":"以粉末覆蓋後忽略"},{"letter":"C","text":"自行剪除固定縫線"},{"letter":"D","text":"停止所有無菌照護"}],"answer":"A","rationale":"局部感染徵象需評估並通報，依無菌技術與醫囑處理，避免自行移除固定。"},{"stem":"照護胸管敷料時，最重要的感染預防原則為何？","options":[{"letter":"A","text":"每小時無必要地拆開檢查"},{"letter":"B","text":"採無菌技術並依機構規範更換"},{"letter":"C","text":"以未清潔手直接觸碰傷口"},{"letter":"D","text":"讓敷料長期潮濕"}],"answer":"B","rationale":"胸管出口與胸膜腔相通，應以手部衛生、無菌技術及適當敷料照護降低感染風險。"},{"stem":"胸管患者移動時，引流瓶應放置於何處？","options":[{"letter":"A","text":"暫時倒置"},{"letter":"B","text":"高於患者頭部"},{"letter":"C","text":"置於床上與胸部同高"},{"letter":"D","text":"低於患者胸部且保持直立"}],"answer":"D","rationale":"引流裝置低於胸部且直立可維持重力引流並降低液體逆流風險。"},{"stem":"患者因胸管疼痛不敢咳嗽，護理師應如何協助？","options":[{"letter":"A","text":"只給止咳藥而不評估"},{"letter":"B","text":"評估止痛需求並教導支托胸部後有效咳嗽"},{"letter":"C","text":"要求完全停止咳嗽"},{"letter":"D","text":"拔掉胸管再咳"}],"answer":"B","rationale":"適當止痛及胸部支托可協助有效咳嗽、清除分泌物；不宜一概抑制咳嗽。"},{"stem":"胸部外傷患者出現呼吸音不對稱，哪一項護理評估最適當？","options":[{"letter":"A","text":"不需重複評估"},{"letter":"B","text":"只聽一側肺尖"},{"letter":"C","text":"比較雙側呼吸音、胸廓起伏及呼吸功"},{"letter":"D","text":"只詢問是否口渴"}],"answer":"C","rationale":"雙側比較可辨認氣胸、血胸或肺部損傷相關變化，需結合呼吸功與整體狀況。"},{"stem":"胸部外傷患者懷疑氣道受損，出現聲音沙啞與頸部皮下氣腫，護理師應如何處理？","options":[{"letter":"A","text":"安排例行肺功能檢查"},{"letter":"B","text":"給予固體食物測吞嚥"},{"letter":"C","text":"等待沙啞自行消失"},{"letter":"D","text":"優先確保氣道並立即啟動緊急評估"}],"answer":"D","rationale":"聲音改變與皮下氣腫可能提示氣道或胸腔損傷，應警覺氣道快速惡化並緊急求援。"},{"stem":"胸腔外傷患者疑似心包填塞，出現低血壓、頸靜脈怒張及心音低弱，應如何處置？","options":[{"letter":"A","text":"給予一般止痛後返家"},{"letter":"B","text":"立即啟動急救並通知醫療團隊"},{"letter":"C","text":"等待胸管自行引流"},{"letter":"D","text":"增加口服水分即可"}],"answer":"B","rationale":"此組徵象提示心包填塞，可能迅速危及生命，須緊急醫療處置。"},{"stem":"胸部外傷患者接受電腦斷層檢查前，護理師應優先確認何項？","options":[{"letter":"A","text":"檢查適應性、對比劑過敏史及腎功能等相關資訊"},{"letter":"B","text":"是否停止所有監測"},{"letter":"C","text":"患者鞋碼"},{"letter":"D","text":"是否已完成胸管拔除"}],"answer":"A","rationale":"若使用含碘對比劑，需依流程評估過敏史、腎功能及其他風險；不可為檢查擅自拔管。"},{"stem":"接受含碘對比劑後患者出現喘鳴及臉部腫脹，護理師應如何做？","options":[{"letter":"A","text":"立即啟動過敏反應急救流程"},{"letter":"B","text":"只提供口服水"},{"letter":"C","text":"請患者回家休息"},{"letter":"D","text":"先安排下一次影像"}],"answer":"A","rationale":"喘鳴及臉腫提示嚴重過敏反應，需立即處置與監測。"},{"stem":"胸膜疾病患者接受胸水抽吸後感到頭暈、冒冷汗，護理師應優先作為為何？","options":[{"letter":"A","text":"忽略並繼續抽液"},{"letter":"B","text":"停止或暫緩操作並評估生命徵象、通知操作者"},{"letter":"C","text":"鼓勵站立行走"},{"letter":"D","text":"讓患者獨自去洗手間"}],"answer":"B","rationale":"可能為迷走神經反應、低血壓或其他不耐受，應保障安全、評估並告知操作者。"},{"stem":"胸腔積液患者氣促，協助採何種姿勢通常可改善呼吸？","options":[{"letter":"A","text":"俯臥且壓迫胸部"},{"letter":"B","text":"頭低腳高"},{"letter":"C","text":"完全平躺"},{"letter":"D","text":"坐起或採高坐臥位"}],"answer":"D","rationale":"坐起可改善胸廓擴張與呼吸舒適度，仍須依患者耐受及禁忌調整。"},{"stem":"胸水患者血氧偏低且呼吸費力，護理師應如何使用氧氣？","options":[{"letter":"A","text":"依處方或緊急流程給氧並評估反應"},{"letter":"B","text":"因胸水存在而禁止氧氣"},{"letter":"C","text":"任意調高至不需監測"},{"letter":"D","text":"僅在患者睡眠時給氧"}],"answer":"A","rationale":"依臨床狀況與處方提供氧療並監測反應；不能因胸水而禁用，也不可忽略監測。"},{"stem":"胸膜疾病患者出院後出現發燒、胸痛加重及喘，應如何衛教？","options":[{"letter":"A","text":"儘速聯絡醫療人員或就醫評估"},{"letter":"B","text":"停止所有處方藥"},{"letter":"C","text":"等數週後回診"},{"letter":"D","text":"自行加倍止痛藥"}],"answer":"A","rationale":"發燒、疼痛或呼吸惡化可能提示感染或積液復發，須及早評估。"},{"stem":"胸膜炎患者因疼痛減少活動，護理師應如何促進復原？","options":[{"letter":"A","text":"長期完全臥床"},{"letter":"B","text":"避免所有姿勢變換"},{"letter":"C","text":"限制深呼吸直到疼痛消失"},{"letter":"D","text":"依耐受逐步活動並配合止痛與呼吸訓練"}],"answer":"D","rationale":"適度活動及呼吸訓練有助維持肺擴張與功能，應先控制疼痛並依狀況漸進。"},{"stem":"患者胸部外傷後接受阿斯匹靈止痛，護理師最需留意哪種風險？","options":[{"letter":"A","text":"立即引起乳糜胸"},{"letter":"B","text":"必然造成氣胸"},{"letter":"C","text":"出血增加及胃腸不適"},{"letter":"D","text":"使肋骨自行癒合"}],"answer":"C","rationale":"阿斯匹靈有抗血小板作用並可能造成胃腸刺激，外傷患者需依醫囑評估出血風險。"},{"stem":"患者同時使用多種止痛藥，護理師給藥前應確認何者？","options":[{"letter":"A","text":"止痛藥不會交互作用"},{"letter":"B","text":"只看藥片顏色"},{"letter":"C","text":"成分是否重複及總劑量是否符合處方"},{"letter":"D","text":"所有藥物都可自行加量"}],"answer":"C","rationale":"多種複方藥可能含相同成分，須核對處方、總量及禁忌，防止過量與不良反應。"},{"stem":"胸部外傷患者服用乙醯胺酚止痛，護理師衛教何者正確？","options":[{"letter":"A","text":"只要疼痛就可縮短給藥間隔"},{"letter":"B","text":"可無限制增加劑量"},{"letter":"C","text":"飲酒可避免肝臟副作用"},{"letter":"D","text":"遵照處方並留意其他複方藥是否也含此成分"}],"answer":"D","rationale":"應依醫囑使用並避免不同藥品成分重複，以降低肝毒性風險；不可自行超量。"},{"stem":"胸腔積液患者使用抗生素，出院衛教何者適當？","options":[{"letter":"A","text":"將藥物分享給家人"},{"letter":"B","text":"下次感染時自行使用剩藥"},{"letter":"C","text":"依處方完成療程並回報過敏或嚴重不良反應"},{"letter":"D","text":"症狀一改善就自行停藥"}],"answer":"C","rationale":"應依處方使用、不可分享或自行停換藥，出現嚴重過敏反應須立即求助。"},{"stem":"胸管引流患者下床活動前，護理師應先確認何者？","options":[{"letter":"A","text":"不需評估姿勢性症狀"},{"letter":"B","text":"管路固定、裝置低於胸部且患者可安全活動"},{"letter":"C","text":"先夾住胸管一整天"},{"letter":"D","text":"拔除引流瓶"}],"answer":"B","rationale":"活動前確認管路與裝置位置可減少牽扯及逆流風險，也應評估患者活動耐受。"},{"stem":"胸管患者翻身時，最重要的護理措施為何？","options":[{"letter":"A","text":"將管路壓在患者身下"},{"letter":"B","text":"避免胸管折曲、牽拉或受壓並維持引流裝置位置"},{"letter":"C","text":"先拔除固定敷料"},{"letter":"D","text":"將瓶子放在胸部上方"}],"answer":"B","rationale":"翻身時需保護胸管通暢與固定，防止脫落、折曲或引流液逆流。"},{"stem":"患者胸腔引流系統有可見漏氣，護理師應先檢查何處？","options":[{"letter":"A","text":"尿袋顏色"},{"letter":"B","text":"床頭桌抽屜"},{"letter":"C","text":"患者鞋襪"},{"letter":"D","text":"連接處與管路是否鬆脫或破損"}],"answer":"D","rationale":"先查核外部系統連接及管路，再依機構流程與醫療團隊判斷漏氣來源。"},{"stem":"對胸腔引流管進行擠管或剝管的原則為何？","options":[{"letter":"A","text":"非例行措施，僅依醫囑與機構規範執行"},{"letter":"B","text":"所有患者都應自行操作"},{"letter":"C","text":"擠壓可取代檢查管路"},{"letter":"D","text":"每小時都必須用力擠壓"}],"answer":"A","rationale":"例行擠壓可能造成胸膜腔壓力變化或傷害，不應自行常規執行。"},{"stem":"胸腔引流裝置水封液面低於規定標記，護理師應如何做？","options":[{"letter":"A","text":"倒入任意消毒液"},{"letter":"B","text":"依裝置規格及機構流程補充並確認水封"},{"letter":"C","text":"忽略水封高度"},{"letter":"D","text":"拔除胸管後再處理"}],"answer":"B","rationale":"水封須維持裝置要求的液位以形成單向屏障，依製造規格與機構流程處置。"},{"stem":"胸腔引流瓶需要更換時，護理師應遵循何項原則？","options":[{"letter":"A","text":"依機構流程無菌操作並避免胸膜腔暴露於空氣"},{"letter":"B","text":"讓患者屏氣數分鐘即可"},{"letter":"C","text":"任意切斷胸管並放置床上"},{"letter":"D","text":"不需準備替代裝置"}],"answer":"A","rationale":"更換系統須維持密閉與無菌，依流程迅速安全完成，避免空氣進入或污染。"},{"stem":"胸部外傷患者出現意識混亂，可能反映何種急迫問題？","options":[{"letter":"A","text":"肋骨癒合"},{"letter":"B","text":"低氧或循環灌流不足"},{"letter":"C","text":"單純視力疲勞"},{"letter":"D","text":"必然是飢餓"}],"answer":"B","rationale":"意識變化可能是低氧、休克或腦傷徵象，須立即評估氧合、循環及神經狀態。"},{"stem":"胸部外傷患者皮膚蒼白、濕冷，應優先評估何者？","options":[{"letter":"A","text":"循環灌流及出血性休克徵象"},{"letter":"B","text":"睡眠姿勢"},{"letter":"C","text":"耳垢量"},{"letter":"D","text":"每日飲食偏好"}],"answer":"A","rationale":"蒼白濕冷可能代表周邊灌流不良，應評估脈搏、血壓、意識及出血來源。"},{"stem":"胸腔積液患者需長期居家氧療，衛教何者正確？","options":[{"letter":"A","text":"依處方流量使用並遠離明火與吸菸"},{"letter":"B","text":"在氧氣旁點燃香菸"},{"letter":"C","text":"自行任意提高流量"},{"letter":"D","text":"以油脂塗抹氧氣接口"}],"answer":"A","rationale":"氧氣支持須依處方使用，並注意火災安全；嚴禁吸菸或靠近明火。"},{"stem":"使用居家氧氣的患者鼻腔乾燥，護理師應建議何者？","options":[{"letter":"A","text":"自行停氧"},{"letter":"B","text":"使用油性凡士林塞入鼻孔"},{"letter":"C","text":"依設備與醫療建議使用適當加濕或水性潤滑"},{"letter":"D","text":"以明火加熱氧氣"}],"answer":"C","rationale":"可依設備規格及醫囑考慮適當加濕或水性產品；油性物質及火源在氧氣環境有危險。"},{"stem":"胸膜疾病患者有吸菸史，出院衛教最適當的是何者？","options":[{"letter":"A","text":"只要改抽淡菸即可"},{"letter":"B","text":"戒菸與呼吸健康無關"},{"letter":"C","text":"鼓勵戒菸並提供戒菸資源"},{"letter":"D","text":"吸菸可促進胸膜癒合"}],"answer":"C","rationale":"戒菸有助降低呼吸道傷害與相關疾病風險，應提供可行支持資源。"},{"stem":"胸部外傷患者返家後仍有肋骨疼痛，哪項活動建議較恰當？","options":[{"letter":"A","text":"以緊束胸帶限制呼吸"},{"letter":"B","text":"長期完全不動"},{"letter":"C","text":"疼痛時自行超量服藥"},{"letter":"D","text":"依疼痛及醫囑漸進活動，避免造成呼吸受限"}],"answer":"D","rationale":"漸進活動可維持功能；應避免緊束胸廓及自行超量用藥，並依醫囑追蹤。"}]},{"title":"急性呼吸道窘迫症候群","questions":[{"stem":"ARDS的主要病理生理變化為何？","options":[{"letter":"A","text":"肺泡表面活性物質增加而提高順應性"},{"letter":"B","text":"左心室收縮力增加造成肺靜脈壓下降"},{"letter":"C","text":"肺泡－微血管屏障受損，通透性增加而形成非心因性肺水腫"},{"letter":"D","text":"支氣管平滑肌痙攣造成可逆性氣流阻塞"}],"answer":"C","rationale":"發炎損傷肺泡上皮及微血管內皮，富蛋白液體進入肺泡，造成低氧與肺順應性下降。"},{"stem":"敗血症病人急性低氧、雙側肺部陰影，且不能以心衰竭充分解釋，最應懷疑何者？","options":[{"letter":"A","text":"急性呼吸道窘迫症候群"},{"letter":"B","text":"肺栓塞已確診"},{"letter":"C","text":"單純氣喘"},{"letter":"D","text":"慢性阻塞性肺病"}],"answer":"A","rationale":"急性發作、雙側陰影及非心因性肺水腫，配合氧合障礙，符合ARDS評估方向。"},{"stem":"ARDS肺泡滲液增加，對氣體交換最可能造成何種影響？","options":[{"letter":"A","text":"肺泡死腔完全消失"},{"letter":"B","text":"動脈血氧分壓持續上升"},{"letter":"C","text":"肺內分流與通氣灌流不匹配增加"},{"letter":"D","text":"二氧化碳必然立即嚴重潴留"}],"answer":"C","rationale":"充液或塌陷肺泡仍有灌流但通氣不足，形成分流及V/Q不匹配，造成低氧血症。"},{"stem":"肺順應性下降對ARDS呼吸器照護的意義為何？","options":[{"letter":"A","text":"肺容易擴張，應提高潮氣量"},{"letter":"B","text":"肺僵硬，應避免過度牽張並監測氣道壓"},{"letter":"C","text":"代表可停止監測呼吸器"},{"letter":"D","text":"可用最大潮氣量迅速改善"}],"answer":"B","rationale":"順應性下降表示肺僵硬，過大潮氣量與壓力會加重肺損傷。"},{"stem":"下列何者是ARDS常見誘發因素？","options":[{"letter":"A","text":"白內障"},{"letter":"B","text":"遠視"},{"letter":"C","text":"嚴重肺炎"},{"letter":"D","text":"季節性鼻炎"}],"answer":"C","rationale":"肺炎、敗血症、吸入性傷害及重大創傷等是常見誘因。"},{"stem":"敗血症病人突然呼吸急促且氧合惡化，護理師首先應如何處理？","options":[{"letter":"A","text":"先提供大量口服飲水"},{"letter":"B","text":"等下一班再評估"},{"letter":"C","text":"關閉血氧監測"},{"letter":"D","text":"立即評估ABC、確認氧氣與監測並通報"}],"answer":"D","rationale":"急性低氧可能迅速危及生命，須立即評估呼吸道、呼吸、循環與設備並求援。"},{"stem":"動脈血氣PaO2偏低最直接表示何者？","options":[{"letter":"A","text":"動脈氧合不足"},{"letter":"B","text":"腎絲球過濾加快"},{"letter":"C","text":"血紅素必然增加"},{"letter":"D","text":"血糖控制良好"}],"answer":"A","rationale":"PaO2反映動脈血氧分壓；需連同吸入氧濃度及臨床狀態判讀。"},{"stem":"PaO2/FiO2比值主要用來評估什麼？","options":[{"letter":"A","text":"腎臟排泄功能"},{"letter":"B","text":"肺順應性"},{"letter":"C","text":"氧合障礙程度"},{"letter":"D","text":"血紅素濃度"}],"answer":"C","rationale":"此比值描述給定FiO2下的氧合狀態，須配合診斷條件判讀。"},{"stem":"ARDS胸部影像常見何種表現？","options":[{"letter":"A","text":"只有心臟縮小"},{"letter":"B","text":"雙側肺部陰影"},{"letter":"C","text":"腸道氣體擴張"},{"letter":"D","text":"肺野必然完全清晰"}],"answer":"B","rationale":"ARDS常有雙側肺部陰影，且須排除其他足以解釋的原因。"},{"stem":"診斷ARDS時評估心臟功能及容量狀態的目的為何？","options":[{"letter":"A","text":"判斷肺水腫是否主要為心因性"},{"letter":"B","text":"決定停止氧療"},{"letter":"C","text":"排除所有肺部疾病"},{"letter":"D","text":"證明ARDS必由心肌梗塞引起"}],"answer":"A","rationale":"ARDS為非心因性肺水腫，須與心衰竭或容量過負荷造成的肺水腫鑑別。"},{"stem":"ARDS採用低潮氣量通氣的主要目的為何？","options":[{"letter":"A","text":"避免任何呼吸器警報"},{"letter":"B","text":"消除咳嗽反射"},{"letter":"C","text":"使所有肺泡過度擴張"},{"letter":"D","text":"減少肺泡過度牽張及呼吸器相關肺損傷"}],"answer":"D","rationale":"肺保護性通氣採低潮氣量以降低呼吸器造成的肺損傷風險。"},{"stem":"依肺保護性通氣原則，潮氣量通常依何者計算？","options":[{"letter":"A","text":"體脂肪重量"},{"letter":"B","text":"預測體重"},{"letter":"C","text":"身體質量指數"},{"letter":"D","text":"實際體重一律計算"}],"answer":"B","rationale":"潮氣量依身高推算的預測體重設定，而非受水腫或肥胖影響的實際體重。"},{"stem":"ARDS通氣設定採低潮氣量時，護理師應特別注意何種安全目標？","options":[{"letter":"A","text":"忽略呼吸器警報"},{"letter":"B","text":"追求最高氣道壓"},{"letter":"C","text":"將呼吸頻率固定為零"},{"letter":"D","text":"監測平台壓並避免過高"}],"answer":"D","rationale":"監測平台壓有助降低肺泡過度牽張；設定依醫囑與病人狀況調整。"},{"stem":"ARDS病人使用PEEP的主要生理目的為何？","options":[{"letter":"A","text":"呼氣末維持部分肺泡開放，改善氧合"},{"letter":"B","text":"降低所有肺泡容量"},{"letter":"C","text":"增加胃腸蠕動"},{"letter":"D","text":"替代病因治療"}],"answer":"A","rationale":"PEEP可減少肺泡塌陷、改善肺泡募集與氧合，但需觀察血流動力學影響。"},{"stem":"提高PEEP後病人血壓下降，最適當的理解為何？","options":[{"letter":"A","text":"胸腔壓升高可能降低靜脈回流"},{"letter":"B","text":"PEEP不可能影響循環"},{"letter":"C","text":"應自行大幅調高PEEP"},{"letter":"D","text":"代表氧合已完全恢復"}],"answer":"A","rationale":"較高胸腔壓可能減少靜脈回流與心輸出量，應立即評估並通報，不可自行改設定。"},{"stem":"ARDS病人接受俯臥姿勢照護，主要預期效益為何？","options":[{"letter":"A","text":"改善肺部通氣分布及氧合"},{"letter":"B","text":"治癒感染病原"},{"letter":"C","text":"避免所有壓傷"},{"letter":"D","text":"取代呼吸器"}],"answer":"A","rationale":"俯臥可改善通氣灌流匹配及背側肺區募集；仍需持續處理病因與併發症。"},{"stem":"執行俯臥前最重要的護理準備為何？","options":[{"letter":"A","text":"停止評估皮膚"},{"letter":"B","text":"拔除所有監測線"},{"letter":"C","text":"讓氣管內管不固定"},{"letter":"D","text":"確認管路固定並安排足夠人力及翻身流程"}],"answer":"D","rationale":"翻身前規劃人力、管路與氣道固定，可降低意外拔管及管路脫落風險。"},{"stem":"俯臥期間護理師最應密切觀察何者？","options":[{"letter":"A","text":"氣管內管位置、氧合、皮膚與眼部受壓"},{"letter":"B","text":"僅測量身高"},{"letter":"C","text":"忽略循環監測"},{"letter":"D","text":"只記錄食慾"}],"answer":"A","rationale":"俯臥可能造成氣道移位、壓傷與眼部壓迫，須定期檢查並調整受壓點。"},{"stem":"ARDS病人FiO2持續偏高，氧療照護的原則何者正確？","options":[{"letter":"A","text":"FiO2與氧合無關"},{"letter":"B","text":"立即停用氧氣"},{"letter":"C","text":"依氧合目標調整並避免不必要的高氧暴露"},{"letter":"D","text":"只要低氧就無限提高且不監測"}],"answer":"C","rationale":"需維持適當氧合，並依醫囑逐步調整FiO2以避免不必要的氧毒性。"},{"stem":"ARDS病人插管後出現突發低血氧與高壓警報，護理師第一步宜如何？","options":[{"letter":"A","text":"移除血氧監測"},{"letter":"B","text":"先靜音警報離開"},{"letter":"C","text":"立即評估病人、氣道與呼吸器管路"},{"letter":"D","text":"直接提高鎮靜藥"}],"answer":"C","rationale":"先以病人為中心迅速檢查氧合、管路扭折或阻塞及胸廓起伏，必要時呼救。"},{"stem":"呼吸器低壓警報常提示何種可能？","options":[{"letter":"A","text":"管路脫接或漏氣"},{"letter":"B","text":"痰液阻塞必然"},{"letter":"C","text":"血糖降低"},{"letter":"D","text":"肺順應性突然下降必然"}],"answer":"A","rationale":"低壓警報常見原因為管路脫接或漏氣；應立即查看病人及呼吸器迴路。"},{"stem":"呼吸器高壓警報響起，可能原因為何？","options":[{"letter":"A","text":"管路脫接必然"},{"letter":"B","text":"氧氣來源充足"},{"letter":"C","text":"分泌物阻塞、管路扭折或咳嗽"},{"letter":"D","text":"血糖升高"}],"answer":"C","rationale":"阻力增加如痰液、扭折或病人咳嗽可造成高壓警報，須即時評估原因。"},{"stem":"ARDS插管病人聽到痰音且分泌物多，抽痰的適當原則為何？","options":[{"letter":"A","text":"抽痰前不需評估氧合"},{"letter":"B","text":"抽痰期間忽略心律"},{"letter":"C","text":"固定每數分鐘深抽一次"},{"letter":"D","text":"有臨床需要時無菌抽吸並監測耐受"}],"answer":"D","rationale":"抽痰應依分泌物及臨床指標執行，採適當無菌技術並觀察低氧、心律變化。"},{"stem":"抽痰造成病人血氧明顯下降時，應如何處理？","options":[{"letter":"A","text":"持續抽至預定次數"},{"letter":"B","text":"停止抽吸、恢復氧合並重新評估"},{"letter":"C","text":"關閉呼吸器"},{"letter":"D","text":"立即拔除氣管內管"}],"answer":"B","rationale":"低氧時應停止刺激、提供支持並評估；持續抽痰可能加劇缺氧。"},{"stem":"ARDS病人呼吸器潮氣量目標應依預測體重設定，預測體重主要與何者相關？","options":[{"letter":"A","text":"身高及生理性別公式"},{"letter":"B","text":"體重秤當下讀值"},{"letter":"C","text":"血糖值"},{"letter":"D","text":"每日輸液量"}],"answer":"A","rationale":"預測體重由身高及生理性別公式估算，較能反映肺大小。"},{"stem":"ARDS病人動脈血氣PaCO2輕度上升但pH可接受，醫療團隊採容許性高碳酸血症的考量為何？","options":[{"letter":"A","text":"故意造成嚴重酸中毒"},{"letter":"B","text":"代表無需監測血氣"},{"letter":"C","text":"維持肺保護性通氣以減少牽張傷害"},{"letter":"D","text":"用來治療感染"}],"answer":"C","rationale":"為避免過大潮氣量，可容許一定程度CO2上升；須監測酸鹼及禁忌狀況。"},{"stem":"使用容許性高碳酸血症策略時，何者應持續監測？","options":[{"letter":"A","text":"不需觀察意識"},{"letter":"B","text":"只測尿糖"},{"letter":"C","text":"動脈血氣與酸鹼狀態"},{"letter":"D","text":"僅體溫"}],"answer":"C","rationale":"CO2上升可能造成呼吸性酸中毒，須追蹤血氣與臨床耐受性。"},{"stem":"ARDS病人需要鎮靜以配合呼吸器時，護理師應如何執行？","options":[{"letter":"A","text":"一律鎮靜至完全無反應"},{"letter":"B","text":"依醫囑採目標導向鎮靜並定期評估"},{"letter":"C","text":"不監測呼吸及血壓"},{"letter":"D","text":"自行增加藥物劑量"}],"answer":"B","rationale":"鎮靜需依目標評估舒適、同步性及副作用，避免過度鎮靜與延遲脫機。"},{"stem":"鎮靜病人突然躁動且血氧下降，最適切的優先作法為何？","options":[{"letter":"A","text":"不評估即追加鎮靜"},{"letter":"B","text":"將警報關閉"},{"letter":"C","text":"先評估低氧、疼痛、管路與呼吸器同步"},{"letter":"D","text":"立即認定為精神疾病"}],"answer":"C","rationale":"躁動可能是低氧或不適的表現，須先找可逆生理原因，避免掩蓋惡化。"},{"stem":"ARDS病人使用神經肌肉阻斷藥時，護理師須確認何者？","options":[{"letter":"A","text":"充分鎮靜止痛且持續監測，因藥物不提供鎮靜或止痛"},{"letter":"B","text":"病人必然失去疼痛感"},{"letter":"C","text":"不需確認呼吸器支持"},{"letter":"D","text":"可不再照護眼睛"}],"answer":"A","rationale":"肌肉鬆弛劑不會使病人失去意識或止痛，必須提供適當鎮靜止痛並防護眼睛。"},{"stem":"神經肌肉阻斷期間，病人無法表達不適，護理師應如何溝通照護？","options":[{"letter":"A","text":"假設病人沒有疼痛"},{"letter":"B","text":"只觀察肢體動作"},{"letter":"C","text":"停止所有溝通"},{"letter":"D","text":"持續向病人說明並使用客觀監測及評估"}],"answer":"D","rationale":"病人可能仍有知覺，應維持尊嚴、說明處置並依客觀指標評估鎮靜止痛。"},{"stem":"ARDS病人使用鎮靜藥後血壓降低，護理師的適當行動為何？","options":[{"letter":"A","text":"增加鎮靜劑"},{"letter":"B","text":"評估灌流與藥物反應並立即通報"},{"letter":"C","text":"認為是預期效果而不處理"},{"letter":"D","text":"自行停掉所有生命支持"}],"answer":"B","rationale":"鎮靜藥可能造成低血壓，需評估循環與灌流並依醫囑處理。"},{"stem":"ARDS常需限制不必要的液體正平衡，其照護考量為何？","options":[{"letter":"A","text":"液體量與肺部無關"},{"letter":"B","text":"避免增加肺水腫，但仍須維持器官灌流"},{"letter":"C","text":"只看尿色決定所有治療"},{"letter":"D","text":"完全停止所有輸液"}],"answer":"B","rationale":"保守液體策略可減少肺水腫，但須兼顧血壓、腎灌流及整體循環。"},{"stem":"ARDS病人接受利尿劑後，護理師最應監測何者？","options":[{"letter":"A","text":"僅瞳孔大小"},{"letter":"B","text":"停止輸入輸出記錄"},{"letter":"C","text":"只看皮膚顏色"},{"letter":"D","text":"尿量、血壓、電解質及腎功能"}],"answer":"D","rationale":"利尿可能造成低血容量、低血壓與電解質異常，需追蹤尿量及檢驗值。"},{"stem":"ARDS病人突然少尿，適當的護理評估為何？","options":[{"letter":"A","text":"增加利尿劑不需醫囑"},{"letter":"B","text":"檢查導尿管通暢並評估灌流、液體狀態及腎功能"},{"letter":"C","text":"立即假設腎衰竭且不評估"},{"letter":"D","text":"忽略紀錄"}],"answer":"B","rationale":"少尿須先確認測量與導管，並評估循環灌流及腎功能，及時通報變化。"},{"stem":"ARDS病人因感染誘發疾病，治療上的根本原則為何？","options":[{"letter":"A","text":"延後培養至出院"},{"letter":"B","text":"只處理血氧而忽略感染"},{"letter":"C","text":"積極辨識並治療誘發病因"},{"letter":"D","text":"所有病人都使用相同抗生素"}],"answer":"C","rationale":"支持性呼吸治療之外，必須處理肺炎、敗血症等誘發因素；抗生素依病因及醫囑使用。"},{"stem":"懷疑感染引起ARDS且醫師安排血液培養，何者正確？","options":[{"letter":"A","text":"自行取消培養"},{"letter":"B","text":"從污染表面採樣"},{"letter":"C","text":"依流程採集適當培養，避免不必要延誤治療"},{"letter":"D","text":"培養結果不可能影響治療"}],"answer":"C","rationale":"培養有助辨識病原及調整治療，採檢須遵循技術並避免延誤必要處置。"},{"stem":"ARDS病人使用抗生素，護理師最重要的用藥安全作法為何？","options":[{"letter":"A","text":"只核對藥袋顏色"},{"letter":"B","text":"核對過敏史、給藥時間並觀察反應"},{"letter":"C","text":"忽略腎功能"},{"letter":"D","text":"病人發疹仍照常給藥不通報"}],"answer":"B","rationale":"須核對藥物、過敏史、給藥時程與可能不良反應，並留意腎功能調整需求。"},{"stem":"ARDS病人有嚴重肺炎，抗生素使用後出現蕁麻疹與喘鳴，護理師應如何處置？","options":[{"letter":"A","text":"立即停止疑似致敏藥並啟動緊急評估通報"},{"letter":"B","text":"加快輸注"},{"letter":"C","text":"只給口服水"},{"letter":"D","text":"記錄後等下次巡房"}],"answer":"A","rationale":"蕁麻疹合併喘鳴可能是嚴重過敏反應，應立即處理氣道與循環並通報。"},{"stem":"ARDS病人因長期臥床，預防靜脈血栓的適當措施為何？","options":[{"letter":"A","text":"依風險與醫囑採藥物或機械性預防"},{"letter":"B","text":"按摩單側腫痛小腿"},{"letter":"C","text":"完全不活動且不評估"},{"letter":"D","text":"自行停用預防措施"}],"answer":"A","rationale":"重症臥床增加血栓風險，可依禁忌及醫囑使用預防措施；不可按摩疑似血栓肢體。"},{"stem":"ARDS病人單側小腿突然腫痛，最適當作法為何？","options":[{"letter":"A","text":"自行增加抗凝藥"},{"letter":"B","text":"只抬高後不記錄"},{"letter":"C","text":"加強按摩促進循環"},{"letter":"D","text":"避免按摩並立即通報評估血栓"}],"answer":"D","rationale":"需懷疑深部靜脈栓塞，避免按摩以免栓子移動，並儘速評估。"},{"stem":"重症ARDS病人預防壓力性損傷，照護重點為何？","options":[{"letter":"A","text":"俯臥時不需檢查受壓點"},{"letter":"B","text":"只在出院前看皮膚"},{"letter":"C","text":"潮濕皮膚不需處理"},{"letter":"D","text":"依耐受定期檢查皮膚、減壓與調整姿勢"}],"answer":"D","rationale":"重症與俯臥均增加壓傷風險，需檢查受壓區、保持皮膚清潔乾燥並減壓。"},{"stem":"俯臥病人耳廓及臉部出現發紅，護理師應如何處理？","options":[{"letter":"A","text":"解除局部壓力、調整支托並持續檢查"},{"letter":"B","text":"忽略直到破皮"},{"letter":"C","text":"以熱敷取代減壓"},{"letter":"D","text":"加壓固定避免移動"}],"answer":"A","rationale":"早期發紅需立即卸壓及調整支托，預防進展為壓力性損傷。"},{"stem":"ARDS插管病人無法進食，營養照護的一般方向為何？","options":[{"letter":"A","text":"病況允許時及早評估並採適當腸道營養"},{"letter":"B","text":"營養與復原無關"},{"letter":"C","text":"長期完全禁食"},{"letter":"D","text":"未評估即大量靜脈營養"}],"answer":"A","rationale":"病況允許時腸道營養有助維持營養與腸道功能，需個別評估耐受性及風險。"},{"stem":"接受鼻胃管灌食的ARDS病人，降低吸入風險的措施為何？","options":[{"letter":"A","text":"灌食後立即大量翻轉"},{"letter":"B","text":"依規範抬高床頭並評估灌食耐受"},{"letter":"C","text":"平躺灌食"},{"letter":"D","text":"灌食時不檢查管路"}],"answer":"B","rationale":"適當抬高床頭並檢視管路、耐受與吸入徵象，可降低灌食相關吸入風險。"},{"stem":"ARDS病人發燒且痰液增加，護理師最適當的感染控制作法為何？","options":[{"letter":"A","text":"多人共用未清潔器材"},{"letter":"B","text":"只更換手套不洗手"},{"letter":"C","text":"不需遵守隔離措施"},{"letter":"D","text":"執行手部衛生及依感染途徑採取防護"}],"answer":"D","rationale":"手部衛生與依病原傳播途徑採取防護，是降低交叉感染的重要措施。"},{"stem":"氣管內管照護時，預防呼吸器相關肺炎的重要措施為何？","options":[{"letter":"A","text":"常規將病人平躺"},{"letter":"B","text":"任意增加鎮靜"},{"letter":"C","text":"不清潔口腔"},{"letter":"D","text":"維持適當床頭抬高及口腔照護"}],"answer":"D","rationale":"依院內指引進行床頭抬高、口腔照護及其他預防組合措施，降低吸入及感染風險。"},{"stem":"ARDS插管病人需要翻身，最重要的氣道安全措施為何？","options":[{"letter":"A","text":"不需檢查呼吸器迴路"},{"letter":"B","text":"翻身時拔除固定裝置"},{"letter":"C","text":"只靠病人自行抓住管路"},{"letter":"D","text":"翻身前後由人員確認管路固定及插入深度"}],"answer":"D","rationale":"翻身可能造成管路位移或拔管，需協調人力並確認氣管內管和迴路。"},{"stem":"ARDS病人清醒插管且無法說話，適當的溝通支持為何？","options":[{"letter":"A","text":"假設病人無法理解"},{"letter":"B","text":"避免告知任何處置"},{"letter":"C","text":"提供手勢、書寫板或是非題溝通方式"},{"letter":"D","text":"只提高聲量"}],"answer":"C","rationale":"插管不等於失去理解能力，替代溝通可降低焦慮並促進參與照護。"},{"stem":"病人因ARDS插管而焦慮，護理師最合宜的回應為何？","options":[{"letter":"A","text":"告知呼吸器一定很快移除"},{"letter":"B","text":"不作解釋直接加藥"},{"letter":"C","text":"簡短說明設備與照護並提供可行的溝通方式"},{"letter":"D","text":"斥責病人不配合"}],"answer":"C","rationale":"清楚說明與支持性溝通可減輕焦慮；避免無法保證的預後承諾。"},{"stem":"ARDS病人氧合持續惡化且呼吸器需求增加，護理師應如何處理？","options":[{"letter":"A","text":"單獨停止監測"},{"letter":"B","text":"自行任意調整呼吸器"},{"letter":"C","text":"等待例行查房"},{"letter":"D","text":"立即重新評估並通報團隊，確認氧氣設備與病人狀態"}],"answer":"D","rationale":"惡化需迅速評估氣道、呼吸器、循環及病因並通報，設定應依授權處理。"},{"stem":"血氧飽和度讀值突然下降，但病人外觀穩定且手指冰冷，第一步為何？","options":[{"letter":"A","text":"確認探頭位置、訊號品質並與臨床狀態比對"},{"letter":"B","text":"關閉血氧儀"},{"letter":"C","text":"直接認定病人休克"},{"letter":"D","text":"完全依賴單次數值"}],"answer":"A","rationale":"低灌流、移動或探頭不當可造成不可靠讀值；應檢查訊號並同時評估病人。"},{"stem":"ARDS病人有深色指甲油且血氧數值與臨床不符，護理師宜如何做？","options":[{"letter":"A","text":"忽略臨床表現"},{"letter":"B","text":"把讀值當成絕對真實"},{"letter":"C","text":"改善探頭測量條件並以其他評估或血氣確認"},{"letter":"D","text":"將氧氣完全停掉"}],"answer":"C","rationale":"周邊灌流、指甲油或動作可能影響脈搏血氧，必要時以血氣等方式確認。"},{"stem":"ARDS使用呼吸器病人的呼氣末二氧化碳監測，可提供何種資訊？","options":[{"letter":"A","text":"確診所有感染"},{"letter":"B","text":"直接測量血紅素"},{"letter":"C","text":"取代動脈血壓"},{"letter":"D","text":"通氣變化及呼氣二氧化碳趨勢"}],"answer":"D","rationale":"呼氣末二氧化碳可追蹤通氣與循環相關變化，但不能完全取代動脈血氣。"},{"stem":"ARDS病人的血氣PaCO2與呼氣末二氧化碳差距擴大，可能表示什麼？","options":[{"letter":"A","text":"死腔或通氣灌流不匹配增加"},{"letter":"B","text":"測量值必然無效"},{"letter":"C","text":"血紅素突然上升"},{"letter":"D","text":"腎功能已恢復"}],"answer":"A","rationale":"肺部死腔及V/Q不匹配可使PaCO2與呼氣末CO2差距增加，需結合臨床判讀。"},{"stem":"ARDS病人呼吸急促且使用輔助呼吸肌，這些發現代表什麼？","options":[{"letter":"A","text":"呼吸窘迫加重，需立即評估氧合與呼吸功"},{"letter":"B","text":"一定是疼痛而非呼吸問題"},{"letter":"C","text":"不需通報"},{"letter":"D","text":"病況已完全穩定"}],"answer":"A","rationale":"呼吸功增加是呼吸窘迫表現，應即時評估低氧、疲乏與支持需求。"},{"stem":"ARDS早期低氧時病人可能出現何種神經行為改變？","options":[{"letter":"A","text":"視力必然永久改善"},{"letter":"B","text":"聽力必然增加"},{"letter":"C","text":"焦躁或意識改變"},{"letter":"D","text":"必然無任何症狀"}],"answer":"C","rationale":"低氧可表現為焦躁、混亂或意識改變；新發變化需立即評估。"},{"stem":"ARDS病人出現發紺，護理師應如何理解？","options":[{"letter":"A","text":"可能為嚴重低氧的晚期徵象，需緊急處理"},{"letter":"B","text":"只是皮膚色素改變不需評估"},{"letter":"C","text":"表示二氧化碳一定偏低"},{"letter":"D","text":"代表氧合正常"}],"answer":"A","rationale":"發紺可能提示顯著低氧，應立即評估呼吸道與氧合並求援。"},{"stem":"ARDS病人喘鳴並突然高壓警報，除檢查管路外還應考量何者？","options":[{"letter":"A","text":"血糖偏低必然"},{"letter":"B","text":"支氣管痙攣或分泌物阻塞"},{"letter":"C","text":"視網膜剝離"},{"letter":"D","text":"腎結石"}],"answer":"B","rationale":"氣道阻力增加可由痙攣或分泌物造成，須臨床評估並依醫囑處置。"},{"stem":"ARDS病人突然單側呼吸音減弱、低血壓及低氧，應警覺何種急症？","options":[{"letter":"A","text":"胃食道逆流"},{"letter":"B","text":"低血糖"},{"letter":"C","text":"單純鼻炎"},{"letter":"D","text":"張力性氣胸"}],"answer":"D","rationale":"通氣急變合併低血壓及單側呼吸音減弱，須警覺氣胸並立即通報處置。"},{"stem":"ARDS病人接受中央靜脈導管照護時，如何降低導管相關感染？","options":[{"letter":"A","text":"依無菌技術及院內導管照護流程操作"},{"letter":"B","text":"觸摸接頭前不需手部衛生"},{"letter":"C","text":"共用未消毒接頭"},{"letter":"D","text":"敷料潮濕仍不更換"}],"answer":"A","rationale":"手部衛生、無菌操作及適當敷料照護可降低導管感染。"},{"stem":"ARDS病人使用升壓藥支持循環，護理師應優先監測何者？","options":[{"letter":"A","text":"不需確認藥物濃度或泵浦"},{"letter":"B","text":"血壓、末梢灌流及輸注管路"},{"letter":"C","text":"只測體溫"},{"letter":"D","text":"只觀察瞳孔"}],"answer":"B","rationale":"升壓藥可能影響血管灌流，需密切監測血壓、末梢狀態與輸注安全。"},{"stem":"ARDS病人使用升壓藥時，發現輸注管路外滲或接頭鬆脫，應如何處理？","options":[{"letter":"A","text":"忽略至輸液結束"},{"letter":"B","text":"將管路丟棄不記錄"},{"letter":"C","text":"立即處理管路並通報，避免升壓藥中斷或外滲傷害"},{"letter":"D","text":"自行快速推注"}],"answer":"C","rationale":"升壓藥中斷可能使循環不穩，外滲也可能傷害組織，須立即依流程處理。"},{"stem":"ARDS病人靜脈輸液期間呼吸狀況變差且水腫增加，護理師宜如何做？","options":[{"letter":"A","text":"評估液體平衡、肺部與循環並通報"},{"letter":"B","text":"盲目再加快輸液"},{"letter":"C","text":"只擦拭皮膚"},{"letter":"D","text":"不記錄輸入量"}],"answer":"A","rationale":"可能存在液體過負荷或肺部惡化，須評估輸入輸出、肺音、氧合及灌流。"},{"stem":"ARDS病人監測液體平衡時，哪一項最能支持精確趨勢判讀？","options":[{"letter":"A","text":"只在出院時計算"},{"letter":"B","text":"漏記沖管液"},{"letter":"C","text":"按規範記錄所有輸入與輸出"},{"letter":"D","text":"只估計飲水量"}],"answer":"C","rationale":"完整、準確的輸入輸出紀錄有助評估容量狀態與治療反應。"},{"stem":"ARDS病人排尿量減少且口乾，護理師不應直接推論何者？","options":[{"letter":"A","text":"不應只憑單一徵象自行決定大量補液"},{"letter":"B","text":"可先評估循環、腎功能及液體狀況"},{"letter":"C","text":"需核對尿管是否扭折"},{"letter":"D","text":"應記錄變化並通報"}],"answer":"A","rationale":"ARDS需在肺水腫風險與器官灌流間平衡，不能只依口乾或少尿自行大量補液。"},{"stem":"ARDS病人長期臥床，為預防關節僵硬與功能退化，合宜照護為何？","options":[{"letter":"A","text":"只在拔管後開始照護"},{"letter":"B","text":"完全固定所有關節"},{"letter":"C","text":"忽略疼痛與耐受"},{"letter":"D","text":"病況允許時進行活動與關節活動度照護"}],"answer":"D","rationale":"依血流動力與呼吸耐受安排早期活動或被動關節活動，有助維持功能。"},{"stem":"ARDS病人生命徵象穩定，安排早期活動時應如何做？","options":[{"letter":"A","text":"活動後不再監測"},{"letter":"B","text":"不評估即站立"},{"letter":"C","text":"停止所有氧氣"},{"letter":"D","text":"先評估氧合、循環、管路及活動耐受，再循序進行"}],"answer":"D","rationale":"早期活動須個別評估穩定度與管路安全，活動中及活動後持續監測反應。"},{"stem":"病人活動中血氧下降、血壓不穩，護理師應如何處理？","options":[{"letter":"A","text":"移除監測設備"},{"letter":"B","text":"強迫完成活動"},{"letter":"C","text":"停止或降低活動、提供支持並重新評估"},{"letter":"D","text":"不告知醫療團隊"}],"answer":"C","rationale":"不耐受時應停止活動、穩定病人並評估原因，避免持續造成低氧或循環惡化。"},{"stem":"ARDS恢復期病人自拔管後仍需氧療，衛教何者適當？","options":[{"letter":"A","text":"自行任意調高流量"},{"letter":"B","text":"症狀改善便自行停用所有治療"},{"letter":"C","text":"依處方使用氧氣並回報呼吸困難或低氧症狀"},{"letter":"D","text":"有氧氣就可吸菸"}],"answer":"C","rationale":"氧療應依處方使用並觀察症狀，避免自行調整；吸菸與氧氣並用有火災危險。"},{"stem":"病人出院後仍使用居家氧氣，何項安全衛教最重要？","options":[{"letter":"A","text":"氧氣設備旁點蠟燭"},{"letter":"B","text":"以油性產品塗抹氧氣接頭"},{"letter":"C","text":"遠離火源並禁止吸菸"},{"letter":"D","text":"自行改裝流量計"}],"answer":"C","rationale":"氧氣會助燃，須遠離火焰與吸菸，並依廠商及醫療指示安全使用設備。"},{"stem":"ARDS病人使用氧氣鼻導管，鼻腔乾燥不適，較合宜的建議為何？","options":[{"letter":"A","text":"任意停止氧療"},{"letter":"B","text":"告知照護團隊評估濕化與皮膚黏膜照護"},{"letter":"C","text":"自行塗抹油性凡士林於鼻孔"},{"letter":"D","text":"以明火加熱導管"}],"answer":"B","rationale":"乾燥可回報評估適當濕化與水性照護；油性物質及明火配合氧氣有危險。"},{"stem":"ARDS家屬詢問病人何時一定能脫離呼吸器，護理師適當回應為何？","options":[{"letter":"A","text":"保證明天拔管"},{"letter":"B","text":"告知永遠不能脫離"},{"letter":"C","text":"說明需依病因、氧合與整體狀況逐步評估，無法預先保證日期"},{"letter":"D","text":"拒絕提供任何資訊"}],"answer":"C","rationale":"脫機時間因病況而異，應提供誠實、可理解的資訊並鼓勵與團隊討論。"},{"stem":"ARDS病人家屬因病情緊張而詢問治療計畫，護理師最適切的作法為何？","options":[{"letter":"A","text":"以清楚語言說明護理可說明的內容並協助向團隊詢問"},{"letter":"B","text":"隱瞞已知照護資訊"},{"letter":"C","text":"提供未確認的預後"},{"letter":"D","text":"責怪家屬提問"}],"answer":"A","rationale":"以病人及家屬為中心提供準確資訊，超出護理說明範圍者協助轉介團隊。"},{"stem":"ARDS病人需要插管，病人尚有決策能力且情況允許，護理師應如何參與？","options":[{"letter":"A","text":"隱瞞替代方案"},{"letter":"B","text":"在緊急狀況下延誤必要救命處置"},{"letter":"C","text":"代替病人自行同意"},{"letter":"D","text":"協助確認已說明處置、風險並支持知情決策"}],"answer":"D","rationale":"尊重自主並協助知情同意；若病人無決策能力或緊急情況，依規範及法律程序處理。"},{"stem":"ARDS病人進行管路照護，正確的病人辨識方式為何？","options":[{"letter":"A","text":"以床號作為唯一識別"},{"letter":"B","text":"詢問隔壁病人"},{"letter":"C","text":"依房間位置辨認"},{"letter":"D","text":"依機構規範使用至少兩項識別資訊"}],"answer":"D","rationale":"執行治療或給藥前須以規範的識別資訊確認病人，床號不能作唯一依據。"},{"stem":"給ARDS病人給藥前，病人姓名與藥袋資訊不一致，應如何處理？","options":[{"letter":"A","text":"請家屬猜測"},{"letter":"B","text":"忽略不一致"},{"letter":"C","text":"先給藥再補紀錄"},{"letter":"D","text":"暫停給藥並釐清身分與醫囑"}],"answer":"D","rationale":"身分不一致時應暫停給藥並查明，避免錯誤病人用藥。"},{"stem":"ARDS病人有腎功能受損，接受可能需腎功能調整的藥物，護理師應如何做？","options":[{"letter":"A","text":"忽略腎功能"},{"letter":"B","text":"核對檢驗與醫囑並向團隊確認劑量安全"},{"letter":"C","text":"自行加倍劑量"},{"letter":"D","text":"假設所有藥物都不經腎臟排除"}],"answer":"B","rationale":"腎功能可能影響藥物清除，須核對檢驗、醫囑及必要的劑量調整。"},{"stem":"ARDS病人接受鴉片類止痛藥後，護理師應特別觀察何者？","options":[{"letter":"A","text":"只測身高"},{"letter":"B","text":"僅食慾"},{"letter":"C","text":"不需評估意識"},{"letter":"D","text":"鎮靜程度、呼吸狀態與血壓"}],"answer":"D","rationale":"鴉片類藥物可能造成呼吸抑制、過度鎮靜與低血壓，須持續評估。"},{"stem":"ARDS病人使用鴉片類止痛藥後呼吸變慢且難以喚醒，護理師應如何處理？","options":[{"letter":"A","text":"讓病人獨處"},{"letter":"B","text":"再追加同種止痛藥"},{"letter":"C","text":"立即評估呼吸循環並依緊急流程通報處置"},{"letter":"D","text":"等藥效自然消退不監測"}],"answer":"C","rationale":"可能為藥物引起的呼吸抑制，須立即維持氣道與呼吸並啟動相應處置。"},{"stem":"ARDS病人有疼痛，使用止痛藥前最適當的護理步驟為何？","options":[{"letter":"A","text":"詢問同房病人"},{"letter":"B","text":"只看病人外觀"},{"letter":"C","text":"不需評估即給藥"},{"letter":"D","text":"評估疼痛程度、意識、呼吸與過敏史"}],"answer":"D","rationale":"用藥前評估疼痛與安全風險，給藥後再評估療效及不良反應。"},{"stem":"ARDS病人長期使用鎮靜藥，護理師可協助避免何種問題？","options":[{"letter":"A","text":"不評估停藥反應"},{"letter":"B","text":"忽略譫妄"},{"letter":"C","text":"定期依醫囑評估鎮靜需求，避免不必要的深度鎮靜"},{"letter":"D","text":"維持最高鎮靜深度"}],"answer":"C","rationale":"以目標導向評估降低過度鎮靜、譫妄及延遲脫機等風險。"},{"stem":"ARDS重症病人出現急性混亂，護理師應優先評估何者？","options":[{"letter":"A","text":"立即限制所有溝通"},{"letter":"B","text":"低氧、感染、代謝異常與藥物等可逆原因"},{"letter":"C","text":"只認定為失智"},{"letter":"D","text":"不告知團隊"}],"answer":"B","rationale":"重症譫妄或混亂常有可逆誘因，應評估氧合、感染、代謝、藥物與環境。"},{"stem":"預防ARDS病人譫妄的非藥物措施何者較適當？","options":[{"letter":"A","text":"協助日夜定向、提供眼鏡助聽器及維持睡眠活動節律"},{"letter":"B","text":"任意增加鎮靜"},{"letter":"C","text":"不允許家屬溝通"},{"letter":"D","text":"整日不提供時間資訊"}],"answer":"A","rationale":"定向、感官輔具、睡眠與活動支持可協助減少譫妄風險。"},{"stem":"ARDS病人需隔離，護理師進出病室最重要的感染管制措施為何？","options":[{"letter":"A","text":"依隔離類別正確穿脫防護裝備並執行手部衛生"},{"letter":"B","text":"只戴手套即可涵蓋所有防護"},{"letter":"C","text":"共用防護衣"},{"letter":"D","text":"離室後不洗手"}],"answer":"A","rationale":"遵守病原相關防護及手部衛生，並正確穿脫裝備，避免自我與交叉污染。"},{"stem":"ARDS病人有大量呼吸道分泌物，標本採集的原則為何？","options":[{"letter":"A","text":"不標示病人資料"},{"letter":"B","text":"將標本放置數日再送"},{"letter":"C","text":"用一般紙杯收集"},{"letter":"D","text":"使用適當無菌容器與技術，標示並及時送檢"}],"answer":"D","rationale":"正確採集、標示與及時送檢可提升檢體品質並減少污染。"},{"stem":"ARDS病人肺部感染治療後體溫下降但氧合仍差，護理師應如何理解？","options":[{"letter":"A","text":"表示診斷一定錯誤"},{"letter":"B","text":"可立即拔除所有氧氣"},{"letter":"C","text":"體溫下降即可停止呼吸照護"},{"letter":"D","text":"氧合恢復可能落後於感染控制，仍需持續評估支持"}],"answer":"D","rationale":"肺損傷與氧合改善未必同步，應依氧合、影像與整體臨床狀態持續治療。"},{"stem":"ARDS病人氧合改善，呼吸器FiO2調降後應觀察何者？","options":[{"letter":"A","text":"血氧、呼吸狀態及後續血氣反應"},{"letter":"B","text":"不再監測"},{"letter":"C","text":"立即自行移除呼吸器"},{"letter":"D","text":"只看心率"}],"answer":"A","rationale":"氧療調整後須確認病人能維持目標氧合及通氣，並依醫囑追蹤血氣。"},{"stem":"ARDS病人使用PEEP期間，護理師觀察到頸靜脈怒張與血壓變化，應如何做？","options":[{"letter":"A","text":"自行取消PEEP"},{"letter":"B","text":"認為必然正常不處理"},{"letter":"C","text":"只記錄不評估"},{"letter":"D","text":"評估循環及胸腔壓相關影響並通報"}],"answer":"D","rationale":"PEEP可能影響靜脈回流及右心負荷，循環徵象變化需及時評估。"},{"stem":"ARDS病人接受高PEEP支持，哪項照護有助及早發現氣壓傷？","options":[{"letter":"A","text":"不評估胸部"},{"letter":"B","text":"僅測體重"},{"letter":"C","text":"觀察突發呼吸惡化、胸廓及呼吸音變化"},{"letter":"D","text":"只檢查瞳孔"}],"answer":"C","rationale":"正壓通氣可能造成氣壓傷，突發低氧、單側呼吸音變化等須立即評估。"},{"stem":"呼吸器管路積水，護理師應如何處理？","options":[{"letter":"A","text":"不需戴手套或防護"},{"letter":"B","text":"將冷凝水倒入病人端"},{"letter":"C","text":"依設備流程安全排水，避免冷凝水流向病人"},{"letter":"D","text":"讓水流入氣管內管"}],"answer":"C","rationale":"冷凝水可能污染或流入病人呼吸道，須按流程處理並避免暴露。"},{"stem":"ARDS病人呼吸器管路需暫時斷開進行照護，最重要的考量為何？","options":[{"letter":"A","text":"長時間敞開管路"},{"letter":"B","text":"先關閉所有監測"},{"letter":"C","text":"忽略病人氧合"},{"letter":"D","text":"盡量減少斷開時間並維持氧合與無菌安全"}],"answer":"D","rationale":"斷開管路會造成去募集或低氧及污染風險，應減少時間並依流程維持支持。"},{"stem":"氣管內管固定處皮膚受損，護理師應如何照護？","options":[{"letter":"A","text":"任由固定帶持續摩擦"},{"letter":"B","text":"評估皮膚並調整固定位置或保護方式，確保管路仍安全"},{"letter":"C","text":"鬆開後不固定"},{"letter":"D","text":"只以化妝品遮蓋"}],"answer":"B","rationale":"需兼顧皮膚完整與氣道安全，依規範檢查並調整固定裝置。"},{"stem":"ARDS插管病人需要口腔清潔，適當作法為何？","options":[{"letter":"A","text":"用尖銳物清除口腔分泌物"},{"letter":"B","text":"依院內流程清潔口腔並固定氣管內管"},{"letter":"C","text":"清潔時不顧管路"},{"letter":"D","text":"完全不做口腔照護"}],"answer":"B","rationale":"口腔照護有助舒適及感染預防，過程中須避免管路移位與黏膜傷害。"},{"stem":"ARDS病人嘴唇乾裂，護理師可採取何種措施？","options":[{"letter":"A","text":"使用油性物質接觸氧氣設備"},{"letter":"B","text":"依規範使用適當水性保濕照護並評估黏膜"},{"letter":"C","text":"停止口腔評估"},{"letter":"D","text":"撕除乾裂皮屑"}],"answer":"B","rationale":"提供安全的口唇黏膜照護並避免油性產品接觸氧氣環境。"},{"stem":"ARDS病人因發燒與出汗，需進行皮膚照護，重點為何？","options":[{"letter":"A","text":"只在可見破皮後處理"},{"letter":"B","text":"不更換污染衣物"},{"letter":"C","text":"使用潮濕床單覆蓋"},{"letter":"D","text":"保持皮膚清潔乾燥並檢查受壓與潮濕部位"}],"answer":"D","rationale":"濕潤與摩擦增加皮膚損傷，應維持清潔乾燥及早發現異常。"},{"stem":"ARDS病人呼吸器相關肺炎預防中，口腔照護的理由為何？","options":[{"letter":"A","text":"直接治癒ARDS"},{"letter":"B","text":"降低口腔病原負荷及可能微量吸入風險"},{"letter":"C","text":"使呼吸器不需清潔"},{"letter":"D","text":"取代抗生素"}],"answer":"B","rationale":"口腔照護是呼吸器照護組合之一，可減少口腔微生物負荷，但不取代其他措施。"},{"stem":"ARDS病人脫離呼吸器前，護理師可協助團隊評估何者？","options":[{"letter":"A","text":"只看病人年齡"},{"letter":"B","text":"只看家屬是否在場"},{"letter":"C","text":"只看胸部影像單一結果"},{"letter":"D","text":"氧合與通氣穩定、病因改善及自主呼吸能力"}],"answer":"D","rationale":"脫機需綜合病因、氧合、通氣、意識、肌力及自主呼吸能力評估。"},{"stem":"病人接受自主呼吸測試時出現明顯喘促、血氧下降，護理師應如何做？","options":[{"letter":"A","text":"不記錄反應"},{"letter":"B","text":"關閉氧氣"},{"letter":"C","text":"依流程終止測試並恢復支持、通報評估"},{"letter":"D","text":"強迫繼續至時間結束"}],"answer":"C","rationale":"不耐受提示測試失敗或狀況不穩，應恢復適當支持並評估原因。"},{"stem":"拔管後ARDS病人出現聲音嘶啞及呼吸費力，護理師應如何處理？","options":[{"letter":"A","text":"給予固體食物"},{"letter":"B","text":"認為正常而不觀察"},{"letter":"C","text":"立即評估氣道通暢與呼吸狀態並通報"},{"letter":"D","text":"讓病人平躺獨處"}],"answer":"C","rationale":"拔管後呼吸費力可能是上氣道阻塞等急症，需迅速評估並準備支持。"}]},{"title":"肺炎","questions":[{"stem":"肺泡滲出物主要造成何者？","options":[{"letter":"A","text":"氣道永久擴張"},{"letter":"B","text":"呼吸中樞抑制"},{"letter":"C","text":"肺泡面積增加"},{"letter":"D","text":"通氣灌流失衡"}],"answer":"D","rationale":"滲出物妨礙通氣，造成低氧。"},{"stem":"肺炎發紺且喘，優先處置？","options":[{"letter":"A","text":"平躺"},{"letter":"B","text":"先餵食"},{"letter":"C","text":"先採痰而延誤"},{"letter":"D","text":"坐起評估並依指示給氧"}],"answer":"D","rationale":"優先維持氣道與氧合。"},{"stem":"黃綠痰代表？","options":[{"letter":"A","text":"不能單憑痰色判定病原"},{"letter":"B","text":"無感染"},{"letter":"C","text":"確診細菌"},{"l 藥"},{"letter":"C","text":"儘速專科及公衛評估抗藥性方案"},{"letter":"D","text":"宣告治癒"}],"answer":"C","rationale":"可能涉及重大抗藥性，需專業處置及進一步敏感性檢查。"},{"stem":"結核患者合併腎功能不全，應提供團隊何資料？","options":[{"letter":"A","text":"腎功能與透析資訊"},{"letter":"B","text":"只報咳嗽"},{"letter":"C","text":"只報身高"},{"letter":"D","text":"隱瞞透析"}],"answer":"A","rationale":"腎功能影響部分藥物劑量及監測。"},{"stem":"結核患者合併慢性肝病，照護應？","options":[{"letter":"A","text":"告知病史並依個別方案監測肝臟"},{"letter":"B","text":"自行停藥"},{"letter":"C","text":"隱瞞病情"},{"letter":"D","text":"只量體溫"}],"answer":"A","rationale":"肝病影響藥物安全需團隊評估。"},{"stem":"疑似肺結核患者在急診候診，應？","options":[{"letter":"A","text":"分流、給口罩並安排通風隔離"},{"letter":"B","text":"公共區採痰"},{"letter":"C","text":"塗片陽性才防護"},{"letter":"D","text":"擁擠候診"}],"answer":"A","rationale":"確診前即應適當感染管制。"},{"stem":"負壓病室功能為何？","options":[{"letter":"A","text":"取代所有口罩"},{"letter":"B","text":"改變溫度"},{"letter":"C","text":"控制氣流向病室內並適當排氣"},{"letter":"D","text":"降低氧氣殺菌"}],"answer":"C","rationale":"負壓減少污染空氣外逸，但仍需其他防護。"},{"stem":"共用照護器材使用後如何處理？","options":[{"letter":"A","text":"直接交下一位"},{"letter":"B","text":"乾布擦拭"},{"letter":"C","text":"依規範清潔消毒後再用"},{"letter":"D","text":"不需處理"}],"answer":"C","rationale":"器材仍須遵循標準清潔消毒流程。"},{"stem":"抽血照護肺結核患者需遵守何者？","options":[{"letter":"A","text":"不洗手"},{"letter":"B","text":"只N95不手套"},{"letter":"C","text":"無咳嗽免防護"},{"letter":"D","text":"標準防護並依風險維持空氣防護"}],"answer":"D","rationale":"空氣隔離與標準防護並行。"},{"stem":"家屬詢問日常握手是否傳染，應答？","options":[{"letter":"A","text":"主要是空氣傳播，握手不是主要途徑"},{"letter":"B","text":"不握手即可免空氣防護"},{"letter":"C","text":"握手最主要"},{"letter":"D","text":"只有握手傳染"}],"answer":"A","rationale":"主要風險來自吸入感染性空氣微粒。"},{"stem":"家屬擔心衣物傳染，衛教為何？","options":[{"letter":"A","text":"洗衣可取代治療"},{"letter":"B","text":"衣物唯一途徑"},{"letter":"C","text":"衣物分洗非核心措施，重點是通風與空氣防護"},{"letter":"D","text":"衣物焚毀"}],"answer":"C","rationale":"肺結核主要空氣傳播。"},{"stem":"家有幼兒曾密切接觸患者，建議？","options":[{"letter":"A","text":"儘速安排接觸者評估"},{"letter":"B","text":"無症狀免評估"},{"letter":"C","text":"不需告知"},{"letter":"D","text":"吃患者藥"}],"answer":"A","rationale":"幼兒接觸需依公衛流程及早評估。"},{"stem":"患者問接觸者是否都會感染，回答？","options":[{"letter":"A","text":"接觸必感染"},{"letter":"B","text":"只有兒童感染"},{"letter":"C","text":"不一定，依暴露及個人風險評估"},{"letter":"D","text":"接觸者終身帶菌"}],"answer":"C","rationale":"感染風險因暴露程度及宿主因素而異。"},{"stem":"接觸者預防治療前需？","options":[{"letter":"A","text":"只看是否咳嗽"},{"letter":"B","text":"評估並排除活動性結核"},{"letter":"C","text":"不必評估"},{"letter":"D","text":"共用患者藥物"}],"answer":"B","rationale":"處置需先排除活動病並由團隊決定。"},{"stem":"肺外結核可能侵犯何處？","options":[{"letter":"A","text":"只限肺"},{"letter":"B","text":"只侵犯皮膚"},{"letter":"C","text":"淋巴結或骨骼等器官"},{"letter":"D","text":"不需治療"}],"answer":"C","rationale":"結核可侵犯肺外器官。"},{"stem":"影像上肺葉病灶能否確定結核及抗藥性？","options":[{"letter":"A","text":"可以確定菌種藥敏"},{"letter":"B","text":"不用痰檢"},{"letter":"C","text":"可排除其他病"},{"letter":"D","text":"不能，須結合微生物與臨床檢查"}],"answer":"D","rationale":"影像提供支持但不能確診菌種與藥敏。"},{"stem":"胸片正常但高風險者持續疑似症狀，應？","options":[{"letter":"A","text":"只查血糖"},{"letter":"B","text":"保證無結核"},{"letter":"C","text":"繼續臨床評估與必要檢查"},{"letter":"D","text":"停止防護"}],"answer":"C","rationale":"單次影像正常不一定排除結核。"},{"stem":"患者擔心結核是個人不潔造成，應如何說明？","options":[{"letter":"A","text":"疾病由結核菌感染造成，非道德或衛生污名"},{"letter":"B","text":"是遺傳病"},{"letter":"C","text":"咳嗽等於故意傳染"},{"letter":"D","text":"只因不洗澡"}],"answer":"A","rationale":"正確衛教可減少污名。"}]},{"title":"肺癌","questions":[{"stem":"長期吸菸刺激支氣管黏膜，可能先造成何種變化？","options":[{"letter":"A","text":"肺血管鈣化"},{"letter":"B","text":"肺泡表面活性物質增加"},{"letter":"C","text":"正常纖毛增加"},{"letter":"D","text":"鱗狀化生，後續可能異型增生"}],"answer":"D","rationale":"慢性刺激可使纖毛柱狀上皮轉為鱗狀上皮；化生可能進展但不等於癌症。"},{"stem":"小細胞肺癌最典型的特性為何？","options":[{"letter":"A","text":"生長緩慢且多局限肺部"},{"letter":"B","text":"各期皆以手術為首選"},{"letter":"C","text":"常早期轉移且對化療、放療較敏感"},{"letter":"D","text":"罕見副腫瘤症候群"}],"answer":"C","rationale":"小細胞肺癌具侵襲性且易早期轉移，通常以全身性治療為主。"},{"stem":"肺腺癌屬於何類肺癌？","options":[{"letter":"A","text":"小細胞肺癌，必位於主支氣管"},{"letter":"B","text":"非小細胞肺癌，常見於肺周邊"},{"letter":"C","text":"僅見於吸菸者"},{"letter":"D","text":"胸膜間皮瘤"}],"answer":"B","rationale":"腺癌為非小細胞肺癌，常呈周邊型，也可見於不吸菸者。"},{"stem":"肺門附近鱗狀細胞癌最相關的風險因子為何？","options":[{"letter":"A","text":"短暫日曬"},{"letter":"B","text":"長期吸菸"},{"letter":"C","text":"高纖飲食"},{"letter":"D","text":"乳糖不耐"}],"answer":"B","rationale":"鱗狀細胞癌與吸菸關聯強，較常呈中央型。"},{"stem":"小細胞肺癌患者低血鈉、低血漿滲透壓且尿液濃縮，最可能原因為何？","options":[{"letter":"A","text":"胰島素分泌增加"},{"letter":"B","text":"異位抗利尿激素造成SIADH"},{"letter":"C","text":"肺泡通氣造成尿濃縮"},{"letter":"D","text":"醛固酮造成高鈉"}],"answer":"B","rationale":"SIADH造成水分滯留與稀釋性低血鈉，需評估神經狀態。"},{"stem":"肺癌患者骨痛、便祕及高血鈣，常見機轉為何？","options":[{"letter":"A","text":"骨轉移或腫瘤相關因子促進骨吸收"},{"letter":"B","text":"抗利尿激素造成低鈣"},{"letter":"C","text":"維生素K缺乏"},{"letter":"D","text":"腎臟排鈣增加"}],"answer":"A","rationale":"骨轉移或副腫瘤性體液因子可造成高血鈣，需注意脫水與意識變化。"},{"stem":"小細胞肺癌患者近端肌無力，懷疑Lambert-Eaton症候群，其機轉為何？","options":[{"letter":"A","text":"破壞肌動蛋白"},{"letter":"B","text":"造成視神經發炎"},{"letter":"C","text":"壓迫脊髓前角"},{"letter":"D","text":"抗體影響突觸前鈣通道，降低乙醯膽鹼釋放"}],"answer":"D","rationale":"此症候群為突觸前神經肌肉傳導障礙，可與小細胞肺癌相關。"},{"stem":"肺癌侵犯上腔靜脈，最典型表現為何？","options":[{"letter":"A","text":"右上腹餐後痛"},{"letter":"B","text":"耳鳴"},{"letter":"C","text":"單側小腿腫脹"},{"letter":"D","text":"臉頸腫脹、上肢水腫及頸靜脈怒張"}],"answer":"D","rationale":"上腔靜脈阻塞使上半身靜脈回流受阻，呼吸惡化需立即評估。"},{"stem":"肺尖腫瘤造成肩痛、尺側手臂麻木及眼瞼下垂，最可能為何？","options":[{"letter":"A","text":"Pancoast-Tobias症候群"},{"letter":"B","text":"腎病症候群"},{"letter":"C","text":"庫欣氏症候群"},{"letter":"D","text":"馬凡氏症候群"}],"answer":"A","rationale":"肺尖腫瘤侵犯臂神經叢及交感神經鏈，可有肩臂痛及Horner徵象。"},{"stem":"肺癌患者單側聲帶麻痺、聲音沙啞，可能侵犯何神經？","options":[{"letter":"A","text":"正中神經"},{"letter":"B","text":"坐骨神經"},{"letter":"C","text":"視神經"},{"letter":"D","text":"喉返神經"}],"answer":"D","rationale":"肺腫瘤或縱膈淋巴結可能壓迫喉返神經。"},{"stem":"咳血患者的初步評估最應包含何者？","options":[{"letter":"A","text":"出血量、顏色、頻率及呼吸循環狀況"},{"letter":"B","text":"只記錄咳嗽聲"},{"letter":"C","text":"立即限制所有飲水"},{"letter":"D","text":"只問痰液氣味"}],"answer":"A","rationale":"需評估咳血嚴重度及生命徵象；大量咳血可能危及氣道。"},{"stem":"疑似肺癌者的吸菸史評估，最需記錄何者？","options":[{"letter":"A","text":"鞋號"},{"letter":"B","text":"吸菸量、年數及戒菸時間"},{"letter":"C","text":"慣用手"},{"letter":"D","text":"剪髮日期"}],"answer":"B","rationale":"累積吸菸暴露是重要風險資訊，也應詢問二手菸及職業暴露。"},{"stem":"石綿暴露史與何種疾病風險相關？","options":[{"letter":"A","text":"膀胱結石"},{"letter":"B","text":"甲狀腺腫"},{"letter":"C","text":"僅有氣喘"},{"letter":"D","text":"肺癌及惡性胸膜間皮瘤"}],"answer":"D","rationale":"石綿暴露可增加肺癌及胸膜間皮瘤風險。"},{"stem":"肺癌患者活動時呼吸急促，護理師首先取得何種資料？","options":[{"letter":"A","text":"食慾"},{"letter":"B","text":"呼吸頻率、血氧、呼吸型態及生命徵象"},{"letter":"C","text":"身高"},{"letter":"D","text":"指甲長度"}],"answer":"B","rationale":"先評估氧合及呼吸窘迫，再依結果處置。"},{"stem":"追蹤肺癌患者營養狀況，最適當的方式為何？","options":[{"letter":"A","text":"限制蛋白質"},{"letter":"B","text":"只記錄尿色"},{"letter":"C","text":"以單次體重取代追蹤"},{"letter":"D","text":"定期記錄體重、攝取量及相關症狀"}],"answer":"D","rationale":"趨勢性資料有助辨識營養不良並調整支持措施。"},{"stem":"癌症骨痛評估何者最完整？","options":[{"letter":"A","text":"部位、強度、性質、誘因、緩解因子及功能影響"},{"letter":"B","text":"只問有無疼痛"},{"letter":"C","text":"疼痛難忍才記錄"},{"letter":"D","text":"由家屬猜測"}],"answer":"A","rationale":"完整疼痛評估需涵蓋特性及功能影響，並反覆評估治療效果。"},{"stem":"肺癌患者新發背痛合併肢體無力，最適當處置為何？","options":[{"letter":"A","text":"安排下週回診"},{"letter":"B","text":"立即通報，評估脊髓壓迫"},{"letter":"C","text":"停止神經學評估"},{"letter":"D","text":"鼓勵步行測試"}],"answer":"B","rationale":"可能脊髓壓迫，延誤可造成永久神經損傷。"},{"stem":"肺癌患者咳嗽影響睡眠，護理師應先評估何者？","options":[{"letter":"A","text":"不評估即停藥"},{"letter":"B","text":"咖啡品牌"},{"letter":"C","text":"咳嗽時間、誘因、痰液及呼吸狀況"},{"letter":"D","text":"鞋子尺寸"}],"answer":"C","rationale":"需釐清原因並排除感染、阻塞或治療副作用。"},{"stem":"胸部顯影電腦斷層前，應確認何者？","options":[{"letter":"A","text":"視力"},{"letter":"B","text":"顯影劑反應史及腎功能等風險"},{"letter":"C","text":"鞋號"},{"letter":"D","text":"剪髮日期"}],"answer":"B","rationale":"顯影檢查前依流程評估過敏史、腎功能及相關風險。"},{"stem":"胸部X光發現陰影，何項說明正確？","options":[{"letter":"A","text":"可發現異常，但不能單獨確診肺癌"},{"letter":"B","text":"陰影必定是轉移癌"},{"letter":"C","text":"正常即可完全排除肺癌"},{"letter":"D","text":"可直接判定細胞型態"}],"answer":"A","rationale":"確診通常需要細胞或組織病理證據。"},{"stem":"PET影像在肺癌評估的用途為何？","options":[{"letter":"A","text":"保證預測藥效"},{"letter":"B","text":"直接取得組織"},{"letter":"C","text":"協助評估代謝活性病灶及可能轉移"},{"letter":"D","text":"取代所有檢查"}],"answer":"C","rationale":"PET有助分期，但需與其他檢查及臨床資料整合判讀。"},{"stem":"支氣管鏡切片前，護理師最重要的準備為何？","options":[{"letter":"A","text":"鼓勵大量進食"},{"letter":"B","text":"確認禁食、同意及出血／抗凝風險"},{"letter":"C","text":"擅自加抗凝藥"},{"letter":"D","text":"不需核對病人"}],"answer":"B","rationale":"依醫囑及流程確認術前準備與用藥風險，不擅自停加藥。"},{"stem":"支氣管鏡後咽喉仍麻木，何時可恢復飲食？","options":[{"letter":"A","text":"咽喉反射恢復且吞嚥安全後"},{"letter":"B","text":"口渴就立即飲水"},{"letter":"C","text":"只要坐起即可"},{"letter":"D","text":"痰液消失後"}],"answer":"A","rationale":"局部麻醉可能抑制咽喉反射，過早進食有吸入風險。"},{"stem":"經皮肺穿刺切片後最需監測的急性併發症為何？","options":[{"letter":"A","text":"氣胸及呼吸惡化"},{"letter":"B","text":"腸阻塞"},{"letter":"C","text":"青光眼"},{"letter":"D","text":"尿滯留"}],"answer":"A","rationale":"應監測胸痛、呼吸困難、血氧及氣胸／出血徵象。"},{"stem":"確認肺癌組織型態及分子標記，最直接的資料來源為何？","options":[{"letter":"A","text":"聽診"},{"letter":"B","text":"體溫"},{"letter":"C","text":"血氧"},{"letter":"D","text":"組織或細胞檢體病理分析"}],"answer":"D","rationale":"病理檢體可確診及分型，分子檢測可協助治療選擇。"},{"stem":"腫瘤基因結果未出，患者詢問是否開始特定標靶藥，應如何回應？","options":[{"letter":"A","text":"所有肺癌都適用同藥"},{"letter":"B","text":"基因檢測無關治療"},{"letter":"C","text":"由團隊依分子結果及臨床條件決定"},{"letter":"D","text":"可自行開始"}],"answer":"C","rationale":"標靶治療需依特定分子變異及臨床條件選擇。"},{"stem":"腦部MRI檢查前，護理師應確認何者？","options":[{"letter":"A","text":"胸部X光日期"},{"letter":"B","text":"植入物、金屬異物及裝置相容性"},{"letter":"C","text":"指甲長度"},{"letter":"D","text":"襪子顏色"}],"answer":"B","rationale":"MRI前需篩檢植入物與金屬安全性。"},{"stem":"肺功能檢查對肺癌手術評估的主要用途為何？","options":[{"letter":"A","text":"判定組織型態"},{"letter":"B","text":"取代切片確診"},{"letter":"C","text":"檢查基因突變"},{"letter":"D","text":"評估肺功能及手術呼吸儲備"}],"answer":"D","rationale":"肺功能檢查評估通氣及手術耐受度，不負責癌症病理診斷。"},{"stem":"痰液細胞學檢查應如何採檢？","options":[{"letter":"A","text":"只收口水"},{"letter":"B","text":"室溫放數日再送"},{"letter":"C","text":"依指示深咳取得下呼吸道痰液，避免只收唾液"},{"letter":"D","text":"先加水稀釋"}],"answer":"C","rationale":"應採深部痰液並依檢驗室要求儘速送檢。"},{"stem":"肺葉切除術前呼吸訓練宜包含何者？","options":[{"letter":"A","text":"快速淺呼吸"},{"letter":"B","text":"深呼吸、有效咳嗽及誘發性肺量計"},{"letter":"C","text":"完全禁止咳嗽"},{"letter":"D","text":"避免所有活動"}],"answer":"B","rationale":"術前練習有助術後肺擴張與分泌物清除。"},{"stem":"化療患者發燒、發冷，護理師應如何處置？","options":[{"letter":"A","text":"只擦澡不通報"},{"letter":"B","text":"自行服退燒藥等數日"},{"letter":"C","text":"不再量體溫"},{"letter":"D","text":"立即評估並依發燒／嗜中性球低下流程通報"}],"answer":"D","rationale":"化療期間發燒可能為嚴重感染，應及時評估，不可延誤。"},{"stem":"咳血患者呼吸急促迅速惡化，優先處置為何？","options":[{"letter":"A","text":"維持氣道與氧合並緊急求援"},{"letter":"B","text":"大量飲水"},{"letter":"C","text":"讓患者離開病室"},{"letter":"D","text":"先完成病歷"}],"answer":"A","rationale":"大量咳血可能造成氣道阻塞，須立即處理呼吸威脅。"},{"stem":"上腔靜脈症候群患者臉部腫脹、呼吸不適，適當措施為何？","options":[{"letter":"A","text":"頭低腳高"},{"letter":"B","text":"平躺不觀察"},{"letter":"C","text":"抬高床頭並監測呼吸、血氧及神經狀態"},{"letter":"D","text":"加壓包紮上肢"}],"answer":"C","rationale":"抬高床頭可減輕上半身靜脈壓，惡化時需即刻通報。"},{"stem":"疑似SIADH患者低血鈉且混亂，優先監測何者？","options":[{"letter":"A","text":"增加自由飲水"},{"letter":"B","text":"神經狀態、抽搐風險及血鈉"},{"letter":"C","text":"只記錄尿色"},{"letter":"D","text":"大量飲水"}],"answer":"B","rationale":"低血鈉可致腦水腫及抽搐，水分處置需依醫囑。"},{"stem":"骨轉移疼痛患者的照護何者適當？","options":[{"letter":"A","text":"要求忍痛"},{"letter":"B","text":"依處方止痛並安全協助活動"},{"letter":"C","text":"禁止所有止痛藥"},{"letter":"D","text":"用力按摩病灶"}],"answer":"B","rationale":"癌痛需適當治療；骨轉移處避免強力按摩及不當負重。"},{"stem":"胸管接頭鬆脫且患者呼吸窘迫，應如何處理？","options":[{"letter":"A","text":"呼叫支援，依胸管意外流程處理並評估呼吸"},{"letter":"B","text":"拔管"},{"letter":"C","text":"引流瓶抬高"},{"letter":"D","text":"任意夾管離開"}],"answer":"A","rationale":"須立即維持系統安全及處理呼吸惡化，不可任意拔管或抬高引流瓶。"},{"stem":"胸管水封室呼吸性波動消失，護理師下一步為何？","options":[{"letter":"A","text":"引流瓶放床上"},{"letter":"B","text":"檢查管路折曲阻塞並評估病人"},{"letter":"C","text":"擠壓胸管"},{"letter":"D","text":"常規夾管"}],"answer":"B","rationale":"波動消失可能為肺復張或管路問題，應先評估病人與系統。"},{"stem":"術後疼痛使病人不敢咳嗽，最適當指導為何？","options":[{"letter":"A","text":"依處方止痛並以枕頭支托切口咳嗽"},{"letter":"B","text":"停止深呼吸"},{"letter":"C","text":"禁止咳嗽"},{"letter":"D","text":"拆敷料按壓"}],"answer":"A","rationale":"止痛及支托切口可助有效咳嗽，降低肺部併發症。"},{"stem":"居家氧療安全衛教何者正確？","options":[{"letter":"A","text":"遠離火源，依處方使用氧氣並避免油性產品"},{"letter":"B","text":"以油膏塗設備"},{"letter":"C","text":"任意提高流量"},{"letter":"D","text":"氧氣旁可吸菸"}],"answer":"A","rationale":"氧氣助燃，須禁菸避火，流量依處方設定。"},{"stem":"放射治療皮膚乾燥紅斑，照護方式何者適當？","options":[{"letter":"A","text":"用力搓洗標記"},{"letter":"B","text":"長時間熱敷"},{"letter":"C","text":"自塗刺激性藥膏"},{"letter":"D","text":"溫和清潔、避免摩擦曝曬，依指示使用護膚品"}],"answer":"D","rationale":"照射皮膚需溫和照護，護膚品依放療團隊指示。"},{"stem":"胸部放射治療後吞嚥痛可能源於何者？","options":[{"letter":"A","text":"食道黏膜炎"},{"letter":"B","text":"闌尾炎"},{"letter":"C","text":"青光眼"},{"letter":"D","text":"膽囊炎"}],"answer":"A","rationale":"胸部照射可能刺激食道黏膜，影響吞嚥。"},{"stem":"化療白血球低下期間，最重要感染預防為何？","options":[{"letter":"A","text":"發燒等下次門診"},{"letter":"B","text":"探訪感冒親友"},{"letter":"C","text":"勤洗手並避免接觸感染者，發燒即聯絡團隊"},{"letter":"D","text":"共用餐具"}],"answer":"C","rationale":"免疫低下時感染可能迅速惡化，手部衛生與及時通報重要。"},{"stem":"血小板低下患者的安全措施何者適當？","options":[{"letter":"A","text":"硬毛牙刷用力刷"},{"letter":"B","text":"忽略黑便"},{"letter":"C","text":"觀察出血並避免不必要肌肉注射與創傷"},{"letter":"D","text":"碰撞性運動"}],"answer":"C","rationale":"血小板低下增加出血風險，需避免創傷並回報出血。"},{"stem":"使用含鉑化療藥物，依藥物風險應追蹤何者？","options":[{"letter":"A","text":"只追蹤視力顏色"},{"letter":"B","text":"腎功能、電解質及聽力"},{"letter":"C","text":"不需尿量"},{"letter":"D","text":"身高"}],"answer":"B","rationale":"部分含鉑藥物可能造成腎毒性、電解質異常或耳毒性。"},{"stem":"化療輸注處灼痛腫脹，疑似外滲，首先處理為何？","options":[{"letter":"A","text":"沖液入組織"},{"letter":"B","text":"停止輸注、保留管路並依外滲流程處置"},{"letter":"C","text":"拔除且不記錄"},{"letter":"D","text":"加快輸注"}],"answer":"B","rationale":"停止輸注並保留通路供依藥物流程處理，避免沖入組織。"},{"stem":"標靶藥患者新發嚴重腹瀉，衛教何者適當？","options":[{"letter":"A","text":"記錄排便與水分並儘速聯絡團隊，勿自行改藥"},{"letter":"B","text":"等數週"},{"letter":"C","text":"一律自行用止瀉藥"},{"letter":"D","text":"加倍服藥"}],"answer":"A","rationale":"腹瀉可造成脫水，需評估並依團隊指示處理。"},{"stem":"免疫檢查點抑制劑治療後新發乾咳及喘，應警覺何者？","options":[{"letter":"A","text":"牙齦炎"},{"letter":"B","text":"耳垢栓塞"},{"letter":"C","text":"免疫相關肺炎"},{"letter":"D","text":"近視"}],"answer":"C","rationale":"免疫治療可能引發肺炎，新發呼吸症狀需迅速評估。"},{"stem":"免疫治療後腹瀉、腹痛且血便，適當處置為何？","options":[{"letter":"A","text":"使用瀉藥"},{"letter":"B","text":"儘速通知團隊評估免疫相關腸炎"},{ r":"C","rationale":"追蹤涵蓋疾病監測、晚期效應及身心社會需求。"},{"stem":"治療後新發持續骨痛，護理師應建議何者？","options":[{"letter":"A","text":"忽略至不能忍"},{"letter":"B","text":"只熱敷不回報"},{"letter":"C","text":"加抗癌藥"},{"letter":"D","text":"儘速告知團隊評估，不自行判定復發"}],"answer":"D","rationale":"新症狀須評估，但不能僅憑症狀判定復發。"},{"stem":"植入式輸液港病人接受MRI前應如何處理？","options":[{"letter":"A","text":"確認裝置MRI條件並遵循安全流程"},{"letter":"B","text":"自行拆除"},{"letter":"C","text":"假設皆可掃描"},{"letter":"D","text":"隱瞞裝置"}],"answer":"A","rationale":"植入裝置相容性不同，須核對資訊及依流程確認。"},{"stem":"使用芳香環酶抑制劑應評估何者？","options":[{"letter":"A","text":"低血糖"},{"letter":"B","text":"關節症狀與骨質健康"},{"letter":"C","text":"牙齒生長"},{"letter":"D","text":"聽力增強"}],"answer":"B","rationale":"可能造成關節症狀及骨質流失風險。"},{"stem":"血小板低下病人抽血後應如何處置穿刺處？","options":[{"letter":"A","text":"按摩"},{"letter":"B","text":"持續加壓至止血並確認"},{"letter":"C","text":"熱敷取代"},{"letter":"D","text":"輕擦即放"}],"answer":"B","rationale":"低血小板可能延長出血，需充分加壓並確認止血。"},{"stem":"免疫低下病人皮膚破損，護理師應注意何者？","options":[{"letter":"A","text":"評估感染並依無菌原則照護"},{"letter":"B","text":"不量體溫"},{"letter":"C","text":"徒手觸摸傷口"},{"letter":"D","text":"共用毛巾"}],"answer":"A","rationale":"皮膚屏障受損及免疫低下增加感染風險。"},{"stem":"化療造成金屬味，何種建議適當？","options":[{"letter":"A","text":"強迫不適食物"},{"letter":"B","text":"嘗試不同餐具及食物，選擇可接受餐點"},{"letter":"C","text":"停止口腔清潔"},{"letter":"D","text":"只喝糖飲"}],"answer":"B","rationale":"個別調整可改善進食耐受，仍須維持清潔及營養。"},{"stem":"神經病變病人穿鞋前何項建議安全？","options":[{"letter":"A","text":"檢查鞋內異物並穿合腳鞋襪"},{"letter":"B","text":"尖物測感覺"},{"letter":"C","text":"穿緊鞋"},{"letter":"D","text":"赤腳試地面"}],"answer":"A","rationale":"感覺減退時不易發現異物或壓傷，應先檢查鞋內。"}]}];
const $=id=>document.getElementById(id);const topicSel=$('topic');
const ALL='全部主題';topicSel.innerHTML=`<option value="${ALL}">${ALL}</option>`+BANK.map((t,i)=>`<option value="${i}">${t.title}</option>`).join('');
let list=[],pos=0,answers={},wrongIds=new Set(JSON.parse(localStorage.getItem('nurseWrong')||'[]')),marked=new Set(JSON.parse(localStorage.getItem('nurseMarked')||'[]')),runWrong=[];
const ident=q=>q.ti+'-'+q.qi;
function baseList(){let ids=[];let sel=topicSel.value;BANK.forEach((t,ti)=>{if(sel!==ALL&&Number(sel)!==ti)return;t.questions.forEach((q,qi)=>ids.push({ti,qi,...q}))});return ids}
function start(){let a=baseList();if($('range').value==='wrong')a=a.filter(q=>wrongIds.has(ident(q)));if($('range').value==='marked')a=a.filter(q=>marked.has(ident(q)));if($('shuffle').checked)a.sort(()=>Math.random()-.5);list=a;pos=0;answers={};runWrong=[];$('complete').style.display='none';$('quiz').classList.remove('hide');render()}
function render(){if(!list.length){$('quiz').classList.add('hide');$('complete').style.display='block';$('finalscore').textContent='0 題';$('summary').textContent=$('range').value==='wrong'?'目前沒有錯題，太好了！':$('range').value==='marked'?'尚未收藏題目。':'沒有符合條件的題目。';$('retryWrong').classList.add('hide');return}if(pos>=list.length){finish();return}let q=list[pos],key=ident(q),chosen=answers[key],exam=$('mode').value==='exam';$('qmeta').textContent=`${BANK[q.ti].title}　｜　第 ${q.qi+1} 題`;$('stem').textContent=q.stem;$('counter').textContent=`第 ${pos+1} / ${list.length} 題`;$('progress').style.width=(100*pos/list.length)+'%';$('prev').disabled=pos===0;$('next').textContent=pos===list.length-1?'完成本回合':'下一題';$('mark').textContent=marked.has(key)?'★ 已收藏':'☆ 收藏';let box=$('options');box.innerHTML='';q.options.forEach(o=>{let b=document.createElement('button');b.className='opt';b.innerHTML=`<span class="letter">${o.letter}</span><span></span>`;b.lastChild.textContent=o.text;if(chosen!==undefined){b.disabled=true;if(!exam&&o.letter===q.answer)b.classList.add('correct');if(!exam&&o.letter===chosen&&chosen!==q.answer)b.classList.add('wrong')}else if(exam&&answers[key]!==undefined)b.disabled=true;b.onclick=()=>select(o.letter);box.appendChild(b)});let f=$('feedback');f.className='feedback';if(chosen!==undefined&&!exam){f.classList.add('show',chosen===q.answer?'ok':'no');f.innerHTML=`<b>${chosen===q.answer?'答對了！':'答案是 '+q.answer+'。'}</b>${q.rationale}`}else if(exam&&chosen!==undefined){f.classList.add('show');f.innerHTML='<b>已記錄答案</b>測驗模式將於本回合結束後顯示答案與解析。'}else if(chosen!==undefined&&exam){f.classList.add('show');f.innerHTML=`<b>本題答案：${q.answer}</b>${q.rationale}`}updateStats()}
function select(letter){let q=list[pos],key=ident(q);if(answers[key]!==undefined)return;answers[key]=letter;if(letter!==q.answer){wrongIds.add(key);runWrong.push(key)}else wrongIds.delete(key);save();if($('mode').value==='exam'){updateStats();render()}else render()}
function updateStats(){let answered=Object.keys(answers).length,correct=Object.entries(answers).filter(([k,v])=>{let q=list.find(x=>ident(x)===k);return q&&v===q.answer}).length;$('score').textContent=`答對 ${correct} / 已答 ${answered}`}
function finish(){let correct=Object.entries(answers).filter(([k,v])=>{let q=list.find(x=>ident(x)===k);return q&&v===q.answer}).length;$('quiz').classList.add('hide');$('complete').style.display='block';$('finalscore').textContent=`${correct} / ${list.length}`;$('summary').textContent=`答對 ${correct} 題，答錯 ${list.length-correct} 題。進度已保存在這台裝置。`;$('retryWrong').classList.toggle('hide',runWrong.length===0);$('progress').style.width='100%'}
function save(){localStorage.setItem('nurseWrong',JSON.stringify([...wrongIds]));localStorage.setItem('nurseMarked',JSON.stringify([...marked]))}
$('prev').onclick=()=>{pos=Math.max(0,pos-1);render()};$('next').onclick=()=>{if(pos===list.length-1){finish();return}pos++;render()};$('mark').onclick=()=>{let key=ident(list[pos]);marked.has(key)?marked.delete(key):marked.add(key);save();render()};$('topic').onchange=start;$('range').onchange=start;$('mode').onchange=start;$('shuffle').onchange=start;$('jump').onkeydown=e=>{if(e.key==='Enter'){let n=Number(e.target.value);if(n>=1&&n<=100){let ix=list.findIndex(q=>q.qi===n-1);if(ix>=0){pos=ix;render()}else alert('目前的題目範圍中找不到此題號。')}}};$('restart').onclick=start;$('retryWrong').onclick=()=>{$('range').value='wrong';start()};start();
</script></body></html>
