患者同時有鼻炎症狀，護理師評估時應注意何者？"},{"answer":"A","options":[{"letter":"A","text":"記錄症狀時序並評估可能共病與其他因素"},{"letter":"B","text":"因有逆流便自行停用氣喘控制藥"},{"letter":"C","text":"直接認定夜咳完全由胃食道逆流造成"},{"letter":"D","text":"只給止咳藥而不評估氣喘控制"}],"rationale":"逆流可能與症狀相關，但需依時序及其他臨床資訊評估，不能逕自歸因或停藥。","stem":"患者有夜咳並自述胃食道逆流，護理師較適當的評估方式為何？"},{"answer":"C","options":[{"letter":"A","text":"感染期間停止所有控制藥物"},{"letter":"B","text":"自行服用家中剩餘抗生素控制氣喘"},{"letter":"C","text":"依計畫監測並維持處方，惡化時及時求助"},{"letter":"D","text":"即使呼吸困難加重也不需就醫"}],"rationale":"感染可能誘發氣喘惡化，應依計畫監測及維持處方，勿自行使用剩餘抗生素或停控制藥。","stem":"患者呼吸道感染後喘咳惡化，護理師應提供何種衛教？"},{"answer":"C","options":[{"letter":"A","text":"只有出現喘鳴時氣喘才會傳染"},{"letter":"B","text":"咳嗽時氣喘一定會傳染給旁人"},{"letter":"C","text":"氣喘本身不是人際間傳染的疾病"},{"letter":"D","text":"共用吸入器才是氣喘傳染的主要途徑"}],"rationale":"氣喘本身不是傳染病；若合併感染則感染的傳播需另行注意。","stem":"患者擔心氣喘會傳染給同住家人，護理師應如何說明？"},{"answer":"A","options":[{"letter":"A","text":"依一般建議並評估個人禁忌與當時狀況"},{"letter":"B","text":"疫苗可完全取代氣喘控制藥物"},{"letter":"C","text":"氣喘患者一律禁止接種各類疫苗"},{"letter":"D","text":"只有發生氣喘急性發作時才安排接種"}],"rationale":"氣喘通常不是所有疫苗的普遍禁忌，應依一般建議並考量個人禁忌與臨床狀況。","stem":"氣喘患者詢問適齡疫苗是否都應避免，護理師如何回應較恰當？"},{"answer":"D","options":[{"letter":"A","text":"依已確立的食物過敏採取避開措施"},{"letter":"B","text":"教導辨認可能的嚴重過敏反應"},{"letter":"C","text":"詢問進食與症狀發生的時間關聯"},{"letter":"D","text":"沒有依據便要求全面禁食常見食物"}],"rationale":"飲食限制應有明確過敏或醫療依據，不應無差別要求所有患者全面禁食。","stem":"患者沒有證實任何食物會誘發症狀，護理師應避免哪種衛教？"},{"answer":"B","options":[{"letter":"A","text":"只使用吸入藥即可處理全身性過敏反應"},{"letter":"B","text":"依過敏性休克流程立即處置，支氣管擴張劑不能取代腎上腺素"},{"letter":"C","text":"先觀察數小時，待呼吸惡化再處理"},{"letter":"D","text":"只給口服止咳藥並等待皮膚症狀消退"}],"rationale":"全身性過敏反應合併循環不穩須依過敏性休克流程緊急處置，吸入支氣管擴張劑不能取代腎上腺素。","stem":"氣喘患者接觸過敏原後出現全身蕁麻疹、喘與循環不穩，護理師的急救概念為何？"},{"answer":"A","options":[{"letter":"A","text":"攜帶個人緩解藥並確認藥量及裝置可用"},{"letter":"B","text":"與同行者共用其緩解藥即可"},{"letter":"C","text":"只帶控制藥，緩解藥留在家中即可"},{"letter":"D","text":"所有藥物留家中以免裝置受損"}],"rationale":"外出時應確保個人處方緩解藥可取得、藥量足夠且裝置可正確使用。","stem":"氣喘患者準備外出旅行，護理師建議如何準備用藥？"},{"answer":"B","options":[{"letter":"A","text":"過期藥物仍必然與新品有相同效果"},{"letter":"B","text":"檢查效期並依處方及時補充可用藥物"},{"letter":"C","text":"拆開藥罐自行補入其他藥物"},{"letter":"D","text":"因一支過期便停止所有氣喘藥物"}],"rationale":"應檢查藥物效期並確保緩解藥可用，避免依賴過期藥物或自行拆改裝置。","stem":"患者發現家中緩解吸入器已過期，平日應如何處理？"},{"answer":"A","options":[{"letter":"A","text":"依個別藥物與裝置說明確認操作方式"},{"letter":"B","text":"每種裝置都須以鼻吸方式操作"},{"letter":"C","text":"所有吸入裝置一律不可搖晃"},{"letter":"D","text":"所有裝置都應在使用後浸入清水"}],"rationale":"不同藥物與裝置的操作要求不一，是否搖勻應依產品說明確認。","stem":"患者詢問吸入器使用前是否都要搖勻，護理師應如何指導？"},{"answer":"B","options":[{"letter":"A","text":"連續多次噴藥，不必等待吸入"},{"letter":"B","text":"吸入後短暫閉氣，再緩慢呼氣"},{"letter":"C","text":"憋氣至感到不適才可以呼氣"},{"letter":"D","text":"吸完後立刻快速吐氣以排出藥物"}],"rationale":"吸入後短暫閉氣有助藥物沉積，應在可耐受範圍內進行而非憋至不適。","stem":"患者使用噴霧器吸藥後立刻吐氣，護理師應如何修正？"},{"answer":"C","options":[{"letter":"A","text":"是否可以不修正現有操作方式"},{"letter":"B","text":"是否需要立即加倍每次噴藥次數"},{"letter":"C","text":"吸嘴位置、操作姿勢及按壓吸氣協調"},{"letter":"D","text":"是否應閉住鼻子以改善吸入效果"}],"rationale":"藥物常沉積在口腔可能表示技巧需修正，應先檢查吸嘴位置、姿勢與協調。","stem":"患者表示吸入藥常噴到舌頭，護理師應先評估何者？"},{"answer":"B","options":[{"letter":"A","text":"只根據容器顏色猜測藥物用途"},{"letter":"B","text":"保留原標示並清楚辨識各藥用途"},{"letter":"C","text":"將不同藥物混合在同一容器內"},{"letter":"D","text":"與家人藥物混放以便集中管理"}],"rationale":"保留原標示並清楚區分藥物用途可降低控制藥與緩解藥混淆及誤用。","stem":"患者把控制藥與緩解藥放在無標示容器中，護理師應建議何者？"},{"answer":"A","options":[{"letter":"A","text":"再評估呼吸作功、血氧與說話能力等客觀表現"},{"letter":"B","text":"停止評估並只採信患者感覺"},{"letter":"C","text":"否定患者主訴而不再溝通"},{"letter":"D","text":"立即安排出院而不做客觀評估"}],"rationale":"治療反應須綜合主觀症狀與客觀呼吸狀態判斷，不能只依感覺或單一徵象。","stem":"患者表示主觀上喘已好轉，但觀察仍呼吸急促，護理師應如何判斷？"},{"answer":"C","options":[{"letter":"A","text":"患者自行駕車，同行者攜帶藥物即可"},{"letter":"B","text":"在家等待一天，觀察呼吸是否改善"},{"letter":"C","text":"呼叫緊急救援，避免患者自行駕車"},{"letter":"D","text":"只要帶著吸入器便可自行開車前往"}],"rationale":"嚴重呼吸困難可能迅速惡化，應呼叫緊急救援並避免患者自行駕車。","stem":"氣喘患者出現嚴重呼吸窘迫，需要前往急診時，護理師應建議何種交通方式？"},{"answer":"D","options":[{"letter":"A","text":"症狀改善可保證未來不會再發作"},{"letter":"B","text":"可將剩餘藥物提供給有相似症狀者"},{"letter":"C","text":"改善後自行減半即可避免副作用"},{"letter":"D","text":"依處方持續使用並定期評估控制情形"}],"rationale":"症狀改善不代表疾病消失，應依處方使用並定期評估，調整需由醫療人員討論。","stem":"患者開始新控制藥後症狀改善，護理師應如何提醒？"},{"answer":"D","options":[{"letter":"A","text":"可連續吸入直到口中出現藥味"},{"letter":"B","text":"所有吸入藥都必須有明顯味道才有效"},{"letter":"C","text":"拆開裝置舔藥粉確認是否有藥物"},{"letter":"D","text":"檢查操作技巧與計量，不以藥味判斷是否吸入"}],"rationale":"部分藥物味道不明顯，應依操作技巧及裝置計量確認，不可因無味而重複吸入。","stem":"患者說吸入藥沒有味道，懷疑藥物沒有進入肺部，護理師應如何回應？"},{"answer":"B","options":[{"letter":"A","text":"沒有喘鳴就必定安全，不需處理"},{"letter":"B","text":"呼吸急速加重、說話困難、發紺、意識改變或治療無效"},{"letter":"C","text":"單純體溫升高但呼吸狀態穩定"},{"letter":"D","text":"只有輕微咳嗽一聲且活動如常"}],"rationale":"呼吸急遽惡化、說話困難、發紺、意識改變或治療無效均為重度警訊；喘鳴消失不一定代表改善。","stem":"氣喘患者出現何種狀況時，護理師應提醒立即尋求緊急醫療？"},{"answer":"B","options":[{"letter":"A","text":"只提供網路資料，不需討論實際處置"},{"letter":"B","text":"共同制定並演練個人化行動計畫"},{"letter":"C","text":"建議永久停止活動以避免所有誘因"},{"letter":"D","text":"保證患者接受治療後不會再發作"}],"rationale":"共同制定並演練行動計畫可增加患者辨認惡化與及時應變能力，不應保證完全不再發作。","stem":"患者因擔心發作而不敢外出，護理師最有益的衛教方式為何？"},{"answer":"C","options":[{"letter":"A","text":"只詢問患者是否聽懂所有說明"},{"letter":"B","text":"發給書面資料後不再確認理解"},{"letter":"C","text":"請患者回述重點並實際示範操作"},{"letter":"D","text":"請患者背出藥名即可結束教學"}],"rationale":"回覆示教同時確認知識理解與實際操作技巧，比單純詢問是否聽懂更可靠。","stem":"護理師完成吸入器衛教後，哪種方式最能確認患者已理解？"},{"answer":"C","options":[{"letter":"A","text":"由患者自行猜測每種裝置的使用順序"},{"letter":"B","text":"假設所有吸入器的操作步驟完全相同"},{"letter":"C","text":"逐一核對各裝置用途並觀察操作技巧"},{"letter":"D","text":"依外觀相似程度互換兩種裝置"}],"rationale":"裝置用途與操作技巧可能不同，需逐一核對並觀察患者實際操作。","stem":"患者同時使用兩種不同吸入裝置，護理師如何降低操作混淆？"},{"answer":"C","options":[{"letter":"A","text":"使用血糖機確認吸入劑量是否足夠"},{"letter":"B","text":"使用鼻胃管將藥物送入下呼吸道"},{"letter":"C","text":"依年齡及配合度選擇儲霧罐與必要面罩"},{"letter":"D","text":"由成人代替兒童吸入即可，不需輔具"}],"rationale":"適齡儲霧罐及必要時的面罩可協助兒童有效吸入，應依配合度評估。","stem":"兒童使用定量噴霧器時，護理師應評估何種輔具是否合適？"},{"answer":"B","options":[{"letter":"A","text":"不需觀察功能變化，只記錄體溫"},{"letter":"B","text":"觀察夜間覺醒、活動、餵食及呼吸費力"},{"letter":"C","text":"只觀察家族史，不需檢視呼吸型態"},{"letter":"D","text":"只詢問幼兒能否說出胸悶感受"}],"rationale":"幼兒常無法完整描述症狀，應以可觀察的呼吸型態、夜醒及活動與餵食狀況評估。","stem":"幼兒無法清楚描述胸悶或喘，護理師應觀察哪些表現？"},{"answer":"C","options":[{"letter":"A","text":"表示吸入治療已充分發揮作用"},{"letter":"B","text":"只是例行衛教需求，無須臨床評估"},{"letter":"C","text":"表示呼吸作功增加，須評估呼吸窘迫"},{"letter":"D","text":"通常是正常睡眠時常見的表現"}],"rationale":"肋間凹陷與鼻翼搧動提示呼吸作功增加，應評估呼吸窘迫及治療需求。","stem":"氣喘兒童出現肋間凹陷及鼻翼搧動，護理師應如何判斷？"},{"answer":"D","options":[{"letter":"A","text":"不需記錄生活功能，僅依胸片判斷"},{"letter":"B","text":"只確認家族史，不需詢問症狀影響"},{"letter":"C","text":"詢問患者最喜歡的休閒活動即可"},{"letter":"D","text":"評估功能受限、缺席情形及可能暴露關聯"}],"rationale":"上學或工作受影響是控制評估的重要面向，需釐清功能受損及相關暴露。","stem":"患者氣喘症狀已影響上學或工作，護理師應優先評估何者？"},{"answer":"C","options":[{"letter":"A","text":"保證藥物完全沒有任何副作用"},{"letter":"B","text":"責備患者不配合治療"},{"letter":"C","text":"傾聽疑慮並平衡說明利弊，共同討論方案"},{"letter":"D","text":"建議患者立即停用所有處方藥"}],"rationale":"非批判地傾聽並平衡說明利弊有助安全依從與共同決策，不應保證零風險或責備患者。","stem":"患者因擔心副作用而不規律使用控制藥，護理師應如何回應？"},{"answer":"A","options":[{"letter":"A","text":"頻繁需要緩解藥可能代表控制不佳"},{"letter":"B","text":"緩解藥使用越多，控制通常越穩定"},{"letter":"C","text":"只要備有緩解藥便可不設使用限制"},{"letter":"D","text":"緩解藥可完全取代控制藥物"}],"rationale":"緩解藥需求頻繁可能提示控制不佳，應重新評估症狀及治療計畫，而非鼓勵增加使用。","stem":"患者認為緩解藥使用越頻繁越能維持穩定，護理師應澄清何者？"},{"answer":"D","options":[{"letter":"A","text":"由家屬依患者當日感覺決定減量"},{"letter":"B","text":"不必評估即可自行完全停藥"},{"letter":"C","text":"症狀好轉便立即自行減少藥物"},{"letter":"D","text":"由醫療人員評估控制與風險後再調整"}],"rationale":"控制藥降階須依控制與風險評估，在醫療人員監督下進行，不宜自行減停。","stem":"患者病情穩定後希望減少控制藥，護理師應如何建議？"},{"answer":"A","options":[{"letter":"A","text":"可現場檢視裝置及患者實際操作技巧"},{"letter":"B","text":"可免除後續用藥與控制情形詢問"},{"letter":"C","text":"可直接取代所有肺功能與症狀評估"},{"letter":"D","text":"可與其他患者交換不同吸入藥物"}],"rationale":"攜帶實際裝置可讓護理師觀察操作並發現技巧或裝置問題，但不能取代完整評估。","stem":"患者回診時攜帶正在使用的吸入器，對護理評估有何幫助？"},{"answer":"B","options":[{"letter":"A","text":"不需評估便直接加倍所有吸入藥"},{"letter":"B","text":"診斷、依從性、技巧、暴露與共病等因素"},{"letter":"C","text":"以藥物外觀顏色決定是否換藥"},{"letter":"D","text":"只測體溫即可排除所有控制問題"}],"rationale":"持續有症狀時應先確認診斷、依從性、技巧、誘因暴露與共病等可修正因素，避免盲目升級。","stem":"患者控制藥使用正確仍有症狀，進一步升級治療前應先確認何者？"},{"answer":"B","options":[{"letter":"A","text":"搖晃裝置並猜測剩餘劑量"},{"letter":"B","text":"依產品指示更換並補充可用裝置"},{"letter":"C","text":"刺穿藥罐確認是否仍有藥液"},{"letter":"D","text":"拆開藥罐後倒入其他容器"}],"rationale":"應依計量器判讀並及時更換，避免猜測或自行拆改裝置造成劑量不確定。","stem":"患者吸入器計量窗已顯示藥物用盡，護理師應建議何者？"},{"answer":"C","options":[{"letter":"A","text":"停止觀察以尊重患者拒絕治療"},{"letter":"B","text":"等待患者昏迷後再重新評估意願"},{"letter":"C","text":"了解拒絕原因、說明風險並持續監測"},{"letter":"D","text":"不作解釋便強行給藥"}],"rationale":"應了解患者拒絕原因並清楚說明風險，同時持續監測急症狀況、依規範處理。","stem":"急性發作患者拒絕接受吸入治療，護理師首先應如何處理？"},{"answer":"D","options":[{"letter":"A","text":"咳嗽停止便表示氣道阻塞已改善"},{"letter":"B","text":"開始止咳藥後可自行停用原處方藥"},{"letter":"C","text":"非處方止咳藥通常適用於所有氣喘患者"},{"letter":"D","text":"不能取代控制發炎或急性支氣管擴張治療"}],"rationale":"止咳藥不處理氣道發炎或支氣管收縮，不能取代氣喘控制或急性緩解治療。","stem":"患者詢問非處方止咳藥能否取代氣喘藥，護理師應如何回答？"}]},{"title":"肋膜疾病與胸部外傷","questions":[{"stem":"胸腔積液患者平躺時呼吸更喘，最可能的直接原因為何？","options":[{"letter":"A","text":"胸膜腔壓力下降使肺過度膨脹"},{"letter":"B","text":"肋膜液增加使氣道阻力消失"},{"letter":"C","text":"積液刺激肺泡分泌胰島素"},{"letter":"D","text":"積液使肺受壓而限制擴張"}],"answer":"D","rationale":"胸膜腔液體壓迫肺組織，減少可擴張肺容積；平躺可加重呼吸不適。"},{"stem":"胸腔積液患者接受胸腔穿刺前，護理師應優先確認哪項？","options":[{"letter":"A","text":"已完成凝血與抗凝藥物風險評估"},{"letter":"B","text":"已停止所有氧氣治療"},{"letter":"C","text":"已禁食至少12小時"},{"letter":"D","text":"已給予鎮靜藥使患者入睡"}],"answer":"A","rationale":"穿刺前須評估出血風險、用藥及相關檢驗；禁食並非一律要求，氧氣不可任意停用。"},{"stem":"胸腔穿刺時，患者突然劇烈咳嗽並訴胸痛，護理師應如何處理？","options":[{"letter":"A","text":"立即告知操作者並依指示暫停抽液"},{"letter":"B","text":"將患者改為平躺並繼續操作"},{"letter":"C","text":"鼓勵患者深呼吸以加快抽液"},{"letter":"D","text":"請患者用力咳出胸腔液"}],"answer":"A","rationale":"突發咳嗽或胸痛可能表示肺復張或胸膜刺激等狀況，應立即告知操作者並評估，避免強行繼續。"},{"stem":"胸腔穿刺後患者出現呼吸急促、低血壓及單側呼吸音減弱，應優先懷疑何種併發症？","options":[{"letter":"A","text":"胃食道逆流"},{"letter":"B","text":"單純肌肉痠痛"},{"letter":"C","text":"鼻竇炎"},{"letter":"D","text":"氣胸"}],"answer":"D","rationale":"穿刺可能造成氣胸；呼吸窘迫、低血壓及患側呼吸音下降須立即評估並通報。"},{"stem":"胸腔積液送檢時，最能協助判別滲出液與漏出液的檢體為何？","options":[{"letter":"A","text":"單獨測量胸水顏色"},{"letter":"B","text":"痰液與尿液"},{"letter":"C","text":"胸水與糞便潛血"},{"letter":"D","text":"胸水及同時抽取的血清蛋白與LDH"}],"answer":"D","rationale":"依胸水與血清蛋白、LDH等比較可使用Light標準分類；單看顏色不足以判斷。"},{"stem":"患者因心衰竭造成漏出性胸腔積液，護理照護的治療方向為何？","options":[{"letter":"A","text":"限制所有蛋白質攝取"},{"letter":"B","text":"安排胸膜剝脫術作為常規首選"},{"letter":"C","text":"處理心衰竭及液體負荷"},{"letter":"D","text":"立即長期使用抗結核藥"}],"answer":"C","rationale":"漏出液常源自全身性壓力或膠體滲透壓改變，治療重點是處理病因，如心衰竭與液體負荷。"},{"stem":"惡性胸腔積液反覆造成呼吸困難，患者接受胸膜固定術，護理師應說明其目的為何？","options":[{"letter":"A","text":"清除所有肺泡分泌物"},{"letter":"B","text":"增加胸膜腔空間以容納更多液體"},{"letter":"C","text":"治療肺動脈栓塞"},{"letter":"D","text":"使胸膜兩層貼合以減少液體再累積"}],"answer":"D","rationale":"胸膜固定術促使臟層與壁層胸膜黏合，減少胸膜腔再積液。"},{"stem":"胸膜炎患者吸氣時胸痛明顯，較適當的舒適護理為何？","options":[{"letter":"A","text":"避免評估疼痛以免患者焦慮"},{"letter":"B","text":"依處方給予止痛並協助採舒適姿勢"},{"letter":"C","text":"按摩患側胸膜以消除摩擦音"},{"letter":"D","text":"要求長時間閉氣"}],"answer":"B","rationale":"止痛及適當姿勢可減輕胸膜性疼痛，促進有效呼吸；閉氣可能造成通氣不足。"},{"stem":"胸膜炎患者聽診有胸膜摩擦音，其成因為何？","options":[{"letter":"A","text":"心瓣膜狹窄造成血流湍流"},{"letter":"B","text":"胃內容物逆流至咽喉"},{"letter":"C","text":"支氣管內有大量液體流動"},{"letter":"D","text":"發炎的胸膜表面於呼吸時互相摩擦"}],"answer":"D","rationale":"胸膜表面發炎粗糙，呼吸時臟層與壁層胸膜摩擦可產生摩擦音。"},{"stem":"患者發燒、胸痛且胸水呈膿性，最適當的照護重點為何？","options":[{"letter":"A","text":"依醫囑取得培養並配合抗感染及引流治療"},{"letter":"B","text":"以止咳藥取代抗感染治療"},{"letter":"C","text":"停止所有引流以避免蛋白流失"},{"letter":"D","text":"鼓勵自行拔除胸管"}],"answer":"A","rationale":"膿胸通常需培養、抗感染治療及適當引流；單純止咳或自行拔管可能延誤或惡化病情。"},{"stem":"膿胸患者胸管引流液突然停止，且管路可見折曲，護理師首先應如何處理？","options":[{"letter":"A","text":"立刻擠壓胸管全長"},{"letter":"B","text":"檢查並解除外部管路折曲"},{"letter":"C","text":"夾閉胸管觀察一整班"},{"letter":"D","text":"自行以無菌液體沖洗胸膜腔"}],"answer":"B","rationale":"先檢查可見的管路阻塞或折曲並確保系統通暢；不可任意擠壓、沖洗或長時間夾管。"},{"stem":"患者的胸腔積液檢查呈乳白色，可能提示何種情況？","options":[{"letter":"A","text":"血胸"},{"letter":"B","text":"單純氣胸"},{"letter":"C","text":"乳糜胸"},{"letter":"D","text":"肺栓塞"}],"answer":"C","rationale":"胸導管或淋巴管受損可使富含脂質的乳糜進入胸膜腔，胸水可能呈乳白色。"},{"stem":"乳糜胸患者接受低脂、中鏈脂肪酸飲食指導，其主要目的為何？","options":[{"letter":"A","text":"改善胸腔內氧氣分壓"},{"letter":"B","text":"增加胸膜液生成"},{"letter":"C","text":"減少經淋巴吸收的長鏈脂肪負荷"},{"letter":"D","text":"溶解胸膜纖維化"}],"answer":"C","rationale":"長鏈脂肪主要經淋巴吸收；依醫療團隊建議調整脂肪種類可減少乳糜流量。"},{"stem":"胸腔積液患者接受胸部X光檢查，護理師應如何準備？","options":[{"letter":"A","text":"不需確認妊娠可能性"},{"letter":"B","text":"要求患者先拔除胸管"},{"letter":"C","text":"安排檢查前常規禁水一日"},{"letter":"D","text":"依指示協助移除胸前金屬物並配合姿勢"}],"answer":"D","rationale":"胸部X光需配合影像姿勢並避免金屬遮蔽；適用時應依規範評估妊娠可能性。"},{"stem":"胸腔積液患者接受超音波導引穿刺，其優點為何？","options":[{"letter":"A","text":"可定位積液並避開不適合穿刺處"},{"letter":"B","text":"可保證完全沒有氣胸風險"},{"letter":"C","text":"可直接確診所有癌症"},{"letter":"D","text":"可取代胸水化驗"}],"answer":"A","rationale":"超音波有助辨識液體位置與深度、提高操作安全，但不能取代檢驗或消除所有風險。"},{"stem":"患者胸水細胞學檢查陰性，但仍高度懷疑惡性胸膜病變，應如何理解結果？","options":[{"letter":"A","text":"代表胸水一定是漏出液"},{"letter":"B","text":"已證明沒有癌症"},{"letter":"C","text":"可停止所有後續評估"},{"letter":"D","text":"陰性結果不能完全排除惡性病變"}],"answer":"D","rationale":"細胞學檢查有其敏感度限制，陰性不能單獨排除惡性病變，仍須依臨床判斷進一步評估。"},{"stem":"胸膜腔積液造成患側呼吸音降低，主要機轉為何？","options":[{"letter":"A","text":"胸水使胸壁傳導聲音增強"},{"letter":"B","text":"液體限制肺膨脹並減弱通氣"},{"letter":"C","text":"液體使患側支氣管永久擴張"},{"letter":"D","text":"積液直接增加肺泡通氣"}],"answer":"B","rationale":"胸膜腔液體壓迫肺，降低肺膨脹及通氣，因此患側呼吸音可能減弱。"},{"stem":"患者接受胸腔穿刺後，護理師應優先追蹤何項狀況？","options":[{"letter":"A","text":"足背動脈搏動作為唯一評估"},{"letter":"B","text":"排便顏色"},{"letter":"C","text":"呼吸狀態、生命徵象及穿刺處"},{"letter":"D","text":"當日視力變化"}],"answer":"C","rationale":"需觀察呼吸窘迫、血氧、生命徵象及局部出血等，及早發現氣胸或其他併發症。"},{"stem":"患者胸水細菌培養結果尚未出爐，臨床疑似細菌性胸膜感染，抗生素照護原則為何？","options":[{"letter":"A","text":"自行以剩餘抗生素替代處方"},{"letter":"B","text":"等培養結果出來前一律不給藥"},{"letter":"C","text":"依醫囑及採檢時機儘速給藥並監測反應"},{"letter":"D","text":"症狀減輕即擅自停藥"}],"answer":"C","rationale":"依醫療團隊指示取得必要檢體後，及時給予處方抗生素並監測療效與不良反應；不可自行停換藥。"},{"stem":"胸膜固定術後患者應接受何項衛教？","options":[{"letter":"A","text":"永久避免所有深呼吸"},{"letter":"B","text":"胸痛代表療效失敗，不須告知醫療人員"},{"letter":"C","text":"依醫囑活動與止痛，並回報呼吸困難或發燒"},{"letter":"D","text":"胸管有任何輸出都自行拔除"}],"answer":"C","rationale":"術後疼痛可能影響呼吸，需配合止痛與呼吸照護；呼吸惡化、感染徵象應儘速回報。"},{"stem":"外傷後患者一側胸廓起伏減少、呼吸音消失且頸靜脈怒張，應優先考慮何者？","options":[{"letter":"A","text":"單純胸膜摩擦音"},{"letter":"B","text":"肺不張以外的消化道疾病"},{"letter":"C","text":"慢性支氣管炎"},{"letter":"D","text":"張力性氣胸"}],"answer":"D","rationale":"單側呼吸音消失合併循環受損或頸靜脈怒張，須高度懷疑張力性氣胸並立即處置。"},{"stem":"疑似張力性氣胸患者血壓快速下降，護理師最優先的行動為何？","options":[{"letter":"A","text":"安排例行門診追蹤"},{"letter":"B","text":"等待胸部X光確診後再通報"},{"letter":"C","text":"先餵水觀察是否改善"},{"letter":"D","text":"啟動緊急處置並立即通知醫療團隊"}],"answer":"D","rationale":"張力性氣胸可迅速造成阻塞性休克，臨床不穩定時不可等待影像才求援或處置。"},{"stem":"胸部穿刺傷患者有開放性胸壁傷口並聽見吸氣時空氣聲，第一線護理處置為何？","options":[{"letter":"A","text":"將傷口完全敞開等待自行閉合"},{"letter":"B","text":"以手指探入傷口尋找異物"},{"letter":"C","text":"給予飲水並觀察"},{"letter":"D","text":"依急救流程覆蓋適當敷料並立即求援"}],"answer":"D","rationale":"開放性氣胸須迅速處置傷口並呼叫支援；敷料方式依急救規範與臨床流程執行，避免探入傷口。"},{"stem":"開放性氣胸傷口已覆蓋具排氣功能的敷料，患者突然呼吸惡化，護理師應如何做？","options":[{"letter":"A","text":"立即重新評估敷料與呼吸，通知團隊並依流程處置"},{"letter":"B","text":"等待下一次生命徵象測量"},{"letter":"C","text":"加壓密封敷料後離開患者"},{"letter":"D","text":"自行拔除任何胸管"}],"answer":"A","rationale":"病況惡化可能表示氣體排出受阻或氣胸進展，須立即評估並依急救流程處理。"},{"stem":"胸部鈍傷患者肋骨骨折，最重要的常規護理措施為何？","options":[{"letter":"A","text":"避免任何止痛以保留評估能力"},{"letter":"B","text":"緊緊環繞胸部以限制所有胸廓活動"},{"letter":"C","text":"長期臥床避免肺部擴張"},{"letter":"D","text":"充分止痛並鼓勵深呼吸及有效咳嗽"}],"answer":"D","rationale":"止痛有助通氣及咳嗽，降低肺不張與分泌物滯留；胸部緊束會限制呼吸。"},{"stem":"多根相鄰肋骨多處骨折造成胸壁反常運動，屬於何種傷害？","options":[{"letter":"A","text":"單純肋軟骨炎"},{"letter":"B","text":"連枷胸"},{"letter":"C","text":"胸膜固定術"},{"letter":"D","text":"肺栓塞"}],"answer":"B","rationale":"多根連續肋骨多處骨折形成游離胸壁區，吸氣時可反常內陷，稱連枷胸。"},{"stem":"連枷胸患者出現呼吸窘迫，護理師優先處理的原則為何？","options":[{"letter":"A","text":"先以胸帶緊束胸廓"},{"letter":"B","text":"確保呼吸道與氧合並立即求援"},{"letter":"C","text":"以口服止痛藥取代呼吸評估"},{"letter":"D","text":"讓患者仰臥並停止監測"}],"answer":"B","rationale":"連枷胸可能伴肺挫傷及低氧，須優先維持呼吸道、氧合並密切監測。"},{"stem":"胸部外傷後數小時患者低氧加劇、肺部浸潤增加，應考慮何種傷害？","options":[{"letter":"A","text":"慢性鼻炎"},{"letter":"B","text":"單純皮膚擦傷"},{"letter":"C","text":"肺挫傷"},{"letter":"D","text":"腎結石"}],"answer":"C","rationale":"肺挫傷可在受傷後逐漸出現水腫、出血與低氧，需持續觀察而非僅看初始影像。"},{"stem":"肺挫傷患者的輸液照護應注意何事？","options":[{"letter":"A","text":"只監測尿色即可"},{"letter":"B","text":"完全禁用任何液體"},{"letter":"C","text":"依循環狀態謹慎給液並監測肺部與氧合"},{"letter":"D","text":"大量快速補液而不需評估"}],"answer":"C","rationale":"過量液體可能加重肺水腫與氣體交換障礙；仍須依循環灌流及醫囑平衡補液。"},{"stem":"胸部外傷後胸膜腔大量積血，常稱為何種情形？","options":[{"letter":"A","text":"膿胸"},{"letter":"B","text":"血胸"},{"letter":"C","text":"氣胸"},{"letter":"D","text":"乳糜胸"}],"answer":"B","rationale":"血液進入胸膜腔稱血胸，可造成肺受壓及失血性休克。"},{"stem":"血胸患者胸管引流大量鮮紅血液且血壓下降，護理師應如何處理？","options":[{"letter":"A","text":"以暖敷代替生命徵象監測"},{"letter":"B","text":"立即通報並依失血與胸腔引流緊急流程處置"},{"letter":"C","text":"夾閉胸管以免繼續失血"},{"letter":"D","text":"先讓患者步行促進循環"}],"answer":"B","rationale":"大量出血與低血壓提示持續出血或休克，須立即求援；不可任意夾管或延誤評估。"},{"stem":"胸部外傷患者疑似大血胸，哪項表現最支持失血性休克？","options":[{"letter":"A","text":"單純打噴嚏"},{"letter":"B","text":"心搏加快、血壓下降、皮膚濕冷"},{"letter":"C","text":"脈搏緩慢且皮膚溫暖"},{"letter":"D","text":"食慾增加"}],"answer":"B","rationale":"心搏過速、低血壓及周邊灌流不良是失血性休克警訊。"},{"stem":"胸腔引流系統中的水封室持續冒泡，可能代表何者？","options":[{"letter":"A","text":"系統或患者仍有空氣漏出"},{"letter":"B","text":"胸管已必然阻塞"},{"letter":"C","text":"水封液應立即倒空"},{"letter":"D","text":"患者已完全康復"}],"answer":"A","rationale":"持續冒泡可能反映漏氣，需檢查患者與系統連接並依機構流程判別，不能直接認定阻塞。"},{"stem":"胸腔引流水封室僅在咳嗽或呼吸時間歇冒泡，常見解釋為何？","options":[{"letter":"A","text":"胸膜腔空氣正在排出或漏氣逐漸減少"},{"letter":"B","text":"水封室功能失效"},{"letter":"C","text":"胸管內必定有血栓"},{"letter":"D","text":"必然發生張力性氣胸"}],"answer":"A","rationale":"間歇冒泡可見於排出胸膜腔殘餘空氣，需結合病況觀察；並非一概代表嚴重故障。"},{"stem":"胸管水封室液面隨呼吸上下波動，稱為何種現象？","options":[{"letter":"A","text":"潮汐現象"},{"letter":"B","text":"支氣管痙攣"},{"letter":"C","text":"脈搏短絀"},{"letter":"D","text":"胸膜摩擦音"}],"answer":"A","rationale":"水封液面隨呼吸變化稱潮汐，通常反映胸膜腔壓力傳導；消失需配合臨床及管路評估。"},{"stem":"胸管連接處意外脫開，護理師首要作為為何？","options":[{"letter":"A","text":"將患者胸管剪短"},{"letter":"B","text":"將胸管永久夾住"},{"letter":"C","text":"依緊急流程維持水封並立即重新連接或求援"},{"letter":"D","text":"讓胸管末端暴露於空氣"}],"answer":"C","rationale":"系統脫開會破壞密閉引流，應迅速依機構流程恢復水封與連接並評估患者，不宜任意剪管或長夾。"},{"stem":"患者胸管意外脫出胸壁，應如何處理？","options":[{"letter":"A","text":"立即以無菌敷料覆蓋並求援，監測呼吸"},{"letter":"B","text":"忽略傷口，只記錄引流量"},{"letter":"C","text":"以棉花塞入傷口深處"},{"letter":"D","text":"將脫出的管子自行插回"}],"answer":"A","rationale":"胸管脫出需立即覆蓋傷口並通知醫療團隊，觀察呼吸窘迫；不可自行重新插入。"},{"stem":"患者胸管系統需短暫移位，護理師應採取何原則？","options":[{"letter":"A","text":"任意長時間夾閉胸管"},{"letter":"B","text":"保持引流裝置低於胸部並避免不必要夾管"},{"letter":"C","text":"將引流瓶放在床面以上"},{"letter":"D","text":"拔除水封裝置再移動"}],"answer":"B","rationale":"裝置低於胸部有助避免液體逆流；胸管不應例行或任意長時間夾閉，以免張力性氣胸。"},{"stem":"胸管引流液突然不再波動，但患者呼吸平穩，第一步應為何？","options":[{"letter":"A","text":"將引流瓶抬高至胸部上方"},{"letter":"B","text":"立即拔除胸管"},{"letter":"C","text":"檢查管路是否折曲、受壓或阻塞"},{"letter":"D","text":"立刻以止血鉗夾緊"}],"answer":"C","rationale":"先查核外部管路及患者狀況；波動消失可能有多種原因，不能僅憑此拔管或夾管。"},{"stem":"胸腔引流瓶被打翻但仍連接胸管，護理師應優先如何處理？","options":[{"letter":"A","text":"以手擠壓患者胸壁"},{"letter":"B","text":"直立裝置並確認水封與系統完整，評估患者"},{"letter":"C","text":"立即將胸管拔除"},{"letter":"D","text":"停止所有監測"}],"answer":"B","rationale":"應恢復裝置正確直立與水封功能，檢查連接並評估患者；依機構流程處理系統污染或損壞。"},{"stem":"護理師交班胸管引流量時，最恰當的作法為何？","options":[{"letter":"A","text":"不記錄血性變化"},{"letter":"B","text":"只寫有或沒有引流"},{"letter":"C","text":"每次交班將收集瓶歸零"},{"letter":"D","text":"依刻度記錄時間、量與性狀並比較趨勢"}],"answer":"D","rationale":"量、顏色與趨勢有助發現出血或病情變化；不可任意倒空或忽略異常性狀。"},{"stem":"患者胸管引流液由淡紅轉為鮮紅且量增加，護理師應如何做？","options":[{"letter":"A","text":"只加強飲水"},{"letter":"B","text":"夾住胸管阻止引流"},{"letter":"C","text":"立即評估生命徵象並通知醫療團隊"},{"letter":"D","text":"等到例行查房再報告"}],"answer":"C","rationale":"鮮紅血液增加可能表示活動性出血，需及時評估循環及通報。"},{"stem":"胸管拔除後，護理師應優先觀察哪些情形？","options":[{"letter":"A","text":"僅評估雙手握力"},{"letter":"B","text":"呼吸困難、血氧變化及穿刺處滲漏"},{"letter":"C","text":"停止所有胸部評估"},{"letter":"D","text":"僅觀察食慾"}],"answer":"B","rationale":"拔管後需觀察氣胸復發、出血或傷口漏氣等，並依醫囑安排後續影像或監測。"},{"stem":"胸管拔除時患者應如何配合呼吸？","options":[{"letter":"A","text":"自行快速深呼吸不停"},{"letter":"B","text":"依操作者指示在適當呼吸時相配合"},{"letter":"C","text":"不需聽從指示"},{"letter":"D","text":"用力咳嗽直到拔管完成"}],"answer":"B","rationale":"依醫療團隊指示配合呼吸或屏氣，可降低空氣進入胸膜腔的風險；具體時機依操作流程。"},{"stem":"胸部外傷患者呼吸急促，護理師初評最重要的第一步為何？","options":[{"letter":"A","text":"依急救評估先確保呼吸道通暢並評估呼吸"},{"letter":"B","text":"先安排衛教"},{"letter":"C","text":"先測量身高體重"},{"letter":"D","text":"先取得完整病史再處置"}],"answer":"A","rationale":"創傷處置遵循優先維持呼吸道與呼吸的原則，不可因完整病史而延誤急救。"},{"stem":"胸部外傷患者使用氧氣後，仍需持續評估何項指標？","options":[{"letter":"A","text":"僅問是否口渴"},{"letter":"B","text":"只測體溫"},{"letter":"C","text":"僅看氧氣流量"},{"letter":"D","text":"呼吸功、意識、血氧與呼吸音"}],"answer":"D","rationale":"氧氣治療不能取代對通氣及灌流的評估，需綜合呼吸功、意識、血氧及肺部發現。"},{"stem":"胸部外傷患者疼痛導致淺快呼吸，疼痛控制的臨床目的為何？","options":[{"letter":"A","text":"使患者完全不需監測"},{"letter":"B","text":"避免患者活動一週"},{"letter":"C","text":"促進深呼吸與有效咳嗽，降低肺部併發症"},{"letter":"D","text":"取代氧氣治療"}],"answer":"C","rationale":"適當鎮痛可改善胸廓活動與肺部擴張，減少分泌物滯留及肺不張。"},{"stem":"給予鴉片類止痛藥後，護理師最應監測何種藥物安全問題？","options":[{"letter":"A","text":"毛髮生長速度"},{"letter":"B","text":"瞳孔散大是唯一指標"},{"letter":"C","text":"聽力立即變化"},{"letter":"D","text":"鎮靜程度與呼吸抑制"}],"answer":"D","rationale":"鴉片類藥物可能造成嗜睡及呼吸抑制，應依風險監測呼吸、意識與鎮痛效果。"},{"stem":"胸部外傷患者同時使用抗凝血藥，護理師應特別注意何事？","options":[{"letter":"A","text":"任意停用所有藥物而不告知"},{"letter":"B","text":"忽略皮下瘀青"},{"letter":"C","text":"自行追加抗凝血藥"},{"letter":"D","text":"出血徵象及凝血狀況並通報相關用藥資訊"}],"answer":"D","rationale":"抗凝血可能增加胸腔或其他部位出血風險；需評估與通報，藥物調整由處方團隊決定。"},{"stem":"患者外傷後胸壁瘀青，呼吸狀況暫穩，護理師的適當作法為何？","options":[{"letter":"A","text":"持續觀察呼吸與疼痛變化，警覺延遲性併發症"},{"letter":"B","text":"因生命徵象正常便不再評估"},{"letter":"C","text":"按摩瘀青處以消除血腫"},{"letter":"D","text":"讓患者獨自離院"}],"answer":"A","rationale":"胸部傷害可能出現延遲性肺挫傷或氣胸，需依病況持續觀察。"},{"stem":"胸部外傷患者有皮下氣腫，觸診呈捻髮感，最可能代表什麼？","options":[{"letter":"A","text":"單純水腫"},{"letter":"B","text":"空氣進入皮下組織"},{"letter":"C","text":"骨髓炎"},{"letter":"D","text":"皮下膿瘍已確診"}],"answer":"B","rationale":"皮下氣腫是空氣進入皮下組織的觸診表現，胸部外傷時須評估是否有氣胸或氣道損傷。"},{"stem":"胸部外傷後縱膈偏移合併低血壓，提示何種危急狀況？","options":[{"letter":"A","text":"張力性氣胸造成縱膈受壓"},{"letter":"B","text":"穩定胸膜炎"},{"letter":"C","text":"單純肋骨挫傷"},{"letter":"D","text":"胃潰瘍"}],"answer":"A","rationale":"胸膜腔壓力升高可推移縱膈、妨礙靜脈回流並導致休克，須緊急處理。"},{"stem":"疑似氣胸患者因呼吸困難安排胸部影像，若病況快速不穩，應如何處理？","options":[{"letter":"A","text":"先停止監測"},{"letter":"B","text":"先啟動緊急評估與處置，不因等待影像延誤"},{"letter":"C","text":"安排患者步行至放射科"},{"letter":"D","text":"必須等影像報告才能採取任何行動"}],"answer":"B","rationale":"不穩定患者依臨床急救優先處理；影像不能延誤危及生命狀況的處置。"},{"stem":"胸部外傷患者的脈搏血氧飽和度突然下降，護理師第一步應為何？","options":[{"letter":"A","text":"立即確認患者狀況與訊號品質並評估呼吸"},{"letter":"B","text":"等待一小時再測"},{"letter":"C","text":"只重新貼上數值而不看患者"},{"letter":"D","text":"先拔除所有監測設備"}],"answer":"A","rationale":"應同時確認患者與設備訊號，迅速評估呼吸、循環並採取必要升級處置。"},{"stem":"患者胸部外傷後出現咳血，護理師應優先評估什麼？","options":[{"letter":"A","text":"視力敏銳度"},{"letter":"B","text":"當日食物偏好"},{"letter":"C","text":"氣道通暢、出血量與氧合狀態"},{"letter":"D","text":"排尿次數"}],"answer":"C","rationale":"咳血可能代表肺或氣道損傷，需優先確保氣道、評估呼吸與出血。"},{"stem":"胸部外傷合併疑似頸椎損傷時，移動患者應如何進行？","options":[{"letter":"A","text":"先坐起再評估"},{"letter":"B","text":"單獨拉扯手臂翻身"},{"letter":"C","text":"不需固定頭頸"},{"letter":"D","text":"維持脊椎對線並依團隊方式搬運"}],"answer":"D","rationale":"合併脊椎傷害可能時，需依創傷流程維持對線並協同搬運，避免加重神經損傷。"},{"stem":"患者肋骨骨折接受止痛藥後，護理師應評估哪項療效？","options":[{"letter":"A","text":"是否出現嗜睡才算有效"},{"letter":"B","text":"患者是否完全無須呼吸"},{"letter":"C","text":"疼痛減輕且能較有效深呼吸、咳嗽"},{"letter":"D","text":"胸廓是否不再活動"}],"answer":"C","rationale":"止痛療效應兼顧疼痛控制與功能性呼吸，並同時注意藥物不良反應。"},{"stem":"肋骨骨折患者出院後何種症狀應儘速就醫？","options":[{"letter":"A","text":"瘀青顏色逐漸變淡"},{"letter":"B","text":"輕微局部壓痛逐日減輕"},{"letter":"C","text":"短暫想睡但容易喚醒且符合用藥指示"},{"letter":"D","text":"呼吸困難加重或發紺"}],"answer":"D","rationale":"呼吸惡化或發紺可能表示氣胸、肺部併發症或低氧，需緊急評估。"},{"stem":"胸部外傷患者使用抗生素後出現呼吸困難、全身蕁麻疹，應優先考慮何者？","options":[{"letter":"A","text":"單純胸膜積液"},{"letter":"B","text":"嚴重過敏反應"},{"letter":"C","text":"藥物已發揮正常作用"},{"letter":"D","text":"預期胸壁疼痛"}],"answer":"B","rationale":"呼吸困難合併蕁麻疹可能為嚴重過敏反應，須立即停止可疑藥物並依急救流程處置、通報。"},{"stem":"胸腔積液患者接受利尿劑治療心衰竭，護理師應監測何項安全指標？","options":[{"letter":"A","text":"只觀察胸痛"},{"letter":"B","text":"僅測瞳孔"},{"letter":"C","text":"血壓、尿量與電解質變化"},{"letter":"D","text":"完全不需記錄體重"}],"answer":"C","rationale":"利尿劑可能造成低血容量、低血壓及電解質異常，需監測灌流、尿量及相關檢驗。"},{"stem":"患者服用利尿劑後感到站起時暈眩，護理師首先應如何做？","options":[{"letter":"A","text":"忽略症狀並停止所有觀察"},{"letter":"B","text":"協助坐臥、預防跌倒並評估血壓"},{"letter":"C","text":"再追加一劑利尿劑"},{"letter":"D","text":"鼓勵立即快走"}],"answer":"B","rationale":"可能有姿勢性低血壓或容量不足，先防跌倒並評估，再依醫囑處理。"},{"stem":"胸膜疾病患者接受胸水檢體採集，標本標示最重要的原則為何？","options":[{"letter":"A","text":"先送出後再確認身分"},{"letter":"B","text":"床旁核對身分並正確標記檢體種類與時間"},{"letter":"C","text":"只標病房不標患者"},{"letter":"D","text":"與其他患者檢體合併"}],"answer":"B","rationale":"正確身分、檢體種類及採集時間可避免檢驗錯誤；須遵循機構檢體流程。"},{"stem":"胸腔穿刺前，患者表示不理解操作目的，護理師最適當的回應為何？","options":[{"letter":"A","text":"確認疑問並請執行者再次說明，確保知情同意流程完成"},{"letter":"B","text":"告訴患者不需了解即可直接進行"},{"letter":"C","text":"代替患者簽署同意書"},{"letter":"D","text":"以保證無風險安撫患者"}],"answer":"A","rationale":"應尊重患者自主並協助取得充分說明；不可代簽或保證無風險。"},{"stem":"胸腔穿刺採坐姿前傾時，護理師應如何協助？","options":[{"letter":"A","text":"要求患者突然扭轉身體"},{"letter":"B","text":"支撐患者手臂並維持穩定舒適姿勢"},{"letter":"C","text":"讓患者自行站立不扶持"},{"letter":"D","text":"使患者平躺以方便咳嗽"}],"answer":"B","rationale":"穩定姿勢可利於操作並降低跌倒或突然移動風險，需全程觀察耐受度。"},{"stem":"胸腔穿刺後穿刺處敷料迅速被血液浸濕，護理師應如何處理？","options":[{"letter":"A","text":"撕除敷料後不再覆蓋"},{"letter":"B","text":"只記錄敷料顏色"},{"letter":"C","text":"評估患者與出血情況並立即通知醫療團隊"},{"letter":"D","text":"鼓勵用力咳嗽止血"}],"answer":"C","rationale":"持續滲血需評估出血及循環並及時通報；不能忽視或延誤處理。"},{"stem":"胸膜腔壓力正常低於大氣壓，其生理意義為何？","options":[{"letter":"A","text":"使血液停止回流心臟"},{"letter":"B","text":"阻止胸廓呼吸運動"},{"letter":"C","text":"有助肺維持擴張並貼附胸壁"},{"letter":"D","text":"使肺泡永久塌陷"}],"answer":"C","rationale":"胸膜腔負壓有助肺隨胸廓擴張；空氣進入胸膜腔可破壞此關係而造成肺塌陷。"},{"stem":"氣胸的基本病理生理為何？","options":[{"letter":"A","text":"血液進入胃腔造成潰瘍"},{"letter":"B","text":"胸膜腔內壓降低使肺擴張過度"},{"letter":"C","text":"液體進入心包造成心肌肥厚"},{"letter":"D","text":"空氣進入胸膜腔，使肺部分或全部塌陷"}],"answer":"D","rationale":"胸膜腔空氣破壞正常胸膜壓力關係，使肺回縮塌陷程度不一。"},{"stem":"自發性氣胸患者突然胸痛與呼吸困難，護理師評估時首先關注何者？","options":[{"letter":"A","text":"每日視力"},{"letter":"B","text":"呼吸窘迫程度、血氧及患側呼吸音"},{"letter":"C","text":"皮膚色素變化"},{"letter":"D","text":"近期飲食纖維量"}],"answer":"B","rationale":"需迅速判斷氣胸對通氣與氧合的影響，並辨認是否進展為張力性氣胸。"},{"stem":"小型且穩定的自發性氣胸患者，醫療團隊採觀察策略，護理師應如何照護？","options":[{"letter":"A","text":"密切監測症狀與氧合，依計畫追蹤影像"},{"letter":"B","text":"鼓勵劇烈運動測試耐受"},{"letter":"C","text":"忽略呼吸突然惡化"},{"letter":"D","text":"讓患者自行離院且不需衛教"}],"answer":"A","rationale":"部分穩定患者可依醫療判斷觀察，但需追蹤症狀與影像並提供惡化警訊衛教。"},{"stem":"氣胸患者接受胸管治療後，何種變化最需要立即通報？","options":[{"letter":"A","text":"引流裝置保持直立"},{"letter":"B","text":"突發呼吸困難及血氧下降"},{"letter":"C","text":"局部輕微牽拉感但呼吸穩定"},{"letter":"D","text":"依計畫活動後略疲倦"}],"answer":"B","rationale":"突發呼吸惡化可能表示氣胸擴大、管路問題或其他併發症，須即時評估。"},{"stem":"胸管固定處皮膚出現紅腫、熱痛及膿性分泌物，護理師應如何處理？","options":[{"letter":"A","text":"以粉末覆蓋後忽略"},{"letter":"B","text":"評估感染徵象、依流程處理並通知醫療團隊"},{"letter":"C","text":"停止所有無菌照護"},{"letter":"D","text":"自行剪除固定縫線"}],"answer":"B","rationale":"局部感染徵象需評估並通報，依無菌技術與醫囑處理，避免自行移除固定。"},{"stem":"照護胸管敷料時，最重要的感染預防原則為何？","options":[{"letter":"A","text":"採無菌技術並依機構規範更換"},{"letter":"B","text":"讓敷料長期潮濕"},{"letter":"C","text":"以未清潔手直接觸碰傷口"},{"letter":"D","text":"每小時無必要地拆開檢查"}],"answer":"A","rationale":"胸管出口與胸膜腔相通，應以手部衛生、無菌技術及適當敷料照護降低感染風險。"},{"stem":"胸管患者移動時，引流瓶應放置於何處？","options":[{"letter":"A","text":"置於床上與胸部同高"},{"letter":"B","text":"暫時倒置"},{"letter":"C","text":"低於患者胸部且保持直立"},{"letter":"D","text":"高於患者頭部"}],"answer":"C","rationale":"引流裝置低於胸部且直立可維持重力引流並降低液體逆流風險。"},{"stem":"患者因胸管疼痛不敢咳嗽，護理師應如何協助？","options":[{"letter":"A","text":"只給止咳藥而不評估"},{"letter":"B","text":"評估止痛需求並教導支托胸部後有效咳嗽"},{"letter":"C","text":"拔掉胸管再咳"},{"letter":"D","text":"要求完全停止咳嗽"}],"answer":"B","rationale":"適當止痛及胸部支托可協助有效咳嗽、清除分泌物；不宜一概抑制咳嗽。"},{"stem":"胸部外傷患者出現呼吸音不對稱，哪一項護理評估最適當？","options":[{"letter":"A","text":"只詢問是否口渴"},{"letter":"B","text":"只聽一側肺尖"},{"letter":"C","text":"比較雙側呼吸音、胸廓起伏及呼吸功"},{"letter":"D","text":"不需重複評估"}],"answer":"C","rationale":"雙側比較可辨認氣胸、血胸或肺部損傷相關變化，需結合呼吸功與整體狀況。"},{"stem":"胸部外傷患者懷疑氣道受損，出現聲音沙啞與頸部皮下氣腫，護理師應如何處理？","options":[{"letter":"A","text":"給予固體食物測吞嚥"},{"letter":"B","text":"等待沙啞自行消失"},{"letter":"C","text":"安排例行肺功能檢查"},{"letter":"D","text":"優先確保氣道並立即啟動緊急評估"}],"answer":"D","rationale":"聲音改變與皮下氣腫可能提示氣道或胸腔損傷，應警覺氣道快速惡化並緊急求援。"},{"stem":"胸腔外傷患者疑似心包填塞，出現低血壓、頸靜脈怒張及心音低弱，應如何處置？","options":[{"letter":"A","text":"立即啟動急救並通知醫療團隊"},{"letter":"B","text":"等待胸管自行引流"},{"letter":"C","text":"給予一般止痛後返家"},{"letter":"D","text":"增加口服水分即可"}],"answer":"A","rationale":"此組徵象提示心包填塞，可能迅速危及生命，須緊急醫療處置。"},{"stem":"胸部外傷患者接受電腦斷層檢查前，護理師應優先確認何項？","options":[{"letter":"A","text":"檢查適應性、對比劑過敏史及腎功能等相關資訊"},{"letter":"B","text":"是否停止所有監測"},{"letter":"C","text":"是否已完成胸管拔除"},{"letter":"D","text":"患者鞋碼"}],"answer":"A","rationale":"若使用含碘對比劑，需依流程評估過敏史、腎功能及其他風險；不可為檢查擅自拔管。"},{"stem":"接受含碘對比劑後患者出現喘鳴及臉部腫脹，護理師應如何做？","options":[{"letter":"A","text":"立即啟動過敏反應急救流程"},{"letter":"B","text":"請患者回家休息"},{"letter":"C","text":"先安排下一次影像"},{"letter":"D","text":"只提供口服水"}],"answer":"A","rationale":"喘鳴及臉腫提示嚴重過敏反應，需立即處置與監測。"},{"stem":"胸膜疾病患者接受胸水抽吸後感到頭暈、冒冷汗，護理師應優先作為為何？","options":[{"letter":"A","text":"鼓勵站立行走"},{"letter":"B","text":"讓患者獨自去洗手間"},{"letter":"C","text":"停止或暫緩操作並評估生命徵象、通知操作者"},{"letter":"D","text":"忽略並繼續抽液"}],"answer":"C","rationale":"可能為迷走神經反應、低血壓或其他不耐受，應保障安全、評估並告知操作者。"},{"stem":"胸腔積液患者氣促，協助採何種姿勢通常可改善呼吸？","options":[{"letter":"A","text":"俯臥且壓迫胸部"},{"letter":"B","text":"完全平躺"},{"letter":"C","text":"坐起或採高坐臥位"},{"letter":"D","text":"頭低腳高"}],"answer":"C","rationale":"坐起可改善胸廓擴張與呼吸舒適度，仍須依患者耐受及禁忌調整。"},{"stem":"胸水患者血氧偏低且呼吸費力，護理師應如何使用氧氣？","options":[{"letter":"A","text":"僅在患者睡眠時給氧"},{"letter":"B","text":"任意調高至不需監測"},{"letter":"C","text":"依處方或緊急流程給氧並評估反應"},{"letter":"D","text":"因胸水存在而禁止氧氣"}],"answer":"C","rationale":"依臨床狀況與處方提供氧療並監測反應；不能因胸水而禁用，也不可忽略監測。"},{"stem":"胸膜疾病患者出院後出現發燒、胸痛加重及喘，應如何衛教？","options":[{"letter":"A","text":"等數週後回診"},{"letter":"B","text":"自行加倍止痛藥"},{"letter":"C","text":"儘速聯絡醫療人員或就醫評估"},{"letter":"D","text":"停止所有處方藥"}],"answer":"C","rationale":"發燒、疼痛或呼吸惡化可能提示感染或積液復發，須及早評估。"},{"stem":"胸膜炎患者因疼痛減少活動，護理師應如何促進復原？","options":[{"letter":"A","text":"依耐受逐步活動並配合止痛與呼吸訓練"},{"letter":"B","text":"限制深呼吸直到疼痛消失"},{"letter":"C","text":"避免所有姿勢變換"},{"letter":"D","text":"長期完全臥床"}],"answer":"A","rationale":"適度活動及呼吸訓練有助維持肺擴張與功能，應先控制疼痛並依狀況漸進。"},{"stem":"患者胸部外傷後接受阿斯匹靈止痛，護理師最需留意哪種風險？","options":[{"letter":"A","text":"出血增加及胃腸不適"},{"letter":"B","text":"必然造成氣胸"},{"letter":"C","text":"使肋骨自行癒合"},{"letter":"D","text":"立即引起乳糜胸"}],"answer":"A","rationale":"阿斯匹靈有抗血小板作用並可能造成胃腸刺激，外傷患者需依醫囑評估出血風險。"},{"stem":"患者同時使用多種止痛藥，護理師給藥前應確認何者？","options":[{"letter":"A","text":"所有藥物都可自行加量"},{"letter":"B","text":"只看藥片顏色"},{"letter":"C","text":"止痛藥不會交互作用"},{"letter":"D","text":"成分是否重複及總劑量是否符合處方"}],"answer":"D","rationale":"多種複方藥可能含相同成分，須核對處方、總量及禁忌，防止過量與不良反應。"},{"stem":"胸部外傷患者服用乙醯胺酚止痛，護理師衛教何者正確？","options":[{"letter":"A","text":"飲酒可避免肝臟副作用"},{"letter":"B","text":"可無限制增加劑量"},{"letter":"C","text":"只要疼痛就可縮短給藥間隔"},{"letter":"D","text":"遵照處方並留意其他複方藥是否也含此成分"}],"answer":"D","rationale":"應依醫囑使用並避免不同藥品成分重複，以降低肝毒性風險；不可自行超量。"},{"stem":"胸腔積液患者使用抗生素，出院衛教何者適當？","options":[{"letter":"A","text":"下次感染時自行使用剩藥"},{"letter":"B","text":"依處方完成療程並回報過敏或嚴重不良反應"},{"letter":"C","text":"症狀一改善就自行停藥"},{"letter":"D","text":"將藥物分享給家人"}],"answer":"B","rationale":"應依處方使用、不可分享或自行停換藥，出現嚴重過敏反應須立即求助。"},{"stem":"胸管引流患者下床活動前，護理師應先確認何者？","options":[{"letter":"A","text":"管路固定、裝置低於胸部且患者可安全活動"},{"letter":"B","text":"拔除引流瓶"},{"letter":"C","text":"不需評估姿勢性症狀"},{"letter":"D","text":"先夾住胸管一整天"}],"answer":"A","rationale":"活動前確認管路與裝置位置可減少牽扯及逆流風險，也應評估患者活動耐受。"},{"stem":"胸管患者翻身時，最重要的護理措施為何？","options":[{"letter":"A","text":"將管路壓在患者身下"},{"letter":"B","text":"避免胸管折曲、牽拉或受壓並維持引流裝置位置"},{"letter":"C","text":"將瓶子放在胸部上方"},{"letter":"D","text":"先拔除固定敷料"}],"answer":"B","rationale":"翻身時需保護胸管通暢與固定，防止脫落、折曲或引流液逆流。"},{"stem":"患者胸腔引流系統有可見漏氣，護理師應先檢查何處？","options":[{"letter":"A","text":"床頭桌抽屜"},{"letter":"B","text":"患者鞋襪"},{"letter":"C","text":"尿袋顏色"},{"letter":"D","text":"連接處與管路是否鬆脫或破損"}],"answer":"D","rationale":"先查核外部系統連接及管路，再依機構流程與醫療團隊判斷漏氣來源。"},{"stem":"對胸腔引流管進行擠管或剝管的原則為何？","options":[{"letter":"A","text":"非例行措施，僅依醫囑與機構規範執行"},{"letter":"B","text":"每小時都必須用力擠壓"},{"letter":"C","text":"所有患者都應自行操作"},{"letter":"D","text":"擠壓可取代檢查管路"}],"answer":"A","rationale":"例行擠壓可能造成胸膜腔壓力變化或傷害，不應自行常規執行。"},{"stem":"胸腔引流裝置水封液面低於規定標記，護理師應如何做？","options":[{"letter":"A","text":"倒入任意消毒液"},{"letter":"B","text":"拔除胸管後再處理"},{"letter":"C","text":"忽略水封高度"},{"letter":"D","text":"依裝置規格及機構流程補充並確認水封"}],"answer":"D","rationale":"水封須維持裝置要求的液位以形成單向屏障，依製造規格與機構流程處置。"},{"stem":"胸腔引流瓶需要更換時，護理師應遵循何項原則？","options":[{"letter":"A","text":"讓患者屏氣數分鐘即可"},{"letter":"B","text":"不需準備替代裝置"},{"letter":"C","text":"依機構流程無菌操作並避免胸膜腔暴露於空氣"},{"letter":"D","text":"任意切斷胸管並放置床上"}],"answer":"C","rationale":"更換系統須維持密閉與無菌，依流程迅速安全完成，避免空氣進入或污染。"},{"stem":"胸部外傷患者出現意識混亂，可能反映何種急迫問題？","options":[{"letter":"A","text":"低氧或循環灌流不足"},{"letter":"B","text":"肋骨癒合"},{"letter":"C","text":"必然是飢餓"},{"letter":"D","text":"單純視力疲勞"}],"answer":"A","rationale":"意識變化可能是低氧、休克或腦傷徵象，須立即評估氧合、循環及神經狀態。"},{"stem":"胸部外傷患者皮膚蒼白、濕冷，應優先評估何者？","options":[{"letter":"A","text":"耳垢量"},{"letter":"B","text":"睡眠姿勢"},{"letter":"C","text":"每日飲食偏好"},{"letter":"D","text":"循環灌流及出血性休克徵象"}],"answer":"D","rationale":"蒼白濕冷可能代表周邊灌流不良，應評估脈搏、血壓、意識及出血來源。"},{"stem":"胸腔積液患者需長期居家氧療，衛教何者正確？","options":[{"letter":"A","text":"在氧氣旁點燃香菸"},{"letter":"B","text":"以油脂塗抹氧氣接口"},{"letter":"C","text":"自行任意提高流量"},{"letter":"D","text":"依處方流量使用並遠離明火與吸菸"}],"answer":"D","rationale":"氧氣支持須依處方使用，並注意火災安全；嚴禁吸菸或靠近明火。"},{"stem":"使用居家氧氣的患者鼻腔乾燥，護理師應建議何者？","options":[{"letter":"A","text":"使用油性凡士林塞入鼻孔"},{"letter":"B","text":"以明火加熱氧氣"},{"letter":"C","text":"依設備與醫療建議使用適當加濕或水性潤滑"},{"letter":"D","text":"自行停氧"}],"answer":"C","rationale":"可依設備規格及醫囑考慮適當加濕或水性產品；油性物質及火源在氧氣環境有危險。"},{"stem":"胸膜疾病患者有吸菸史，出院衛教最適當的是何者？","options":[{"letter":"A","text":"吸菸可促進胸膜癒合"},{"letter":"B","text":"鼓勵戒菸並提供戒菸資源"},{"letter":"C","text":"戒菸與呼吸健康無關"},{"letter":"D","text":"只要改抽淡菸即可"}],"answer":"B","rationale":"戒菸有助降低呼吸道傷害與相關疾病風險，應提供可行支持資源。"},{"stem":"胸部外傷患者返家後仍有肋骨疼痛，哪項活動建議較恰當？","options":[{"letter":"A","text":"依疼痛及醫囑漸進活動，避免造成呼吸受限"},{"letter":"B","text":"長期完全不動"},{"letter":"C","text":"以緊束胸帶限制呼吸"},{"letter":"D","text":"疼痛時自行超量服藥"}],"answer":"A","rationale":"漸進活動可維持功能；應避免緊束胸廓及自行超量用藥，並依醫囑追蹤。"}]},{"title":"急性呼吸道窘迫症候群","questions":[{"stem":"ARDS的主要病理生理變化為何？","options":[{"letter":"A","text":"左心室收縮力增加造成肺靜脈壓下降"},{"letter":"B","text":"肺泡－微血管屏障受損，通透性增加而形成非心因性肺水腫"},{"letter":"C","text":"肺泡表面活性物質增加而提高順應性"},{"letter":"D","text":"支氣管平滑肌痙攣造成可逆性氣流阻塞"}],"answer":"B","rationale":"發炎損傷肺泡上皮及微血管內皮，富蛋白液體進入肺泡，造成低氧與肺順應性下降。"},{"stem":"敗血症病人急性低氧、雙側肺部陰影，且不能以心衰竭充分解釋，最應懷疑何者？","options":[{"letter":"A","text":"慢性阻塞性肺病"},{"letter":"B","text":"單純氣喘"},{"letter":"C","text":"急性呼吸道窘迫症候群"},{"letter":"D","text":"肺栓塞已確診"}],"answer":"C","rationale":"急性發作、雙側陰影及非心因性肺水腫，配合氧合障礙，符合ARDS評估方向。"},{"stem":"ARDS肺泡滲液增加，對氣體交換最可能造成何種影響？","options":[{"letter":"A","text":"肺泡死腔完全消失"},{"letter":"B","text":"二氧化碳必然立即嚴重潴留"},{"letter":"C","text":"動脈血氧分壓持續上升"},{"letter":"D","text":"肺內分流與通氣灌流不匹配增加"}],"answer":"D","rationale":"充液或塌陷肺泡仍有灌流但通氣不足，形成分流及V/Q不匹配，造成低氧血症。"},{"stem":"肺順應性下降對ARDS呼吸器照護的意義為何？","options":[{"letter":"A","text":"代表可停止監測呼吸器"},{"letter":"B","text":"肺僵硬，應避免過度牽張並監測氣道壓"},{"letter":"C","text":"可用最大潮氣量迅速改善"},{"letter":"D","text":"肺容易擴張，應提高潮氣量"}],"answer":"B","rationale":"順應性下降表示肺僵硬，過大潮氣量與壓力會加重肺損傷。"},{"stem":"下列何者是ARDS常見誘發因素？","options":[{"letter":"A","text":"白內障"},{"letter":"B","text":"季節性鼻炎"},{"letter":"C","text":"嚴重肺炎"},{"letter":"D","text":"遠視"}],"answer":"C","rationale":"肺炎、敗血症、吸入性傷害及重大創傷等是常見誘因。"},{"stem":"敗血症病人突然呼吸急促且氧合惡化，護理師首先應如何處理？","options":[{"letter":"A","text":"先提供大量口服飲水"},{"letter":"B","text":"立即評估ABC、確認氧氣與監測並通報"},{"letter":"C","text":"等下一班再評估"},{"letter":"D","text":"關閉血氧監測"}],"answer":"B","rationale":"急性低氧可能迅速危及生命，須立即評估呼吸道、呼吸、循環與設備並求援。"},{"stem":"動脈血氣PaO2偏低最直接表示何者？","options":[{"letter":"A","text":"血糖控制良好"},{"letter":"B","text":"動脈氧合不足"},{"letter":"C","text":"腎絲球過濾加快"},{"letter":"D","text":"血紅素必然增加"}],"answer":"B","rationale":"PaO2反映動脈血氧分壓；需連同吸入氧濃度及臨床狀態判讀。"},{"stem":"PaO2/FiO2比值主要用來評估什麼？","options":[{"letter":"A","text":"氧合障礙程度"},{"letter":"B","text":"腎臟排泄功能"},{"letter":"C","text":"血紅素濃度"},{"letter":"D","text":"肺順應性"}],"answer":"A","rationale":"此比值描述給定FiO2下的氧合狀態，須配合診斷條件判讀。"},{"stem":"ARDS胸部影像常見何種表現？","options":[{"letter":"A","text":"雙側肺部陰影"},{"letter":"B","text":"腸道氣體擴張"},{"letter":"C","text":"肺野必然完全清晰"},{"letter":"D","text":"只有心臟縮小"}],"answer":"A","rationale":"ARDS常有雙側肺部陰影，且須排除其他足以解釋的原因。"},{"stem":"診斷ARDS時評估心臟功能及容量狀態的目的為何？","options":[{"letter":"A","text":"排除所有肺部疾病"},{"letter":"B","text":"判斷肺水腫是否主要為心因性"},{"letter":"C","text":"決定停止氧療"},{"letter":"D","text":"證明ARDS必由心肌梗塞引起"}],"answer":"B","rationale":"ARDS為非心因性肺水腫，須與心衰竭或容量過負荷造成的肺水腫鑑別。"},{"stem":"ARDS採用低潮氣量通氣的主要目的為何？","options":[{"letter":"A","text":"減少肺泡過度牽張及呼吸器相關肺損傷"},{"letter":"B","text":"避免任何呼吸器警報"},{"letter":"C","text":"消除咳嗽反射"},{"letter":"D","text":"使所有肺泡過度擴張"}],"answer":"A","rationale":"肺保護性通氣採低潮氣量以降低呼吸器造成的肺損傷風險。"},{"stem":"依肺保護性通氣原則，潮氣量通常依何者計算？","options":[{"letter":"A","text":"預測體重"},{"letter":"B","text":"實際體重一律計算"},{"letter":"C","text":"身體質量指數"},{"letter":"D","text":"體脂肪重量"}],"answer":"A","rationale":"潮氣量依身高推算的預測體重設定，而非受水腫或肥胖影響的實際體重。"},{"stem":"ARDS通氣設定採低潮氣量時，護理師應特別注意何種安全目標？","options":[{"letter":"A","text":"追求最高氣道壓"},{"letter":"B","text":"將呼吸頻率固定為零"},{"letter":"C","text":"忽略呼吸器警報"},{"letter":"D","text":"監測平台壓並避免過高"}],"answer":"D","rationale":"監測平台壓有助降低肺泡過度牽張；設定依醫囑與病人狀況調整。"},{"stem":"ARDS病人使用PEEP的主要生理目的為何？","options":[{"letter":"A","text":"增加胃腸蠕動"},{"letter":"B","text":"降低所有肺泡容量"},{"letter":"C","text":"呼氣末維持部分肺泡開放，改善氧合"},{"letter":"D","text":"替代病因治療"}],"answer":"C","rationale":"PEEP可減少肺泡塌陷、改善肺泡募集與氧合，但需觀察血流動力學影響。"},{"stem":"提高PEEP後病人血壓下降，最適當的理解為何？","options":[{"letter":"A","text":"PEEP不可能影響循環"},{"letter":"B","text":"應自行大幅調高PEEP"},{"letter":"C","text":"代表氧合已完全恢復"},{"letter":"D","text":"胸腔壓升高可能降低靜脈回流"}],"answer":"D","rationale":"較高胸腔壓可能減少靜脈回流與心輸出量，應立即評估並通報，不可自行改設定。"},{"stem":"ARDS病人接受俯臥姿勢照護，主要預期效益為何？","options":[{"letter":"A","text":"避免所有壓傷"},{"letter":"B","text":"治癒感染病原"},{"letter":"C","text":"改善肺部通氣分布及氧合"},{"letter":"D","text":"取代呼吸器"}],"answer":"C","rationale":"俯臥可改善通氣灌流匹配及背側肺區募集；仍需持續處理病因與併發症。"},{"stem":"執行俯臥前最重要的護理準備為何？","options":[{"letter":"A","text":"讓氣管內管不固定"},{"letter":"B","text":"確認管路固定並安排足夠人力及翻身流程"},{"letter":"C","text":"停止評估皮膚"},{"letter":"D","text":"拔除所有監測線"}],"answer":"B","rationale":"翻身前規劃人力、管路與氣道固定，可降低意外拔管及管路脫落風險。"},{"stem":"俯臥期間護理師最應密切觀察何者？","options":[{"letter":"A","text":"氣管內管位置、氧合、皮膚與眼部受壓"},{"letter":"B","text":"僅測量身高"},{"letter":"C","text":"忽略循環監測"},{"letter":"D","text":"只記錄食慾"}],"answer":"A","rationale":"俯臥可能造成氣道移位、壓傷與眼部壓迫，須定期檢查並調整受壓點。"},{"stem":"ARDS病人FiO2持續偏高，氧療照護的原則何者正確？","options":[{"letter":"A","text":"FiO2與氧合無關"},{"letter":"B","text":"只要低氧就無限提高且不監測"},{"letter":"C","text":"依氧合目標調整並避免不必要的高氧暴露"},{"letter":"D","text":"立即停用氧氣"}],"answer":"C","rationale":"需維持適當氧合，並依醫囑逐步調整FiO2以避免不必要的氧毒性。"},{"stem":"ARDS病人插管後出現突發低血氧與高壓警報，護理師第一步宜如何？","options":[{"letter":"A","text":"先靜音警報離開"},{"letter":"B","text":"立即評估病人、氣道與呼吸器管路"},{"letter":"C","text":"移除血氧監測"},{"letter":"D","text":"直接提高鎮靜藥"}],"answer":"B","rationale":"先以病人為中心迅速檢查氧合、管路扭折或阻塞及胸廓起伏，必要時呼救。"},{"stem":"呼吸器低壓警報常提示何種可能？","options":[{"letter":"A","text":"血糖降低"},{"letter":"B","text":"痰液阻塞必然"},{"letter":"C","text":"肺順應性突然下降必然"},{"letter":"D","text":"管路脫接或漏氣"}],"answer":"D","rationale":"低壓警報常見原因為管路脫接或漏氣；應立即查看病人及呼吸器迴路。"},{"stem":"呼吸器高壓警報響起，可能原因為何？","options":[{"letter":"A","text":"氧氣來源充足"},{"letter":"B","text":"分泌物阻塞、管路扭折或咳嗽"},{"letter":"C","text":"管路脫接必然"},{"letter":"D","text":"血糖升高"}],"answer":"B","rationale":"阻力增加如痰液、扭折或病人咳嗽可造成高壓警報，須即時評估原因。"},{"stem":"ARDS插管病人聽到痰音且分泌物多，抽痰的適當原則為何？","options":[{"letter":"A","text":"有臨床需要時無菌抽吸並監測耐受"},{"letter":"B","text":"抽痰前不需評估氧合"},{"letter":"C","text":"固定每數分鐘深抽一次"},{"letter":"D","text":"抽痰期間忽略心律"}],"answer":"A","rationale":"抽痰應依分泌物及臨床指標執行，採適當無菌技術並觀察低氧、心律變化。"},{"stem":"抽痰造成病人血氧明顯下降時，應如何處理？","options":[{"letter":"A","text":"關閉呼吸器"},{"letter":"B","text":"立即拔除氣管內管"},{"letter":"C","text":"停止抽吸、恢復氧合並重新評估"},{"letter":"D","text":"持續抽至預定次數"}],"answer":"C","rationale":"低氧時應停止刺激、提供支持並評估；持續抽痰可能加劇缺氧。"},{"stem":"ARDS病人呼吸器潮氣量目標應依預測體重設定，預測體重主要與何者相關？","options":[{"letter":"A","text":"身高及生理性別公式"},{"letter":"B","text":"體重秤當下讀值"},{"letter":"C","text":"血糖值"},{"letter":"D","text":"每日輸液量"}],"answer":"A","rationale":"預測體重由身高及生理性別公式估算，較能反映肺大小。"},{"stem":"ARDS病人動脈血氣PaCO2輕度上升但pH可接受，醫療團隊採容許性高碳酸血症的考量為何？","options":[{"letter":"A","text":"維持肺保護性通氣以減少牽張傷害"},{"letter":"B","text":"故意造成嚴重酸中毒"},{"letter":"C","text":"用來治療感染"},{"letter":"D","text":"代表無需監測血氣"}],"answer":"A","rationale":"為避免過大潮氣量，可容許一定程度CO2上升；須監測酸鹼及禁忌狀況。"},{"stem":"使用容許性高碳酸血症策略時，何者應持續監測？","options":[{"letter":"A","text":"不需觀察意識"},{"letter":"B","text":"只測尿糖"},{"letter":"C","text":"動脈血氣與酸鹼狀態"},{"letter":"D","text":"僅體溫"}],"answer":"C","rationale":"CO2上升可能造成呼吸性酸中毒，須追蹤血氣與臨床耐受性。"},{"stem":"ARDS病人需要鎮靜以配合呼吸器時，護理師應如何執行？","options":[{"letter":"A","text":"自行增加藥物劑量"},{"letter":"B","text":"一律鎮靜至完全無反應"},{"letter":"C","text":"不監測呼吸及血壓"},{"letter":"D","text":"依醫囑採目標導向鎮靜並定期評估"}],"answer":"D","rationale":"鎮靜需依目標評估舒適、同步性及副作用，避免過度鎮靜與延遲脫機。"},{"stem":"鎮靜病人突然躁動且血氧下降，最適切的優先作法為何？","options":[{"letter":"A","text":"不評估即追加鎮靜"},{"letter":"B","text":"先評估低氧、疼痛、管路與呼吸器同步"},{"letter":"C","text":"立即認定為精神疾病"},{"letter":"D","text":"將警報關閉"}],"answer":"B","rationale":"躁動可能是低氧或不適的表現，須先找可逆生理原因，避免掩蓋惡化。"},{"stem":"ARDS病人使用神經肌肉阻斷藥時，護理師須確認何者？","options":[{"letter":"A","text":"病人必然失去疼痛感"},{"letter":"B","text":"不需確認呼吸器支持"},{"letter":"C","text":"可不再照護眼睛"},{"letter":"D","text":"充分鎮靜止痛且持續監測，因藥物不提供鎮靜或止痛"}],"answer":"D","rationale":"肌肉鬆弛劑不會使病人失去意識或止痛，必須提供適當鎮靜止痛並防護眼睛。"},{"stem":"神經肌肉阻斷期間，病人無法表達不適，護理師應如何溝通照護？","options":[{"letter":"A","text":"持續向病人說明並使用客觀監測及評估"},{"letter":"B","text":"停止所有溝通"},{"letter":"C","text":"只觀察肢體動作"},{"letter":"D","text":"假設病人沒有疼痛"}],"answer":"A","rationale":"病人可能仍有知覺，應維持尊嚴、說明處置並依客觀指標評估鎮靜止痛。"},{"stem":"ARDS病人使用鎮靜藥後血壓降低，護理師的適當行動為何？","options":[{"letter":"A","text":"評估灌流與藥物反應並立即通報"},{"letter":"B","text":"自行停掉所有生命支持"},{"letter":"C","text":"認為是預期效果而不處理"},{"letter":"D","text":"增加鎮靜劑"}],"answer":"A","rationale":"鎮靜藥可能造成低血壓，需評估循環與灌流並依醫囑處理。"},{"stem":"ARDS常需限制不必要的液體正平衡，其照護考量為何？","options":[{"letter":"A","text":"避免增加肺水腫，但仍須維持器官灌流"},{"letter":"B","text":"完全停止所有輸液"},{"letter":"C","text":"液體量與肺部無關"},{"letter":"D","text":"只看尿色決定所有治療"}],"answer":"A","rationale":"保守液體策略可減少肺水腫，但須兼顧血壓、腎灌流及整體循環。"},{"stem":"ARDS病人接受利尿劑後，護理師最應監測何者？","options":[{"letter":"A","text":"停止輸入輸出記錄"},{"letter":"B","text":"尿量、血壓、電解質及腎功能"},{"letter":"C","text":"僅瞳孔大小"},{"letter":"D","text":"只看皮膚顏色"}],"answer":"B","rationale":"利尿可能造成低血容量、低血壓與電解質異常，需追蹤尿量及檢驗值。"},{"stem":"ARDS病人突然少尿，適當的護理評估為何？","options":[{"letter":"A","text":"增加利尿劑不需醫囑"},{"letter":"B","text":"檢查導尿管通暢並評估灌流、液體狀態及腎功能"},{"letter":"C","text":"立即假設腎衰竭且不評估"},{"letter":"D","text":"忽略紀錄"}],"answer":"B","rationale":"少尿須先確認測量與導管，並評估循環灌流及腎功能，及時通報變化。"},{"stem":"ARDS病人因感染誘發疾病，治療上的根本原則為何？","options":[{"letter":"A","text":"只處理血氧而忽略感染"},{"letter":"B","text":"延後培養至出院"},{"letter":"C","text":"積極辨識並治療誘發病因"},{"letter":"D","text":"所有病人都使用相同抗生素"}],"answer":"C","rationale":"支持性呼吸治療之外，必須處理肺炎、敗血症等誘發因素；抗生素依病因及醫囑使用。"},{"stem":"懷疑感染引起ARDS且醫師安排血液培養，何者正確？","options":[{"letter":"A","text":"從污染表面採樣"},{"letter":"B","text":"自行取消培養"},{"letter":"C","text":"培養結果不可能影響治療"},{"letter":"D","text":"依流程採集適當培養，避免不必要延誤治療"}],"answer":"D","rationale":"培養有助辨識病原及調整治療，採檢須遵循技術並避免延誤必要處置。"},{"stem":"ARDS病人使用抗生素，護理師最重要的用藥安全作法為何？","options":[{"letter":"A","text":"核對過敏史、給藥時間並觀察反應"},{"letter":"B","text":"只核對藥袋顏色"},{"letter":"C","text":"忽略腎功能"},{"letter":"D","text":"病人發疹仍照常給藥不通報"}],"answer":"A","rationale":"須核對藥物、過敏史、給藥時程與可能不良反應，並留意腎功能調整需求。"},{"stem":"ARDS病人有嚴重肺炎，抗生素使用後出現蕁麻疹與喘鳴，護理師應如何處置？","options":[{"letter":"A","text":"只給口服水"},{"letter":"B","text":"記錄後等下次巡房"},{"letter":"C","text":"加快輸注"},{"letter":"D","text":"立即停止疑似致敏藥並啟動緊急評估通報"}],"answer":"D","rationale":"蕁麻疹合併喘鳴可能是嚴重過敏反應，應立即處理氣道與循環並通報。"},{"stem":"ARDS病人因長期臥床，預防靜脈血栓的適當措施為何？","options":[{"letter":"A","text":"依風險與醫囑採藥物或機械性預防"},{"letter":"B","text":"完全不活動且不評估"},{"letter":"C","text":"自行停用預防措施"},{"letter":"D","text":"按摩單側腫痛小腿"}],"answer":"A","rationale":"重症臥床增加血栓風險，可依禁忌及醫囑使用預防措施；不可按摩疑似血栓肢體。"},{"stem":"ARDS病人單側小腿突然腫痛，最適當作法為何？","options":[{"letter":"A","text":"加強按摩促進循環"},{"letter":"B","text":"只抬高後不記錄"},{"letter":"C","text":"自行增加抗凝藥"},{"letter":"D","text":"避免按摩並立即通報評估血栓"}],"answer":"D","rationale":"需懷疑深部靜脈栓塞，避免按摩以免栓子移動，並儘速評估。"},{"stem":"重症ARDS病人預防壓力性損傷，照護重點為何？","options":[{"letter":"A","text":"只在出院前看皮膚"},{"letter":"B","text":"俯臥時不需檢查受壓點"},{"letter":"C","text":"依耐受定期檢查皮膚、減壓與調整姿勢"},{"letter":"D","text":"潮濕皮膚不需處理"}],"answer":"C","rationale":"重症與俯臥均增加壓傷風險，需檢查受壓區、保持皮膚清潔乾燥並減壓。"},{"stem":"俯臥病人耳廓及臉部出現發紅，護理師應如何處理？","options":[{"letter":"A","text":"加壓固定避免移動"},{"letter":"B","text":"解除局部壓力、調整支托並持續檢查"},{"letter":"C","text":"忽略直到破皮"},{"letter":"D","text":"以熱敷取代減壓"}],"answer":"B","rationale":"早期發紅需立即卸壓及調整支托，預防進展為壓力性損傷。"},{"stem":"ARDS插管病人無法進食，營養照護的一般方向為何？","options":[{"letter":"A","text":"未評估即大量靜脈營養"},{"letter":"B","text":"營養與復原無關"},{"letter":"C","text":"長期完全禁食"},{"letter":"D","text":"病況允許時及早評估並採適當腸道營養"}],"answer":"D","rationale":"病況允許時腸道營養有助維持營養與腸道功能，需個別評估耐受性及風險。"},{"stem":"接受鼻胃管灌食的ARDS病人，降低吸入風險的措施為何？","options":[{"letter":"A","text":"灌食時不檢查管路"},{"letter":"B","text":"灌食後立即大量翻轉"},{"letter":"C","text":"依規範抬高床頭並評估灌食耐受"},{"letter":"D","text":"平躺灌食"}],"answer":"C","rationale":"適當抬高床頭並檢視管路、耐受與吸入徵象，可降低灌食相關吸入風險。"},{"stem":"ARDS病人發燒且痰液增加，護理師最適當的感染控制作法為何？","options":[{"letter":"A","text":"執行手部衛生及依感染途徑採取防護"},{"letter":"B","text":"不需遵守隔離措施"},{"letter":"C","text":"多人共用未清潔器材"},{"letter":"D","text":"只更換手套不洗手"}],"answer":"A","rationale":"手部衛生與依病原傳播途徑採取防護，是降低交叉感染的重要措施。"},{"stem":"氣管內管照護時，預防呼吸器相關肺炎的重要措施為何？","options":[{"letter":"A","text":"常規將病人平躺"},{"letter":"B","text":"維持適當床頭抬高及口腔照護"},{"letter":"C","text":"不清潔口腔"},{"letter":"D","text":"任意增加鎮靜"}],"answer":"B","rationale":"依院內指引進行床頭抬高、口腔照護及其他預防組合措施，降低吸入及感染風險。"},{"stem":"ARDS插管病人需要翻身，最重要的氣道安全措施為何？","options":[{"letter":"A","text":"翻身前後由人員確認管路固定及插入深度"},{"letter":"B","text":"翻身時拔除固定裝置"},{"letter":"C","text":"只靠病人自行抓住管路"},{"letter":"D","text":"不需檢查呼吸器迴路"}],"answer":"A","rationale":"翻身可能造成管路位移或拔管，需協調人力並確認氣管內管和迴路。"},{"stem":"ARDS病人清醒插管且無法說話，適當的溝通支持為何？","options":[{"letter":"A","text":"只提高聲量"},{"letter":"B","text":"避免告知任何處置"},{"letter":"C","text":"假設病人無法理解"},{"letter":"D","text":"提供手勢、書寫板或是非題溝通方式"}],"answer":"D","rationale":"插管不等於失去理解能力，替代溝通可降低焦慮並促進參與照護。"},{"stem":"病人因ARDS插管而焦慮，護理師最合宜的回應為何？","options":[{"letter":"A","text":"簡短說明設備與照護並提供可行的溝通方式"},{"letter":"B","text":"不作解釋直接加藥"},{"letter":"C","text":"告知呼吸器一定很快移除"},{"letter":"D","text":"斥責病人不配合"}],"answer":"A","rationale":"清楚說明與支持性溝通可減輕焦慮；避免無法保證的預後承諾。"},{"stem":"ARDS病人氧合持續惡化且呼吸器需求增加，護理師應如何處理？","options":[{"letter":"A","text":"立即重新評估並通報團隊，確認氧氣設備與病人狀態"},{"letter":"B","text":"單獨停止監測"},{"letter":"C","text":"等待例行查房"},{"letter":"D","text":"自行任意調整呼吸器"}],"answer":"A","rationale":"惡化需迅速評估氣道、呼吸器、循環及病因並通報，設定應依授權處理。"},{"stem":"血氧飽和度讀值突然下降，但病人外觀穩定且手指冰冷，第一步為何？","options":[{"letter":"A","text":"直接認定病人休克"},{"letter":"B","text":"完全依賴單次數值"},{"letter":"C","text":"確認探頭位置、訊號品質並與臨床狀態比對"},{"letter":"D","text":"關閉血氧儀"}],"answer":"C","rationale":"低灌流、移動或探頭不當可造成不可靠讀值；應檢查訊號並同時評估病人。"},{"stem":"ARDS病人有深色指甲油且血氧數值與臨床不符，護理師宜如何做？","options":[{"letter":"A","text":"將氧氣完全停掉"},{"letter":"B","text":"改善探頭測量條件並以其他評估或血氣確認"},{"letter":"C","text":"把讀值當成絕對真實"},{"letter":"D","text":"忽略臨床表現"}],"answer":"B","rationale":"周邊灌流、指甲油或動作可能影響脈搏血氧，必要時以血氣等方式確認。"},{"stem":"ARDS使用呼吸器病人的呼氣末二氧化碳監測，可提供何種資訊？","options":[{"letter":"A","text":"取代動脈血壓"},{"letter":"B","text":"直接測量血紅素"},{"letter":"C","text":"通氣變化及呼氣二氧化碳趨勢"},{"letter":"D","text":"確診所有感染"}],"answer":"C","rationale":"呼氣末二氧化碳可追蹤通氣與循環相關變化，但不能完全取代動脈血氣。"},{"stem":"ARDS病人的血氣PaCO2與呼氣末二氧化碳差距擴大，可能表示什麼？","options":[{"letter":"A","text":"血紅素突然上升"},{"letter":"B","text":"腎功能已恢復"},{"letter":"C","text":"死腔或通氣灌流不匹配增加"},{"letter":"D","text":"測量值必然無效"}],"answer":"C","rationale":"肺部死腔及V/Q不匹配可使PaCO2與呼氣末CO2差距增加，需結合臨床判讀。"},{"stem":"ARDS病人呼吸急促且使用輔助呼吸肌，這些發現代表什麼？","options":[{"letter":"A","text":"一定是疼痛而非呼吸問題"},{"letter":"B","text":"不需通報"},{"letter":"C","text":"病況已完全穩定"},{"letter":"D","text":"呼吸窘迫加重，需立即評估氧合與呼吸功"}],"answer":"D","rationale":"呼吸功增加是呼吸窘迫表現，應即時評估低氧、疲乏與支持需求。"},{"stem":"ARDS早期低氧時病人可能出現何種神經行為改變？","options":[{"letter":"A","text":"聽力必然增加"},{"letter":"B","text":"必然無任何症狀"},{"letter":"C","text":"視力必然永久改善"},{"letter":"D","text":"焦躁或意識改變"}],"answer":"D","rationale":"低氧可表現為焦躁、混亂或意識改變；新發變化需立即評估。"},{"stem":"ARDS病人出現發紺，護理師應如何理解？","options":[{"letter":"A","text":"表示二氧化碳一定偏低"},{"letter":"B","text":"只是皮膚色素改變不需評估"},{"letter":"C","text":"可能為嚴重低氧的晚期徵象，需緊急處理"},{"letter":"D","text":"代表氧合正常"}],"answer":"C","rationale":"發紺可能提示顯著低氧，應立即評估呼吸道與氧合並求援。"},{"stem":"ARDS病人喘鳴並突然高壓警報，除檢查管路外還應考量何者？","options":[{"letter":"A","text":"支氣管痙攣或分泌物阻塞"},{"letter":"B","text":"視網膜剝離"},{"letter":"C","text":"血糖偏低必然"},{"letter":"D","text":"腎結石"}],"answer":"A","rationale":"氣道阻力增加可由痙攣或分泌物造成，須臨床評估並依醫囑處置。"},{"stem":"ARDS病人突然單側呼吸音減弱、低血壓及低氧，應警覺何種急症？","options":[{"letter":"A","text":"低血糖"},{"letter":"B","text":"張力性氣胸"},{"letter":"C","text":"胃食道逆流"},{"letter":"D","text":"單純鼻炎"}],"answer":"B","rationale":"通氣急變合併低血壓及單側呼吸音減弱，須警覺氣胸並立即通報處置。"},{"stem":"ARDS病人接受中央靜脈導管照護時，如何降低導管相關感染？","options":[{"letter":"A","text":"共用未消毒接頭"},{"letter":"B","text":"觸摸接頭前不需手部衛生"},{"letter":"C","text":"依無菌技術及院內導管照護流程操作"},{"letter":"D","text":"敷料潮濕仍不更換"}],"answer":"C","rationale":"手部衛生、無菌操作及適當敷料照護可降低導管感染。"},{"stem":"ARDS病人使用升壓藥支持循環，護理師應優先監測何者？","options":[{"letter":"A","text":"只觀察瞳孔"},{"letter":"B","text":"不需確認藥物濃度或泵浦"},{"letter":"C","text":"血壓、末梢灌流及輸注管路"},{"letter":"D","text":"只測體溫"}],"answer":"C","rationale":"升壓藥可能影響血管灌流，需密切監測血壓、末梢狀態與輸注安全。"},{"stem":"ARDS病人使用升壓藥時，發現輸注管路外滲或接頭鬆脫，應如何處理？","options":[{"letter":"A","text":"忽略至輸液結束"},{"letter":"B","text":"自行快速推注"},{"letter":"C","text":"將管路丟棄不記錄"},{"letter":"D","text":"立即處理管路並通報，避免升壓藥中斷或外滲傷害"}],"answer":"D","rationale":"升壓藥中斷可能使循環不穩，外滲也可能傷害組織，須立即依流程處理。"},{"stem":"ARDS病人靜脈輸液期間呼吸狀況變差且水腫增加，護理師宜如何做？","options":[{"letter":"A","text":"盲目再加快輸液"},{"letter":"B","text":"評估液體平衡、肺部與循環並通報"},{"letter":"C","text":"只擦拭皮膚"},{"letter":"D","text":"不記錄輸入量"}],"answer":"B","rationale":"可能存在液體過負荷或肺部惡化，須評估輸入輸出、肺音、氧合及灌流。"},{"stem":"ARDS病人監測液體平衡時，哪一項最能支持精確趨勢判讀？","options":[{"letter":"A","text":"只估計飲水量"},{"letter":"B","text":"按規範記錄所有輸入與輸出"},{"letter":"C","text":"只在出院時計算"},{"letter":"D","text":"漏記沖管液"}],"answer":"B","rationale":"完整、準確的輸入輸出紀錄有助評估容量狀態與治療反應。"},{"stem":"ARDS病人排尿量減少且口乾，護理師不應直接推論何者？","options":[{"letter":"A","text":"可先評估循環、腎功能及液體狀況"},{"letter":"B","text":"不應只憑單一徵象自行決定大量補液"},{"letter":"C","text":"應記錄變化並通報"},{"letter":"D","text":"需核對尿管是否扭折"}],"answer":"B","rationale":"ARDS需在肺水腫風險與器官灌流間平衡，不能只依口乾或少尿自行大量補液。"},{"stem":"ARDS病人長期臥床，為預防關節僵硬與功能退化，合宜照護為何？","options":[{"letter":"A","text":"病況允許時進行活動與關節活動度照護"},{"letter":"B","text":"只在拔管後開始照護"},{"letter":"C","text":"完全固定所有關節"},{"letter":"D","text":"忽略疼痛與耐受"}],"answer":"A","rationale":"依血流動力與呼吸耐受安排早期活動或被動關節活動，有助維持功能。"},{"stem":"ARDS病人生命徵象穩定，安排早期活動時應如何做？","options":[{"letter":"A","text":"先評估氧合、循環、管路及活動耐受，再循序進行"},{"letter":"B","text":"停止所有氧氣"},{"letter":"C","text":"活動後不再監測"},{"letter":"D","text":"不評估即站立"}],"answer":"A","rationale":"早期活動須個別評估穩定度與管路安全，活動中及活動後持續監測反應。"},{"stem":"病人活動中血氧下降、血壓不穩，護理師應如何處理？","options":[{"letter":"A","text":"強迫完成活動"},{"letter":"B","text":"移除監測設備"},{"letter":"C","text":"停止或降低活動、提供支持並重新評估"},{"letter":"D","text":"不告知醫療團隊"}],"answer":"C","rationale":"不耐受時應停止活動、穩定病人並評估原因，避免持續造成低氧或循環惡化。"},{"stem":"ARDS恢復期病人自拔管後仍需氧療，衛教何者適當？","options":[{"letter":"A","text":"有氧氣就可吸菸"},{"letter":"B","text":"自行任意調高流量"},{"letter":"C","text":"症狀改善便自行停用所有治療"},{"letter":"D","text":"依處方使用氧氣並回報呼吸困難或低氧症狀"}],"answer":"D","rationale":"氧療應依處方使用並觀察症狀，避免自行調整；吸菸與氧氣並用有火災危險。"},{"stem":"病人出院後仍使用居家氧氣，何項安全衛教最重要？","options":[{"letter":"A","text":"以油性產品塗抹氧氣接頭"},{"letter":"B","text":"氧氣設備旁點蠟燭"},{"letter":"C","text":"遠離火源並禁止吸菸"},{"letter":"D","text":"自行改裝流量計"}],"answer":"C","rationale":"氧氣會助燃，須遠離火焰與吸菸，並依廠商及醫療指示安全使用設備。"},{"stem":"ARDS病人使用氧氣鼻導管，鼻腔乾燥不適，較合宜的建議為何？","options":[{"letter":"A","text":"任意停止氧療"},{"letter":"B","text":"告知照護團隊評估濕化與皮膚黏膜照護"},{"letter":"C","text":"自行塗抹油性凡士林於鼻孔"},{"letter":"D","text":"以明火加熱導管"}],"answer":"B","rationale":"乾燥可回報評估適當濕化與水性照護；油性物質及明火配合氧氣有危險。"},{"stem":"ARDS家屬詢問病人何時一定能脫離呼吸器，護理師適當回應為何？","options":[{"letter":"A","text":"保證明天拔管"},{"letter":"B","text":"拒絕提供任何資訊"},{"letter":"C","text":"告知永遠不能脫離"},{"letter":"D","text":"說明需依病因、氧合與整體狀況逐步評估，無法預先保證日期"}],"answer":"D","rationale":"脫機時間因病況而異，應提供誠實、可理解的資訊並鼓勵與團隊討論。"},{"stem":"ARDS病人家屬因病情緊張而詢問治療計畫，護理師最適切的作法為何？","options":[{"letter":"A","text":"提供未確認的預後"},{"letter":"B","text":"以清楚語言說明護理可說明的內容並協助向團隊詢問"},{"letter":"C","text":"隱瞞已知照護資訊"},{"letter":"D","text":"責怪家屬提問"}],"answer":"B","rationale":"以病人及家屬為中心提供準確資訊，超出護理說明範圍者協助轉介團隊。"},{"stem":"ARDS病人需要插管，病人尚有決策能力且情況允許，護理師應如何參與？","options":[{"letter":"A","text":"隱瞞替代方案"},{"letter":"B","text":"在緊急狀況下延誤必要救命處置"},{"letter":"C","text":"代替病人自行同意"},{"letter":"D","text":"協助確認已說明處置、風險並支持知情決策"}],"answer":"D","rationale":"尊重自主並協助知情同意；若病人無決策能力或緊急情況，依規範及法律程序處理。"},{"stem":"ARDS病人進行管路照護，正確的病人辨識方式為何？","options":[{"letter":"A","text":"以床號作為唯一識別"},{"letter":"B","text":"依房間位置辨認"},{"letter":"C","text":"依機構規範使用至少兩項識別資訊"},{"letter":"D","text":"詢問隔壁病人"}],"answer":"C","rationale":"執行治療或給藥前須以規範的識別資訊確認病人，床號不能作唯一依據。"},{"stem":"給ARDS病人給藥前，病人姓名與藥袋資訊不一致，應如何處理？","options":[{"letter":"A","text":"忽略不一致"},{"letter":"B","text":"請家屬猜測"},{"letter":"C","text":"先給藥再補紀錄"},{"letter":"D","text":"暫停給藥並釐清身分與醫囑"}],"answer":"D","rationale":"身分不一致時應暫停給藥並查明，避免錯誤病人用藥。"},{"stem":"ARDS病人有腎功能受損，接受可能需腎功能調整的藥物，護理師應如何做？","options":[{"letter":"A","text":"核對檢驗與醫囑並向團隊確認劑量安全"},{"letter":"B","text":"自行加倍劑量"},{"letter":"C","text":"假設所有藥物都不經腎臟排除"},{"letter":"D","text":"忽略腎功能"}],"answer":"A","rationale":"腎功能可能影響藥物清除，須核對檢驗、醫囑及必要的劑量調整。"},{"stem":"ARDS病人接受鴉片類止痛藥後，護理師應特別觀察何者？","options":[{"letter":"A","text":"不需評估意識"},{"letter":"B","text":"僅食慾"},{"letter":"C","text":"只測身高"},{"letter":"D","text":"鎮靜程度、呼吸狀態與血壓"}],"answer":"D","rationale":"鴉片類藥物可能造成呼吸抑制、過度鎮靜與低血壓，須持續評估。"},{"stem":"ARDS病人使用鴉片類止痛藥後呼吸變慢且難以喚醒，護理師應如何處理？","options":[{"letter":"A","text":"等藥效自然消退不監測"},{"letter":"B","text":"立即評估呼吸循環並依緊急流程通報處置"},{"letter":"C","text":"讓病人獨處"},{"letter":"D","text":"再追加同種止痛藥"}],"answer":"B","rationale":"可能為藥物引起的呼吸抑制，須立即維持氣道與呼吸並啟動相應處置。"},{"stem":"ARDS病人有疼痛，使用止痛藥前最適當的護理步驟為何？","options":[{"letter":"A","text":"評估疼痛程度、意識、呼吸與過敏史"},{"letter":"B","text":"只看病人外觀"},{"letter":"C","text":"詢問同房病人"},{"letter":"D","text":"不需評估即給藥"}],"answer":"A","rationale":"用藥前評估疼痛與安全風險，給藥後再評估療效及不良反應。"},{"stem":"ARDS病人長期使用鎮靜藥，護理師可協助避免何種問題？","options":[{"letter":"A","text":"不評估停藥反應"},{"letter":"B","text":"定期依醫囑評估鎮靜需求，避免不必要的深度鎮靜"},{"letter":"C","text":"忽略譫妄"},{"letter":"D","text":"維持最高鎮靜深度"}],"answer":"B","rationale":"以目標導向評估降低過度鎮靜、譫妄及延遲脫機等風險。"},{"stem":"ARDS重症病人出現急性混亂，護理師應優先評估何者？","options":[{"letter":"A","text":"立即限制所有溝通"},{"letter":"B","text":"只認定為失智"},{"letter":"C","text":"低氧、感染、代謝異常與藥物等可逆原因"},{"letter":"D","text":"不告知團隊"}],"answer":"C","rationale":"重症譫妄或混亂常有可逆誘因，應評估氧合、感染、代謝、藥物與環境。"},{"stem":"預防ARDS病人譫妄的非藥物措施何者較適當？","options":[{"letter":"A","text":"任意增加鎮靜"},{"letter":"B","text":"整日不提供時間資訊"},{"letter":"C","text":"協助日夜定向、提供眼鏡助聽器及維持睡眠活動節律"},{"letter":"D","text":"不允許家屬溝通"}],"answer":"C","rationale":"定向、感官輔具、睡眠與活動支持可協助減少譫妄風險。"},{"stem":"ARDS病人需隔離，護理師進出病室最重要的感染管制措施為何？","options":[{"letter":"A","text":"依隔離類別正確穿脫防護裝備並執行手部衛生"},{"letter":"B","text":"離室後不洗手"},{"letter":"C","text":"只戴手套即可涵蓋所有防護"},{"letter":"D","text":"共用防護衣"}],"answer":"A","rationale":"遵守病原相關防護及手部衛生，並正確穿脫裝備，避免自我與交叉污染。"},{"stem":"ARDS病人有大量呼吸道分泌物，標本採集的原則為何？","options":[{"letter":"A","text":"將標本放置數日再送"},{"letter":"B","text":"用一般紙杯收集"},{"letter":"C","text":"不標示病人資料"},{"letter":"D","text":"使用適當無菌容器與技術，標示並及時送檢"}],"answer":"D","rationale":"正確採集、標示與及時送檢可提升檢體品質並減少污染。"},{"stem":"ARDS病人肺部感染治療後體溫下降但氧合仍差，護理師應如何理解？","options":[{"letter":"A","text":"表示診斷一定錯誤"},{"letter":"B","text":"可立即拔除所有氧氣"},{"letter":"C","text":"氧合恢復可能落後於感染控制，仍需持續評估支持"},{"letter":"D","text":"體溫下降即可停止呼吸照護"}],"answer":"C","rationale":"肺損傷與氧合改善未必同步，應依氧合、影像與整體臨床狀態持續治療。"},{"stem":"ARDS病人氧合改善，呼吸器FiO2調降後應觀察何者？","options":[{"letter":"A","text":"不再監測"},{"letter":"B","text":"立即自行移除呼吸器"},{"letter":"C","text":"只看心率"},{"letter":"D","text":"血氧、呼吸狀態及後續血氣反應"}],"answer":"D","rationale":"氧療調整後須確認病人能維持目標氧合及通氣，並依醫囑追蹤血氣。"},{"stem":"ARDS病人使用PEEP期間，護理師觀察到頸靜脈怒張與血壓變化，應如何做？","options":[{"letter":"A","text":"自行取消PEEP"},{"letter":"B","text":"評估循環及胸腔壓相關影響並通報"},{"letter":"C","text":"認為必然正常不處理"},{"letter":"D","text":"只記錄不評估"}],"answer":"B","rationale":"PEEP可能影響靜脈回流及右心負荷，循環徵象變化需及時評估。"},{"stem":"ARDS病人接受高PEEP支持，哪項照護有助及早發現氣壓傷？","options":[{"letter":"A","text":"不評估胸部"},{"letter":"B","text":"只檢查瞳孔"},{"letter":"C","text":"觀察突發呼吸惡化、胸廓及呼吸音變化"},{"letter":"D","text":"僅測體重"}],"answer":"C","rationale":"正壓通氣可能造成氣壓傷，突發低氧、單側呼吸音變化等須立即評估。"},{"stem":"呼吸器管路積水，護理師應如何處理？","options":[{"letter":"A","text":"不需戴手套或防護"},{"letter":"B","text":"讓水流入氣管內管"},{"letter":"C","text":"依設備流程安全排水，避免冷凝水流向病人"},{"letter":"D","text":"將冷凝水倒入病人端"}],"answer":"C","rationale":"冷凝水可能污染或流入病人呼吸道，須按流程處理並避免暴露。"},{"stem":"ARDS病人呼吸器管路需暫時斷開進行照護，最重要的考量為何？","options":[{"letter":"A","text":"盡量減少斷開時間並維持氧合與無菌安全"},{"letter":"B","text":"長時間敞開管路"},{"letter":"C","text":"忽略病人氧合"},{"letter":"D","text":"先關閉所有監測"}],"answer":"A","rationale":"斷開管路會造成去募集或低氧及污染風險，應減少時間並依流程維持支持。"},{"stem":"氣管內管固定處皮膚受損，護理師應如何照護？","options":[{"letter":"A","text":"評估皮膚並調整固定位置或保護方式，確保管路仍安全"},{"letter":"B","text":"鬆開後不固定"},{"letter":"C","text":"任由固定帶持續摩擦"},{"letter":"D","text":"只以化妝品遮蓋"}],"answer":"A","rationale":"需兼顧皮膚完整與氣道安全，依規範檢查並調整固定裝置。"},{"stem":"ARDS插管病人需要口腔清潔，適當作法為何？","options":[{"letter":"A","text":"用尖銳物清除口腔分泌物"},{"letter":"B","text":"完全不做口腔照護"},{"letter":"C","text":"清潔時不顧管路"},{"letter":"D","text":"依院內流程清潔口腔並固定氣管內管"}],"answer":"D","rationale":"口腔照護有助舒適及感染預防，過程中須避免管路移位與黏膜傷害。"},{"stem":"ARDS病人嘴唇乾裂，護理師可採取何種措施？","options":[{"letter":"A","text":"停止口腔評估"},{"letter":"B","text":"使用油性物質接觸氧氣設備"},{"letter":"C","text":"依規範使用適當水性保濕照護並評估黏膜"},{"letter":"D","text":"撕除乾裂皮屑"}],"answer":"C","rationale":"提供安全的口唇黏膜照護並避免油性產品接觸氧氣環境。"},{"stem":"ARDS病人因發燒與出汗，需進行皮膚照護，重點為何？","options":[{"letter":"A","text":"不更換污染衣物"},{"letter":"B","text":"只在可見破皮後處理"},{"letter":"C","text":"使用潮濕床單覆蓋"},{"letter":"D","text":"保持皮膚清潔乾燥並檢查受壓與潮濕部位"}],"answer":"D","rationale":"濕潤與摩擦增加皮膚損傷，應維持清潔乾燥及早發現異常。"},{"stem":"ARDS病人呼吸器相關肺炎預防中，口腔照護的理由為何？","options":[{"letter":"A","text":"直接治癒ARDS"},{"letter":"B","text":"使呼吸器不需清潔"},{"letter":"C","text":"取代抗生素"},{"letter":"D","text":"降低口腔病原負荷及可能微量吸入風險"}],"answer":"D","rationale":"口腔照護是呼吸器照護組合之一，可減少口腔微生物負荷，但不取代其他措施。"},{"stem":"ARDS病人脫離呼吸器前，護理師可協助團隊評估何者？","options":[{"letter":"A","text":"只看病人年齡"},{"letter":"B","text":"氧合與通氣穩定、病因改善及自主呼吸能力"},{"letter":"C","text":"只看家屬是否在場"},{"letter":"D","text":"只看胸部影像單一結果"}],"answer":"B","rationale":"脫機需綜合病因、氧合、通氣、意識、肌力及自主呼吸能力評估。"},{"stem":"病人接受自主呼吸測試時出現明顯喘促、血氧下降，護理師應如何做？","options":[{"letter":"A","text":"強迫繼續至時間結束"},{"letter":"B","text":"依流程終止測試並恢復支持、通報評估"},{"letter":"C","text":"不記錄反應"},{"letter":"D","text":"關閉氧氣"}],"answer":"B","rationale":"不耐受提示測試失敗或狀況不穩，應恢復適當支持並評估原因。"},{"stem":"拔管後ARDS病人出現聲音嘶啞及呼吸費力，護理師應如何處理？","options":[{"letter":"A","text":"讓病人平躺獨處"},{"letter":"B","text":"認為正常而不觀察"},{"letter":"C","text":"給予固體食物"},{"letter":"D","text":"立即評估氣道通暢與呼吸狀態並通報"}],"answer":"D","rationale":"拔管後呼吸費力可能是上氣道阻塞等急症，需迅速評估並準備支持。"}]},{"title":"肺炎","questions":[{"answer":"C","options":[{"letter":"A","text":"肺泡壁增厚使氣道永久擴張"},{"letter":"B","text":"肺泡表面積增加而氧合改善"},{"letter":"C","text":"肺泡通氣受阻造成通氣灌流失衡"},{"letter":"D","text":"呼吸中樞受抑而換氣驟減"}],"rationale":"肺泡滲出物妨礙氣體交換，使通氣與灌流不匹配；不代表氣道永久擴張或表面積增加。","stem":"肺炎病人肺泡內有滲出物，最可能造成何種生理影響？"},{"answer":"A","options":[{"letter":"A","text":"協助坐起並評估呼吸，依指示給氧"},{"letter":"B","text":"先提供餐食並觀察嘴唇顏色"},{"letter":"C","text":"暫停氧療以免影響後續檢查"},{"letter":"D","text":"維持平躺並先完成痰液採集"}],"rationale":"發紺和喘促提示氧合可能受損，應先維持呼吸與氧合；檢體採集不可延誤必要處置。","stem":"肺炎病人出現發紺與喘促，尚未完成檢體採集，護理師應先採取何措施？"},{"answer":"C","options":[{"letter":"A","text":"痰色可直接確認感染菌種"},{"letter":"B","text":"痰色可作為選擇抗生素的依據"},{"letter":"C","text":"痰色本身不能確定致病菌"},{"letter":"D","text":"黃綠痰表示目前沒有感染"}],"rationale":"痰色缺乏病原特異性，需配合臨床表現及檢驗判讀，不能單憑顏色確診或選藥。","stem":"肺炎病人咳出黃綠色痰，家屬詢問是否已能確定細菌感染，最適切回應為何？"},{"answer":"B","options":[{"letter":"A","text":"先以殺菌漱口液處理再咳痰"},{"letter":"B","text":"清水漱口後深咳痰液至無菌容器"},{"letter":"C","text":"收集漱口後吐出的唾液檢體"},{"letter":"D","text":"以棉棒擦拭口腔黏膜後送驗"}],"rationale":"深咳取得的下呼吸道痰液較具代表性；唾液或口腔棉棒容易受口腔菌叢污染。","stem":"護理師需為可自行咳痰的肺炎病人送痰培養，何種採檢方式較適當？"},{"answer":"A","options":[{"letter":"A","text":"浸潤影像支持肺炎，仍須合併臨床判斷"},{"letter":"B","text":"肺葉浸潤代表肺組織已永久纖維化"},{"letter":"C","text":"胸片結果足以取代病史及身體評估"},{"letter":"D","text":"此影像可以直接確定致病的細菌種類"}],"rationale":"肺葉浸潤可支持肺炎診斷，但影像不能單獨辨認病原或取代臨床資料。","stem":"肺炎病人胸部X光顯示肺葉浸潤，護理師向病人說明此結果時何者正確？"},{"answer":"C","options":[{"letter":"A","text":"頭低腳高以增加肺部灌流"},{"letter":"B","text":"俯臥並讓臉部貼住枕頭"},{"letter":"C","text":"採半坐臥以利胸廓擴張"},{"letter":"D","text":"平躺並將枕頭置於膝下"}],"rationale":"半坐臥可促進胸廓擴張、減輕呼吸負荷；其他姿勢可能不利通氣或不安全。","stem":"肺炎病人自述呼吸費力，評估無姿勢禁忌，護理師宜先協助採何姿勢？"},{"answer":"D","options":[{"letter":"A","text":"先記錄症狀，待查房時再報告"},{"letter":"B","text":"安排休息並等待下一次例行測量"},{"letter":"C","text":"提供飲水後再觀察生命徵象變化"},{"letter":"D","text":"立即啟動緊急評估並通報醫療團隊"}],"rationale":"低血壓合併意識改變和呼吸窘迫可能代表嚴重感染及灌流不足，需立即求援處理。","stem":"肺炎病人出現低血壓、意識改變及喘促，護理師最適當的處置為何？"},{"answer":"D","options":[{"letter":"A","text":"病人表示舒服即可停止後續觀察"},{"letter":"B","text":"將流量調至最高後不再測量血氧"},{"letter":"C","text":"在氧氣設備接頭塗油以避免乾澀"},{"letter":"D","text":"依醫囑調整氧療並持續評估臨床反應"}],"rationale":"氧療應依醫囑或個別目標調整，並觀察氧合及呼吸反應；油品有助燃風險。","stem":"肺炎病人接受氧療後，哪一項護理作法最適當？"},{"answer":"D","options":[{"letter":"A","text":"觀察皮膚顏色而不再測量生命徵象"},{"letter":"B","text":"記錄指甲外觀及頭髮長度變化"},{"letter":"C","text":"比較每日食慾並作為唯一療效指標"},{"letter":"D","text":"追蹤體溫、呼吸狀況及氧合趨勢"}],"rationale":"體溫、呼吸狀況與氧合的整體趨勢可反映病情變化；單一食慾或外觀不足以判斷療效。","stem":"肺炎病人接受抗生素治療，護理師以何項資料追蹤治療反應最合宜？"},{"answer":"A","options":[{"letter":"A","text":"協助排出分泌物以維持氣道通暢"},{"letter":"B","text":"減少所有呼吸活動以保存氧氣"},{"letter":"C","text":"抑制肺部發炎並取代抗生素治療"},{"letter":"D","text":"使咳嗽消失並避免肺部擴張"}],"rationale":"有效咳嗽可清除呼吸道分泌物、維持氣道通暢，但不能取代抗感染治療。","stem":"肺炎病人痰液不易咳出，護理師教導有效咳嗽的主要目的為何？"},{"answer":"D","options":[{"letter":"A","text":"減少所有飲水以免稀釋消化液"},{"letter":"B","text":"以酒精飲品協助稀釋呼吸道痰液"},{"letter":"C","text":"停止口腔清潔以減少咳嗽刺激"},{"letter":"D","text":"依耐受適量補充水分並考量共病"}],"rationale":"適量水分有助痰液稀釋，但仍須依病人的共病、液體限制及醫囑調整。","stem":"肺炎病人痰液黏稠，且未被醫囑限制水分，護理師應提供何項建議？"},{"answer":"A","options":[{"letter":"A","text":"暫停餵食並進一步評估吞嚥安全"},{"letter":"B","text":"以大口飲水方式幫助食物快速吞下"},{"letter":"C","text":"改採平躺姿勢並繼續餵完餐點"},{"letter":"D","text":"忽略嗆咳並鼓勵病人加快進食"}],"rationale":"反覆嗆咳可能表示吞嚥障礙及吸入風險，應先停止口服並評估，不宜繼續餵食。","stem":"肺炎病人進食時反覆嗆咳，護理師此刻最適當的處置為何？"},{"answer":"C","options":[{"letter":"A","text":"通常由外耳道阻塞所造成"},{"letter":"B","text":"通常表示腸道蠕動傳至胸腔"},{"letter":"C","text":"可能與肺泡或小氣道液體相關"},{"letter":"D","text":"代表肺部聽診正常且無須追蹤"}],"rationale":"爆裂音可能與肺泡或小氣道內液體、或肺泡張開有關，須結合其他呼吸評估判讀。","stem":"肺炎病人聽診可聞及肺底爆裂音，護理師對此發現的解讀何者較適當？"},{"answer":"B","options":[{"letter":"A","text":"排尿或改變手部姿勢時"},{"letter":"B","text":"深呼吸、咳嗽或胸廓活動時"},{"letter":"C","text":"進食甜食或飲用溫水時"},{"letter":"D","text":"按摩腹部或閉眼休息時"}],"rationale":"胸膜刺激所致疼痛常隨胸廓活動加劇，尤其深呼吸及咳嗽時較明顯。","stem":"肺炎病人主訴胸膜性疼痛，護理師詢問何種情況會使疼痛加劇？"},{"answer":"B","options":[{"letter":"A","text":"皮膚保養方式、睡眠習慣與慣用手"},{"letter":"B","text":"呼吸頻率、呼吸作功、血氧與意識狀態"},{"letter":"C","text":"最近理髮時間、視力及日常穿著"},{"letter":"D","text":"鞋碼、髮量、指甲長度與飲食偏好"}],"rationale":"呼吸頻率、呼吸作功、氧合與意識可共同反映呼吸狀態及惡化風險。","stem":"肺炎病人表示呼吸困難，護理師進行評估時應優先記錄哪些資料？"},{"answer":"A","options":[{"letter":"A","text":"立即檢視呼吸及氧合狀況"},{"letter":"B","text":"詢問病人是否想更換電視節目"},{"letter":"C","text":"觀察髮型及衣物是否整齊"},{"letter":"D","text":"確認病人鞋子是否合腳"}],"rationale":"躁動可能是缺氧或病況改變的早期表現，應優先評估呼吸與氧合。","stem":"肺炎病人原本清醒，突然出現躁動不安，護理師應先評估何項狀況？"},{"answer":"B","options":[{"letter":"A","text":"忽略不穩讀值並只依主觀感受判斷"},{"letter":"B","text":"改善末梢灌流或更換測量處後再確認"},{"letter":"C","text":"將當下讀值視為確定結果並停止評估"},{"letter":"D","text":"直接移除血氧探頭且不再測量"}],"rationale":"末梢低灌流可能影響脈搏血氧讀值，應確認探頭及測量處並結合臨床評估。","stem":"肺炎病人手部冰冷，血氧監測數值反覆跳動且與外觀不符，護理師宜如何處理？"},{"answer":"C","options":[{"letter":"A","text":"不需採集培養，直接依痰色選藥"},{"letter":"B","text":"退燒且生命徵象穩定後才採集"},{"letter":"C","text":"給予抗生素前先依規範採血培養"},{"letter":"D","text":"完成抗生素療程後再採血培養"}],"rationale":"若病況允許，抗生素前採血培養較利於病原檢出；但不可因此延誤緊急治療。","stem":"肺炎病人疑有菌血症，病況允許且不會延誤治療時，血液培養應安排在何時採集？"},{"answer":"C","options":[{"letter":"A","text":"取消已開立治療並待培養結果"},{"letter":"B","text":"收集口水代替痰液並立即送檢"},{"letter":"C","text":"儘速採取適當檢體但不延誤必要治療"},{"letter":"D","text":"暫停抗生素數日等待病人咳出痰液"}],"rationale":"應儘速取得合格檢體，但不得為採檢而延誤必要抗生素治療。","stem":"肺炎病人已開立抗生素，但痰檢體尚未採得，護理師最適當的作法為何？"},{"answer":"C","options":[{"letter":"A","text":"僅記錄症狀，待下次門診再告知"},{"letter":"B","text":"先給下一劑藥物以確認症狀是否持續"},{"letter":"C","text":"視為可能嚴重過敏，立即急救評估並通報"},{"letter":"D","text":"請病人平躺休息並等待自然緩解"}],"rationale":"嘴唇腫脹合併喘鳴可能是危及生命的過敏反應，須立即停止可疑暴露並啟動緊急處置。","stem":"肺炎病人給予抗生素後出現嘴唇腫脹及喘鳴，護理師應優先採取何措施？"},{"answer":"B","options":[{"letter":"A","text":"任意停掉目前所有處方藥物"},{"letter":"B","text":"儘速回報醫療團隊評估腹瀉原因"},{"letter":"C","text":"用止瀉藥掩蓋症狀並照常不回報"},{"letter":"D","text":"自行加倍抗生素以縮短感染療程"}],"rationale":"嚴重腹瀉可能與抗生素相關腸炎等問題有關，應儘速評估；不宜自行加倍或停用全部藥物。","stem":"肺炎病人使用抗生素後出現嚴重腹瀉，護理師的衛教何者最適切？"},{"answer":"C","options":[{"letter":"A","text":"可提前停藥以避免任何藥物副作用"},{"letter":"B","text":"將剩餘藥物留給有咳嗽的家人"},{"letter":"C","text":"依處方使用，若有疑慮先聯絡醫療人員"},{"letter":"D","text":"症狀改善即可自行減半服用"}],"rationale":"病人不應自行停藥、減量或分享抗生素；療程及疑似副作用應由醫療人員評估。","stem":"肺炎病人服用抗生素數日後自覺好轉，詢問是否可以自行停藥，護理師應如何回應？"},{"answer":"D","options":[{"letter":"A","text":"確認同房病人是否也使用相同藥物"},{"letter":"B","text":"確認病人床號及藥品外觀是否熟悉"},{"letter":"C","text":"只核對藥片顏色及病人是否已進食"},{"letter":"D","text":"核對病人身分、藥物、劑量、途徑與時間"}],"rationale":"給藥前應依用藥安全原則核對病人身分及藥物、劑量、途徑與時間，不能以床號或外觀取代。","stem":"護理師準備給肺炎病人第一劑抗生素，給藥前最重要的核對內容為何？"},{"answer":"B","options":[{"letter":"A","text":"依病人主觀感受自行增加給藥劑量"},{"letter":"B","text":"確認腎功能並依醫囑調整用藥劑量"},{"letter":"C","text":"不必追蹤腎功能，以體溫決定給藥"},{"letter":"D","text":"將抗生素改為止痛藥以保護腎臟"}],"rationale":"部分抗生素需依腎功能調整劑量，應確認相關檢驗並依醫囑給藥，不可自行更改。","stem":"肺炎病人有腎功能不全，醫師開立需經腎臟排除的抗生素，護理師應注意何事？"},{"answer":"C","options":[{"letter":"A","text":"聽力以外的皮膚保養習慣"},{"letter":"B","text":"髮長、指甲顏色及食物偏好"},{"letter":"C","text":"腎功能檢驗及尿量變化"},{"letter":"D","text":"視力變化與每日鞋底磨損情形"}],"rationale":"腎功能及尿量有助及早察覺腎臟損傷，其他外觀資料無法取代相關監測。","stem":"肺炎病人接受可能具腎毒性的藥物治療，護理師應加強監測哪些資料？"},{"answer":"B","options":[{"letter":"A","text":"退燒後自行停用全部抗感染藥物"},{"letter":"B","text":"核對成分並依標示或醫囑使用，避免重複"},{"letter":"C","text":"若體溫仍高即可將所有藥物加倍"},{"letter":"D","text":"不同品牌可任意併用而不必看成分"}],"rationale":"複方藥可能含有相同退燒成分，需核對成分並遵照指示，避免重複或過量。","stem":"肺炎病人同時使用感冒複方藥與退燒藥，護理師應提醒何種用藥安全原則？"},{"answer":"D","options":[{"letter":"A","text":"病人是否偏好不做呼吸評估"},{"letter":"B","text":"是否能完全停止所有咳嗽反射"},{"letter":"C","text":"咳嗽聲音大小是否影響病室安靜"},{"letter":"D","text":"病人的咳嗽及排痰能力"}],"rationale":"咳嗽有助清除痰液，使用鎮咳藥前應評估排痰能力及適應性，避免分泌物滯留。","stem":"肺炎病人有大量痰液且醫師評估可使用鎮咳藥，護理師給藥前應先考量何者？"},{"answer":"B","options":[{"letter":"A","text":"身高、視力與最近一次進食內容"},{"letter":"B","text":"呼吸音、呼吸困難程度及治療反應"},{"letter":"C","text":"排便習慣及衣物尺寸變化"},{"letter":"D","text":"瞳孔顏色、指甲形狀與髮量"}],"rationale":"比較治療前後呼吸音、呼吸困難及整體反應，可評估霧化治療效果與耐受性。","stem":"肺炎病人接受霧化治療，護理師為比較治療效果，應於治療前後評估何者？"},{"answer":"C","options":[{"letter":"A","text":"要求病人自行停掉所有呼吸道藥物"},{"letter":"B","text":"告知心悸必然表示治療無效"},{"letter":"C","text":"評估脈搏與症狀，持續不適時回報"},{"letter":"D","text":"忽略主訴並依原時間重複給藥"}],"rationale":"支氣管擴張劑可能伴隨心悸，需評估脈搏與症狀，若持續或嚴重應回報，不可自行更改療程。","stem":"肺炎病人使用支氣管擴張劑後主訴心悸，護理師最適當的處置為何？"},{"answer":"D","options":[{"letter":"A","text":"改以吞服方式服用吸入藥物"},{"letter":"B","text":"避免喝水並保留藥物於口腔"},{"letter":"C","text":"立即再吸一劑以沖洗口腔"},{"letter":"D","text":"以清水漱口後吐出，減少口腔藥物殘留"}],"rationale":"吸入型類固醇使用後漱口並吐出，可減少口腔藥物殘留及局部副作用。","stem":"肺炎病人使用吸入型類固醇後，護理師應提醒何項照護？"},{"answer":"B","options":[{"letter":"A","text":"在鼻孔與設備接頭塗抹油性軟膏"},{"letter":"B","text":"依機構規範使用水溶性潤滑劑"},{"letter":"C","text":"自行停止氧療直到乾燥感消失"},{"letter":"D","text":"提高氧流量以增加鼻腔濕潤"}],"rationale":"鼻腔乾燥可依規範使用水溶性潤滑劑；油性產品具助燃風險，氧療不可擅自停止。","stem":"肺炎病人使用氧氣鼻導管後覺得鼻腔乾燥，護理師可採取何措施？"},{"answer":"B","options":[{"letter":"A","text":"先關閉氧氣後即可在床旁點菸"},{"letter":"B","text":"提醒氧療環境禁菸並遠離火源"},{"letter":"C","text":"允許在窗邊吸菸以降低室內煙味"},{"letter":"D","text":"將氧氣設備覆蓋以隔絕火焰"}],"rationale":"氧氣會助燃，氧療環境須禁菸並遠離火源；不可用關氧或覆蓋設備取代安全管理。","stem":"肺炎病人接受氧療，家屬欲在床旁點菸，護理師應如何處理？"},{"answer":"A","options":[{"letter":"A","text":"依病況安排並觀察治療耐受性"},{"letter":"B","text":"不論病況固定進行同一強度的處置"},{"letter":"C","text":"治療中不需觀察呼吸及耐受情形"},{"letter":"D","text":"病人喘促時仍要求完成全部療程"}],"rationale":"排痰處置應依病人狀況與耐受性安排，並觀察呼吸反應，必要時調整或暫停。","stem":"肺炎病人接受排痰物理治療，護理師安排及執行時何者最適當？"},{"answer":"D","options":[{"letter":"A","text":"平躺並用力壓迫胸骨正中"},{"letter":"B","text":"憋住咳嗽並避免排出痰液"},{"letter":"C","text":"咳嗽時快速扭轉軀幹增加力量"},{"letter":"D","text":"以枕頭輕柔支托胸部再咳嗽"}],"rationale":"咳嗽時以枕頭支托胸部可減少胸壁牽扯不適，仍應保留有效咳嗽以利排痰。","stem":"肺炎病人咳嗽時胸痛，護理師教導何種方式可協助減輕咳嗽牽扯不適？"},{"answer":"D","options":[{"letter":"A","text":"以閉氣方式完全停止呼吸活動"},{"letter":"B","text":"取代所有氧療與醫療評估"},{"letter":"C","text":"快速吸氣使呼吸次數持續增加"},{"letter":"D","text":"延長呼氣並協助控制呼吸節律"}],"rationale":"縮唇呼吸可延長呼氣並協助控制呼吸，並非取代氧療或其他必要評估。","stem":"肺炎病人呼吸急促且焦慮，護理師示範縮唇呼吸，其主要目的為何？"},{"answer":"D","options":[{"letter":"A","text":"病人是否願意停止所有活動"},{"letter":"B","text":"鞋碼、髮色與皮膚保養方式"},{"letter":"C","text":"飲食喜好、慣用手及睡眠時間"},{"letter":"D","text":"咳嗽力量、意識及分泌物狀況"}],"rationale":"咳力、意識及分泌物量與性質可協助判斷排痰能力及所需支持。","stem":"肺炎病人咳嗽無力且痰液增加，護理師在決定協助排痰方式前應先評估何者？"},{"answer":"D","options":[{"letter":"A","text":"先安排進食，避免病人過度緊張"},{"letter":"B","text":"只記錄呼吸音差異並於交班時提及"},{"letter":"C","text":"請病人深睡休息，稍後再聽診"},{"letter":"D","text":"立即評估呼吸狀態並通報醫療團隊"}],"rationale":"單側呼吸音突減合併喘促惡化可能代表急性胸腔或肺部問題，須立即評估及通報。","stem":"肺炎病人突然喘促加劇，且一側呼吸音明顯減弱，護理師應如何處理？"},{"answer":"A","options":[{"letter":"A","text":"立即求援並評估生命徵象及呼吸"},{"letter":"B","text":"提供熱敷後等待疼痛自行改善"},{"letter":"C","text":"讓病人獨自休息並延後評估"},{"letter":"D","text":"先完成疼痛量表再等例行查房"}],"rationale":"胸痛加劇合併低血壓可能表示急性惡化，應立即求援並評估呼吸、循環及生命徵象。","stem":"肺炎病人胸痛突然加劇，並出現低血壓，護理師最優先的行動為何？"},{"answer":"D","options":[{"letter":"A","text":"必然代表抗生素已經奏效"},{"letter":"B","text":"單純因睡眠不足造成的症狀"},{"letter":"C","text":"只需觀察食慾不必追蹤尿量"},{"letter":"D","text":"可能脫水或組織灌流不足"}],"rationale":"發燒增加水分流失，心搏加快及尿量減少也可能反映脫水或灌流不足，需整體評估。","stem":"肺炎病人發燒、心搏加快且尿量減少，護理師應特別評估何種問題？"},{"answer":"A","options":[{"letter":"A","text":"更換濕衣並評估體溫及水分狀態"},{"letter":"B","text":"停止測量體溫以免干擾休息"},{"letter":"C","text":"保留濕衣被以維持皮膚溫度"},{"letter":"D","text":"立即限制所有液體攝取"}],"rationale":"更換濕衣有助舒適，並應評估體溫與水分狀態；是否補液須依個別狀況判斷。","stem":"肺炎病人退燒後大量出汗，護理師的照護何者較適當？"},{"answer":"B","options":[{"letter":"A","text":"活動期間不需觀察呼吸與血氧"},{"letter":"B","text":"分段活動、安排休息並監測耐受"},{"letter":"C","text":"要求一次完成所有活動以增加耐力"},{"letter":"D","text":"禁止任何翻身或床上活動"}],"rationale":"依耐受度分段活動並適時休息、監測，可逐步維持活動能力並降低過度負荷。","stem":"肺炎病人稍作活動即喘，護理師應如何安排日常活動？"},{"answer":"D","options":[{"letter":"A","text":"限制深呼吸並減少翻身頻率"},{"letter":"B","text":"固定平躺並避免任何咳嗽"},{"letter":"C","text":"維持同一姿勢以減少耗氧"},{"letter":"D","text":"依能力翻身、深呼吸並逐步活動"}],"rationale":"翻身、深呼吸及依能力活動有助肺部擴張與排痰，長時間固定姿勢可能增加併發症風險。","stem":"肺炎病人因病臥床，為預防肺部併發症，護理師應鼓勵何種措施？"},{"answer":"B","options":[{"letter":"A","text":"對持續發紅處用力按摩促進循環"},{"letter":"B","text":"定期評估皮膚並依狀況翻身減壓"},{"letter":"C","text":"讓潮濕床單留置以避免搬動病人"},{"letter":"D","text":"出院當日再首次檢查皮膚完整性"}],"rationale":"定期檢查皮膚、保持乾爽並適當翻身減壓可預防壓傷；不宜按摩持續發紅處。","stem":"肺炎病人因虛弱長時間臥床，護理師預防壓傷的作法何者適當？"},{"answer":"A","options":[{"letter":"A","text":"採少量多餐並選擇營養密度較高食物"},{"letter":"B","text":"要求一次大量進食以補足營養"},{"letter":"C","text":"躺平進食以減少呼吸活動"},{"letter":"D","text":"以無熱量飲料取代所有餐點"}],"rationale":"少量多餐及營養密度較高的食物可減輕進食疲勞並支持營養攝取，仍須注意吞嚥安全。","stem":"肺炎病人食慾差但可安全進食，護理師宜提供何種飲食安排？"},{"answer":"A","options":[{"letter":"A","text":"休息後坐直，以小段方式完成進食"},{"letter":"B","text":"讓病人邊走動邊進食以訓練耐力"},{"letter":"C","text":"採平躺姿勢並以吸管快速餵水"},{"letter":"D","text":"催促病人快速吞嚥以縮短用餐時間"}],"rationale":"休息後坐直、分段進食可減少呼吸負荷並維持較安全的吞嚥姿勢。","stem":"肺炎病人進食時容易喘，護理師如何安排較能降低呼吸負荷與嗆咳風險？"},{"answer":"D","options":[{"letter":"A","text":"將檢體倒入一般垃圾桶處理"},{"letter":"B","text":"不標示以免影響實驗室判讀"},{"letter":"C","text":"開蓋置於床旁等待集中送檢"},{"letter":"D","text":"密封並正確標示後儘速送檢"}],"rationale":"檢體須密封、正確標示並儘速送驗，以維持檢體品質及病人辨識正確。","stem":"護理師採得肺炎病人的痰液培養檢體後，應如何處理？"},{"answer":"B","options":[{"letter":"A","text":"表示病人必定同時感染多種病原"},{"letter":"B","text":"可能有口腔污染，須評估檢體品質"},{"letter":"C","text":"此結果足以支持立即停止治療"},{"letter":"D","text":"可單憑此結果確認沒有肺部感染"}],"rationale":"混合口腔菌叢可能表示檢體受污染，需結合採檢品質及臨床狀況判讀。","stem":"肺炎病人的痰培養報告顯示混合口腔菌叢，護理師應如何理解此結果？"},{"answer":"D","options":[{"letter":"A","text":"此結果可排除病毒感染可能"},{"letter":"B","text":"有此結果即可不再評估病人狀況"},{"letter":"C","text":"可直接確診特定細菌並依此選藥"},{"letter":"D","text":"可支持發炎，但不能單獨判定病因"}],"rationale":"白血球升高是非特異性發炎指標，須與臨床表現和其他檢查合併判讀。","stem":"肺炎病人檢驗發現白血球升高，護理師對此結果的解讀何者最適當？"},{"answer":"D","options":[{"letter":"A","text":"肝臟影像及膽道通暢程度"},{"letter":"B","text":"腸蠕動速度及消化功能"},{"letter":"C","text":"骨密度與關節活動範圍"},{"letter":"D","text":"氧合、通氣及酸鹼狀態"}],"rationale":"動脈血液氣體分析可評估氧合、通氣及酸鹼狀態，協助判斷呼吸功能。","stem":"肺炎病人接受動脈血液氣體分析，這項檢查主要可提供何種資訊？"},{"answer":"A","options":[{"letter":"A","text":"於穿刺處直接加壓至止血"},{"letter":"B","text":"按摩穿刺點以加快血液循環"},{"letter":"C","text":"以熱敷代替穿刺處止血"},{"letter":"D","text":"不需處理，等待自然凝固"}],"rationale":"動脈採血後須對穿刺處持續加壓至止血，並依情況觀察出血或血腫。","stem":"護理師協助肺炎病人完成動脈採血後，應採取何種措施？"},{"answer":"A","options":[{"letter":"A","text":"仍評估呼吸作功並結合整體臨床表現"},{"letter":"B","text":"停止評估並延至下一班再追蹤"},{"letter":"C","text":"以單次血氧正常判定病情已穩定"},{"letter":"D","text":"立即撤除所有呼吸支持且不再觀察"}],"rationale":"單一血氧值不能取代呼吸作功及整體評估，病人仍有呼吸費力時須持續評估。","stem":"肺炎病人的血氧讀值在目標範圍，但仍可見明顯呼吸費力，護理師應如何處理？"},{"answer":"D","options":[{"letter":"A","text":"依儀器讀值判定正常並停止處置"},{"letter":"B","text":"僅記錄血氧值，不需通報異常表現"},{"letter":"C","text":"延後觀察，待下一次例行測量再說"},{"letter":"D","text":"檢查探頭與訊號並立即進行臨床評估"}],"rationale":"臨床表現與監測數值不一致時，須檢查測量可靠性並立即評估病人，不可只依儀器判斷。","stem":"肺炎病人嘴唇發紺且意識混亂，但血氧機顯示數值正常，護理師應如何處理？"},{"answer":"C","options":[{"letter":"A","text":"只依病人感覺決定是否持續給氧"},{"letter":"B","text":"因有慢性肺病而一律不給氧"},{"letter":"C","text":"依個別氧合目標及醫囑調整並監測"},{"letter":"D","text":"不論狀況皆直接使用最大流量"}],"rationale":"氧療應依病人個別目標及醫囑調整，並觀察反應；慢性肺病不是一律不給氧的理由。","stem":"慢性肺病病人合併肺炎需接受氧療，護理師應採何種原則？"},{"answer":"B","options":[{"letter":"A","text":"刮除紅處表皮以減少壓迫"},{"letter":"B","text":"檢查皮膚並調整導管、採取減壓措施"},{"letter":"C","text":"用力摩擦紅處以促進局部循環"},{"letter":"D","text":"只要尚未破皮即可不再檢查"}],"rationale":"裝置造成的持續壓迫可能導致皮膚損傷，應檢查皮膚、調整固定並減壓。","stem":"肺炎病人使用鼻導管後，耳後皮膚出現持續泛紅，護理師應如何處理？"},{"answer":"A","options":[{"letter":"A","text":"先確認固定穩妥並檢查氧氣存量"},{"letter":"B","text":"轉送途中靠近熱源以便照明"},{"letter":"C","text":"抵達檢查室後才接上氧氣"},{"letter":"D","text":"將鋼瓶平放床上並任其滾動"}],"rationale":"轉送前須固定鋼瓶並確認氧氣存量與供氧連續性，避免傾倒或途中氧氣中斷。","stem":"肺炎病人需以氧氣鋼瓶轉送檢查，護理師應採取何項安全措施？"},{"answer":"B","options":[{"letter":"A","text":"將用過的污染紙巾留著重複使用"},{"letter":"B","text":"以紙巾遮掩咳嗽並於之後清潔雙手"},{"letter":"C","text":"面向他人咳嗽以避免污染手部"},{"letter":"D","text":"咳出痰液後不需清理或處理"}],"rationale":"以紙巾遮掩咳嗽並妥善處理後清潔手部，可降低飛沫與接觸傳播。","stem":"肺炎病人頻繁咳嗽，護理師進行咳嗽衛生衛教時何者適當？"},{"answer":"A","options":[{"letter":"A","text":"依時機執行手部衛生"},{"letter":"B","text":"以戴手套取代所有手部清潔"},{"letter":"C","text":"多位病人共用同一副手套"},{"letter":"D","text":"集中到下班時才進行手部清潔"}],"rationale":"手部衛生是預防感染傳播的核心措施；手套不能取代手部清潔。","stem":"護理師照護肺炎病人前後，預防感染傳播最重要的常規措施為何？"},{"answer":"D","options":[{"letter":"A","text":"重複使用已污染的口罩以節省物資"},{"letter":"B","text":"固定每次只戴手套即可"},{"letter":"C","text":"病人的床位及照護者個人偏好"},{"letter":"D","text":"預期暴露風險及機構感染管制規範"}],"rationale":"防護裝備應依傳播途徑、預期暴露風險及機構規範選擇，不宜一律採同一裝備。","stem":"照護肺炎病人時，護理師選擇個人防護裝備應依據何者？"}
